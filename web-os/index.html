        <button class="music-ctrl-btn play" onclick="musicToggle()" id="music-play-btn"><i class="ti ti-${playing?'player-pause':'player-play'}"></i></button>
        <button class="music-ctrl-btn" onclick="musicNext()" title="Volgende"><i class="ti ti-player-skip-forward"></i></button>
        <button class="music-ctrl-btn" title="Herhalen"><i class="ti ti-repeat"></i></button>
      </div>
      <div class="music-playlist">
        <div class="music-pl-title">Afspeellijst</div>
        ${songs.map((song, i) => `
          <div class="music-pl-item${i===currentSong?' active':''}" onclick="musicSelect(${i})">
            <div class="music-pl-num">${i===currentSong&&playing?'▶':i+1}</div>
            <div class="music-pl-info"><div class="music-pl-name">${song.title}</div><div class="music-pl-art">${song.artist}</div></div>
            <div class="music-pl-dur">${song.dur}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  window.musicToggle = () => { playing = !playing; render(); if (playing) startMusicTick(); else clearInterval(window._musicInterval); };
  window.musicNext = () => { currentSong = (currentSong + 1) % songs.length; progress = 0; render(); if (playing) startMusicTick(); };
  window.musicPrev = () => { currentSong = (currentSong - 1 + songs.length) % songs.length; progress = 0; render(); };
  window.musicSelect = (i) => { currentSong = i; progress = 0; playing = true; render(); startMusicTick(); };
  window.musicShuffle = () => { currentSong = Math.floor(Math.random() * songs.length); progress = 0; render(); };

  function startMusicTick() {
    clearInterval(window._musicInterval);
    window._musicInterval = setInterval(() => {
      if (!playing) return;
      progress = Math.min(100, progress + 0.3);
      const slider = document.getElementById('music-slider');
      const cur = document.getElementById('music-cur');
      if (slider) slider.value = progress;
      if (cur) {
        const secs = Math.floor(progress / 100 * 240);
        cur.textContent = Math.floor(secs/60) + ':' + (secs%60).toString().padStart(2,'0');
      }
      if (progress >= 100) { window.musicNext(); }
    }, 300);
  }
  render();
}

// ===== CALENDAR =====
function renderCalendar(body) {
  const ud = getUserData(currentUser.username);
  if (!ud.calendarEvents) ud.calendarEvents = [];
  let now = new Date();
  let viewYear = now.getFullYear(), viewMonth = now.getMonth();
  let selectedDate = null;

  function render() {
    const firstDay = new Date(viewYear, viewMonth, 1);
    const lastDay = new Date(viewYear, viewMonth + 1, 0);
    const startDow = (firstDay.getDay() + 6) % 7;
    const days = ['Ma','Di','Wo','Do','Vr','Za','Zo'];
    const months = ['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];

    let cells = [];
    for (let i = 0; i < startDow; i++) {
      const d = new Date(viewYear, viewMonth, -startDow + i + 1);
      cells.push({ date: d, other: true });
    }
    for (let d = 1; d <= lastDay.getDate(); d++) cells.push({ date: new Date(viewYear, viewMonth, d), other: false });
    while (cells.length % 7 !== 0) {
      const last = cells[cells.length-1].date;
      cells.push({ date: new Date(last.getTime() + 86400000), other: true });
    }

    const selEvents = selectedDate ? ud.calendarEvents.filter(e => e.date === selectedDate) : [];

    body.innerHTML = `<div class="calendar-wrap">
      <div class="calendar-header">
        <button class="calendar-nav-btn" onclick="calNav(-1)">‹</button>
        <div class="calendar-month">${months[viewMonth]} ${viewYear}</div>
        <button class="calendar-nav-btn" onclick="calNav(1)">›</button>
      </div>
      <div class="calendar-grid">
        ${days.map(d=>`<div class="calendar-day-label">${d}</div>`).join('')}
        ${cells.map(c => {
          const ds = `${c.date.getFullYear()}-${(c.date.getMonth()+1).toString().padStart(2,'0')}-${c.date.getDate().toString().padStart(2,'0')}`;
          const isToday = c.date.toDateString() === now.toDateString();
          const hasBe = ud.calendarEvents.some(e => e.date === ds);
          const isSel = ds === selectedDate;
          return `<div class="calendar-cell${c.other?' other-month':''}${isToday?' today':''}${hasBe?' has-event':''}${isSel?' selected':''}" onclick="calSelect('${ds}')">${c.date.getDate()}</div>`;
        }).join('')}
      </div>
      <div class="calendar-events">
        <div class="calendar-events-title">${selectedDate ? `Afspraken op ${selectedDate}` : 'Selecteer een datum'}</div>
        ${selEvents.map(e=>`<div class="calendar-event-item"><div class="calendar-event-name">${e.name}</div><div class="calendar-event-time">${e.time||''}</div></div>`).join('')}
        ${selectedDate ? `<div class="calendar-add-row">
          <input class="calendar-add-input" id="cal-event-name" placeholder="Nieuwe afspraak...">
          <input class="calendar-add-input" id="cal-event-time" placeholder="Tijd" style="width:80px;">
          <button class="calendar-add-btn" onclick="calAddEvent()">+</button>
        </div>` : ''}
      </div>
    </div>`;
  }

  window.calNav = (d) => {
    viewMonth += d;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  };
  window.calSelect = (ds) => { selectedDate = ds; render(); };
  window.calAddEvent = () => {
    const name = document.getElementById('cal-event-name')?.value.trim();
    const time = document.getElementById('cal-event-time')?.value.trim();
    if (!name) return;
    ud.calendarEvents.push({ date: selectedDate, name, time, id: Date.now() });
    saveUserData(currentUser.username, ud);
    render();
  };
  render();
}

// ===== CLOCK =====
function renderClock(body) {
  const ud = getUserData(currentUser.username);
  if (!ud.alarms) ud.alarms = [];

  function render() {
    body.innerHTML = `<div class="clock-wrap">
      <svg class="clock-analog" viewBox="0 0 200 200" id="clock-svg">
        <circle cx="100" cy="100" r="95" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        ${Array.from({length:12},(_,i)=>{const a=(i*30-90)*Math.PI/180;return `<line x1="${100+80*Math.cos(a)}" y1="${100+80*Math.sin(a)}" x2="${100+90*Math.cos(a)}" y2="${100+90*Math.sin(a)}" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>`}).join('')}
        <line id="ch" x1="100" y1="100" x2="100" y2="50" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
        <line id="cm" x1="100" y1="100" x2="100" y2="35" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
        <line id="cs" x1="100" y1="100" x2="100" y2="25" stroke="var(--accent2)" stroke-width="1" stroke-linecap="round"/>
        <circle cx="100" cy="100" r="4" fill="var(--accent)"/>
      </svg>
      <div class="clock-digital" id="clock-digital">00:00:00</div>
      <div class="clock-date" id="clock-date"></div>
      <div class="clock-alarm-section">
        <div class="clock-alarm-title">Alarmen</div>
        <div class="clock-alarm-row">
          <input type="time" class="clock-alarm-input" id="alarm-input">
          <button class="clock-alarm-btn" onclick="addAlarm()">Instellen</button>
        </div>
        <div class="clock-alarm-list" id="alarm-list">
          ${ud.alarms.map(a=>`<div class="clock-alarm-item"><span>⏰ ${a.time}</span><span style="font-size:11px;color:var(--text-muted)">${a.active?'Actief':'Uit'}</span><button class="clock-alarm-del" onclick="delAlarm(${a.id})"><i class="ti ti-x"></i></button></div>`).join('')}
        </div>
      </div>
    </div>`;
  }

  function tick() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    const ha = (h % 12 + m / 60) * 30 - 90;
    const ma = (m + s / 60) * 6 - 90;
    const sa = s * 6 - 90;
    const toXY = (a, r) => [100 + r * Math.cos(a * Math.PI / 180), 100 + r * Math.sin(a * Math.PI / 180)];
    const ch = document.getElementById('ch'), cm = document.getElementById('cm'), cs = document.getElementById('cs');
    if (ch) { const p = toXY(ha, 50); ch.setAttribute('x2', p[0]); ch.setAttribute('y2', p[1]); }
    if (cm) { const p = toXY(ma, 65); cm.setAttribute('x2', p[0]); cm.setAttribute('y2', p[1]); }
    if (cs) { const p = toXY(sa, 75); cs.setAttribute('x2', p[0]); cs.setAttribute('y2', p[1]); }
    const dEl = document.getElementById('clock-digital');
    if (dEl) dEl.textContent = [h,m,s].map(v=>v.toString().padStart(2,'0')).join(':');
    const dtEl = document.getElementById('clock-date');
    if (dtEl) dtEl.textContent = now.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    // Check alarms
    const timeStr = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
    ud.alarms.forEach(a => { if (a.active && a.time === timeStr && s === 0) notify('⏰ Alarm', `Alarm om ${a.time}!`, 'ti-alarm'); });
  }

  window.addAlarm = () => {
    const t = document.getElementById('alarm-input')?.value;
    if (!t) return;
    ud.alarms.push({ id: Date.now(), time: t, active: true });
    saveUserData(currentUser.username, ud);
    render();
    startClockTick();
  };
  window.delAlarm = (id) => { ud.alarms = ud.alarms.filter(a => a.id !== id); saveUserData(currentUser.username, ud); render(); startClockTick(); };

  function startClockTick() {
    clearInterval(window._clockInterval);
    window._clockInterval = setInterval(tick, 1000);
    tick();
  }

  render();
  startClockTick();
}

      <button class="paint-tool-btn" id="ptool-fill" onclick="paintTool('fill')"><i class="ti ti-bucket"></i> Vullen</button>
      <div class="paint-color-row">
        ${['#000000','#ffffff','#ef4444','#f59e0b','#22c55e','#3b82f6','#6366f1','#ec4899','#14b8a6','#f97316'].map(c=>`<div class="paint-color-swatch${c==='#000000'?' selected':''}" style="background:${c}" onclick="paintColor('${c}')"></div>`).join('')}
        <input type="color" id="paint-custom-color" style="width:22px;height:22px;border:none;background:none;cursor:pointer;padding:0;" onchange="paintColor(this.value)">
      </div>
      <input type="range" class="paint-size-slider" id="paint-size" min="1" max="40" value="4">
      <button class="paint-tool-btn" onclick="paintClear()"><i class="ti ti-trash"></i> Wis</button>
      <button class="paint-tool-btn" onclick="paintSave()"><i class="ti ti-download"></i></button>
    </div>
    <div class="paint-canvas-wrap">
      <canvas class="paint-canvas" id="paint-canvas"></canvas>
    </div>
  </div>`;

  const canvas = document.getElementById('paint-canvas');
  const wrap = body.querySelector('.paint-canvas-wrap');
  canvas.width = wrap.offsetWidth || 600;
  canvas.height = wrap.offsetHeight || 400;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let tool = 'pen', color = '#000000', size = 4;
  let drawing = false, startX, startY, snapshot;

  canvas.addEventListener('mousedown', e => {
    drawing = true;
    const r = canvas.getBoundingClientRect();
    startX = e.clientX - r.left; startY = e.clientY - r.top;
    snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
    if (tool === 'pen' || tool === 'eraser') { ctx.beginPath(); ctx.moveTo(startX, startY); }
  });

  canvas.addEventListener('mousemove', e => {
    if (!drawing) return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    ctx.putImageData(snapshot, 0, 0);
    ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
    ctx.lineWidth = tool === 'eraser' ? size * 3 : size;
    ctx.lineCap = 'round';
    if (tool === 'pen' || tool === 'eraser') { ctx.lineTo(x, y); ctx.stroke(); }
    else if (tool === 'line') { ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(x, y); ctx.stroke(); }
    else if (tool === 'rect') { ctx.strokeRect(startX, startY, x-startX, y-startY); }
    else if (tool === 'circle') { ctx.beginPath(); ctx.ellipse((startX+x)/2,(startY+y)/2,Math.abs(x-startX)/2,Math.abs(y-startY)/2,0,0,Math.PI*2); ctx.stroke(); }
  });

  canvas.addEventListener('mouseup', () => { drawing = false; });

  window.paintTool = (t) => {
    tool = t;
    document.querySelectorAll('.paint-tool-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('ptool-' + t);
    if (btn) btn.classList.add('active');
    if (t === 'fill') {
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  };
  window.paintColor = (c) => {
    color = c;
    document.querySelectorAll('.paint-color-swatch').forEach(s => s.classList.remove('selected'));
  };
  window.paintClear = () => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); };
  window.paintSave = () => {
    const a = document.createElement('a');
    a.download = 'my-os-tekening.png';
    a.href = canvas.toDataURL();
    a.click();
  };
  document.getElementById('paint-size').addEventListener('input', e => size = parseInt(e.target.value));
}

      <div class="settings-group">
        <div class="sysinfo-process-list" style="padding:8px 16px;">
          ${[['my-os-kernel','Kern','2.1 MB'],['window-manager','Vensterbeheer','1.4 MB'],['auth-service','Authenticatie','0.8 MB'],['file-system','Bestandssysteem','1.2 MB'],['notification-daemon','Meldingen','0.3 MB'],['clock-service','Klok','0.1 MB']]
            .map(([n,l,m])=>`<div class="sysinfo-proc-item"><span style="color:var(--accent2);font-family:monospace;font-size:12px">${n}</span><span style="color:var(--text-muted);font-size:12px">${l}</span><span style="color:var(--text-muted);font-size:12px">${m}</span></div>`).join('')}

function renderAppStore(body) {

          style="flex:1;min-width:140px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-size:13px;outline:none;"
          oninput="asSearch(this.value)">
        <div style="display:flex;gap:4px;overflow-x:auto;flex-wrap:nowrap;">
          ${['Alle','Games','Ontwikkeling','Ontwerp','Productiviteit','Kaarten','Wetenschap','Nieuws','Websites'].map(c =>
            `<div onclick="asCat('${c}')" id="as-cat-${c.replace(/\s/g,'_')}" style="padding:5px 11px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;${cat===c?'background:var(--accent);color:#fff;':'background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-muted);'}">${c}</div>`
          ).join('')}
        </div>
      </div>
      <div id="as-grid" style="flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;align-content:start;"></div>
    </div>

    <!-- Installed panel -->
    <div id="as-installed" style="flex:1;display:none;flex-direction:column;overflow:hidden;">
      <div style="flex:1;overflow-y:auto;" id="as-installed-body"></div>

  window.asTab = (t) => {
    const disc = document.getElementById('as-discover');
    const inst = document.getElementById('as-installed');

      ti.style.cssText = 'padding:8px 18px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-muted);';

      disc.style.display = 'none'; inst.style.display = 'flex';

      renderInstalledTab();

  window.asInstall = (id) => {

    const ids = getInstalledIds();
    if (!ids.includes(id)) { ids.push(id); saveInstalledIds(ids); }

}

// ===================== CODE EDITOR APP =====================
function renderCodeEditor(body) {
  const langs = ['html','css','javascript','python','json','markdown'];
  let activeLang = 'html', tabs = { html:'<!DOCTYPE html>\n<html>\n<head>\n  <title>Mijn Pagina</title>\n</head>\n<body>\n  <h1>Hallo wereld!</h1>\n</body>\n</html>', css:'body {\n  font-family: sans-serif;\n  background: #f0f0f0;\n  margin: 0;\n  padding: 20px;\n}', javascript:'// JavaScript\nconsole.log("Hallo!");\n\nfunction greet(name) {\n  return `Hallo, ${name}!`;\n}\n', python:'# Python code\ndef hallo(naam):\n    print(f"Hallo, {naam}!")\n\nhallo("Wereld")\n', json:'{\n  "naam": "My-OS",\n  "versie": "2.0",\n  "features": ["editor","terminal","browser"]\n}', markdown:'# Hallo Markdown\n\nDit is een **vet** woord en dit is *cursief*.\n\n## Lijst\n- Item 1\n- Item 2\n\n```js\nconsole.log("code");\n```\n' };
  const colors = { html:'#f97316', css:'#3b82f6', javascript:'#f59e0b', python:'#22c55e', json:'#14b8a6', markdown:'#a78bfa' };

  function render() {
    body.innerHTML = `<div style="display:flex;flex-direction:column;height:100%;">
      <div style="display:flex;gap:0;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.2);flex-shrink:0;overflow-x:auto;">
        ${langs.map(l => `<div onclick="ceTab('${l}')" style="padding:8px 14px;font-size:12px;cursor:pointer;border-bottom:2px solid ${l===activeLang?colors[l]:'transparent'};color:${l===activeLang?'var(--text)':'var(--text-muted)'};white-space:nowrap;flex-shrink:0;font-family:monospace;">${l}</div>`).join('')}
        <div style="flex:1;"></div>
        <div style="display:flex;gap:6px;align-items:center;padding:0 10px;">
          <button onclick="ceRun()" style="padding:4px 12px;background:var(--accent);border:none;border-radius:6px;color:#fff;font-size:12px;cursor:pointer;"><i class="ti ti-player-play"></i> Uitvoeren</button>
          <button onclick="ceCopy()" style="padding:4px 10px;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:6px;color:var(--text-muted);font-size:12px;cursor:pointer;"><i class="ti ti-copy"></i></button>
          <button onclick="ceSave()" style="padding:4px 10px;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:6px;color:var(--text-muted);font-size:12px;cursor:pointer;"><i class="ti ti-download"></i></button>
        </div>
      </div>
      <div style="display:flex;flex:1;overflow:hidden;">
        <div style="flex:1;display:flex;flex-direction:column;position:relative;min-width:0;">
          <div style="display:flex;gap:0;position:relative;flex:1;overflow:hidden;">
            <div id="ce-lines" style="padding:12px 8px;background:rgba(0,0,0,0.3);font-family:monospace;font-size:13px;line-height:1.6;color:var(--text-dim);text-align:right;user-select:none;min-width:36px;overflow:hidden;border-right:1px solid var(--border);"></div>
            <textarea id="ce-area" spellcheck="false"
              style="flex:1;padding:12px;background:transparent;border:none;outline:none;font-family:'Courier New',monospace;font-size:13px;line-height:1.6;color:var(--text);resize:none;tab-size:2;white-space:pre;"
              oninput="ceInput()" onkeydown="ceKey(event)">${tabs[activeLang]}</textarea>
          </div>
          <div id="ce-statusbar" style="padding:3px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);flex-shrink:0;display:flex;gap:16px;">
            <span id="ce-pos">Ln 1, Kl 1</span>
            <span style="color:${colors[activeLang]};font-weight:600;">${activeLang.toUpperCase()}</span>
            <span>UTF-8</span>
          </div>
        </div>
        <div id="ce-preview" style="flex:1;border-left:1px solid var(--border);display:${activeLang==='html'?'flex':'none'};flex-direction:column;min-width:0;">
          <div style="padding:4px 12px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text-dim);flex-shrink:0;">Preview</div>
          <iframe id="ce-iframe" style="flex:1;border:none;background:#fff;"></iframe>
        </div>
      </div>
    </div>`;
    ceUpdateLines();
    if (activeLang === 'html') ceUpdatePreview();
  }

  window.ceTab = (l) => { tabs[activeLang] = document.getElementById('ce-area')?.value || tabs[activeLang]; activeLang = l; render(); };
  window.ceInput = () => {
    const area = document.getElementById('ce-area');
    if (area) tabs[activeLang] = area.value;
    ceUpdateLines();
    if (activeLang === 'html') ceUpdatePreview();
    const pos = document.getElementById('ce-pos');
    if (pos && area) {
      const text = area.value.substring(0, area.selectionStart);
      const lines = text.split('\n');
      pos.textContent = `Ln ${lines.length}, Kl ${lines[lines.length-1].length+1}`;
    }
  };
  window.ceKey = (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const area = document.getElementById('ce-area');
      const s = area.selectionStart, end = area.selectionEnd;
      area.value = area.value.substring(0,s) + '  ' + area.value.substring(end);
      area.selectionStart = area.selectionEnd = s + 2;
      ceInput();
    }
  };
  function ceUpdateLines() {
    const area = document.getElementById('ce-area');
    const lines = document.getElementById('ce-lines');
    if (!area || !lines) return;
    const n = (area.value.match(/\n/g)||[]).length + 1;
    lines.innerHTML = Array.from({length:n},(_,i)=>`<div>${i+1}</div>`).join('');
    lines.scrollTop = area.scrollTop;
  }
  function ceUpdatePreview() {
    const iframe = document.getElementById('ce-iframe');
    if (!iframe) return;
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open(); doc.write(tabs['html']); doc.close();
  }
  window.ceRun = () => {
    if (activeLang === 'html') { ceUpdatePreview(); return; }
    if (activeLang === 'javascript') {
      try { const r = new Function(tabs['javascript'])(); if (r !== undefined) notify('Code Editor', String(r), 'ti-code'); }
      catch(e) { notify('Code Editor', 'Fout: ' + e.message, 'ti-alert-circle'); }
    } else { notify('Code Editor', activeLang + ' kan niet direct worden uitgevoerd in de browser.', 'ti-info-circle'); }
  };
  window.ceCopy = () => { navigator.clipboard?.writeText(tabs[activeLang]); notify('Code Editor', 'Gekopieerd!', 'ti-copy'); };
  window.ceSave = () => {
    const ext = {html:'html',css:'css',javascript:'js',python:'py',json:'json',markdown:'md'}[activeLang];
    const a = document.createElement('a');
    a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(tabs[activeLang]);
    a.download = 'code.' + ext; a.click();
  };
  render();
}

// ===================== SQL PAD =====================
function renderSqlPad(body) {
  let db = { users:[{id:1,naam:'Alice',email:'alice@example.com',leeftijd:28},{id:2,naam:'Bob',email:'bob@example.com',leeftijd:34},{id:3,naam:'Charlie',email:'charlie@example.com',leeftijd:22}], producten:[{id:1,naam:'Laptop',prijs:999.99,voorraad:15},{id:2,naam:'Muis',prijs:29.99,voorraad:87},{id:3,naam:'Toetsenbord',prijs:79.99,voorraad:43}] };
  let query = 'SELECT * FROM users;';
  body.innerHTML = `<div style="display:flex;flex-direction:column;height:100%;">
    <div style="padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-muted);flex-shrink:0;background:rgba(0,0,0,0.15);">
      Tabellen: <b style="color:var(--accent2)">users</b> (id, naam, email, leeftijd) &nbsp;|&nbsp; <b style="color:var(--accent2)">producten</b> (id, naam, prijs, voorraad)
    </div>
    <div style="flex:0 0 140px;display:flex;flex-direction:column;border-bottom:1px solid var(--border);">
      <textarea id="sql-input" spellcheck="false" style="flex:1;background:rgba(0,0,0,0.2);border:none;outline:none;padding:12px;font-family:monospace;font-size:13px;color:var(--text);resize:none;">${query}</textarea>
      <div style="padding:6px 10px;display:flex;gap:8px;background:rgba(0,0,0,0.1);flex-shrink:0;">
        <button onclick="sqlRun()" style="padding:5px 16px;background:var(--accent);border:none;border-radius:7px;color:#fff;font-size:13px;cursor:pointer;"><i class="ti ti-player-play"></i> Uitvoeren</button>
        <button onclick="sqlClear()" style="padding:5px 12px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:7px;color:var(--text-muted);font-size:13px;cursor:pointer;">Wis</button>
        <span style="font-size:11px;color:var(--text-dim);margin-left:auto;align-self:center;">Ctrl+Enter om uit te voeren</span>
      </div>
    </div>
    <div id="sql-result" style="flex:1;overflow:auto;padding:10px;font-size:13px;"></div>
  </div>`;

  document.getElementById('sql-input').addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); sqlRun(); } });

  window.sqlRun = () => {
    const q = document.getElementById('sql-input').value.trim().toLowerCase();
    const res = document.getElementById('sql-result');
    try {
      if (q.startsWith('select')) {
        const match = q.match(/from\s+(\w+)/); if (!match) throw new Error('Geen geldige tabel');
        const tbl = match[1];
        if (!db[tbl]) throw new Error(`Tabel '${tbl}' bestaat niet`);
        let rows = [...db[tbl]];
        const whereM = q.match(/where\s+(\w+)\s*(=|>|<|>=|<=|!=)\s*'?([^'\s]+)'?/);
        if (whereM) {
          const [,col,op,val] = whereM;
          rows = rows.filter(r => { const v = r[col]; const n = parseFloat(val);
            if (op==='=') return String(v)===val||v==n; if (op==='>') return v>n; if (op==='<') return v<n;
            if (op==='>=') return v>=n; if (op==='<=') return v<=n; if (op==='!=') return String(v)!==val; return true; });
        }
        const limitM = q.match(/limit\s+(\d+)/);
        if (limitM) rows = rows.slice(0, parseInt(limitM[1]));
        if (!rows.length) { res.innerHTML = `<div style="color:var(--text-muted);padding:12px;">Geen resultaten.</div>`; return; }
        const cols = Object.keys(rows[0]);
        res.innerHTML = `<div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">${rows.length} rij(en)</div>
          <table style="width:100%;border-collapse:collapse;font-size:12px;">

function renderJsonViewer(body) {
  body.innerHTML = `<div style="display:flex;flex-direction:column;height:100%;">
    <div style="display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;">
      <button onclick="jsonParse()" style="padding:5px 14px;background:var(--accent);border:none;border-radius:7px;color:#fff;font-size:12px;cursor:pointer;"><i class="ti ti-check"></i> Valideren</button>
      <button onclick="jsonFormat()" style="padding:5px 14px;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:7px;color:var(--text-muted);font-size:12px;cursor:pointer;">Formatteren</button>
      <button onclick="jsonMinify()" style="padding:5px 14px;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:7px;color:var(--text-muted);font-size:12px;cursor:pointer;">Minify</button>
      <input id="json-search" placeholder="Zoek sleutel..." style="flex:1;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:7px;padding:5px 10px;color:var(--text);font-size:12px;outline:none;">
    </div>
    <div style="display:flex;flex:1;overflow:hidden;">
      <textarea id="json-input" spellcheck="false" placeholder='Plak hier JSON...' style="flex:1;padding:12px;background:rgba(0,0,0,0.2);border:none;border-right:1px solid var(--border);outline:none;font-family:monospace;font-size:13px;color:var(--text);resize:none;">{"naam":"My-OS","versie":"2.0","apps":["Browser","Terminal","Editor"],"stats":{"windows":0,"users":1}}</textarea>
      <div id="json-tree" style="flex:1;overflow:auto;padding:12px;font-family:monospace;font-size:13px;line-height:1.6;"></div>
    </div>
    <div id="json-status" style="padding:4px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);flex-shrink:0;"></div>
  </div>`;

  function buildTree(val, indent=0) {
    if (val === null) return `<span style="color:#ef4444;">null</span>`;
    if (typeof val === 'boolean') return `<span style="color:#f59e0b;">${val}</span>`;
    if (typeof val === 'number') return `<span style="color:#22c55e;">${val}</span>`;
    if (typeof val === 'string') return `<span style="color:#a78bfa;">"${val}"</span>`;
    if (Array.isArray(val)) {
      if (!val.length) return `<span style="color:var(--text-muted);">[]</span>`;
      const items = val.map((v,i)=>`<div style="padding-left:20px;">${buildTree(v, indent+1)}${i<val.length-1?',':''}</div>`).join('');
      return `<details open><summary style="cursor:pointer;color:var(--text-muted);">[ ${val.length} items ]</summary>${items}</details>`;
    }
    if (typeof val === 'object') {
      const keys = Object.keys(val);
      if (!keys.length) return `<span style="color:var(--text-muted);">{}</span>`;
      const items = keys.map((k,i)=>`<div style="padding-left:20px;"><span style="color:#60a5fa;">"${k}"</span>: ${buildTree(val[k], indent+1)}${i<keys.length-1?',':''}</div>`).join('');
      return `<details open><summary style="cursor:pointer;color:var(--text-muted);">{ ${keys.length} sleutels }</summary>${items}</details>`;
    }
    return String(val);
  }

  window.jsonParse = () => {
    try {
      const v = JSON.parse(document.getElementById('json-input').value);
      document.getElementById('json-tree').innerHTML = buildTree(v);
      document.getElementById('json-status').innerHTML = '<span style="color:var(--success);">✓ Geldige JSON</span>';
    } catch(e) { document.getElementById('json-status').innerHTML = `<span style="color:var(--danger);">✗ ${e.message}</span>`; document.getElementById('json-tree').innerHTML=''; }
  };
  window.jsonFormat = () => {
    try { const v = JSON.parse(document.getElementById('json-input').value); document.getElementById('json-input').value = JSON.stringify(v,null,2); jsonParse(); } catch(e) {}
  };
  window.jsonMinify = () => {
    try { const v = JSON.parse(document.getElementById('json-input').value); document.getElementById('json-input').value = JSON.stringify(v); jsonParse(); } catch(e) {}
  };
  jsonParse();
}

// ===================== POMODORO =====================
function renderPomodoro(body) {
  let mode='work', running=false, secs=25*60, interval=null;
  const modes = { work:25*60, short:5*60, long:15*60 };
  function fmt(s){return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;}
  function render(){
    body.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:20px;background:linear-gradient(160deg,${mode==='work'?'#1a0a0a,#0f0f1a':'#0a1a0a,#0f0f1a'});">
      <div style="display:flex;gap:6px;">
        ${[['work','Werk','#ef4444'],['short','Korte pauze','#22c55e'],['long','Lange pauze','#3b82f6']].map(([m,l,c])=>`<button onclick="pomMode('${m}')" style="padding:6px 14px;border:none;border-radius:8px;font-size:12px;cursor:pointer;background:${mode===m?c:'rgba(255,255,255,0.07)'};color:${mode===m?'#fff':'var(--text-muted)'};">${l}</button>`).join('')}
      </div>
      <svg viewBox="0 0 200 200" width="180" height="180">
        <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8"/>
        <circle cx="100" cy="100" r="88" fill="none" stroke="${mode==='work'?'#ef4444':mode==='short'?'#22c55e':'#3b82f6'}" stroke-width="8"
          stroke-dasharray="${2*Math.PI*88}" stroke-dashoffset="${2*Math.PI*88*(1-secs/modes[mode])}"
          stroke-linecap="round" transform="rotate(-90 100 100)" style="transition:stroke-dashoffset .5s;"/>
        <text x="100" y="108" text-anchor="middle" fill="white" font-size="36" font-weight="200" font-family="sans-serif">${fmt(secs)}</text>
      </svg>
      <div style="font-size:14px;color:var(--text-muted);">${mode==='work'?'Focustijd':'Pauzetijd'}</div>
      <div style="display:flex;gap:12px;">
        <button onclick="pomToggle()" style="width:56px;height:56px;border-radius:50%;background:${mode==='work'?'#ef4444':mode==='short'?'#22c55e':'#3b82f6'};border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
          <i class="ti ti-${running?'player-pause':'player-play'}"></i>
        </button>
        <button onclick="pomReset()" style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text-muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
          <i class="ti ti-refresh"></i>
        </button>
      </div>
      <div id="pom-sessions" style="font-size:12px;color:var(--text-dim);">Sessies: ${LS.get('pom_sessions')||0}</div>
    </div>`;
  }
  window.pomMode=(m)=>{clearInterval(interval);running=false;mode=m;secs=modes[m];render();};
  window.pomToggle=()=>{
    running=!running;
    if(running){interval=setInterval(()=>{secs--;if(secs<=0){clearInterval(interval);running=false;if(mode==='work'){const s=(LS.get('pom_sessions')||0)+1;LS.set('pom_sessions',s);}notify('Pomodoro',mode==='work'?'Tijd voor een pauze!':'Pauze klaar, ga werken!','ti-clock');pomReset();}else render();},1000);}
    else clearInterval(interval);
    render();
  };
  window.pomReset=()=>{clearInterval(interval);running=false;secs=modes[mode];render();};
  render();
}

function renderConverter(body) {
  const units = {
    Lengte:{m:1,km:0.001,cm:100,mm:1000,inch:39.3701,ft:3.28084,yard:1.09361,mijl:0.000621371},
    Gewicht:{kg:1,g:1000,mg:1e6,lb:2.20462,oz:35.274,ton:0.001},
    Temperatuur:{special:true},
    Oppervlakte:{'m²':1,'km²':1e-6,'cm²':10000,'ha':0.0001,'ft²':10.7639,'acre':0.000247105},
    Snelheid:{'m/s':1,'km/u':3.6,'mph':2.23694,'knot':1.94384},
  };
  let cat='Lengte', from='m', to='km', val=1;
  function convert(v,f,t,c){
    if(c==='Temperatuur'){
      const inC=f==='°C'?v:f==='°F'?(v-32)*5/9:v-273.15;
      return t==='°C'?inC:t==='°F'?inC*9/5+32:inC+273.15;
    }
    return v/units[c][f]*units[c][t];
  }
  function render(){
    const cu=cat==='Temperatuur'?{...{'°C':1,'°F':1,'K':1}}:units[cat];
    const ks=Object.keys(cu);
    if(!ks.includes(from))from=ks[0]; if(!ks.includes(to))to=ks[1]||ks[0];
    const result=convert(val,from,to,cat);
    body.innerHTML=`<div style="display:flex;flex-direction:column;height:100%;padding:20px;gap:16px;overflow-y:auto;">
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${Object.keys(units).map(c=>`<button onclick="convCat('${c}')" style="padding:6px 14px;border:none;border-radius:8px;font-size:12px;cursor:pointer;background:${cat===c?'var(--accent)':'rgba(255,255,255,0.07)'};color:${cat===c?'#fff':'var(--text-muted)'};">${c}</button>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;">
        <div>
          <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:5px;">Van</label>
          <select id="conv-from" onchange="convFrom(this.value)" style="width:100%;background:var(--bg-dark);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:14px;outline:none;margin-bottom:8px;">
            ${ks.map(k=>`<option value="${k}"${k===from?' selected':''}>${k}</option>`).join('')}
          </select>
          <input id="conv-val" type="number" value="${val}" oninput="convVal(this.value)"
            style="width:100%;background:var(--bg-dark);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;color:var(--text);font-size:18px;outline:none;">
        </div>
        <div style="font-size:24px;color:var(--text-dim);padding-bottom:10px;">→</div>
        <div>
          <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:5px;">Naar</label>
          <select id="conv-to" onchange="convTo(this.value)" style="width:100%;background:var(--bg-dark);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:14px;outline:none;margin-bottom:8px;">
            ${ks.map(k=>`<option value="${k}"${k===to?' selected':''}>${k}</option>`).join('')}
          </select>
          <div style="background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.2);border-radius:8px;padding:10px 12px;font-size:18px;font-weight:500;color:var(--accent2);">${isNaN(result)?'–':parseFloat(result.toFixed(8))}</div>
        </div>
      </div>
      <div style="background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:14px;">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;font-weight:600;">Alle conversies</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;">
          ${ks.map(k=>{const r=convert(val,from,k,cat);return`<div style="padding:7px 10px;background:rgba(255,255,255,0.03);border-radius:7px;font-size:12px;"><span style="color:var(--text-muted);">${k}:</span> <span style="color:var(--text);font-weight:500;">${isNaN(r)?'–':parseFloat(r.toFixed(6))}</span></div>`;}).join('')}
        </div>
      </div>
    </div>`;
  }
  window.convCat=(c)=>{cat=c;render();};
  window.convFrom=(v)=>{from=v;render();};
  window.convTo=(v)=>{to=v;render();};
  window.convVal=(v)=>{val=parseFloat(v)||0;render();};
  render();
}

  pgGen();

    <button id="snake-start-btn" onclick="snakeStart()" style="padding:8px 20px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:13px;cursor:pointer;">Starten</button>
  </div>`;
  const CELL=20, COLS=16, ROWS=16;
  const canvas=document.getElementById('snake-canvas');
  const ctx=canvas.getContext('2d');
  let snake,dir,food,score,running,loop,paused=false;
  function draw(){
    ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,320,320);
    snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#22c55e':'#16a34a';ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);});
    ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2); ctx.fill();
  }
  function randomFood(){return{x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
  window.snakeStart=()=>{
    snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}]; dir={x:1,y:0}; food=randomFood(); score=0; running=true; paused=false;
    document.getElementById('snake-start-btn').style.display='none';
    clearInterval(loop);
    loop=setInterval(()=>{
      if(paused)return;
      const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
      if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
        clearInterval(loop); running=false;
        const hi=Math.max(score,LS.get('snake_hi')||0); LS.set('snake_hi',hi);
        ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,320,320);
        ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('Game Over!',160,150);
        ctx.font='14px sans-serif';ctx.fillStyle='#94a3b8';ctx.fillText('Score: '+score,160,175);
        document.getElementById('snake-start-btn').style.display=''; document.getElementById('snake-hi').textContent=hi;
        return;
      }
      snake.unshift(head);
      if(head.x===food.x&&head.y===food.y){score++;document.getElementById('snake-score').textContent=score;food=randomFood();}
      else snake.pop();
      draw();
    },120);
    draw();
  };
  ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,320,320);
  ctx.fillStyle='rgba(99,102,241,0.3)';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('Druk op Starten',160,165);
  const keyH=e=>{
    if(!running)return;
    if(e.key===' '){paused=!paused;return;}
    const map={'ArrowUp':{x:0,y:-1},'ArrowDown':{x:0,y:1},'ArrowLeft':{x:-1,y:0},'ArrowRight':{x:1,y:0},'w':{x:0,y:-1},'s':{x:0,y:1},'a':{x:-1,y:0},'d':{x:1,y:0}};
    const nd=map[e.key]; if(nd&&!(nd.x===-dir.x&&nd.y===-dir.y)){dir=nd;e.preventDefault();}
  };
  document.addEventListener('keydown',keyH);
  // Cleanup when window closes
  const origClose=window.closeWindow;
  window.closeWindow=(id)=>{if(id==='store_snake'){clearInterval(loop);document.removeEventListener('keydown',keyH);}origClose(id);};
}

// ===================== 2048 =====================
function render2048(body) {
  let grid,score,best=LS.get('2048_best')||0;
  function newGrid(){return Array.from({length:4},()=>[0,0,0,0]);}
  function addRandom(g){const empty=[];g.forEach((r,i)=>r.forEach((v,j)=>{if(!v)empty.push([i,j]);}));if(!empty.length)return;const[r,c]=empty[Math.floor(Math.random()*empty.length)];g[r][c]=Math.random()<0.9?2:4;}
  function init(){grid=newGrid();score=0;addRandom(grid);addRandom(grid);render2048UI();}
  const COLS=['#cdc1b4','#eee4da','#ede0c8','#f2b179','#f59563','#f67c5f','#f65e3b','#edcf72','#edcc61','#edc850','#edc53f','#edc22e'];
  function tileColor(v){const i=Math.log2(v||1);return COLS[Math.min(i,COLS.length-1)]||'#3c3a32';}
  function tileText(v){return v>0?v:'';}
  function render2048UI(){
    best=Math.max(score,best);LS.set('2048_best',best);
    body.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;height:100%;justify-content:center;background:#faf8ef;">
      <div style="display:flex;gap:10px;align-items:center;width:300px;justify-content:space-between;">
        <div style="font-size:26px;font-weight:800;color:#776e65;">2048</div>
        <div style="display:flex;gap:8px;">
          <div style="background:#bbada0;border-radius:6px;padding:6px 12px;text-align:center;"><div style="font-size:10px;color:#eee4da;font-weight:700;">SCORE</div><div style="font-size:16px;font-weight:700;color:#fff;">${score}</div></div>
          <div style="background:#bbada0;border-radius:6px;padding:6px 12px;text-align:center;"><div style="font-size:10px;color:#eee4da;font-weight:700;">BEST</div><div style="font-size:16px;font-weight:700;color:#fff;">${best}</div></div>
        </div>
      </div>
      <div style="background:#bbada0;border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:300px;">
        ${grid.flat().map(v=>`<div style="aspect-ratio:1;background:${tileColor(v)};border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:${v>99?v>999?18:22:28}px;font-weight:800;color:${v<=4?'#776e65':'#f9f6f2'};transition:all .1s;">${tileText(v)}</div>`).join('')}
      </div>
      <button onclick="init2048()" style="padding:8px 20px;background:#8f7a66;border:none;border-radius:8px;color:#fff;font-size:13px;cursor:pointer;font-weight:600;">Nieuw spel</button>
      <div style="font-size:12px;color:#776e65;">Pijltjestoetsen of WASD</div>
    </div>`;
  }
  function slide(row){let r=row.filter(v=>v),merged=false,res=[];
    for(let i=0;i<r.length;i++){if(!merged&&i+1<r.length&&r[i]===r[i+1]){res.push(r[i]*2);score+=r[i]*2;i++;merged=false;}else{res.push(r[i]);}}
    while(res.length<4)res.push(0);return res;}
  function move(dir){
    let moved=false;
    const ng=grid.map(r=>[...r]);
    if(dir==='left')ng.forEach((r,i)=>{const s=slide(r);if(s.join()!==r.join())moved=true;ng[i]=s;});
    else if(dir==='right')ng.forEach((r,i)=>{const s=slide([...r].reverse()).reverse();if(s.join()!==r.join())moved=true;ng[i]=s;});
    else if(dir==='up'||dir==='down'){
      for(let c=0;c<4;c++){let col=ng.map(r=>r[c]);if(dir==='down')col.reverse();const s=slide(col);if(dir==='down')s.reverse();if(s.join()!==col.join())moved=true;ng.forEach((r,i)=>r[c]=s[i]);}
    }
    if(moved){grid=ng;addRandom(grid);render2048UI();}
  }
  window.init2048=init;
  const keyH=e=>{const map={'ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up','ArrowDown':'down','a':'left','d':'right','w':'up','s':'down'};const d=map[e.key];if(d){e.preventDefault();move(d);}};
  document.addEventListener('keydown',keyH);
  const origClose=window.closeWindow;
  window.closeWindow=(id)=>{if(id==='store_2048')document.removeEventListener('keydown',keyH);origClose(id);};
  init();
}

// ===================== BOTER KAAS & EIEREN =====================
function renderTicTacToe(body) {
  let board=Array(9).fill(''), player='X', gameOver=false;
  function checkWin(b,p){const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return wins.some(([a,c,d])=>b[a]===p&&b[c]===p&&b[d]===p);}
  function aiMove(){
    const empty=board.map((v,i)=>v?null:i).filter(v=>v!==null);
    // Try to win
    for(const i of empty){const t=[...board];t[i]='O';if(checkWin(t,'O'))return i;}
    // Block player
    for(const i of empty){const t=[...board];t[i]='X';if(checkWin(t,'X'))return i;}
    // Center or random
    return board[4]===''?4:empty[Math.floor(Math.random()*empty.length)];
  }
  function render(){
    body.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;">
      <div style="font-size:18px;font-weight:600;" id="ttt-status">${gameOver?'':'Jij bent X, computer is O'}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:240px;">
        ${board.map((v,i)=>`<button onclick="tttPlay(${i})" style="height:74px;background:${v==='X'?'rgba(99,102,241,0.15)':v==='O'?'rgba(239,68,68,0.1)':'rgba(255,255,255,0.04)'};border:1px solid var(--border);border-radius:10px;font-size:32px;font-weight:700;color:${v==='X'?'var(--accent2)':'var(--danger)'};cursor:pointer;">${v}</button>`).join('')}
      </div>
      <button onclick="tttReset()" style="padding:8px 20px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:13px;cursor:pointer;">Nieuw spel</button>
    </div>`;
  }
  window.tttPlay=(i)=>{
    if(board[i]||gameOver)return;
    board[i]='X'; player='O';
    if(checkWin(board,'X')){gameOver=true;render();document.getElementById('ttt-status').textContent='🎉 Jij wint!';return;}
    if(board.every(v=>v)){gameOver=true;render();document.getElementById('ttt-status').textContent='Gelijkspel!';return;}
    const ai=aiMove(); board[ai]='O'; player='X';
    if(checkWin(board,'O')){gameOver=true;render();document.getElementById('ttt-status').textContent='💻 Computer wint!';return;}
    if(board.every(v=>v)){gameOver=true;render();document.getElementById('ttt-status').textContent='Gelijkspel!';return;}
    render();
  };
  window.tttReset=()=>{board=Array(9).fill('');player='X';gameOver=false;render();};
  render();
}

// ===================== MINESWEEPER =====================
function renderMinesweeper(body) {
  const ROWS=9,COLS=9,MINES=10;
  let grid,revealed,flagged,gameOver,firstClick;
  function init(){
    grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    revealed=Array.from({length:ROWS},()=>Array(COLS).fill(false));
    flagged=Array.from({length:ROWS},()=>Array(COLS).fill(false));
    gameOver=false;firstClick=true;renderMS();
  }
  function placeMines(sr,sc){
    let placed=0;while(placed<MINES){const r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS);if(grid[r][c]!=-1&&!(r===sr&&c===sc)){grid[r][c]=-1;placed++;}}
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]!==-1){let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc]===-1)cnt++;}grid[r][c]=cnt;}}
  function reveal(r,c){if(r<0||r>=ROWS||c<0||c>=COLS||revealed[r][c]||flagged[r][c])return;revealed[r][c]=true;if(grid[r][c]===0){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)reveal(r+dr,c+dc);}}
  function numColor(n){return['','#3b82f6','#22c55e','#ef4444','#6366f1','#f59e0b','#14b8a6','#ec4899','#64748b'][n]||'var(--text)';}
  function renderMS(){
    const remaining=MINES-flagged.flat().filter(Boolean).length;
    body.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;height:100%;justify-content:center;background:#0f0f1a;">
      <div style="display:flex;gap:20px;align-items:center;">
        <span style="font-size:20px;">💣 ${remaining}</span>
        <button onclick="msInit()" style="padding:6px 16px;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-size:16px;">🙂</button>
        <span style="font-size:13px;color:var(--text-muted);">Rechts: vlag</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(${COLS},1fr);gap:2px;background:rgba(255,255,255,0.05);padding:4px;border-radius:8px;">
        ${Array.from({length:ROWS},(_,r)=>Array.from({length:COLS},(_,c)=>{
          const rev=revealed[r][c],flag=flagged[r][c],val=grid[r][c];
          let content='',bg='rgba(255,255,255,0.07)',color='var(--text)';
          if(flag){content='🚩';}
          else if(rev){bg=val===-1?'rgba(239,68,68,0.3)':'rgba(0,0,0,0.3)';content=val===-1?'💣':val>0?val:'';color=numColor(val);}
          return`<button onclick="msClick(${r},${c})" oncontextmenu="msFlag(event,${r},${c})"
            style="width:30px;height:30px;background:${bg};border:1px solid rgba(255,255,255,0.05);border-radius:4px;font-size:14px;color:${color};font-weight:700;cursor:pointer;">${content}</button>`;
        }).join('')).join('')}
      </div>
    </div>`;
  }
  window.msInit=init;
  window.msClick=(r,c)=>{
    if(gameOver||flagged[r][c])return;
    if(firstClick){placeMines(r,c);firstClick=false;}
    if(grid[r][c]===-1){revealed[r][c]=true;gameOver=true;revealed.forEach((row,ri)=>row.forEach((_,ci)=>{if(grid[ri][ci]===-1)revealed[ri][ci]=true;}));renderMS();notify('Minesweeper','💥 Boem! Game over.','ti-bomb');return;}
    reveal(r,c);
    const won=revealed.flat().filter(Boolean).length===ROWS*COLS-MINES;
    if(won){gameOver=true;notify('Minesweeper','🎉 Gewonnen!','ti-trophy');}
    renderMS();
  };
  window.msFlag=(e,r,c)=>{e.preventDefault();if(gameOver||revealed[r][c])return;flagged[r][c]=!flagged[r][c];renderMS();};
  init();
}

</script>
