<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My-OS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --taskbar-h: 48px;
  --accent: #6366f1;
  --accent2: #818cf8;
  --bg-dark: #0f0f1a;
  --bg-mid: #1a1a2e;
  --bg-panel: #16213e;
  --bg-card: #1e2a45;
  --border: rgba(255,255,255,0.08);
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --info: #3b82f6;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
  --window-z: 100;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text); overflow: hidden; height: 100vh; width: 100vw; user-select: none; }

/* ===== AUTH SCREEN ===== */
#auth-screen {
  position: fixed; inset: 0; background: var(--bg-dark);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; flex-direction: column; gap: 24px;
}
.auth-logo { font-size: 42px; font-weight: 800; background: linear-gradient(135deg, #6366f1, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
.auth-sub { color: var(--text-muted); font-size: 14px; margin-top: -16px; }
.auth-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; width: 360px; }
.auth-tabs { display: flex; gap: 0; margin-bottom: 24px; background: var(--bg-dark); border-radius: 8px; padding: 3px; }
.auth-tab { flex: 1; padding: 8px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text-muted); transition: all .2s; }
.auth-tab.active { background: var(--accent); color: #fff; }
.auth-field { margin-bottom: 14px; }
.auth-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.auth-field input { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px; outline: none; transition: border .2s; }
.auth-field input:focus { border-color: var(--accent); }
.auth-btn { width: 100%; padding: 11px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s; margin-top: 4px; }
.auth-btn:hover { opacity: .9; }
.auth-error { color: var(--danger); font-size: 13px; text-align: center; margin-top: 8px; min-height: 20px; }
.auth-users { margin-top: 20px; }
.auth-users-title { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
.auth-user-chip { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--bg-dark); border-radius: 8px; cursor: pointer; margin-bottom: 6px; transition: background .2s; }
.auth-user-chip:hover { background: var(--bg-card); }
.auth-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; }

/* ===== DESKTOP ===== */
#desktop { position: fixed; inset: 0; bottom: var(--taskbar-h); background: var(--bg-dark); overflow: hidden; }
#wallpaper { position: absolute; inset: 0; background: radial-gradient(ellipse at 20% 50%, #1a0533 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, #0a1a3d 0%, transparent 60%), radial-gradient(ellipse at 50% 80%, #0d1f3c 0%, transparent 50%), var(--bg-dark); }
.desktop-icon { position: absolute; width: 76px; text-align: center; cursor: pointer; padding: 8px 4px; border-radius: 10px; transition: background .15s; }
.desktop-icon:hover { background: rgba(255,255,255,0.07); }
.desktop-icon .icon-img { font-size: 36px; display: block; margin: 0 auto 6px; }
.desktop-icon .icon-label { font-size: 11px; color: var(--text); text-shadow: 0 1px 3px rgba(0,0,0,0.8); word-break: break-word; }

/* ===== TASKBAR ===== */
#taskbar { position: fixed; bottom: 0; left: 0; right: 0; height: var(--taskbar-h); background: rgba(15,15,26,0.85); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 8px; z-index: 9000; }
.taskbar-start { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; flex-shrink: 0; }
.taskbar-divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
.taskbar-apps { display: flex; gap: 4px; flex: 1; overflow: hidden; }
.taskbar-app { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 7px; cursor: pointer; font-size: 12px; max-width: 140px; background: rgba(255,255,255,0.05); transition: background .15s; border: 1px solid transparent; overflow: hidden; }
.taskbar-app.active { background: rgba(99,102,241,0.2); border-color: var(--accent); }
.taskbar-app:hover { background: rgba(255,255,255,0.1); }
.taskbar-app-icon { font-size: 14px; flex-shrink: 0; }
.taskbar-app-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.taskbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.taskbar-clock { font-size: 12px; color: var(--text); text-align: right; cursor: pointer; }
.taskbar-user { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 8px; border-radius: 7px; }
.taskbar-user:hover { background: rgba(255,255,255,0.07); }

/* ===== START MENU ===== */
#start-menu { position: fixed; bottom: calc(var(--taskbar-h) + 8px); left: 12px; width: 320px; max-height: 500px; background: rgba(22,33,62,0.97); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: var(--radius-lg); z-index: 8999; display: none; flex-direction: column; overflow: hidden; }
#start-menu.open { display: flex; }
.sm-header { padding: 16px; border-bottom: 1px solid var(--border); }
.sm-search { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 13px; outline: none; }
.sm-search:focus { border-color: var(--accent); }
.sm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 12px; overflow-y: auto; }
.sm-app { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border-radius: 8px; cursor: pointer; transition: background .15s; }
.sm-app:hover { background: rgba(255,255,255,0.07); }
.sm-app-icon { font-size: 26px; }
.sm-app-name { font-size: 11px; color: var(--text-muted); text-align: center; }
.sm-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.sm-user-info { display: flex; align-items: center; gap: 10px; }
.sm-power { display: flex; gap: 8px; }
.sm-power-btn { padding: 6px 10px; background: transparent; border: 1px solid var(--border); border-radius: 7px; color: var(--text-muted); cursor: pointer; font-size: 16px; transition: background .15s; }
.sm-power-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); }

/* ===== WINDOWS ===== */
.window { position: absolute; background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 300px; min-height: 200px; z-index: var(--window-z); }
.window.focused { border-color: rgba(99,102,241,0.4); box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(99,102,241,0.15); }
.window.minimized { display: none !important; }
.window.maximized { top: 0 !important; left: 0 !important; width: 100% !important; height: calc(100vh - var(--taskbar-h)) !important; border-radius: 0 !important; }
.win-titlebar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); border-radius: var(--radius-lg) var(--radius-lg) 0 0; cursor: move; flex-shrink: 0; }
.win-icon { font-size: 16px; }
.win-title { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); }
.win-controls { display: flex; gap: 6px; }
.win-btn { width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: opacity .2s; }
.win-btn-min { background: #f59e0b; color: #78350f; }
.win-btn-max { background: #22c55e; color: #14532d; }
.win-btn-close { background: #ef4444; color: #7f1d1d; }
.win-btn:hover { opacity: .8; }
.win-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.win-resize { position: absolute; bottom: 0; right: 0; width: 16px; height: 16px; cursor: nwse-resize; }

/* ===== CONTEXT MENU ===== */
#ctx-menu { position: fixed; background: rgba(22,33,62,0.97); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 10px; min-width: 180px; z-index: 99999; display: none; padding: 4px; box-shadow: var(--shadow); }
.ctx-item { padding: 8px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 10px; color: var(--text); }
.ctx-item:hover { background: rgba(99,102,241,0.15); }
.ctx-item.danger { color: var(--danger); }
.ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }

/* ===== NOTIFICATION ===== */
#notifications { position: fixed; top: 16px; right: 16px; z-index: 99998; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.notif { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; min-width: 240px; max-width: 320px; display: flex; gap: 12px; align-items: flex-start; pointer-events: all; animation: slideIn .3s ease; box-shadow: var(--shadow); }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.notif-icon { font-size: 20px; flex-shrink: 0; }
.notif-body { flex: 1; }
.notif-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.notif-msg { font-size: 12px; color: var(--text-muted); }

/* ===== APPS ===== */
/* Filemanager */
.fm-wrap { display: flex; height: 100%; }
.fm-sidebar { width: 160px; background: rgba(0,0,0,0.2); border-right: 1px solid var(--border); padding: 8px; flex-shrink: 0; overflow-y: auto; }
.fm-sidebar-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--text-muted); }
.fm-sidebar-item:hover, .fm-sidebar-item.active { background: rgba(99,102,241,0.15); color: var(--text); }
.fm-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.fm-toolbar { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.fm-btn { padding: 5px 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.fm-btn:hover { background: rgba(99,102,241,0.15); }
.fm-path { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--text-muted); }
.fm-files { flex: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; align-content: start; }
.fm-file { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border-radius: 8px; cursor: pointer; transition: background .15s; text-align: center; }
.fm-file:hover { background: rgba(255,255,255,0.06); }
.fm-file.selected { background: rgba(99,102,241,0.2); }
.fm-file-icon { font-size: 32px; }
.fm-file-name { font-size: 11px; color: var(--text); word-break: break-all; max-height: 32px; overflow: hidden; }

/* Text Editor */
.editor-wrap { display: flex; flex-direction: column; height: 100%; }
.editor-menubar { padding: 6px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
.editor-mb-btn { padding: 3px 10px; background: transparent; border: 1px solid transparent; border-radius: 5px; color: var(--text-muted); font-size: 12px; cursor: pointer; }
.editor-mb-btn:hover { background: rgba(255,255,255,0.06); border-color: var(--border); color: var(--text); }
.editor-toolbar { padding: 4px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 4px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
.editor-tb-btn { width: 28px; height: 28px; background: transparent; border: none; border-radius: 5px; color: var(--text-muted); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.editor-tb-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); }
.editor-tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
.editor-area { flex: 1; padding: 16px 20px; outline: none; font-size: 14px; line-height: 1.7; color: var(--text); overflow-y: auto; background: transparent; min-height: 0; }
.editor-statusbar { padding: 4px 12px; border-top: 1px solid var(--border); display: flex; gap: 16px; font-size: 11px; color: var(--text-dim); flex-shrink: 0; }

/* Terminal */
.terminal-wrap { display: flex; flex-direction: column; height: 100%; background: #0a0a0f; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.terminal-output { flex: 1; padding: 12px 14px; font-family: 'Courier New', monospace; font-size: 13px; overflow-y: auto; line-height: 1.6; }
.terminal-line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-all; }
.terminal-line.cmd { color: #a78bfa; }
.terminal-line.out { color: #e2e8f0; }
.terminal-line.err { color: #f87171; }
.terminal-line.success { color: #4ade80; }
.terminal-line.info { color: #60a5fa; }
.terminal-input-row { display: flex; align-items: center; padding: 8px 14px; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
.terminal-prompt { color: #a78bfa; font-family: monospace; font-size: 13px; margin-right: 6px; white-space: nowrap; }
.terminal-input { flex: 1; background: transparent; border: none; outline: none; color: #e2e8f0; font-family: 'Courier New', monospace; font-size: 13px; }

/* Browser */
.browser-wrap { display: flex; flex-direction: column; height: 100%; }
.browser-bar { padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.browser-nav-btn { width: 28px; height: 28px; background: rgba(255,255,255,0.05); border: none; border-radius: 6px; color: var(--text-muted); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.browser-nav-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.browser-url { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 13px; color: var(--text); outline: none; }
.browser-url:focus { border-color: var(--accent); }
.browser-content { flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
.browser-home { text-align: center; padding: 32px; }
.browser-home-logo { font-size: 48px; font-weight: 800; background: linear-gradient(135deg, #6366f1, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
.browser-search-row { display: flex; gap: 8px; width: 100%; max-width: 400px; }
.browser-search-input { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; color: var(--text); font-size: 14px; outline: none; }
.browser-search-input:focus { border-color: var(--accent); }
.browser-search-btn { padding: 10px 16px; background: var(--accent); border: none; border-radius: 10px; color: #fff; cursor: pointer; font-size: 14px; }
.browser-bookmarks { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.browser-bookmark { padding: 8px 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 6px; }
.browser-bookmark:hover { background: rgba(99,102,241,0.15); color: var(--text); }

/* Calculator */
.calc-wrap { padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--bg-dark); height: 100%; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.calc-display { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; text-align: right; }
.calc-expr { font-size: 12px; color: var(--text-muted); min-height: 18px; margin-bottom: 4px; }
.calc-val { font-size: 32px; font-weight: 300; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: 1; }
.calc-btn { border: none; border-radius: 10px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 500; transition: transform .1s, opacity .15s; }
.calc-btn:active { transform: scale(.94); }
.calc-btn.num { background: rgba(255,255,255,0.07); color: var(--text); }
.calc-btn.num:hover { background: rgba(255,255,255,0.12); }
.calc-btn.op { background: rgba(99,102,241,0.2); color: var(--accent2); }
.calc-btn.op:hover { background: rgba(99,102,241,0.35); }
.calc-btn.eq { background: var(--accent); color: #fff; }
.calc-btn.eq:hover { opacity: .9; }
.calc-btn.fn { background: rgba(255,255,255,0.04); color: var(--text-muted); font-size: 13px; }
.calc-btn.fn:hover { background: rgba(255,255,255,0.09); }
.calc-btn.span2 { grid-column: span 2; }

/* Settings */
.settings-wrap { display: flex; height: 100%; }
.settings-nav { width: 180px; background: rgba(0,0,0,0.2); border-right: 1px solid var(--border); padding: 8px; flex-shrink: 0; overflow-y: auto; }
.settings-nav-item { padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.settings-nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
.settings-nav-item.active { background: rgba(99,102,241,0.15); color: var(--text); }
.settings-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
.settings-section-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
.settings-group { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.settings-row:last-child { border-bottom: none; }
.settings-row-info { flex: 1; }
.settings-row-label { font-size: 14px; font-weight: 500; }
.settings-row-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.settings-toggle { width: 42px; height: 24px; background: var(--border); border-radius: 12px; cursor: pointer; position: relative; transition: background .2s; flex-shrink: 0; }
.settings-toggle.on { background: var(--accent); }
.settings-toggle::after { content:''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: transform .2s; }
.settings-toggle.on::after { transform: translateX(18px); }
.settings-input { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 13px; outline: none; }
.settings-input:focus { border-color: var(--accent); }
.settings-select { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 13px; outline: none; cursor: pointer; }
.settings-color-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.settings-color-chip { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .15s; }
.settings-color-chip:hover { transform: scale(1.15); }
.settings-color-chip.selected { border-color: #fff; }
.settings-save-btn { padding: 8px 20px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-size: 13px; cursor: pointer; margin-top: 4px; }
.settings-save-btn:hover { opacity: .9; }

/* Notes */
.notes-wrap { display: flex; height: 100%; }
.notes-list { width: 200px; background: rgba(0,0,0,0.2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.notes-list-header { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.notes-list-title { font-size: 13px; font-weight: 600; }
.notes-add-btn { width: 24px; height: 24px; background: var(--accent); border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.notes-items { flex: 1; overflow-y: auto; padding: 6px; }
.notes-item { padding: 8px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 3px; }
.notes-item:hover { background: rgba(255,255,255,0.05); }
.notes-item.active { background: rgba(99,102,241,0.15); }
.notes-item-title { font-size: 13px; font-weight: 500; color: var(--text); }
.notes-item-preview { font-size: 11px; color: var(--text-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 2px; }
.notes-item-date { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.notes-editor { flex: 1; display: flex; flex-direction: column; }
.notes-title-input { padding: 14px 16px; background: transparent; border: none; border-bottom: 1px solid var(--border); outline: none; font-size: 16px; font-weight: 600; color: var(--text); }
.notes-body-input { flex: 1; padding: 14px 16px; background: transparent; border: none; outline: none; font-size: 13px; color: var(--text); line-height: 1.7; resize: none; font-family: inherit; }
.notes-footer { padding: 6px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; }

/* Music Player */
.music-wrap { display: flex; flex-direction: column; height: 100%; padding: 16px; gap: 12px; background: linear-gradient(160deg, #1a0533, #0a1a3d); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.music-cover { width: 120px; height: 120px; background: rgba(255,255,255,0.07); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 48px; flex-shrink: 0; }
.music-info { text-align: center; }
.music-title { font-size: 16px; font-weight: 600; }
.music-artist { font-size: 13px; color: var(--text-muted); }
.music-progress { display: flex; flex-direction: column; gap: 6px; }
.music-slider { width: 100%; -webkit-appearance: none; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; cursor: pointer; }
.music-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--accent); border-radius: 50%; }
.music-time { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
.music-controls { display: flex; align-items: center; justify-content: center; gap: 16px; }
.music-ctrl-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; padding: 6px; border-radius: 50%; transition: color .15s; }
.music-ctrl-btn:hover { color: var(--text); }
.music-ctrl-btn.play { background: var(--accent); color: #fff; width: 48px; height: 48px; border-radius: 50%; font-size: 22px; display: flex; align-items: center; justify-content: center; }
.music-ctrl-btn.play:hover { opacity: .9; }
.music-playlist { flex: 1; overflow-y: auto; }
.music-pl-title { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.music-pl-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.music-pl-item:hover { background: rgba(255,255,255,0.05); }
.music-pl-item.active { background: rgba(99,102,241,0.15); }
.music-pl-num { font-size: 12px; color: var(--text-dim); width: 20px; text-align: center; flex-shrink: 0; }
.music-pl-info { flex: 1; }
.music-pl-name { font-size: 13px; }
.music-pl-art { font-size: 11px; color: var(--text-muted); }

/* Photos */
.photos-wrap { height: 100%; display: flex; flex-direction: column; }
.photos-toolbar { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.photos-grid { flex: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; align-content: start; }
.photos-item { aspect-ratio: 1; border-radius: 8px; overflow: hidden; cursor: pointer; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; font-size: 36px; border: 1px solid var(--border); transition: transform .15s; }
.photos-item:hover { transform: scale(1.03); }
.photos-lightbox { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 10; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.photos-lightbox-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; background: rgba(255,255,255,0.1); border: none; border-radius: 50%; color: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.photos-lightbox-img { max-width: 90%; max-height: 90%; border-radius: 8px; font-size: 80px; }

/* Calendar */
.calendar-wrap { height: 100%; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
.calendar-header { display: flex; align-items: center; justify-content: space-between; }
.calendar-month { font-size: 18px; font-weight: 600; }
.calendar-nav-btn { background: rgba(255,255,255,0.06); border: none; border-radius: 7px; color: var(--text); cursor: pointer; padding: 6px 10px; font-size: 14px; }
.calendar-nav-btn:hover { background: rgba(255,255,255,0.12); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.calendar-day-label { text-align: center; font-size: 11px; color: var(--text-muted); padding: 4px; font-weight: 500; }
.calendar-cell { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; transition: background .15s; flex-direction: column; gap: 2px; }
.calendar-cell:hover { background: rgba(255,255,255,0.06); }
.calendar-cell.other-month { color: var(--text-dim); }
.calendar-cell.today { background: rgba(99,102,241,0.15); color: var(--accent2); font-weight: 600; }
.calendar-cell.has-event::after { content:''; width: 4px; height: 4px; background: var(--accent); border-radius: 50%; }
.calendar-cell.selected { background: var(--accent) !important; color: #fff; }
.calendar-events { flex: 1; overflow-y: auto; }
.calendar-events-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.calendar-event-item { background: rgba(99,102,241,0.1); border-left: 3px solid var(--accent); border-radius: 0 7px 7px 0; padding: 8px 12px; margin-bottom: 6px; }
.calendar-event-name { font-size: 13px; font-weight: 500; }
.calendar-event-time { font-size: 11px; color: var(--text-muted); }
.calendar-add-row { display: flex; gap: 6px; margin-top: 8px; }
.calendar-add-input { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; color: var(--text); font-size: 13px; outline: none; }
.calendar-add-btn { padding: 7px 12px; background: var(--accent); border: none; border-radius: 7px; color: #fff; font-size: 13px; cursor: pointer; }

/* Weather */
.weather-wrap { padding: 20px; height: 100%; overflow-y: auto; }
.weather-location { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.weather-main { display: flex; align-items: center; gap: 16px; margin: 16px 0; }
.weather-icon { font-size: 64px; }
.weather-temp { font-size: 64px; font-weight: 200; }
.weather-desc { font-size: 16px; color: var(--text-muted); }
.weather-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.weather-stat { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
.weather-stat-val { font-size: 18px; font-weight: 500; }
.weather-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.weather-forecast { margin-top: 16px; }
.weather-fc-title { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.weather-fc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.weather-fc-day { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; text-align: center; }
.weather-fc-day-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.weather-fc-day-icon { font-size: 20px; margin-bottom: 4px; }
.weather-fc-day-temp { font-size: 13px; font-weight: 500; }

/* Todo */
.todo-wrap { display: flex; flex-direction: column; height: 100%; padding: 16px; gap: 12px; }
.todo-add-row { display: flex; gap: 8px; }
.todo-add-input { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 14px; outline: none; }
.todo-add-input:focus { border-color: var(--accent); }
.todo-add-btn { padding: 9px 16px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-size: 14px; cursor: pointer; }
.todo-filters { display: flex; gap: 6px; }
.todo-filter { padding: 4px 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text-muted); cursor: pointer; }
.todo-filter.active { background: rgba(99,102,241,0.2); border-color: var(--accent); color: var(--text); }
.todo-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.todo-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; }
.todo-check { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 50%; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s; }
.todo-check.done { background: var(--success); border-color: var(--success); }
.todo-check.done::after { content: '✓'; color: #fff; font-size: 11px; }
.todo-text { flex: 1; font-size: 14px; }
.todo-text.done { text-decoration: line-through; color: var(--text-dim); }
.todo-delete { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 5px; }
.todo-delete:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
.todo-stats { font-size: 12px; color: var(--text-muted); text-align: right; }

/* Clock */
.clock-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; padding: 20px; }
.clock-analog { width: 180px; height: 180px; }
.clock-digital { font-size: 48px; font-weight: 200; letter-spacing: -1px; }
.clock-date { font-size: 16px; color: var(--text-muted); }
.clock-alarm-section { width: 100%; max-width: 300px; }
.clock-alarm-title { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
.clock-alarm-row { display: flex; gap: 6px; margin-bottom: 8px; }
.clock-alarm-input { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 13px; outline: none; }
.clock-alarm-btn { padding: 6px 12px; background: var(--accent); border: none; border-radius: 7px; color: #fff; font-size: 13px; cursor: pointer; }
.clock-alarm-list { display: flex; flex-direction: column; gap: 5px; }
.clock-alarm-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; background: rgba(255,255,255,0.04); border-radius: 7px; font-size: 13px; }
.clock-alarm-del { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; }
.clock-alarm-del:hover { color: var(--danger); }

/* Paint */
.paint-wrap { display: flex; flex-direction: column; height: 100%; }
.paint-toolbar { padding: 6px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
.paint-tool-btn { padding: 5px 10px; background: rgba(255,255,255,0.05); border: 1px solid transparent; border-radius: 6px; color: var(--text-muted); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.paint-tool-btn.active { background: rgba(99,102,241,0.2); border-color: var(--accent); color: var(--text); }
.paint-color-row { display: flex; gap: 4px; align-items: center; }
.paint-color-swatch { width: 22px; height: 22px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: transform .15s; }
.paint-color-swatch:hover { transform: scale(1.2); }
.paint-color-swatch.selected { border-color: #fff; }
.paint-size-slider { width: 80px; }
.paint-canvas-wrap { flex: 1; overflow: hidden; display: flex; }
.paint-canvas { cursor: crosshair; display: block; background: #fff; }

/* System info */
.sysinfo-wrap { padding: 16px; height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.sysinfo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.sysinfo-card { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.sysinfo-card-title { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.sysinfo-card-val { font-size: 22px; font-weight: 600; }
.sysinfo-card-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.sysinfo-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.sysinfo-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 1s; }
.sysinfo-process-list { }
.sysinfo-proc-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.sysinfo-proc-item:last-child { border-bottom: none; }

/* Scrollbars */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-logo">My-OS</div>
  <div class="auth-sub">Jouw persoonlijk besturingssysteem</div>
  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="authTab('login')">Inloggen</div>
      <div class="auth-tab" onclick="authTab('register')">Registreren</div>
    </div>
    <div id="auth-login-form">
      <div class="auth-field"><label>Gebruikersnaam</label><input id="login-user" type="text" placeholder="jouw-naam" autocomplete="username"></div>
      <div class="auth-field"><label>Wachtwoord</label><input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="auth-btn" onclick="doLogin()">Inloggen</button>
      <div class="auth-error" id="login-error"></div>
    </div>
    <div id="auth-register-form" style="display:none">
      <div class="auth-field"><label>Volledige naam</label><input id="reg-name" type="text" placeholder="Jan de Vries"></div>
      <div class="auth-field"><label>Gebruikersnaam</label><input id="reg-user" type="text" placeholder="jan-de-vries"></div>
      <div class="auth-field"><label>Wachtwoord</label><input id="reg-pass" type="password" placeholder="••••••••"></div>
      <div class="auth-field"><label>Bevestig wachtwoord</label><input id="reg-pass2" type="password" placeholder="••••••••"></div>
      <button class="auth-btn" onclick="doRegister()">Account aanmaken</button>
      <div class="auth-error" id="reg-error"></div>
    </div>
    <div class="auth-users" id="auth-users-list"></div>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop" style="display:none">
  <div id="wallpaper"></div>
  <div id="desktop-icons"></div>
</div>

<!-- TASKBAR -->
<div id="taskbar" style="display:none">
  <div class="taskbar-start" onclick="toggleStartMenu()" title="Start menu"><i class="ti ti-layout-grid"></i></div>
  <div class="taskbar-divider"></div>
  <div class="taskbar-apps" id="taskbar-apps"></div>
  <div class="taskbar-right">
    <div class="taskbar-clock" id="taskbar-clock" onclick="openApp('clock')"></div>
    <div class="taskbar-user" onclick="toggleStartMenu()">
      <div class="auth-avatar" id="taskbar-avatar" style="width:28px;height:28px;font-size:12px;"></div>
    </div>
  </div>
</div>

<!-- START MENU -->
<div id="start-menu">
  <div class="sm-header">
    <input class="sm-search" id="sm-search" placeholder="Zoek apps..." oninput="filterStartMenu(this.value)">
  </div>
  <div class="sm-grid" id="sm-grid"></div>
  <div class="sm-footer">
    <div class="sm-user-info">
      <div class="auth-avatar" id="sm-avatar" style="width:32px;height:32px;font-size:13px;"></div>
      <div>
        <div style="font-size:13px;font-weight:500" id="sm-username"></div>
        <div style="font-size:11px;color:var(--text-muted)">My-OS</div>
      </div>
    </div>
    <div class="sm-power">
      <button class="sm-power-btn" title="Vergrendelen" onclick="lockScreen()"><i class="ti ti-lock"></i></button>
      <button class="sm-power-btn" title="Uitloggen" onclick="logout()"><i class="ti ti-logout"></i></button>
    </div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div id="ctx-menu"></div>

<!-- NOTIFICATIONS -->
<div id="notifications"></div>

<script>
// ===================== STORAGE =====================
const LS = {
  get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
  del: (k) => localStorage.removeItem(k)
};

// ===================== AUTH =====================
let currentUser = null;

function getUsers() { return LS.get('myos_users') || {}; }
function saveUsers(u) { LS.set('myos_users', u); }
function getUserData(username) { return LS.get('myos_ud_' + username) || {}; }
function saveUserData(username, data) { LS.set('myos_ud_' + username, data); }

function authTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.textContent === (tab === 'login' ? 'Inloggen' : 'Registreren')));
  document.getElementById('auth-login-form').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('auth-register-form').style.display = tab === 'register' ? '' : 'none';
}

function renderAuthUsers() {
  const users = getUsers();
  const list = document.getElementById('auth-users-list');
  const keys = Object.keys(users);
  if (!keys.length) { list.innerHTML = ''; return; }
  list.innerHTML = '<div class="auth-users-title">Recente gebruikers</div>' +
    keys.map(u => `<div class="auth-user-chip" onclick="quickLogin('${u}')">
      <div class="auth-avatar" style="background:${users[u].color||'#6366f1'};width:32px;height:32px;font-size:13px;">${(users[u].name||u).charAt(0).toUpperCase()}</div>
      <div><div style="font-size:13px;font-weight:500">${users[u].name||u}</div><div style="font-size:11px;color:var(--text-muted)">@${u}</div></div>
    </div>`).join('');
}

function quickLogin(username) {
  document.getElementById('login-user').value = username;
  document.getElementById('login-pass').focus();
  authTab('login');
}

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  const users = getUsers();
  if (!users[u]) { err.textContent = 'Gebruiker niet gevonden.'; return; }
  if (users[u].password !== hashPass(p)) { err.textContent = 'Wachtwoord onjuist.'; return; }
  err.textContent = '';
  loginSuccess(u, users[u]);
}

function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const u = document.getElementById('reg-user').value.trim().toLowerCase().replace(/\s+/g, '-');
  const p = document.getElementById('reg-pass').value;
  const p2 = document.getElementById('reg-pass2').value;
  const err = document.getElementById('reg-error');
  if (!name || !u || !p) { err.textContent = 'Vul alle velden in.'; return; }
  if (p !== p2) { err.textContent = 'Wachtwoorden komen niet overeen.'; return; }
  if (p.length < 4) { err.textContent = 'Wachtwoord minimaal 4 tekens.'; return; }
  const users = getUsers();
  if (users[u]) { err.textContent = 'Gebruikersnaam al in gebruik.'; return; }
  const colors = ['#6366f1','#22c55e','#ef4444','#f59e0b','#3b82f6','#ec4899','#14b8a6'];
  const color = colors[Object.keys(users).length % colors.length];
  users[u] = { name, password: hashPass(p), color, created: Date.now() };
  saveUsers(users);
  // Default user data
  saveUserData(u, {
    notes: [{ id: 1, title: 'Welkom bij My-OS!', body: 'Dit is jouw persoonlijke notitie. Bewerk me!', created: Date.now() }],
    todos: [{ id: 1, text: 'My-OS verkennen', done: true }, { id: 2, text: 'Notities maken', done: false }, { id: 3, text: 'Rekenmachine uitproberen', done: false }],
    calendarEvents: [],
    alarms: [],
    desktopIcons: null,
    wallpaper: null,
    accentColor: '#6366f1',
    fontSize: 'medium',
    taskbarPos: 'bottom'
  });
  err.textContent = '';
  notify('Account aangemaakt', `Welkom, ${name}!`, 'ti-user');
  loginSuccess(u, users[u]);
}

function hashPass(p) {
  let h = 0;
  for (let i = 0; i < p.length; i++) h = Math.imul(31, h) + p.charCodeAt(i) | 0;
  return h.toString(36);
}

function loginSuccess(username, userObj) {
  currentUser = { username, ...userObj };
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('desktop').style.display = 'block';
  document.getElementById('taskbar').style.display = 'flex';
  initOS();
}

function logout() {
  closeAllWindows();
  currentUser = null;
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('desktop').style.display = 'none';
  document.getElementById('taskbar').style.display = 'none';
  document.getElementById('start-menu').classList.remove('open');
  renderAuthUsers();
}

function lockScreen() {
  document.getElementById('start-menu').classList.remove('open');
  const lock = document.createElement('div');
  lock.id = 'lock-screen';
  lock.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(10,10,20,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;';
  lock.innerHTML = `
    <div style="font-size:48px;color:var(--text-muted)"><i class="ti ti-lock"></i></div>
    <div style="font-size:18px;font-weight:600">${currentUser.name}</div>
    <input type="password" id="lock-pass" placeholder="Wachtwoord" style="background:rgba(255,255,255,0.08);border:1px solid var(--border);border-radius:10px;padding:10px 18px;color:var(--text);font-size:15px;outline:none;width:260px;text-align:center;" onkeydown="if(event.key==='Enter')unlockScreen()">
    <button onclick="unlockScreen()" style="padding:10px 28px;background:var(--accent);border:none;border-radius:9px;color:#fff;font-size:14px;cursor:pointer;">Ontgrendelen</button>
    <div id="lock-err" style="color:var(--danger);font-size:13px;"></div>`;
  document.body.appendChild(lock);

// ===================== DESKTOP ICONS =====================
function renderDesktopIcons() {
  const container = document.getElementById('desktop-icons');
  container.innerHTML = '';
  APPS.forEach((app, i) => {
    const col = Math.floor(i / 6);
    const row = i % 6;
    const pos = desktopIconPositions[app.id] || { left: 20 + col * 90, top: 20 + row * 90 };
    const el = document.createElement('div');
    el.className = 'desktop-icon';
    el.id = 'di-' + app.id;
    el.style.cssText = `left:${pos.left}px;top:${pos.top}px;`;
    el.innerHTML = `<i class="ti ${app.icon} icon-img" style="color:${app.color}"></i><div class="icon-label">${app.name}</div>`;
    el.addEventListener('dblclick', () => openApp(app.id));
    el.addEventListener('contextmenu', e => { e.preventDefault(); showCtxMenu(e, [
      { label: 'Openen', icon: 'ti-external-link', action: () => openApp(app.id) },
    ]); });
    makeDraggableIcon(el, app.id);
    container.appendChild(el);
  });
}

function makeDraggableIcon(el, appId) {
  let startX, startY, startLeft, startTop, dragging = false, clicks = 0;
  el.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    startX = e.clientX; startY = e.clientY;
    const rect = el.getBoundingClientRect();
    startLeft = rect.left; startTop = rect.top;
    dragging = false;
    const move = (e2) => {
      if (Math.abs(e2.clientX - startX) > 5 || Math.abs(e2.clientY - startY) > 5) dragging = true;
      if (!dragging) return;
      el.style.left = (startLeft + e2.clientX - startX) + 'px';
      el.style.top = (startTop + e2.clientY - startY) + 'px';
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      if (dragging) {
        desktopIconPositions[appId] = { left: parseInt(el.style.left), top: parseInt(el.style.top) };
        saveUserSetting('desktopIconPositions', desktopIconPositions);
      }
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

// ===================== CLOCK =====================
function startClock() {
  function update() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2,'0');
    const m = now.getMinutes().toString().padStart(2,'0');
    document.getElementById('taskbar-clock').innerHTML = `<div style="font-weight:500">${h}:${m}</div><div style="font-size:10px;color:var(--text-muted)">${now.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'})}</div>`;
  }
  update();
  setInterval(update, 30000);
}

// ===================== WINDOW SYSTEM =====================
function openApp(appId) {
  if (windows[appId]) {
    focusWindow(appId);
    if (windows[appId].minimized) {
      windows[appId].minimized = false;
      document.getElementById('win-' + appId).classList.remove('minimized');
    }
    return;
  }
  const app = APPS.find(a => a.id === appId);
  if (!app) return;
  createWindow(appId, app);
}

function createWindow(appId, app) {
  const desktop = document.getElementById('desktop');
  const win = document.createElement('div');
  win.className = 'window focused';
  win.id = 'win-' + appId;
  const sizes = {
    filemanager: [700, 480], editor: [660, 480], terminal: [580, 400],
    browser: [900, 580], calculator: [300, 460], settings: [620, 480],
    notes: [560, 460], music: [340, 520], photos: [600, 450],
    calendar: [500, 520], weather: [480, 500], todo: [400, 480],
    clock: [380, 480], paint: [640, 480], sysinfo: [540, 480],
    minecraft3d: [900, 580], mattyou2: [860, 560],
  };
  const [w, h] = sizes[appId] || [500, 400];
  const left = 60 + Object.keys(windows).length * 24;
  const top = 40 + Object.keys(windows).length * 24;
  win.style.cssText = `left:${left}px;top:${top}px;width:${w}px;height:${h}px;`;

  win.innerHTML = `
    <div class="win-titlebar" id="winbar-${appId}">
      <i class="ti ${app.icon} win-icon" style="color:${app.color}"></i>
      <div class="win-title" id="wintitle-${appId}">${app.name}</div>
      <div class="win-controls">
        <button class="win-btn win-btn-min" onclick="minimizeWindow('${appId}')" title="Minimaliseren"><i class="ti ti-minus" style="font-size:10px"></i></button>
        <button class="win-btn win-btn-max" onclick="maximizeWindow('${appId}')" title="Maximaliseren"><i class="ti ti-arrows-maximize" style="font-size:10px"></i></button>
        <button class="win-btn win-btn-close" onclick="closeWindow('${appId}')" title="Sluiten"><i class="ti ti-x" style="font-size:10px"></i></button>
      </div>
    </div>
    <div class="win-body" id="winbody-${appId}"></div>
    <div class="win-resize" id="winresize-${appId}"></div>`;

  desktop.appendChild(win);
  windows[appId] = { minimized: false, maximized: false, el: win };
  makeDraggable(win, appId);
  makeResizable(win, appId);
  renderApp(appId, document.getElementById('winbody-' + appId));
  updateTaskbarApps();
  focusWindow(appId);
}

function focusWindow(appId) {
  Object.keys(windows).forEach(id => {
    const w = document.getElementById('win-' + id);
    if (w) w.classList.remove('focused');
  });
  const w = document.getElementById('win-' + appId);
  if (w) { w.classList.add('focused'); w.style.zIndex = ++windowZCounter; }
  updateTaskbarApps(appId);
}

function minimizeWindow(appId) {
  windows[appId].minimized = true;
  document.getElementById('win-' + appId).classList.add('minimized');
  updateTaskbarApps();
}

function maximizeWindow(appId) {
  const win = document.getElementById('win-' + appId);
  windows[appId].maximized = !windows[appId].maximized;
  win.classList.toggle('maximized', windows[appId].maximized);
}

function closeWindow(appId) {
  const win = document.getElementById('win-' + appId);
  if (win) win.remove();
  delete windows[appId];
  updateTaskbarApps();
  // cleanup intervals
  if (appId === 'clock' && window._clockInterval) clearInterval(window._clockInterval);
  if (appId === 'sysinfo' && window._sysinfoInterval) clearInterval(window._sysinfoInterval);
  if (appId === 'music' && window._musicInterval) clearInterval(window._musicInterval);
}

function closeAllWindows() {
  Object.keys(windows).forEach(id => closeWindow(id));
}

function updateTaskbarApps(activeId) {
  const container = document.getElementById('taskbar-apps');
  container.innerHTML = '';
  Object.keys(windows).forEach(id => {
    const app = APPS.find(a => a.id === id);
    if (!app) return;
    const div = document.createElement('div');
    div.className = 'taskbar-app' + (id === activeId ? ' active' : '');
    div.innerHTML = `<i class="ti ${app.icon} taskbar-app-icon" style="color:${app.color}"></i><span class="taskbar-app-name">${app.name}</span>`;
    div.onclick = () => {
      if (windows[id].minimized) { windows[id].minimized = false; document.getElementById('win-' + id).classList.remove('minimized'); focusWindow(id); }
      else if (id === activeId) { minimizeWindow(id); }
      else focusWindow(id);
    };
    container.appendChild(div);
  });
}

function makeDraggable(win, appId) {
  const bar = document.getElementById('winbar-' + appId);
  let startX, startY, startLeft, startTop;
  bar.addEventListener('mousedown', e => {
    if (e.target.closest('.win-controls')) return;
    if (windows[appId].maximized) return;
    startX = e.clientX; startY = e.clientY;
    const r = win.getBoundingClientRect();
    startLeft = r.left; startTop = r.top;
    focusWindow(appId);
    const move = e2 => {
      win.style.left = Math.max(0, startLeft + e2.clientX - startX) + 'px';
      win.style.top = Math.max(0, startTop + e2.clientY - startY) + 'px';
    };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
  win.addEventListener('mousedown', () => focusWindow(appId));
}

function makeResizable(win, appId) {
  const handle = document.getElementById('winresize-' + appId);
  handle.addEventListener('mousedown', e => {
    e.stopPropagation();
    const startX = e.clientX, startY = e.clientY;
    const startW = win.offsetWidth, startH = win.offsetHeight;
    const move = e2 => {
      win.style.width = Math.max(300, startW + e2.clientX - startX) + 'px';
      win.style.height = Math.max(200, startH + e2.clientY - startY) + 'px';
    };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

// ===================== CONTEXT MENU =====================
function showCtxMenu(e, items) {

  ).join('');
  menu.querySelectorAll('.ctx-item').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    if (items[idx]) el.onclick = () => { hideCtxMenu(); items[idx].action(); };
  });
  const x = Math.min(e.clientX, window.innerWidth - 200);
  const y = Math.min(e.clientY, window.innerHeight - (items.length * 36 + 16));
  menu.style.cssText = `display:block;left:${x}px;top:${y}px;`;
}

function hideCtxMenu() {
  document.getElementById('ctx-menu').style.display = 'none';
}

// ===== FILE MANAGER =====
function renderFileManager(body) {
  const ud = getUserData(currentUser.username);
  if (!ud.files) { ud.files = {
    'Documenten': { type: 'folder', children: { 'readme.txt': { type: 'file', content: 'Welkom bij My-OS!', modified: Date.now() } } },
    'Afbeeldingen': { type: 'folder', children: {} },
    'Downloads': { type: 'folder', children: {} },
    'Muziek': { type: 'folder', children: {} }
  }; saveUserData(currentUser.username, ud); }
  let currentPath = [];

  function getNode(path) {
    let node = { children: ud.files };
    for (const p of path) node = node.children[p];
    return node;
  }

  function render() {
    const node = currentPath.length ? getNode(currentPath) : { children: ud.files };
    const pathStr = '/' + currentPath.join('/');
    body.innerHTML = `<div class="fm-wrap">
      <div class="fm-sidebar">
        <div class="fm-sidebar-item${currentPath.length===0?' active':''}" onclick=""><i class="ti ti-home"></i> Home</div>
        ${Object.keys(ud.files).map(k=>`<div class="fm-sidebar-item" id="fmsb-${k}"><i class="ti ti-folder"></i> ${k}</div>`).join('')}
      </div>
      <div class="fm-main">
        <div class="fm-toolbar">
          <button class="fm-btn" id="fm-back"><i class="ti ti-arrow-left"></i></button>
          <div class="fm-path">${pathStr}</div>
          <button class="fm-btn" id="fm-newfolder"><i class="ti ti-folder-plus"></i> Map</button>
          <button class="fm-btn" id="fm-newfile"><i class="ti ti-file-plus"></i> Bestand</button>
        </div>
        <div class="fm-files" id="fm-files-grid"></div>
      </div>
    </div>`;
    // sidebar clicks
    Object.keys(ud.files).forEach(k => {
      const el = document.getElementById('fmsb-' + k);
      if (el) el.onclick = () => { currentPath = [k]; render(); };
    });
    body.querySelector('#fm-back').onclick = () => { if (currentPath.length > 0) { currentPath.pop(); render(); } };
    body.querySelector('#fm-newfolder').onclick = () => {
      const n = prompt('Mapnaam:'); if (!n) return;
      const nd = getNode(currentPath);
      nd.children[n] = { type: 'folder', children: {} };
      saveUserData(currentUser.username, ud); render();
    };
    body.querySelector('#fm-newfile').onclick = () => {
      const n = prompt('Bestandsnaam:'); if (!n) return;
      const nd = getNode(currentPath);
      nd.children[n] = { type: 'file', content: '', modified: Date.now() };
      saveUserData(currentUser.username, ud); render();
    };
    const grid = document.getElementById('fm-files-grid');
    const children = node.children || {};
    grid.innerHTML = Object.keys(children).map(name => {
      const child = children[name];
      const icon = child.type === 'folder' ? 'ti-folder' : getFileIcon(name);
      const color = child.type === 'folder' ? '#f59e0b' : '#94a3b8';
      return `<div class="fm-file" data-name="${name}" data-type="${child.type}">
        <i class="ti ${icon} fm-file-icon" style="color:${color}"></i>
        <div class="fm-file-name">${name}</div>
      </div>`;
    }).join('') || '<div style="padding:20px;color:var(--text-muted);font-size:13px;grid-column:1/-1;">Lege map</div>';
    grid.querySelectorAll('.fm-file').forEach(el => {
      el.addEventListener('dblclick', () => {
        const name = el.dataset.name;
        const child = children[name];
        if (child.type === 'folder') { currentPath.push(name); render(); }
        else { openFileEditor(name, child, currentPath, ud); }
      });
      el.addEventListener('contextmenu', e => {
        e.preventDefault();
        const name = el.dataset.name;
        showCtxMenu(e, [
          { label: 'Verwijderen', icon: 'ti-trash', danger: true, action: () => {
            if (confirm(`'${name}' verwijderen?`)) { delete children[name]; saveUserData(currentUser.username, ud); render(); }
          }},
          { label: 'Hernoemen', icon: 'ti-edit', action: () => {
            const nn = prompt('Nieuwe naam:', name); if (!nn || nn === name) return;
            children[nn] = children[name]; delete children[name];
            saveUserData(currentUser.username, ud); render();
          }}
        ]);
      });
    });
  }
  render();
}

function getFileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  const map = { txt: 'ti-file-text', md: 'ti-markdown', js: 'ti-brand-javascript', html: 'ti-brand-html5', css: 'ti-file-code', json: 'ti-braces', png: 'ti-photo', jpg: 'ti-photo', gif: 'ti-photo', mp3: 'ti-music', mp4: 'ti-video', pdf: 'ti-file-type-pdf', zip: 'ti-file-zip' };
  return map[ext] || 'ti-file';
}

function openFileEditor(name, fileObj, path, ud) {
  openApp('editor');
  setTimeout(() => {
    const body = document.getElementById('winbody-editor');
    if (body) {
      document.getElementById('wintitle-editor').textContent = 'Tekstverwerker – ' + name;
      const area = body.querySelector('.editor-area');
      if (area) { area.innerHTML = fileObj.content || ''; area.dataset.filename = name; area.dataset.path = JSON.stringify(path); }
    }
  }, 100);
}

function edExec(cmd, val) { document.execCommand(cmd, false, val || null); document.getElementById('editor-area')?.focus(); }

function updateEditorStatus() {
  const area = document.getElementById('editor-area');
  if (!area) return;
  const text = area.innerText || '';
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const wEl = document.getElementById('editor-words');
  const cEl = document.getElementById('editor-chars');
  if (wEl) wEl.textContent = words + ' woorden';
  if (cEl) cEl.textContent = text.length + ' tekens';
}

function editorNew() {
  const area = document.getElementById('editor-area');
  if (area) { if (confirm('Nieuw document? Niet-opgeslagen wijzigingen gaan verloren.')) { area.innerHTML = ''; updateEditorStatus(); } }
}

function editorSave() {
  const area = document.getElementById('editor-area');
  if (!area) return;
  const name = prompt('Bestandsnaam:', area.dataset.filename || 'document.txt');
  if (!name) return;
  const ud = getUserData(currentUser.username);
  if (!ud.files) ud.files = {};
  if (!ud.files['Documenten']) ud.files['Documenten'] = { type: 'folder', children: {} };
  ud.files['Documenten'].children[name] = { type: 'file', content: area.innerHTML, modified: Date.now() };
  saveUserData(currentUser.username, ud);
  notify('Opgeslagen', `'${name}' opgeslagen in Documenten`, 'ti-check');
}

function editorExport() {
  const area = document.getElementById('editor-area');
  if (!area) return;
  const blob = new Blob([area.innerText], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'document.txt';
  a.click();
}

const termHistory = [];
let termHistoryIdx = -1;
let termCurrentDir = '~';
const termFS = {};

function renderTerminal(body) {
  body.innerHTML = `<div class="terminal-wrap">
    <div class="terminal-output" id="term-output">
      <div class="terminal-line info">My-OS Terminal v2.0 — type 'help' voor commando's</div>
      <div class="terminal-line info">Ingelogd als ${currentUser.name} (@${currentUser.username})</div>
      <div class="terminal-line"> </div>
    </div>
    <div class="terminal-input-row">
      <div class="terminal-prompt" id="term-prompt">${currentUser.username}@my-os:${termCurrentDir}$</div>
      <input class="terminal-input" id="term-input" type="text" autocomplete="off" spellcheck="false">
    </div>
  </div>`;
  const input = document.getElementById('term-input');
  input.focus();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { runTerminalCmd(input.value.trim()); input.value = ''; termHistoryIdx = -1; }
    else if (e.key === 'ArrowUp') { if (termHistoryIdx < termHistory.length - 1) { termHistoryIdx++; input.value = termHistory[termHistoryIdx]; } e.preventDefault(); }
    else if (e.key === 'ArrowDown') { if (termHistoryIdx > 0) { termHistoryIdx--; input.value = termHistory[termHistoryIdx]; } else { termHistoryIdx = -1; input.value = ''; } e.preventDefault(); }
  });
}

function termPrint(text, cls = 'out') {
  const out = document.getElementById('term-output');
  if (!out) return;
  const div = document.createElement('div');
  div.className = 'terminal-line ' + cls;
  div.textContent = text;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function runTerminalCmd(cmd) {
  if (!cmd) return;
  termHistory.unshift(cmd);
  termPrint(`${currentUser.username}@my-os:${termCurrentDir}$ ${cmd}`, 'cmd');
  const parts = cmd.split(' ');
  const c = parts[0].toLowerCase();
  const args = parts.slice(1);

  const cmds = {
    help: () => {
      ['Beschikbare commando\'s:', 'help      - deze hulp', 'whoami    - wie ben ik', 'date      - huidige datum/tijd', 'echo      - tekst weergeven', 'clear     - scherm wissen', 'ls        - bestanden tonen', 'mkdir     - map aanmaken', 'touch     - bestand aanmaken', 'cat       - bestand tonen', 'rm        - bestand verwijderen', 'pwd       - huidige map', 'uptime    - systeemtijd', 'neofetch  - systeeminfo', 'calc      - snel rekenen', 'open      - app openen', 'exit      - terminal sluiten']
        .forEach(l => termPrint(l, l.startsWith('Beschikbaar') ? 'info' : 'out'));
    },
    whoami: () => termPrint(`${currentUser.name} (@${currentUser.username})`, 'success'),
    date: () => termPrint(new Date().toString(), 'out'),
    echo: () => termPrint(args.join(' '), 'out'),
    clear: () => { const out = document.getElementById('term-output'); if (out) out.innerHTML = ''; },
    pwd: () => termPrint('/home/' + currentUser.username + '/' + termCurrentDir.replace('~',''), 'out'),
    uptime: () => termPrint('System up: ' + Math.floor(performance.now()/1000) + 's', 'out'),
    ls: () => {
      const ud = getUserData(currentUser.username);
      const items = Object.keys(ud.files || {});
      termPrint(items.join('   ') || '(leeg)', 'out');
    },
    mkdir: () => {
      if (!args[0]) { termPrint('Gebruik: mkdir <naam>', 'err'); return; }
      const ud = getUserData(currentUser.username);
      ud.files = ud.files || {};
      ud.files[args[0]] = { type: 'folder', children: {} };
      saveUserData(currentUser.username, ud);
      termPrint(`Map '${args[0]}' aangemaakt.`, 'success');
    },
    touch: () => {
      if (!args[0]) { termPrint('Gebruik: touch <naam>', 'err'); return; }
      const ud = getUserData(currentUser.username);
      if (!ud.files) ud.files = {};
      if (!ud.files['Documenten']) ud.files['Documenten'] = { type: 'folder', children: {} };
      ud.files['Documenten'].children[args[0]] = { type: 'file', content: '', modified: Date.now() };
      saveUserData(currentUser.username, ud);
      termPrint(`Bestand '${args[0]}' aangemaakt.`, 'success');
    },
    calc: () => {
      try { const r = Function('"use strict";return (' + args.join(' ') + ')')(); termPrint('= ' + r, 'success'); }
      catch { termPrint('Ongeldige expressie', 'err'); }
    },
    open: () => {
      const appName = args[0];
      const found = APPS.find(a => a.id === appName || a.name.toLowerCase() === appName?.toLowerCase());
      if (found) { openApp(found.id); termPrint(`${found.name} geopend.`, 'success'); }
      else termPrint(`App '${appName}' niet gevonden.`, 'err');
    },
    neofetch: () => {
      ['', '   ███╗   ███╗██╗   ██╗   ██████╗ ███████╗', '   ████╗ ████║╚██╗ ██╔╝  ██╔═══██╗██╔════╝', '   ██╔████╔██║ ╚████╔╝   ██║   ██║███████╗', '   ██║╚██╔╝██║  ╚██╔╝    ██║   ██║╚════██║', '   ██║ ╚═╝ ██║   ██║     ╚██████╔╝███████║', '   ╚═╝     ╚═╝   ╚═╝      ╚═════╝ ╚══════╝', '',
       `   Gebruiker  : ${currentUser.name} (@${currentUser.username})`,
       `   OS         : My-OS 2.0`,
       `   Kernel     : WebKit/Blink`,
       `   Browser    : ${navigator.userAgent.split(' ').pop()}`,
       `   Resolutie  : ${screen.width}x${screen.height}`,
       `   Taal       : ${navigator.language}`,
       `   Platform   : ${navigator.platform}`,
       ''].forEach((l, i) => termPrint(l, i < 8 ? 'info' : 'out'));
    },
    exit: () => closeWindow('terminal'),
  };

  if (cmds[c]) cmds[c]();
  else termPrint(`Commando niet gevonden: '${c}'. Type 'help'.`, 'err');
  document.getElementById('term-prompt').textContent = `${currentUser.username}@my-os:${termCurrentDir}$ `;
}

function _brNavigate(input) {
  if (!input || !input.trim()) return;
  input = input.trim();

  let url;
  if (input.startsWith('my-os://')) { _brHome(); return; }
  if (/^https?:\/\//i.test(input)) {
    url = input;
  } else if (input.includes('.') && !input.includes(' ')) {
    url = 'https://' + input;
  } else {
    url = 'https://www.google.com/search?q=' + encodeURIComponent(input);
  }

  // Push history
  _browserHistory = _browserHistory.slice(0, _browserHistIdx + 1);
  _browserHistory.push(url);
  _browserHistIdx = _browserHistory.length - 1;

  _brLoad(url);
}

function _brLoad(url) {
  const iframe    = document.getElementById('br-iframe');
  const home      = document.getElementById('br-home');
  const blocked   = document.getElementById('br-blocked');
  const loading   = document.getElementById('br-loading');
  const urlInput  = document.getElementById('browser-url');
  const status    = document.getElementById('br-status');
  const loadingTxt= document.getElementById('br-loading-url');
  if (!iframe) return;

  // Update address bar
  if (urlInput) urlInput.value = url;

  // Show loading overlay
  home.style.display = 'none';
  blocked.style.display = 'none';
  if (loading) { loading.style.display = 'flex'; if (loadingTxt) loadingTxt.textContent = url; }
  iframe.style.display = 'block';
  if (status) status.textContent = 'Laden: ' + url;

  // We try to detect X-Frame-Options blocks via a HEAD fetch first (best effort)
  // Many servers don't send CORS headers so fetch will fail — that's fine, we still try the iframe
  let frameLoaded = false;
  const TIMEOUT = 10000; // 10 seconds

  const hideLoading = () => { if (loading) loading.style.display = 'none'; };

  const onLoad = () => {
    frameLoaded = true;
    hideLoading();
    if (status) status.textContent = url;
    // Try to read title (only works same-origin)
    try {
      const t = iframe.contentDocument?.title;
      if (t && document.getElementById('wintitle-browser')) document.getElementById('wintitle-browser').textContent = 'Browser — ' + t;
    } catch {}
  };

  const onError = () => {
    frameLoaded = true;
    hideLoading();
    _brShowBlocked(url);
  };

  iframe.onload = onLoad;
  iframe.onerror = onError;
  iframe.src = url;

  // Fallback: if after 10s the iframe is "loaded" but shows blank (cross-origin block)
  // we can't reliably detect this without server-side help, so we just trust the load event.
  // If user sees blank, the "Openen in nieuw tabblad" button is always available.
  setTimeout(() => {
    if (!frameLoaded) {
      hideLoading();
      if (status) status.textContent = 'Timeout — ' + url;
    }
  }, TIMEOUT);
}

function _brShowBlocked(url) {
  const iframe  = document.getElementById('br-iframe');
  const blocked = document.getElementById('br-blocked');
  const urlEl   = document.getElementById('br-blocked-url');
  const linkEl  = document.getElementById('br-blocked-link');
  if (iframe) iframe.style.display = 'none';
  if (blocked) blocked.style.display = 'block';
  if (urlEl) urlEl.textContent = url;
  if (linkEl) { linkEl.href = url; }
}

function _brHome() {
  const iframe  = document.getElementById('br-iframe');
  const home    = document.getElementById('br-home');
  const blocked = document.getElementById('br-blocked');
  const loading = document.getElementById('br-loading');
  const urlInput= document.getElementById('browser-url');
  const status  = document.getElementById('br-status');
  if (iframe)  { iframe.src = 'about:blank'; iframe.style.display = 'none'; }
  if (blocked) blocked.style.display = 'none';
  if (loading) loading.style.display = 'none';
  if (home)    home.style.display = 'flex';
  if (urlInput) urlInput.value = '';
  if (status)  status.textContent = 'Startpagina';
  _brRenderBookmarks();
  setTimeout(() => document.getElementById('br-home-q')?.focus(), 60);
}

function _brBack() {
  if (_browserHistIdx > 0) { _browserHistIdx--; _brLoad(_browserHistory[_browserHistIdx]); }
  else _brHome();
}
function _brForward() {
  if (_browserHistIdx < _browserHistory.length - 1) { _browserHistIdx++; _brLoad(_browserHistory[_browserHistIdx]); }
}
function _brReload() {
  const iframe = document.getElementById('br-iframe');
  if (iframe && iframe.src && iframe.src !== 'about:blank' && iframe.style.display !== 'none') {

// ===== CALCULATOR =====
let calcState = { expr: '', val: '0', lastOp: null, waitNew: false };

function renderCalculator(body) {
  body.innerHTML = `<div class="calc-wrap">
    <div class="calc-display">
      <div class="calc-expr" id="calc-expr"></div>
      <div class="calc-val" id="calc-val">0</div>
    </div>
    <div class="calc-grid">
      ${[
        ['C','fn','%','÷'],
        ['7','8','9','×'],
        ['4','5','6','−'],
        ['1','2','3','+'],
        ['±','0','.','=']
      ].map(row => row.map(b => {
        const cls = b === '=' ? 'eq' : ['÷','×','−','+'].includes(b) ? 'op' : ['C','%','±','fn'].includes(b) ? 'fn' : 'num';
        const sp = b === '0' ? ' span2' : '';
        return `<button class="calc-btn ${cls}${sp}" onclick="calcPress('${b}')">${b}</button>`;
      }).join('')).join('')}
    </div>
  </div>`;
}

function calcPress(btn) {
  const s = calcState;
  if (btn === 'C') { s.expr = ''; s.val = '0'; s.waitNew = false; }
  else if (btn === '±') { s.val = (parseFloat(s.val) * -1).toString(); }
  else if (btn === '%') { s.val = (parseFloat(s.val) / 100).toString(); }
  else if (btn === '=') {
    try {
      const expr = s.expr + s.val;
      const result = Function('"use strict";return (' + expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-') + ')')();
      s.expr = '';
      s.val = parseFloat(result.toFixed(10)).toString();
      s.waitNew = true;
    } catch { s.val = 'Fout'; }
  } else if (['÷','×','−','+'].includes(btn)) {
    s.expr += s.val + btn;
    s.waitNew = true;
  } else if (btn === '.') {
    if (!s.val.includes('.')) s.val += '.';
  } else {
    if (s.waitNew) { s.val = btn; s.waitNew = false; }
    else s.val = s.val === '0' ? btn : s.val + btn;
  }
  document.getElementById('calc-val').textContent = s.val;
  document.getElementById('calc-expr').textContent = s.expr;
}

function renderNotes(body) {
  const ud = getUserData(currentUser.username);
  if (!ud.notes) ud.notes = [];
  let activeNote = ud.notes[0] || null;

  function render() {
    body.innerHTML = `<div class="notes-wrap">
      <div class="notes-list">
        <div class="notes-list-header">
          <span class="notes-list-title">Notities</span>
          <button class="notes-add-btn" onclick="notesAdd()"><i class="ti ti-plus"></i></button>
        </div>
        <div class="notes-items" id="notes-items">
          ${ud.notes.map(n => `
            <div class="notes-item${activeNote&&activeNote.id===n.id?' active':''}" data-id="${n.id}">
              <div class="notes-item-title">${n.title||'Naamloos'}</div>
              <div class="notes-item-preview">${(n.body||'').substring(0,40)}</div>
              <div class="notes-item-date">${new Date(n.created).toLocaleDateString('nl-NL')}</div>
            </div>`).join('')}
        </div>
      </div>
      <div class="notes-editor">
        ${activeNote ? `
          <input class="notes-title-input" id="notes-title" value="${activeNote.title||''}" placeholder="Titel...">
          <textarea class="notes-body-input" id="notes-body" placeholder="Begin met typen...">${activeNote.body||''}</textarea>

            <span>${new Date(activeNote.created).toLocaleString('nl-NL')}</span>
            <button onclick="notesDelete(${activeNote.id})" style="background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:12px;"><i class="ti ti-trash"></i> Verwijderen</button>
          </div>` : '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;">Selecteer of maak een notitie</div>'}
      </div>
    </div>`;
    document.querySelectorAll('.notes-item').forEach(el => {
      el.onclick = () => {
        saveActiveNote();
        activeNote = ud.notes.find(n => n.id === parseInt(el.dataset.id));
        render();
      };
    });
    const titleInput = document.getElementById('notes-title');
    const bodyInput = document.getElementById('notes-body');
    if (titleInput) titleInput.addEventListener('input', () => { if (activeNote) activeNote.title = titleInput.value; });
    if (bodyInput) bodyInput.addEventListener('input', () => { if (activeNote) { activeNote.body = bodyInput.value; saveActiveNote(); } });
  }

  function saveActiveNote() {
    if (!activeNote) return;
    const t = document.getElementById('notes-title')?.value;
    const b = document.getElementById('notes-body')?.value;
    if (t !== undefined) activeNote.title = t;
    if (b !== undefined) activeNote.body = b;
    const idx = ud.notes.findIndex(n => n.id === activeNote.id);
    if (idx >= 0) ud.notes[idx] = activeNote;
    saveUserData(currentUser.username, ud);
  }

  window.notesAdd = () => {
    saveActiveNote();
    const n = { id: Date.now(), title: 'Nieuwe notitie', body: '', created: Date.now() };
    ud.notes.unshift(n);
    activeNote = n;
    saveUserData(currentUser.username, ud);
    render();
  };
  window.notesDelete = (id) => {
    if (!confirm('Notitie verwijderen?')) return;
    ud.notes = ud.notes.filter(n => n.id !== id);
    activeNote = ud.notes[0] || null;
    saveUserData(currentUser.username, ud);
    render();
  };
  render();
}

        <button class="music-ctrl-btn" onclick="musicNext()" title="Volgende"><i class="ti ti-player-skip-forward"></i></button>
        <button class="music-ctrl-btn" title="Herhalen"><i class="ti ti-repeat"></i></button>
      </div>
      <div class="music-playlist">
        <div class="music-pl-title">Afspeellijst</div>
        ${songs.map((song, i) => `
          <div class="music-pl-item${i===currentSong?' active':''}" onclick="musicSelect(${i})">
            <div class="music-pl-num">${i===currentSong&&playing?'▶':i+1}</div>
            <div class="music-pl-info"><div class="music-pl-name">${song.title}</div><div class="music-pl-art">${song.artist}</div></div>
            <div class="music-pl-dur">${song.dur}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  window.musicToggle = () => { playing = !playing; render(); if (playing) startMusicTick(); else clearInterval(window._musicInterval); };
  window.musicNext = () => { currentSong = (currentSong + 1) % songs.length; progress = 0; render(); if (playing) startMusicTick(); };
  window.musicPrev = () => { currentSong = (currentSong - 1 + songs.length) % songs.length; progress = 0; render(); };
  window.musicSelect = (i) => { currentSong = i; progress = 0; playing = true; render(); startMusicTick(); };
  window.musicShuffle = () => { currentSong = Math.floor(Math.random() * songs.length); progress = 0; render(); };

  function startMusicTick() {
    clearInterval(window._musicInterval);
    window._musicInterval = setInterval(() => {
      if (!playing) return;
      progress = Math.min(100, progress + 0.3);
      const slider = document.getElementById('music-slider');
      const cur = document.getElementById('music-cur');
      if (slider) slider.value = progress;
      if (cur) {
        const secs = Math.floor(progress / 100 * 240);
        cur.textContent = Math.floor(secs/60) + ':' + (secs%60).toString().padStart(2,'0');
      }
      if (progress >= 100) { window.musicNext(); }
    }, 300);
  }
  render();
}
