// ===== CALENDAR =====
function renderCalendar(body) {
  const ud = getUserData(currentUser.username);
  if (!ud.calendarEvents) ud.calendarEvents = [];
  let now = new Date();
  let viewYear = now.getFullYear(), viewMonth = now.getMonth();
  let selectedDate = null;

  function render() {
    const firstDay = new Date(viewYear, viewMonth, 1);
    const lastDay = new Date(viewYear, viewMonth + 1, 0);
    const startDow = (firstDay.getDay() + 6) % 7;
    const days = ['Ma','Di','Wo','Do','Vr','Za','Zo'];
    const months = ['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];

    let cells = [];
    for (let i = 0; i < startDow; i++) {
      const d = new Date(viewYear, viewMonth, -startDow + i + 1);
      cells.push({ date: d, other: true });
    }
    for (let d = 1; d <= lastDay.getDate(); d++) cells.push({ date: new Date(viewYear, viewMonth, d), other: false });
    while (cells.length % 7 !== 0) {
      const last = cells[cells.length-1].date;
      cells.push({ date: new Date(last.getTime() + 86400000), other: true });
    }

    const selEvents = selectedDate ? ud.calendarEvents.filter(e => e.date === selectedDate) : [];

    body.innerHTML = `<div class="calendar-wrap">
      <div class="calendar-header">
        <button class="calendar-nav-btn" onclick="calNav(-1)">‹</button>
        <div class="calendar-month">${months[viewMonth]} ${viewYear}</div>
        <button class="calendar-nav-btn" onclick="calNav(1)">›</button>
      </div>
      <div class="calendar-grid">
        ${days.map(d=>`<div class="calendar-day-label">${d}</div>`).join('')}
        ${cells.map(c => {
          const ds = `${c.date.getFullYear()}-${(c.date.getMonth()+1).toString().padStart(2,'0')}-${c.date.getDate().toString().padStart(2,'0')}`;
          const isToday = c.date.toDateString() === now.toDateString();
          const hasBe = ud.calendarEvents.some(e => e.date === ds);
          const isSel = ds === selectedDate;
          return `<div class="calendar-cell${c.other?' other-month':''}${isToday?' today':''}${hasBe?' has-event':''}${isSel?' selected':''}" onclick="calSelect('${ds}')">${c.date.getDate()}</div>`;
        }).join('')}
      </div>
      <div class="calendar-events">
        <div class="calendar-events-title">${selectedDate ? `Afspraken op ${selectedDate}` : 'Selecteer een datum'}</div>
        ${selEvents.map(e=>`<div class="calendar-event-item"><div class="calendar-event-name">${e.name}</div><div class="calendar-event-time">${e.time||''}</div></div>`).join('')}
        ${selectedDate ? `<div class="calendar-add-row">
          <input class="calendar-add-input" id="cal-event-name" placeholder="Nieuwe afspraak...">
          <input class="calendar-add-input" id="cal-event-time" placeholder="Tijd" style="width:80px;">
          <button class="calendar-add-btn" onclick="calAddEvent()">+</button>
        </div>` : ''}
      </div>
    </div>`;
  }

  window.calNav = (d) => {
    viewMonth += d;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  };
  window.calSelect = (ds) => { selectedDate = ds; render(); };
  window.calAddEvent = () => {
    const name = document.getElementById('cal-event-name')?.value.trim();
    const time = document.getElementById('cal-event-time')?.value.trim();
    if (!name) return;
    ud.calendarEvents.push({ date: selectedDate, name, time, id: Date.now() });
    saveUserData(currentUser.username, ud);
    render();
  };
  render();
}

// ===== TODO =====
function renderTodo(body) {
  const ud = getUserData(currentUser.username);
  if (!ud.todos) ud.todos = [];
  let filter = 'all';

  function render() {
    const filtered = ud.todos.filter(t => filter === 'all' || (filter === 'open' && !t.done) || (filter === 'done' && t.done));
    const doneCount = ud.todos.filter(t => t.done).length;
    body.innerHTML = `<div class="todo-wrap">
      <div class="todo-add-row">
        <input class="todo-add-input" id="todo-input" placeholder="Nieuwe taak toevoegen..." onkeydown="if(event.key==='Enter')todoAdd()">
        <button class="todo-add-btn" onclick="todoAdd()"><i class="ti ti-plus"></i></button>
      </div>
      <div class="todo-filters">
        <div class="todo-filter${filter==='all'?' active':''}" onclick="todoFilter('all')">Alles (${ud.todos.length})</div>
        <div class="todo-filter${filter==='open'?' active':''}" onclick="todoFilter('open')">Open</div>
        <div class="todo-filter${filter==='done'?' active':''}" onclick="todoFilter('done')">Klaar</div>
      </div>
      <div class="todo-list">
        ${filtered.map(t=>`<div class="todo-item">
          <div class="todo-check${t.done?' done':''}" onclick="todoToggle(${t.id})"></div>
          <div class="todo-text${t.done?' done':''}">${t.text}</div>
          <button class="todo-delete" onclick="todoDelete(${t.id})"><i class="ti ti-x"></i></button>
        </div>`).join('') || '<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:14px;">Geen taken</div>'}
      </div>
      <div class="todo-stats">${doneCount}/${ud.todos.length} voltooid</div>
    </div>`;
  }

  window.todoAdd = () => {
    const input = document.getElementById('todo-input');
    if (!input?.value.trim()) return;
    ud.todos.push({ id: Date.now(), text: input.value.trim(), done: false });
    saveUserData(currentUser.username, ud);
    render();
  };
  window.todoToggle = (id) => {
    const t = ud.todos.find(t => t.id === id);
    if (t) { t.done = !t.done; saveUserData(currentUser.username, ud); render(); }
  };
  window.todoDelete = (id) => {
    ud.todos = ud.todos.filter(t => t.id !== id);
    saveUserData(currentUser.username, ud);
    render();
  };
  window.todoFilter = (f) => { filter = f; render(); };
  render();
}

// ===== CLOCK =====
function renderClock(body) {
  const ud = getUserData(currentUser.username);
  if (!ud.alarms) ud.alarms = [];

  function render() {
    body.innerHTML = `<div class="clock-wrap">
      <svg class="clock-analog" viewBox="0 0 200 200" id="clock-svg">
        <circle cx="100" cy="100" r="95" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        ${Array.from({length:12},(_,i)=>{const a=(i*30-90)*Math.PI/180;return `<line x1="${100+80*Math.cos(a)}" y1="${100+80*Math.sin(a)}" x2="${100+90*Math.cos(a)}" y2="${100+90*Math.sin(a)}" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>`}).join('')}
        <line id="ch" x1="100" y1="100" x2="100" y2="50" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
        <line id="cm" x1="100" y1="100" x2="100" y2="35" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
        <line id="cs" x1="100" y1="100" x2="100" y2="25" stroke="var(--accent2)" stroke-width="1" stroke-linecap="round"/>
        <circle cx="100" cy="100" r="4" fill="var(--accent)"/>
      </svg>
      <div class="clock-digital" id="clock-digital">00:00:00</div>
      <div class="clock-date" id="clock-date"></div>
      <div class="clock-alarm-section">
        <div class="clock-alarm-title">Alarmen</div>
        <div class="clock-alarm-row">
          <input type="time" class="clock-alarm-input" id="alarm-input">
          <button class="clock-alarm-btn" onclick="addAlarm()">Instellen</button>
        </div>
        <div class="clock-alarm-list" id="alarm-list">
          ${ud.alarms.map(a=>`<div class="clock-alarm-item"><span>⏰ ${a.time}</span><span style="font-size:11px;color:var(--text-muted)">${a.active?'Actief':'Uit'}</span><button class="clock-alarm-del" onclick="delAlarm(${a.id})"><i class="ti ti-x"></i></button></div>`).join('')}
        </div>
      </div>
    </div>`;
  }

  function tick() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    const ha = (h % 12 + m / 60) * 30 - 90;
    const ma = (m + s / 60) * 6 - 90;
    const sa = s * 6 - 90;
    const toXY = (a, r) => [100 + r * Math.cos(a * Math.PI / 180), 100 + r * Math.sin(a * Math.PI / 180)];
    const ch = document.getElementById('ch'), cm = document.getElementById('cm'), cs = document.getElementById('cs');
    if (ch) { const p = toXY(ha, 50); ch.setAttribute('x2', p[0]); ch.setAttribute('y2', p[1]); }
    if (cm) { const p = toXY(ma, 65); cm.setAttribute('x2', p[0]); cm.setAttribute('y2', p[1]); }
    if (cs) { const p = toXY(sa, 75); cs.setAttribute('x2', p[0]); cs.setAttribute('y2', p[1]); }
    const dEl = document.getElementById('clock-digital');
    if (dEl) dEl.textContent = [h,m,s].map(v=>v.toString().padStart(2,'0')).join(':');
    const dtEl = document.getElementById('clock-date');
    if (dtEl) dtEl.textContent = now.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    // Check alarms
    const timeStr = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
    ud.alarms.forEach(a => { if (a.active && a.time === timeStr && s === 0) notify('⏰ Alarm', `Alarm om ${a.time}!`, 'ti-alarm'); });
  }

  window.addAlarm = () => {
    const t = document.getElementById('alarm-input')?.value;
    if (!t) return;
    ud.alarms.push({ id: Date.now(), time: t, active: true });
    saveUserData(currentUser.username, ud);
    render();
    startClockTick();
  };
  window.delAlarm = (id) => { ud.alarms = ud.alarms.filter(a => a.id !== id); saveUserData(currentUser.username, ud); render(); startClockTick(); };

  function startClockTick() {
    clearInterval(window._clockInterval);
    window._clockInterval = setInterval(tick, 1000);
    tick();
  }

  render();
  startClockTick();
}

// ===== PAINT =====
function renderPaint(body) {
  body.innerHTML = `<div class="paint-wrap">
    <div class="paint-toolbar">
      <button class="paint-tool-btn active" id="ptool-pen" onclick="paintTool('pen')"><i class="ti ti-pencil"></i> Pen</button>
      <button class="paint-tool-btn" id="ptool-eraser" onclick="paintTool('eraser')"><i class="ti ti-eraser"></i> Gum</button>
      <button class="paint-tool-btn" id="ptool-line" onclick="paintTool('line')"><i class="ti ti-minus"></i> Lijn</button>
      <button class="paint-tool-btn" id="ptool-rect" onclick="paintTool('rect')"><i class="ti ti-square"></i> Rechthoek</button>
      <button class="paint-tool-btn" id="ptool-circle" onclick="paintTool('circle')"><i class="ti ti-circle"></i> Cirkel</button>
      <button class="paint-tool-btn" id="ptool-fill" onclick="paintTool('fill')"><i class="ti ti-bucket"></i> Vullen</button>
      <div class="paint-color-row">
        ${['#000000','#ffffff','#ef4444','#f59e0b','#22c55e','#3b82f6','#6366f1','#ec4899','#14b8a6','#f97316'].map(c=>`<div class="paint-color-swatch${c==='#000000'?' selected':''}" style="background:${c}" onclick="paintColor('${c}')"></div>`).join('')}
        <input type="color" id="paint-custom-color" style="width:22px;height:22px;border:none;background:none;cursor:pointer;padding:0;" onchange="paintColor(this.value)">
      </div>
      <input type="range" class="paint-size-slider" id="paint-size" min="1" max="40" value="4">
      <button class="paint-tool-btn" onclick="paintClear()"><i class="ti ti-trash"></i> Wis</button>
      <button class="paint-tool-btn" onclick="paintSave()"><i class="ti ti-download"></i></button>
    </div>
    <div class="paint-canvas-wrap">
      <canvas class="paint-canvas" id="paint-canvas"></canvas>
    </div>
  </div>`;

  const canvas = document.getElementById('paint-canvas');
  const wrap = body.querySelector('.paint-canvas-wrap');
  canvas.width = wrap.offsetWidth || 600;
  canvas.height = wrap.offsetHeight || 400;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let tool = 'pen', color = '#000000', size = 4;
  let drawing = false, startX, startY, snapshot;

  canvas.addEventListener('mousedown', e => {
    drawing = true;
    const r = canvas.getBoundingClientRect();
    startX = e.clientX - r.left; startY = e.clientY - r.top;
    snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
    if (tool === 'pen' || tool === 'eraser') { ctx.beginPath(); ctx.moveTo(startX, startY); }
  });

  canvas.addEventListener('mousemove', e => {
    if (!drawing) return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    ctx.putImageData(snapshot, 0, 0);
    ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
    ctx.lineWidth = tool === 'eraser' ? size * 3 : size;
    ctx.lineCap = 'round';
    if (tool === 'pen' || tool === 'eraser') { ctx.lineTo(x, y); ctx.stroke(); }
    else if (tool === 'line') { ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(x, y); ctx.stroke(); }
    else if (tool === 'rect') { ctx.strokeRect(startX, startY, x-startX, y-startY); }
    else if (tool === 'circle') { ctx.beginPath(); ctx.ellipse((startX+x)/2,(startY+y)/2,Math.abs(x-startX)/2,Math.abs(y-startY)/2,0,0,Math.PI*2); ctx.stroke(); }
  });

  canvas.addEventListener('mouseup', () => { drawing = false; });

  window.paintTool = (t) => {
    tool = t;
    document.querySelectorAll('.paint-tool-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('ptool-' + t);
    if (btn) btn.classList.add('active');
    if (t === 'fill') {
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  };
  window.paintColor = (c) => {
    color = c;
    document.querySelectorAll('.paint-color-swatch').forEach(s => s.classList.remove('selected'));
  };
  window.paintClear = () => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); };
  window.paintSave = () => {
    const a = document.createElement('a');
    a.download = 'my-os-tekening.png';
    a.href = canvas.toDataURL();
    a.click();
  };
  document.getElementById('paint-size').addEventListener('input', e => size = parseInt(e.target.value));
}
