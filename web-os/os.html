            if (meegegevenSleutelB64 && atob(meegegevenSleutelB64) === RECHTEN_SLEUTEL) {
                
                // Sleutel is correct! We veranderen de wartaal nu weer in jouw echte HTML
                const echteHTML = decodeURIComponent(atob(GECODEERDE_WEB_OS).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                
                // Zet het OS op het scherm
                document.getElementById("loading").style.display = "none";
                document.getElementById("os-container").innerHTML = echteHTML;

                // Haal de sleutel direct uit de URL-balk zodat niemand hem ziet staan
                const schoneURL = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.replaceState({ path: schoneURL }, '', schoneURL);

            } else {
                throw new Error("Geen geldige sleutel");
            }
        } catch(e) {
            // Als de sleutel fout is, leeg de pagina en geef error
            document.getElementById("loading").style.display = "none";
            document.getElementById("error").style.display = "block";
            document.getElementById("os-container").remove(); 
        }
    </script>

</body>
</html>
