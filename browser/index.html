<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BrowsePort Browser</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#0B1220" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0B1220; --chrome:#0E1626; --chrome-2:#141F35; --content-bg:#0B1220;
    --tab-active:#182338; --tab-inactive:#0E1626;
    --text:#E8ECF3; --text-dim:#8B96AE; --text-dimmer:#5D6883;
    --accent:#4FD1C5; --accent-dim:#2C9C90; --accent-glow:rgba(79,209,197,.35);
    --warn:#F0A868; --danger:#E8697A;
    --border:#263252; --border-soft:#1B2540;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;-webkit-font-smoothing:antialiased;}
  button,input,select{font-family:var(--font-body);}
  button{cursor:pointer;}
  ::selection{background:var(--accent-glow);}
  .mono{font-family:var(--font-mono);}

  #shell{display:flex;flex-direction:column;height:100vh;}

  /* ---- tab strip ---- */
  .tabstrip{display:flex;align-items:flex-end;gap:2px;background:var(--chrome);padding:6px 6px 0;overflow-x:auto;scrollbar-width:none;}
  .tabstrip::-webkit-scrollbar{display:none;}
  .tab{
    display:flex;align-items:center;gap:7px;max-width:200px;min-width:110px;
    background:var(--tab-inactive);color:var(--text-dim);border-radius:9px 9px 0 0;
    padding:8px 8px 8px 12px;font-size:12.5px;white-space:nowrap;position:relative;flex-shrink:0;
    border:1px solid var(--border-soft);border-bottom:none;
  }
  .tab.active{background:var(--tab-active);color:var(--text);}
  .tab .favicon{width:14px;height:14px;flex-shrink:0;border-radius:3px;display:flex;align-items:center;justify-content:center;background:var(--bg-elev-2,#182338);font-size:10px;}
  .tab .ttl{overflow:hidden;text-overflow:ellipsis;flex:1;}
  .tab .close{opacity:0;width:16px;height:16px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-dimmer);}
  .tab:hover .close{opacity:1;}
  .tab .close:hover{background:rgba(255,255,255,.08);color:var(--text);}
  .tab-add{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);border-radius:7px;background:transparent;border:none;font-size:16px;margin-bottom:2px;}
  .tab-add:hover{background:var(--chrome-2);color:var(--text);}

  /* ---- toolbar ---- */
  .toolbar{display:flex;align-items:center;gap:8px;background:var(--tab-active);padding:8px 10px;border-bottom:1px solid var(--border-soft);}
  .navbtn{width:30px;height:30px;border-radius:7px;border:none;background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .navbtn:hover:not(:disabled){background:var(--chrome-2);color:var(--text);}
  .navbtn:disabled{opacity:.3;cursor:default;}
  .omnibox{
    flex:1;display:flex;align-items:center;gap:8px;background:var(--chrome);border:1px solid var(--border);
    border-radius:20px;padding:0 6px 0 12px;height:34px;min-width:0;
  }
  .omnibox:focus-within{border-color:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-glow);}
  .omnibox .src-ico{flex-shrink:0;font-size:13px;color:var(--text-dimmer);}
  .omnibox input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13.5px;min-width:0;}
  .omnibox input::placeholder{color:var(--text-dimmer);}
  .omnibox .install-btn{
    flex-shrink:0;font-size:11.5px;padding:5px 10px;border-radius:14px;background:var(--accent);color:#08201D;
    font-weight:600;border:none;display:none;
  }
  .omnibox .install-btn.show{display:inline-flex;align-items:center;gap:4px;}

  .bp-toggle{
    flex-shrink:0;display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;
    padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--chrome);color:var(--text-dim);
    font-weight:500;
  }
  .bp-toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--text-dimmer);}
  .bp-toggle.open{color:var(--accent);border-color:rgba(79,209,197,.4);background:rgba(79,209,197,.08);}
  .bp-toggle.open .dot{background:var(--accent);box-shadow:0 0 6px var(--accent-glow);}

  .menubtn{width:30px;height:30px;border-radius:7px;border:none;background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .menubtn:hover{background:var(--chrome-2);color:var(--text);}

  .fallback-bar{
    display:none;align-items:center;gap:10px;background:rgba(240,168,104,.1);border-bottom:1px solid rgba(240,168,104,.3);
    padding:8px 16px;font-size:12.5px;color:var(--warn);
  }
  .fallback-bar.show{display:flex;}
  .fallback-bar button{background:var(--warn);color:#2A1B08;border:none;padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;}

  /* ---- content ---- */
  #content{flex:1;position:relative;background:#fff;min-height:0;}
  #content iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff;display:none;}
  #content iframe.visible{display:block;}
  .internal-page{position:absolute;inset:0;overflow-y:auto;background:var(--content-bg);display:none;}
  .internal-page.visible{display:block;}

  /* ---- new tab page ---- */
  .newtab{display:flex;flex-direction:column;align-items:center;padding-top:12vh;height:100%;}
  .newtab .logo{width:64px;height:64px;margin-bottom:18px;}
  .newtab h1{font-family:var(--font-display);font-size:26px;font-weight:700;margin:0 0 28px;letter-spacing:-.3px;}
  .newtab .searchbox{
    display:flex;align-items:center;gap:10px;width:min(560px,88vw);background:var(--chrome-2);border:1px solid var(--border);
    border-radius:24px;padding:13px 20px;box-shadow:0 10px 34px rgba(0,0,0,.3);
  }
  .newtab .searchbox:focus-within{border-color:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-glow);}
  .newtab .searchbox input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;}
  .newtab .searchbox .go{color:var(--accent);font-size:15px;}
  .newtab .hint{margin-top:14px;font-size:12px;color:var(--text-dimmer);font-family:var(--font-mono);}
  .newtab .shortcuts{display:flex;gap:14px;margin-top:44px;flex-wrap:wrap;justify-content:center;max-width:560px;}
  .newtab .shortcut{
    width:82px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--text-dim);font-size:11px;text-align:center;
  }
  .newtab .shortcut .ic{width:44px;height:44px;border-radius:12px;background:var(--chrome-2);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:17px;}
  .newtab .shortcut:hover .ic{border-color:var(--accent-dim);}
  .newtab .bp-banner{
    margin-top:40px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-dim);
    background:var(--chrome-2);border:1px solid var(--border-soft);padding:8px 16px;border-radius:20px;
  }

  /* ---- internal pages (settings/history/source/folder) ---- */
  .ipage-wrap{max-width:760px;margin:0 auto;padding:40px 28px 80px;}
  .ipage-wrap h2{font-family:var(--font-display);font-size:22px;margin:0 0 22px;}
  .ipanel{background:var(--chrome-2);border:1px solid var(--border-soft);border-radius:10px;padding:20px;margin-bottom:16px;}
  .ipanel h3{font-family:var(--font-display);font-size:14px;margin:0 0 14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
  .srow:last-child{border-bottom:none;}
  .srow .lbl{font-size:13.5px;}
  .srow .desc{font-size:11.5px;color:var(--text-dimmer);margin-top:3px;}
  .switch{width:38px;height:22px;border-radius:20px;background:var(--border);position:relative;border:none;flex-shrink:0;}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s ease;}
  .switch.on{background:var(--accent);}
  .switch.on::after{transform:translateX(16px);}
  select.ssel, input.stext{background:var(--chrome);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 10px;font-size:12.5px;}
  .sbtn{background:var(--chrome);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:500;}
  .sbtn:hover{border-color:var(--text-dimmer);}
  .sbtn.danger{color:var(--danger);border-color:rgba(232,105,122,.35);}
  .sbtn.danger:hover{background:rgba(232,105,122,.08);}

  .hist-day{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dimmer);margin:20px 0 8px;text-transform:uppercase;}
  .hist-row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:7px;}
  .hist-row:hover{background:var(--chrome-2);}
  .hist-row .t{font-size:11px;color:var(--text-dimmer);font-family:var(--font-mono);width:52px;flex-shrink:0;}
  .hist-row .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .hist-row .url{color:var(--text-dimmer);font-size:11.5px;font-family:var(--font-mono);}
  .hist-row .del{color:var(--text-dimmer);font-size:13px;flex-shrink:0;opacity:0;}
  .hist-row:hover .del{opacity:1;}
  .empty{color:var(--text-dimmer);font-size:13px;text-align:center;padding:40px 0;}

  pre.source{background:var(--chrome);border:1px solid var(--border-soft);border-radius:8px;padding:16px;font-family:var(--font-mono);font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:#B9E3DE;}
  .filelist .frow{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--border-soft);border-radius:7px;margin-bottom:6px;background:var(--chrome);cursor:pointer;font-family:var(--font-mono);font-size:12.5px;}
  .filelist .frow:hover{border-color:var(--accent-dim);}

  /* ---- context menu ---- */
  .ctxmenu{position:fixed;z-index:999;background:var(--chrome-2);border:1px solid var(--border);border-radius:9px;
    box-shadow:0 14px 40px rgba(0,0,0,.5);padding:5px;min-width:230px;font-size:13px;}
  .ctxmenu .item{padding:8px 12px;border-radius:6px;display:flex;justify-content:space-between;gap:14px;color:var(--text);}
  .ctxmenu .item:hover:not(.disabled){background:var(--chrome);}
  .ctxmenu .item.disabled{color:var(--text-dimmer);cursor:default;}
  .ctxmenu .item .kbd{color:var(--text-dimmer);font-size:11px;font-family:var(--font-mono);}
  .ctxmenu .sep{height:1px;background:var(--border-soft);margin:5px 4px;}

  .devbar{position:fixed;bottom:0;left:0;right:0;background:#08110C;border-top:1px solid rgba(79,209,197,.35);
    padding:8px 16px;font-family:var(--font-mono);font-size:11px;color:#8FEFDF;z-index:80;display:none;gap:20px;flex-wrap:wrap;}
  .devbar.show{display:flex;}

  .inspect-panel{position:fixed;right:0;top:0;bottom:0;width:300px;background:var(--chrome-2);border-left:1px solid var(--border);
    z-index:90;padding:16px;overflow-y:auto;display:none;font-size:12px;}
  .inspect-panel.show{display:block;}
  .inspect-panel h4{font-family:var(--font-display);font-size:13px;margin:14px 0 6px;color:var(--accent);}
  .inspect-panel .close-insp{float:right;color:var(--text-dimmer);cursor:pointer;}

  @media (max-width:640px){
    .newtab h1{font-size:20px;} .tab{min-width:90px;}
  }
</style>
</head>
<body>
<div id="shell">
  <div class="tabstrip" id="tabstrip"></div>
  <div class="toolbar">
    <button class="navbtn" id="btnBack" title="Terug (Alt+←)">←</button>
    <button class="navbtn" id="btnFwd" title="Vooruit (Alt+→)">→</button>
    <button class="navbtn" id="btnReload" title="Herladen">⟳</button>
    <button class="navbtn" id="btnHome" title="Nieuw tabblad">⌂</button>
    <div class="omnibox" id="omnibox">
      <span class="src-ico" id="srcIco">✦</span>
      <input id="addressInput" placeholder="Zoek of typ een domeinnaam" autocomplete="off" spellcheck="false" />
      <button class="install-btn" id="installBtn">⭳ Installeren</button>
    </div>
    <button class="bp-toggle" id="bpToggle"><span class="dot"></span><span id="bpToggleLabel">BrowsePort: Closed</span></button>
    <button class="menubtn" id="menuBtn" title="Menu">⋮</button>
  </div>
  <div class="fallback-bar" id="fallbackBar">
    <span id="fallbackText">Deze site laadt mogelijk niet in-app doordat de website embedden blokkeert.</span>
    <button id="fallbackOpenNew">Open in nieuw tabblad</button>
  </div>
  <div id="content"></div>
</div>

<div class="devbar" id="devbar"></div>
<div class="inspect-panel" id="inspectPanel"></div>
<div id="ctxRoot"></div>

<script>
(function(){
"use strict";

// ============== SUPABASE (BrowsePort data) ==============
const SUPABASE_URL = "https://puljajfgjyzipgdrvioy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1bGphamZnanl6aXBnZHJ2aW95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNjU1NDUsImV4cCI6MjA5OTk0MTU0NX0.F9r4TxzjfOLieUaslnvG8cwgKPlEjSrWEPCHM2miJtU";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#101828"/><path d="M18 40 V24 a6 6 0 0 1 6 -6 h6" stroke="#00C48C" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M46 24 V40 a6 6 0 0 1 -6 6 h-6" stroke="#FF6B35" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="24" cy="18" r="4.5" fill="#00C48C"/><circle cx="40" cy="46" r="4.5" fill="#FF6B35"/></svg>`;

// ============== STORAGE (localStorage met in-memory fallback) ==============
const mem = {};
function lsGet(k, def){
  try{ const v = localStorage.getItem(k); return v===null ? def : JSON.parse(v); }
  catch(e){ return (k in mem) ? mem[k] : def; }
}
function lsSet(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }
  catch(e){ mem[k] = v; }
}

// ============== STATE ==============
let tabs = [];
let activeTabId = null;
let tabSeq = 0;
let browseportOpen = lsGet("bp_open", false);
let searchEngine = lsGet("bp_search_engine", "duckduckgo");
let devMode = lsGet("bp_dev_mode", false);
let historyLog = lsGet("bp_history", []);
let deferredInstallPrompt = null;

const SEARCH_ENGINES = {
  duckduckgo: { name:"DuckDuckGo", url:q=>"https://html.duckduckgo.com/html/?q="+encodeURIComponent(q) },
  bing:       { name:"Bing",       url:q=>"https://www.bing.com/search?q="+encodeURIComponent(q) },
  google:     { name:"Google",     url:q=>"https://www.google.com/search?q="+encodeURIComponent(q) },
  startpage:  { name:"Startpage",  url:q=>"https://www.startpage.com/sp/search?query="+encodeURIComponent(q) },
};

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Math.random().toString(36).slice(2,10); }

// ============== TABS ==============
function newTab(activate=true){
  const t = { id:"t"+(++tabSeq), url:"", title:"Nieuw tabblad", isInternal:true, internalPage:"newtab",
              history:[{internal:"newtab"}], histIndex:0, source:"internal", iframeEl:null };
  tabs.push(t);
  if(activate) activeTabId = t.id;
  renderAll();
  return t;
}
function closeTab(id){
  const idx = tabs.findIndex(t=>t.id===id);
  if(idx<0) return;
  const t = tabs[idx];
  if(t.iframeEl) t.iframeEl.remove();
  tabs.splice(idx,1);
  if(tabs.length===0){ newTab(); return; }
  if(activeTabId===id){ activeTabId = tabs[Math.max(0,idx-1)].id; }
  renderAll();
}
function activateTab(id){ activeTabId = id; renderAll(); focusAddressBarIfEmpty(); }
function getActiveTab(){ return tabs.find(t=>t.id===activeTabId); }

function ensureIframe(tab){
  if(tab.iframeEl) return tab.iframeEl;
  const el = document.createElement("iframe");
  el.setAttribute("sandbox","allow-scripts allow-forms allow-popups allow-same-origin allow-modals allow-popups-to-escape-sandbox");
  el.referrerPolicy = "no-referrer-when-downgrade";
  document.getElementById("content").appendChild(el);
  tab.iframeEl = el;
  return el;
}

// ============== NAVIGATION ==============
function looksLikeUrl(input){
  const v = input.trim();
  if(/^https?:\/\//i.test(v)) return true;
  if(/\s/.test(v)) return false;
  return /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$/i.test(v);
}
function normalizeUrl(input){
  let v = input.trim();
  if(!/^https?:\/\//i.test(v)) v = "https://" + v;
  return v;
}
function hostnameOf(url){
  try{ return new URL(url).hostname.toLowerCase().replace(/^www\./,""); }catch(e){ return ""; }
}

async function resolveBrowsePort(hostname){
  const { data: exact } = await sb.from("v2_domains").select("*").eq("domain_name", hostname).maybeSingle();
  if(exact){
    if(exact.is_published && exact.website_id) return { websiteId: exact.website_id, exists:true, published:true };
    return { exists:true, published:false };
  }
  const parts = hostname.split(".");
  if(parts.length>=3){
    const label = parts[0], base = parts.slice(1).join(".");
    const { data: baseDom } = await sb.from("v2_domains").select("*").eq("domain_name", base).maybeSingle();
    if(baseDom){
      const { data: sub } = await sb.from("v2_subdomains").select("*").eq("domain_id", baseDom.id).eq("label", label).maybeSingle();
      if(sub){
        if(sub.is_published && sub.website_id) return { websiteId: sub.website_id, exists:true, published:true };
        return { exists:true, published:false };
      }
    }
  }
  return { exists:false, published:false };
}

function mimeFromPath(path){
  const ext=(path.split(".").pop()||"").toLowerCase();
  const map={html:"text/html",htm:"text/html",css:"text/css",js:"application/javascript",json:"application/json",svg:"image/svg+xml",txt:"text/plain",md:"text/markdown",xml:"application/xml"};
  return map[ext]||"text/plain";
}
function buildFileMap(files){ const m={}; files.forEach(f=>m[f.file_path]=f); return m; }
function resolvePath(basePath,rel){
  if(/^(https?:)?\/\//i.test(rel)||rel.startsWith("data:")||rel.startsWith("#")||rel.startsWith("mailto:")) return null;
  const baseParts=basePath.split("/"); baseParts.pop();
  const stack=baseParts.slice();
  rel.split("/").forEach(part=>{ if(part==="."||part==="") return; if(part==="..") stack.pop(); else stack.push(part); });
  return stack.join("/");
}
function blobUrlFor(path,fileMap,cache){
  if(cache[path]) return cache[path];
  const file=fileMap[path]; if(!file) return null;
  const url=URL.createObjectURL(new Blob([file.content],{type:mimeFromPath(path)}));
  cache[path]=url; return url;
}
function renderHtmlWithAssets(path,fileMap,cache,visited){
  if(cache[path]) return cache[path];
  if(visited.has(path)) return null;
  visited.add(path);
  const file=fileMap[path]; if(!file) return null;
  let html=file.content;
  html=html.replace(/((?:src|href)\s*=\s*)(["'])(.*?)\2/gi,(m,prefix,q,val)=>{
    const resolved=resolvePath(path,val); if(!resolved||!fileMap[resolved]) return m;
    const u = mimeFromPath(resolved)==="text/html" ? renderHtmlWithAssets(resolved,fileMap,cache,visited) : blobUrlFor(resolved,fileMap,cache);
    return u ? prefix+q+u+q : m;
  });
  html=html.replace(/url\((["']?)(.*?)\1\)/gi,(m,q,val)=>{
    const resolved=resolvePath(path,val); if(!resolved||!fileMap[resolved]) return m;
    const u=blobUrlFor(resolved,fileMap,cache);
    return u ? "url("+q+u+q+")" : m;
  });
  const url=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  cache[path]=url; return url;
}

async function navigateTab(tab, rawInput, {push=true}={}){
  const input = (rawInput||"").trim();
  if(!input) return;
  hideFallback();
  let entry;

  if(looksLikeUrl(input)){
    const fullUrl = normalizeUrl(input);
    const hostname = hostnameOf(fullUrl);
    let handled = false;

    if(browseportOpen){
      const res = await resolveBrowsePort(hostname);
      if(res.exists && res.published){
        const { data: files } = await sb.from("v2_website_files").select("*").eq("website_id", res.websiteId);
        if(files && files.length){
          const fileMap = buildFileMap(files);
          const blobUrl = fileMap["index.html"] ? renderHtmlWithAssets("index.html", fileMap, {}, new Set()) : null;
          if(blobUrl){
            tab.isInternal=false; tab.source="browseport"; tab.title=hostname; tab.url=fullUrl;
            tab.bpMeta = { hostname, files, fileMap };
            const el = ensureIframe(tab); el.src = blobUrl;
            handled = true;
          }
        }
      } else if(res.exists && !res.published){
        showFallback(hostname+" bestaat op BrowsePort, maar is niet gepubliceerd door de eigenaar.", null);
        tab.isInternal=true; tab.internalPage="blocked"; tab.title=hostname; tab.url=fullUrl; tab.source="internal";
        handled = true;
      }
    }

    if(!handled){
      tab.isInternal=false; tab.source="external"; tab.title=hostname; tab.url=fullUrl; tab.bpMeta=null;
      const el = ensureIframe(tab); el.src = fullUrl;
      showFallback("Als "+hostname+" hier niet laadt, blokkeert de website zelf embedding (X-Frame-Options) — dat kan geen enkele in-pagina-browser omzeilen.", fullUrl);
    }
    entry = { url: fullUrl, title: tab.title, hostname, ts: Date.now(), source: tab.source };
  } else {
    const eng = SEARCH_ENGINES[searchEngine] || SEARCH_ENGINES.duckduckgo;
    const searchUrl = eng.url(input);
    tab.isInternal=false; tab.source="search"; tab.title=input; tab.url=searchUrl; tab.bpMeta=null;
    const el = ensureIframe(tab); el.src = searchUrl;
    showFallback("Sommige zoekmachines (zoals Google) blokkeren embedden. Werkt de zoekopdracht niet? Open 'm in een nieuw tabblad.", searchUrl);
    entry = { url: searchUrl, title: "Zoeken: "+input, hostname: eng.name, ts: Date.now(), source:"search" };
  }

  if(push){
    tab.history = tab.history.slice(0, tab.histIndex+1);
    tab.history.push(entry.url ? {url:entry.url, title:tab.title} : {internal:tab.internalPage});
    tab.histIndex = tab.history.length-1;
    historyLog.unshift(entry);
    if(historyLog.length>500) historyLog.length = 500;
    lsSet("bp_history", historyLog);
  }
  renderAll();
}

function openNewTabInternal(tab, page, opts={}){
  tab.isInternal=true; tab.internalPage=page; tab.source="internal"; tab.title = internalTitle(page);
  tab.internalOpts = opts;
  if(page!=="newtab"){
    tab.history = tab.history.slice(0, tab.histIndex+1);
    tab.history.push({internal:page, opts});
    tab.histIndex = tab.history.length-1;
  }
  renderAll();
}
function internalTitle(page){
  return { newtab:"Nieuw tabblad", settings:"Instellingen", history:"Geschiedenis", source:"Paginabron", folder:"Paginamap", blocked:"Niet gepubliceerd" }[page] || "BrowsePort";
}

function goBack(tab){
  if(tab.histIndex<=0) return;
  tab.histIndex--;
  loadHistoryEntry(tab, tab.history[tab.histIndex]);
}
function goForward(tab){
  if(tab.histIndex>=tab.history.length-1) return;
  tab.histIndex++;
  loadHistoryEntry(tab, tab.history[tab.histIndex]);
}
function loadHistoryEntry(tab, entry){
  if(entry.internal){
    tab.isInternal=true; tab.internalPage=entry.internal; tab.source="internal"; tab.title=internalTitle(entry.internal); tab.internalOpts=entry.opts||{};
  } else if(entry.url){
    navigateTab(tab, entry.url, {push:false});
    return;
  }
  renderAll();
}
function reloadTab(tab){
  if(tab.isInternal){ renderAll(); return; }
  if(tab.iframeEl) tab.iframeEl.src = tab.iframeEl.src;
}

// ============== FALLBACK BAR ==============
function showFallback(text, openUrl){
  const bar = document.getElementById("fallbackBar");
  document.getElementById("fallbackText").textContent = text;
  bar.classList.add("show");

}
function hideFallback(){ document.getElementById("fallbackBar").classList.remove("show"); }
document.getElementById("fallbackOpenNew").addEventListener("click", ()=>{

// ============== RENDER ==============
function renderAll(){
  renderTabs();
  renderToolbar();
  renderContent();
}

function renderTabs(){
  const strip = document.getElementById("tabstrip");
  strip.innerHTML = tabs.map(t=>`
    <div class="tab ${t.id===activeTabId?'active':''}" data-tab="${t.id}">
      <span class="favicon">${t.source==='browseport'?'🌐':t.isInternal?'✦':'○'}</span>
      <span class="ttl">${esc(t.title||'Nieuw tabblad')}</span>
      <span class="close" data-close="${t.id}">✕</span>
    </div>`).join("") + `<button class="tab-add" id="tabAddBtn">+</button>`;
  strip.querySelectorAll(".tab").forEach(el=>{
    el.addEventListener("click",(e)=>{ if(e.target.dataset.close) return; activateTab(el.dataset.tab); });
  });
  strip.querySelectorAll("[data-close]").forEach(el=>{
    el.addEventListener("click",(e)=>{ e.stopPropagation(); closeTab(el.dataset.close); });
  });
  document.getElementById("tabAddBtn").addEventListener("click", ()=>newTab());
}

function renderToolbar(){
  const tab = getActiveTab(); if(!tab) return;
  document.getElementById("btnBack").disabled = tab.histIndex<=0;
  document.getElementById("btnFwd").disabled = tab.histIndex>=tab.history.length-1;
  const input = document.getElementById("addressInput");
  if(document.activeElement !== input){
    input.value = tab.isInternal ? (tab.internalPage==="newtab" ? "" : "browseport://"+tab.internalPage) : (tab.url||"");
  }
  const srcIco = document.getElementById("srcIco");
  srcIco.textContent = tab.source==='browseport' ? '🌐' : tab.source==='search' ? '🔍' : tab.source==='external' ? '🔒' : '✦';

  const toggle = document.getElementById("bpToggle");
  toggle.className = "bp-toggle" + (browseportOpen?" open":"");
  document.getElementById("bpToggleLabel").textContent = "BrowsePort: " + (browseportOpen ? "Open" : "Closed");

  renderDevbar(tab);
}

function renderDevbar(tab){
  const bar = document.getElementById("devbar");
  if(!devMode){ bar.classList.remove("show"); return; }
  bar.classList.add("show");
  bar.innerHTML = `
    <span>tab: ${esc(tab.id)}</span>
    <span>source: ${esc(tab.source)}</span>
    <span>url: ${esc(tab.url||('browseport://'+tab.internalPage))}</span>
    <span>history: ${tab.histIndex+1}/${tab.history.length}</span>
    <span>browseport: ${browseportOpen?'open':'closed'}</span>
  `;
}

function renderContent(){
  const content = document.getElementById("content");
  content.querySelectorAll(".internal-page").forEach(n=>n.remove());
  tabs.forEach(t=>{ if(t.iframeEl) t.iframeEl.classList.remove("visible"); });

  const tab = getActiveTab(); if(!tab) return;

  if(!tab.isInternal){
    const el = ensureIframe(tab);
    el.classList.add("visible");
    return;
  }
  const page = document.createElement("div");
  page.className = "internal-page visible";
  page.innerHTML = renderInternalPage(tab);
  content.appendChild(page);
  wireInternalPage(page, tab);
}

function renderInternalPage(tab){
  if(tab.internalPage==="newtab") return NewTabHTML();
  if(tab.internalPage==="settings") return SettingsHTML();
  if(tab.internalPage==="history") return HistoryHTML();
  if(tab.internalPage==="source") return SourceHTML(tab);
  if(tab.internalPage==="folder") return FolderHTML(tab);
  if(tab.internalPage==="blocked") return BlockedHTML(tab);
  return `<div class="ipage-wrap"><div class="empty">Onbekende pagina.</div></div>`;
}

function HistoryHTML(){
  if(!historyLog.length) return `<div class="ipage-wrap"><h2>Geschiedenis</h2><div class="empty">Nog geen geschiedenis.</div></div>`;
  const groups = {};
  historyLog.forEach(h=>{
    const d = new Date(h.ts);
    const key = d.toLocaleDateString("nl-NL",{weekday:'long', day:'numeric', month:'long'});
    (groups[key] ||= []).push(h);
  });
  let html = `<div class="ipage-wrap"><h2>Geschiedenis <span style="font-size:12px;color:var(--text-dimmer);">(Ctrl+H)</span></h2><div class="ipanel">`;
  Object.keys(groups).forEach(day=>{
    html += `<div class="hist-day">${esc(day)}</div>`;
    groups[day].forEach((h,i)=>{
      const t = new Date(h.ts).toLocaleTimeString("nl-NL",{hour:'2-digit',minute:'2-digit'});
      html += `<div class="hist-row">
        <span class="t">${t}</span>
        <span class="ttl" data-go="${esc(h.url||'')}">${esc(h.title||h.hostname||h.url)} <span class="url">— ${esc(h.hostname||'')}</span></span>
      </div>`;
    });
  });
  html += `</div><button class="sbtn danger" id="histClearBtn">Volledige geschiedenis wissen</button></div>`;
  return html;
}

function SourceHTML(tab){
  const meta = tab.internalOpts || {};

  return `<div class="ipage-wrap"><h2>Paginabron — ${esc(meta.label||'')}</h2><pre class="source">${esc(content)}</pre></div>`;
}
function FolderHTML(tab){
  const meta = tab.internalOpts || {};
  if(!meta.files) return `<div class="ipage-wrap"><h2>Paginamap</h2><div class="empty">Alleen beschikbaar voor BrowsePort-websites.</div></div>`;
  return `<div class="ipage-wrap"><h2>Paginamap — ${esc(meta.hostname)}</h2><div class="ipanel filelist">
    ${meta.files.sort((a,b)=>a.file_path.localeCompare(b.file_path)).map(f=>`
      <div class="frow" data-viewfile="${esc(f.file_path)}"><span>📄 ${esc(f.file_path)}</span><span style="color:var(--text-dimmer);">${(f.content||'').length} tekens</span></div>

function BlockedHTML(tab){

function wireInternalPage(page, tab){
  page.querySelectorAll("[data-go]").forEach(el=>{
    el.addEventListener("click", ()=>{ const v = el.dataset.go; if(v.startsWith("browseport://")) openNewTabInternal(tab, v.replace("browseport://","")); else navigateTab(tab, v); });
  });
  page.querySelectorAll("[data-toggle-bp]").forEach(el=> el.addEventListener("click", toggleBrowsePort));
  const ntSearch = page.querySelector("#ntSearch");
  if(ntSearch){
    ntSearch.focus();
    ntSearch.addEventListener("keydown",(e)=>{ if(e.key==="Enter") navigateTab(tab, ntSearch.value); });
  }
  const bpTog = page.querySelector("#setBpToggle"); if(bpTog) bpTog.addEventListener("click", toggleBrowsePort);
  const eng = page.querySelector("#setSearchEngine"); if(eng) eng.addEventListener("change", ()=>{ searchEngine=eng.value; lsSet("bp_search_engine",searchEngine); renderAll(); });
  const dm = page.querySelector("#setDevMode"); if(dm) dm.addEventListener("click", ()=>{ devMode=!devMode; lsSet("bp_dev_mode",devMode); renderAll(); });
  const ch = page.querySelector("#setClearHistory"); if(ch) ch.addEventListener("click", ()=>{ if(confirm("Geschiedenis wissen?")){ historyLog=[]; lsSet("bp_history",[]); renderAll(); } });
  const ca = page.querySelector("#setClearAll"); if(ca) ca.addEventListener("click", ()=>{ if(confirm("Alle lokale instellingen en geschiedenis wissen?")){ historyLog=[]; browseportOpen=false; searchEngine="duckduckgo"; devMode=false; lsSet("bp_history",[]); lsSet("bp_open",false); lsSet("bp_search_engine","duckduckgo"); lsSet("bp_dev_mode",false); renderAll(); } });
  const hc = page.querySelector("#histClearBtn"); if(hc) hc.addEventListener("click", ()=>{ if(confirm("Geschiedenis wissen?")){ historyLog=[]; lsSet("bp_history",[]); openNewTabInternal(tab,"history"); } });
  page.querySelectorAll("[data-viewfile]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const meta = tab.internalOpts || {};
      const f = (meta.files||[]).find(f=>f.file_path===el.dataset.viewfile);
      openNewTabInternal(tab, "source", { label: el.dataset.viewfile, content: f?f.content:"" });
    });
  });
}

function toggleBrowsePort(){
  browseportOpen = !browseportOpen;
  lsSet("bp_open", browseportOpen);
  renderAll();
}

});

function focusAddressBarIfEmpty(){}

// ============== CONTEXT MENU ==============
function showCtxMenu(x,y, items){
  hideCtxMenu();
  const w = window.innerWidth, h = window.innerHeight;
  const menu = document.createElement("div");
  menu.className = "ctxmenu";
  menu.innerHTML = items.map(it=>{
    if(it==="sep") return `<div class="sep"></div>`;
    return `<div class="item ${it.disabled?'disabled':''}" data-act="${it.act||''}"><span>${esc(it.label)}</span>${it.kbd?`<span class="kbd">${esc(it.kbd)}</span>`:""}</div>`;
  }).join("");
  document.getElementById("ctxRoot").appendChild(menu);
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.min(x, w-mw-8)+"px";
  menu.style.top = Math.min(y, h-mh-8)+"px";
  menu.querySelectorAll(".item[data-act]").forEach(el=>{
    if(el.classList.contains("disabled")) return;
    el.addEventListener("click", ()=>{ runMenuAction(el.dataset.act); hideCtxMenu(); });
  });
  setTimeout(()=>document.addEventListener("click", hideCtxMenu, {once:true}), 0);
}
function hideCtxMenu(){ document.getElementById("ctxRoot").innerHTML=""; }

function buildMenuItems(tab, fromMenuBtn){
  const sel = window.getSelection().toString().trim();
  const items = [];
  if(sel) items.push({label:`Zoeken met ${SEARCH_ENGINES[searchEngine].name} naar "${sel.slice(0,24)}${sel.length>24?'…':''}"`, act:"search-sel"}, "sep");
  items.push(
    {label:"Terug", act:"back", disabled: tab.histIndex<=0, kbd:"Alt+←"},
    {label:"Vooruit", act:"fwd", disabled: tab.histIndex>=tab.history.length-1, kbd:"Alt+→"},
    {label:"Herladen", act:"reload"},
    "sep",
    {label:"Pagina opslaan als…", act:"save", disabled:true},
    {label:"Paginabron weergeven", act:"viewsource", kbd:"Ctrl+U"},
    {label:"Paginamap weergeven", act:"viewfolder", disabled: tab.source!=="browseport"},
    {label:"Inspecteren", act:"inspect"},
    "sep",
    {label:"Nieuw tabblad", act:"newtab", kbd:"Ctrl+T"},
    {label:"Geschiedenis", act:"history", kbd:"Ctrl+H"},
    {label:"Instellingen", act:"settings"}
  );
  return items;
}

async function runMenuAction(act){
  const tab = getActiveTab();
  if(act==="back") goBack(tab);
  else if(act==="fwd") goForward(tab);
  else if(act==="reload") reloadTab(tab);
  else if(act==="newtab") newTab();
  else if(act==="history") openNewTabInternal(tab,"history");
  else if(act==="settings") openNewTabInternal(tab,"settings");
  else if(act==="search-sel"){ const s=window.getSelection().toString().trim(); const nt=newTab(); navigateTab(nt, s); }
  else if(act==="inspect") openInspector();
  else if(act==="viewsource") await viewSource(tab);
  else if(act==="viewfolder") viewFolder(tab);
}

async function viewSource(tab){
  if(tab.source==="browseport" && tab.bpMeta){
    const idx = tab.bpMeta.fileMap["index.html"];
    openNewTabInternal(tab, "source", { label: tab.bpMeta.hostname+"/index.html", content: idx?idx.content:"" });
    return;
  }
  if(tab.isInternal){ openNewTabInternal(tab,"source",{label:"interne pagina", content:"Interne BrowsePort-pagina — geen HTML-bron."}); return; }
  try{
    const res = await fetch(tab.url);
    const text = await res.text();
    openNewTabInternal(tab, "source", { label: tab.url, content: text });
  }catch(e){
    openNewTabInternal(tab, "source", { label: tab.url, content: "Kan de broncode niet ophalen: deze website staat cross-origin verzoeken (CORS) niet toe vanuit een andere pagina — dat geldt voor de meeste externe sites." });
  }
}
function viewFolder(tab){
  if(tab.source!=="browseport" || !tab.bpMeta) return;
  openNewTabInternal(tab, "folder", { hostname: tab.bpMeta.hostname, files: tab.bpMeta.files });
}

// custom context menu on our own chrome + internal pages (not inside cross-origin iframes — those show their own native menu, which is expected)
document.addEventListener("contextmenu",(e)=>{
  if(e.target.closest("iframe")) return; // let cross-origin content show its native menu
  e.preventDefault();
  showCtxMenu(e.clientX, e.clientY, buildMenuItems(getActiveTab()));
});

// ============== INSPECTOR (lightweight) ==============
function openInspector(){
  const panel = document.getElementById("inspectPanel");
  panel.classList.add("show");
  panel.innerHTML = `<span class="close-insp" id="closeInsp">✕ sluiten</span>
    <h4>Mini-inspecteur</h4>
    <div style="color:var(--text-dimmer);font-size:11.5px;line-height:1.6;">
      Klik op een willekeurig element in de browser-chrome (tabbladen, adresbalk, interne pagina's) om de opbouw te bekijken.<br/><br/>
      Volledige DevTools voor extern geladen pagina's zijn niet beschikbaar vanuit een webpagina zelf — gebruik daarvoor F12 van je eigen browser.
    </div>
    <div id="inspOutput" style="margin-top:14px;"></div>`;
  document.getElementById("closeInsp").addEventListener("click", ()=>{ panel.classList.remove("show"); document.removeEventListener("click", inspectClickHandler, true); });
  document.addEventListener("click", inspectClickHandler, true);
}
function inspectClickHandler(e){
  if(e.target.closest("#inspectPanel")) return;
  e.preventDefault(); e.stopPropagation();
  const el = e.target;
  const out = document.getElementById("inspOutput");
  if(out){
    out.innerHTML = `
      <div class="mono" style="font-size:11px;color:var(--accent);">&lt;${el.tagName.toLowerCase()}${el.id?' id="'+el.id+'"':''}${el.className&&typeof el.className==='string'?' class="'+el.className+'"':''}&gt;</div>
      <pre class="source" style="margin-top:8px;max-height:200px;overflow:auto;">${esc(el.outerHTML.slice(0,600))}</pre>
    `;
  }
  document.removeEventListener("click", inspectClickHandler, true);
}

// ============== KEYBOARD SHORTCUTS ==============
document.addEventListener("keydown",(e)=>{
  const tab = getActiveTab();
  if(e.ctrlKey && e.key.toLowerCase()==="t"){ e.preventDefault(); newTab(); }
  else if(e.ctrlKey && e.key.toLowerCase()==="w"){ e.preventDefault(); if(tab) closeTab(tab.id); }
  else if(e.ctrlKey && e.key.toLowerCase()==="l"){ e.preventDefault(); document.getElementById("addressInput").focus(); document.getElementById("addressInput").select(); }
  else if(e.ctrlKey && e.key.toLowerCase()==="h"){ e.preventDefault(); if(tab) openNewTabInternal(tab,"history"); }
  else if(e.ctrlKey && e.key.toLowerCase()==="u"){ e.preventDefault(); if(tab) viewSource(tab); }
  else if(e.altKey && e.key==="ArrowLeft"){ e.preventDefault(); if(tab) goBack(tab); }
  else if(e.altKey && e.key==="ArrowRight"){ e.preventDefault(); if(tab) goForward(tab); }
  else if(e.key==="F5"){ if(tab) reloadTab(tab); }
});

// ============== PWA INSTALL ==============
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById("installBtn").classList.add("show");
});
document.getElementById("installBtn").addEventListener("click", async ()=>{
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById("installBtn").classList.remove("show");
});
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

// ============== BOOT ==============
newTab();
renderAll();
})();
</script>
</body>
