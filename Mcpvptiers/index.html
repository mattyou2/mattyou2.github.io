<style>
    /* Fullscreen reset zodat de pagina strak aansluit zonder scrollbars */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    /* Hover effect voor het watermerk (licht elegant op) */
    #watermarkBtn:hover {
        transform: scale(1.03);
        color: rgba(255, 255, 255, 0.95);
        box-shadow: 0 6px 20px rgba(100, 149, 237, 0.5);
        border-color: rgba(255, 255, 255, 0.4);
    }
    
    /* Hover voor het sluitkruisje van het menu */
    #closeMenuBtn:hover {
        color: white;
    }
</style>

<!-- Fullscreen container voor de hele pagina -->
<div style="position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #000;">
    
    <!-- Het Iframe (Volledig scherm) -->
    <iframe src="https://mcpvptiers.bolt.host" width="100%" height="100%" style="border: none;" allowfullscreen="">
    </iframe>

    <!-- Watermerk Knop -->
    <div id="watermarkBtn" style="
        position: absolute; 
        
        /* Positie: 3 mm omhoog gezet vanaf de vorige versie (van 14px naar 25px) */
        bottom: 25px; 
        right: 16px; 
        
        /* Flexbox houdt de tekst perfect gecentreerd, ook nu de knop dikker is */
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        
        /* Galaxy Achtergrond */
        background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
        background-image: 
            radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 15px),
            linear-gradient(135deg, #020111 0%, #191621 25%, #20202c 50%, #191621 75%, #020111 100%);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 8px rgba(100, 149, 237, 0.3);
        
        /* Formaat & Padding: Knop 2mm hoger én 2mm lager gemaakt (padding boven/onder verhoogd naar 14px) */
        color: rgba(255, 255, 255, 0.5); 
        padding: 14px 10px; 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        font-size: 13px; 
        font-weight: 400; 
        letter-spacing: -0.2px; 
        text-decoration: none;
        
        /* Rand en Vorm */
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 25px; 
        
        /* Interactie */
        pointer-events: auto;
        cursor: pointer;
        user-select: none;
        
        /* Smooth hover effect */
        transition: all 0.3s ease;">
        
        Made by Mattyou Studios™
    </div>

    <!-- Het Menu Overlay (Blokkeert interactie met de achtergrond zodra geopend) -->
    <div id="menuOverlay" style="
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 9999;
        justify-content: center;
        align-items: center;">
        
        <!-- De Menu Kaart -->
        <div style="
            background: radial-gradient(circle at center, #1c2030 0%, #0c0f17 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            max-width: 400px;
            width: 80%;
            position: relative;
            font-family: system-ui, -apple-system, sans-serif;">
            
            <!-- Sluitkruisje -->
            <span id="closeMenuBtn" style="
                position: absolute;
                top: 12px;
                right: 16px;
                color: rgba(255,255,255,0.5);
                font-size: 20px;
                cursor: pointer;
                transition: color 0.2s;">&times;</span>

            <!-- Menu Tekst -->
            <h3 style="color: white; margin-top: 10px; margin-bottom: 25px; font-size: 18px; font-weight: 500; letter-spacing: 0.5px;">
                This website is made by Mattyou Studios™
            </h3>
            
            <!-- Actie Knop naar GitHub Pages -->
            <a href="https://mattyou2.github.io" target="_blank" style="
                display: inline-block;
                background: linear-gradient(135deg, #2b5c8f 0%, #163051 100%);
                color: white;
                text-decoration: none;
                padding: 12px 20px;
                font-weight: 600;
                font-size: 14px;
                border-radius: 8px;
                border: 1px solid rgba(255,255,255,0.2);
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                transition: all 0.2s ease;">
                Go to the Mattyou Studios™ website
            </a>
        </div>
    </div>
</div>

<script>
    const watermarkBtn = document.getElementById('watermarkBtn');
    const menuOverlay = document.getElementById('menuOverlay');
    const closeMenuBtn = document.getElementById('closeMenuBtn');

    // Menu openen
    watermarkBtn.addEventListener('click', () => {
        menuOverlay.style.display = 'flex';
    });

    // Menu sluiten via kruisje
    closeMenuBtn.addEventListener('click', () => {
        menuOverlay.style.display = 'none';
    });

    // Menu sluiten als je buiten de kaart klikt
    menuOverlay.addEventListener('click', (e) => {
        if (e.target === menuOverlay) {
            menuOverlay.style.display = 'none';
        }
    });
</script>
