<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ball Parkour 3D - Fixed Levels & Jump Upgrades</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d1117; color: #fff; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    .ui-layer { position: absolute; z-index: 10; pointer-events: none; }
    .interactive { pointer-events: auto; }
    #top-bar { top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; }
    .hud-box { background: rgba(16, 22, 34, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px 14px; border-radius: 10px; backdrop-filter: blur(4px); }
    .hud-title { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
    .hud-value { font-size: 18px; font-weight: bold; color: #58a6ff; }
    .btn { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #2ea043; }
    .btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
    .btn-blue { background: #1f6feb; }
    .btn-blue:hover { background: #388bfd; }
    #multiplayer-panel { top: 85px; left: 15px; width: 220px; }
    #leaderboard-panel { top: 85px; right: 15px; width: 200px; }
    input[type="text"] { width: 100%; padding: 6px; margin: 6px 0; border-radius: 4px; border: 1px solid #30363d; background: #0d1117; color: #fff; }
    .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 340px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; display: none; flex-direction: column; gap: 12px; }
    .shop-item { display: flex; justify-content: space-between; align-items: center; background: #0d1117; padding: 10px; border-radius: 6px; border: 1px solid #30363d; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- HUD Top Bar -->
  <div id="top-bar" class="ui-layer">
    <div style="display: flex; gap: 8px;">
      <div class="hud-box"><div class="hud-title">Level</div><div class="hud-value" id="hud-level">1</div></div>
      <div class="hud-box"><div class="hud-title">Tijd</div><div class="hud-value" id="hud-time">0.0s</div></div>
      <div class="hud-box"><div class="hud-title">Saldo</div><div class="hud-value" id="hud-balance">...</div></div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn interactive" onclick="resetProgress()" style="background: #da3633;">Reset Level</button>
      <button class="btn btn-blue interactive" onclick="openShop()">Winkel 🛒</button>
    </div>
  </div>

  <!-- Multiplayer Panel -->
  <div id="multiplayer-panel" class="ui-layer hud-box interactive">
    <div class="hud-title">Ghost Multiplayer</div>
    <div style="font-size: 11px; color: #8b949e; margin-top: 2px;">Kamer ID: <span id="my-peer-id" style="color:#fff;">Laden...</span></div>
    <input type="text" id="join-peer-id" placeholder="Kamer ID plakken...">
    <button class="btn btn-blue" style="width: 100%;" onclick="connectToPeer()">Verbinden</button>
  </div>

  <!-- Leaderboard Panel -->
  <div id="leaderboard-panel" class="ui-layer hud-box">
    <div class="hud-title">Online Spelers</div>
    <ul id="leaderboard-list" style="list-style: none; font-size: 12px; margin-top: 6px;">
      <li>Jij (Lvl <span id="lb-my-lvl">1</span>)</li>
    </ul>
  </div>

  <!-- Shop Modal -->
  <div id="shop-modal" class="modal ui-layer interactive">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>ITLab Shop</h3>
      <button class="btn" onclick="closeShop()" style="padding: 2px 8px;">X</button>
    </div>

    <div class="shop-item">
      <div>
        <strong>Gouden Skin</strong>
        <div style="font-size: 10px; color: #8b949e;">Mooie gouden glans</div>
      </div>
      <button class="btn" id="btn-gold" onclick="buyPass('Gouden Skin')">Kopen</button>
    </div>

    <div class="shop-item">
      <div>
        <strong>Speed Boost</strong>
        <div style="font-size: 10px; color: #8b949e;">25% sneller rollen</div>
      </div>
      <button class="btn" id="btn-speed" onclick="buyPass('Speed Boost')">Kopen</button>
    </div>

    <!-- Sprong Pass (7 Tokens) -->
    <div class="shop-item">
      <div>
        <strong>Sprong (Spatiebalk)</strong>
        <div style="font-size: 10px; color: #8b949e;">Spring een klein beetje (7 Tokens)</div>
      </div>
      <button class="btn" id="btn-jump" onclick="buyPass('Sprong')">Kopen</button>
    </div>

    <!-- Hogere Sprong Pass (7 Tokens) - Zichtbaar pas nadat Sprong is gekocht -->
    <div class="shop-item" id="item-high-jump" style="display: none;">
      <div>
        <strong>Hogere Sprong</strong>
        <div style="font-size: 10px; color: #8b949e;">Spring nog hoger (7 Tokens)</div>
      </div>
      <button class="btn" id="btn-high-jump" onclick="buyPass('Hogere Sprong')">Kopen</button>
    </div>
  </div>

  <script>
    var currentLevel = 1;
    var speedMultiplier = 1.0;
    var canJump = false;
    var jumpPower = 0.0; // 0.28 = klein, 0.45 = hoger
    var isGrounded = false;

    /* ==========================================
       1. POSTMESSAGE COMMUNICATIE (ITLAB COMPLIANT)
       ========================================== */
    window.addEventListener('message', function(event) {
      var data = event.data;
      if (!data) return;

      if (data.type === 'INIT_DATA_RESPONSE') {
        if (data.balance !== undefined) {
          document.getElementById('hud-balance').innerText = data.balance + " 🪙";
        }
        
        // Skins & Upgrades checks
        if (data.hasGold) {
          applyGoldSkin();
          setButtonBought('btn-gold');
        }
        if (data.hasSpeed) {
          speedMultiplier = 1.25;
          setButtonBought('btn-speed');
        }

        // Jump Upgrades
        if (data.hasJump) {
          canJump = true;
          jumpPower = 0.28; // Kleine sprong
          setButtonBought('btn-jump');
          // Toon Hogere Sprong optie pas als Sprong bezeten is!
          document.getElementById('item-high-jump').style.display = 'flex';
        }

        if (data.hasHighJump) {
          canJump = true;
          jumpPower = 0.45; // Hogere sprong
          setButtonBought('btn-high-jump');
        }
      }

      if (data.type === 'LOAD_RESPONSE') {
        if (data.saveData && typeof data.saveData.level === 'number' && data.saveData.level > 0) {
          currentLevel = data.saveData.level;
        } else {
          currentLevel = 1;
        }
        updateHUD();
        initLevel(currentLevel);
      }

      if (data.type === 'BUY_RESPONSE') {
        if (data.result && data.result.ok) {
          alert("Aankoop geslaagd!");
          requestInitData();
        } else {
          alert("Fout bij aankoop: " + (data.result && data.result.error ? data.result.error : "Onvoldoende saldo"));
        }
      }
    });

    function setButtonBought(id) {
      var btn = document.getElementById(id);
      if (btn) { btn.innerText = "Gekocht ✓"; btn.disabled = true; }
    }

    function requestInitData() {
      window.parent.postMessage({ type: 'GET_INIT_DATA' }, '*');
    }

    function buyPass(passName) {
      window.parent.postMessage({ type: 'BUY_PASS', passName: passName }, '*');
    }

    function saveLevelProgress() {
      window.parent.postMessage({ type: 'SAVE_GAME', saveData: { level: currentLevel } }, '*');
      updateHUD();
    }

    function resetProgress() {
      if (confirm("Wil je echt terug naar Level 1?")) {
        currentLevel = 1;
        saveLevelProgress();
        initLevel(currentLevel);
      }
    }

    function updateHUD() {
      document.getElementById('hud-level').innerText = currentLevel;
      document.getElementById('lb-my-lvl').innerText = currentLevel;
    }

    /* ==========================================
       2. THREE.JS SCENE SETUP
       ========================================== */
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    scene.fog = new THREE.FogExp2(0x0d1117, 0.012);

    var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    var dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(20, 50, 20);
    scene.add(dirLight);

    var ballGeo = new THREE.SphereGeometry(1, 32, 32);
    var ballMat = new THREE.MeshStandardMaterial({ color: 0x58a6ff, roughness: 0.3, metalness: 0.1 });
    var playerBall = new THREE.Mesh(ballGeo, ballMat);
    scene.add(playerBall);

    var velocity = new THREE.Vector3();
    var levelPlatforms = [];
    var rotatingObstacles = [];
    var finishZone = null;
    var timer = 0, timerInterval = null, isPlaying = false;

    var keys = { Up: false, Down: false, Left: false, Right: false };

    window.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
      
      // Spatiebalk Sprong
      if (e.key === ' ' || e.code === 'Space') {
        if (canJump && isGrounded) {
          velocity.y = jumpPower;
          isGrounded = false;
        }
      }
    });

    window.addEventListener('keyup', function(e) {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
    });

    /* ==========================================
       3. GEBALANSEERDE & HAALBARE PARCOURS
       ========================================== */
    function clearLevel() {
      for (var i = 0; i < levelPlatforms.length; i++) scene.remove(levelPlatforms[i]);
      for (var i = 0; i < rotatingObstacles.length; i++) scene.remove(rotatingObstacles[i]);
      levelPlatforms = [];
      rotatingObstacles = [];
      if (finishZone) scene.remove(finishZone);
    }

    function createPlatform(x, y, z, w, h, d, color, rx, ry, rz) {
      var mat = new THREE.MeshStandardMaterial({ color: color || 0x21262d, roughness: 0.5 });
      var mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x, y, z);
      if (rx) mesh.rotation.x = rx;
      if (ry) mesh.rotation.y = ry;
      if (rz) mesh.rotation.z = rz;
      scene.add(mesh);
      levelPlatforms.push(mesh);
      return mesh;
    }

    function initLevel(lvl) {
      lvl = (typeof lvl === 'number' && lvl > 0) ? lvl : 1;
      clearLevel();

      playerBall.position.set(0, 3, 0);
      velocity.set(0, 0, 0);

      // Start Vlak
      createPlatform(0, 0, 0, 8, 1, 10, 0x30363d);
      var curZ = -10;

      if (lvl === 1) {
        // Level 1: Makkelijk & Haalbare schans
        createPlatform(0, -0.5, curZ - 8, 7, 1, 16, 0x21262d);
        curZ -= 18;
        // Schans
        createPlatform(0, 0, curZ - 4, 7, 0.8, 8, 0x1f6feb, -0.2, 0, 0);
        curZ -= 14; // Gat is verkleind naar 14 units (perfect haalbaar!)
        // Landingsbaan
        createPlatform(0, -2, curZ - 8, 8, 1, 16, 0x21262d);
        curZ -= 18;
      } 
      else if (lvl === 2) {
        // Level 2: Fijn gebalanceerde smalle strook
        createPlatform(0, -0.5, curZ - 6, 6, 1, 12, 0x21262d);
        curZ -= 14;
        // Verbrede balansbalk (2.6 breed i.p.v. 1.8)
        createPlatform(0, -0.5, curZ - 8, 2.6, 1, 16, 0xda3633);
        curZ -= 18;
        // Korte Schans
        createPlatform(0, 0, curZ - 4, 6, 0.8, 8, 0x1f6feb, -0.22, 0, 0);
        curZ -= 15;
        createPlatform(0, -2, curZ - 8, 7, 1, 16, 0x21262d);
        curZ -= 18;
      } 
      else {
        // Level 3+: Echte hindernissen & Roterende balken op goede afstand
        var sections = 2 + Math.min(lvl, 5);
        for (var i = 0; i < sections; i++) {
          var type = i % 3;
          if (type === 0) {
            createPlatform(0, -1, curZ - 10, 6, 1, 18, 0x21262d);
            var obs = new THREE.Mesh(new THREE.BoxGeometry(5, 1, 0.8), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
            obs.position.set(0, 0.5, curZ - 10);
            scene.add(obs);
            rotatingObstacles.push(obs);
            curZ -= 20;
          } else if (type === 1) {
            createPlatform(0, 0, curZ - 4, 6, 0.8, 8, 0x1f6feb, -0.25, 0, 0);
            curZ -= 16;
            createPlatform(0, -3, curZ - 6, 7, 1, 14, 0x21262d);
            curZ -= 14;
          } else {
            createPlatform(-2.5, -1.5, curZ - 6, 5, 1, 12, 0x30363d, 0, 0, 0.1);
            createPlatform(2.5, -1.5, curZ - 16, 5, 1, 12, 0x30363d, 0, 0, -0.1);
            curZ -= 24;
          }
        }
      }

      // Finish Zone
      var finishGeo = new THREE.CylinderGeometry(3, 3, 0.5, 32);
      var finishMat = new THREE.MeshBasicMaterial({ color: 0x2ea043, wireframe: true });
      finishZone = new THREE.Mesh(finishGeo, finishMat);
      finishZone.position.set(0, -1, curZ - 6);
      scene.add(finishZone);

      clearInterval(timerInterval);
      timer = 0;
      isPlaying = true;
      timerInterval = setInterval(function() {
        if (isPlaying) {
          timer += 0.1;
          document.getElementById('hud-time').innerText = timer.toFixed(1) + "s";
        }
      }, 100);

      updateHUD();
    }

    /* ==========================================
       4. GAME LOOP & MOVEMENT
       ========================================== */
    function animate() {
      requestAnimationFrame(animate);

      for (var i = 0; i < rotatingObstacles.length; i++) {
        rotatingObstacles[i].rotation.y += 0.025;
      }

      if (isPlaying) {
        var accel = 0.008 * speedMultiplier;

        if (keys.Up) velocity.z -= accel;
        if (keys.Down) velocity.z += accel;
        if (keys.Left) velocity.x -= accel;
        if (keys.Right) velocity.x += accel;

        // Uitrollen met traagheid
        velocity.x *= 0.985;
        velocity.z *= 0.985;
        velocity.y -= 0.02; // Zwaartekracht

        playerBall.position.add(velocity);

        playerBall.rotation.x += velocity.z * 0.4;
        playerBall.rotation.z -= velocity.x * 0.4;

        var pPos = playerBall.position;
        isGrounded = false;

        for (var i = 0; i < levelPlatforms.length; i++) {
          var plat = levelPlatforms[i];
          var box = new THREE.Box3().setFromObject(plat);

          if (pPos.x >= box.min.x - 0.6 && pPos.x <= box.max.x + 0.6 &&
              pPos.z >= box.min.z - 0.6 && pPos.z <= box.max.z + 0.6 &&
              pPos.y <= box.max.y + 1.1 && pPos.y >= box.min.y - 0.5) {
            
            if (velocity.y <= 0) {
              playerBall.position.y = box.max.y + 1;
              velocity.y = 0;
              isGrounded = true;
            }
            break;
          }
        }

        if (pPos.y < -20) {
          initLevel(currentLevel);
        }

        if (finishZone && pPos.distanceTo(finishZone.position) < 3.5) {
          isPlaying = false;
          currentLevel++;
          saveLevelProgress();
          alert("Gefeliciteerd! Level " + (currentLevel - 1) + " gehaald!");
          initLevel(currentLevel);
        }

        camera.position.x += (playerBall.position.x - camera.position.x) * 0.08;
        camera.position.y += (playerBall.position.y + 5 - camera.position.y) * 0.08;
        camera.position.z += (playerBall.position.z + 10 - camera.position.z) * 0.08;
        camera.lookAt(playerBall.position.x, playerBall.position.y + 0.5, playerBall.position.z);

        broadcastPosition();
      }

      renderer.render(scene, camera);
    }

    /* ==========================================
       5. PEERJS MULTIPLAYER
       ========================================== */
    var peer = new Peer(), connections = {}, ghostMeshes = {};
    peer.on('open', function(id) { document.getElementById('my-peer-id').innerText = id; });
    peer.on('connection', function(conn) { setupConn(conn); });

    function connectToPeer() {
      var id = document.getElementById('join-peer-id').value.trim();
      if (id) setupConn(peer.connect(id));
    }

    function setupConn(conn) {
      conn.on('open', function() {
        connections[conn.peer] = conn;
        var ghost = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({ color: 0xff4757, transparent: true, opacity: 0.5 }));
        scene.add(ghost);
        ghostMeshes[conn.peer] = ghost;

        conn.on('data', function(data) {
          if (data.type === 'pos' && ghostMeshes[conn.peer]) {
            ghostMeshes[conn.peer].position.set(data.x, data.y, data.z);
          }
        });
      });
    }

    function broadcastPosition() {
      var data = { type: 'pos', x: playerBall.position.x, y: playerBall.position.y, z: playerBall.position.z };
      for (var id in connections) {
        if (connections[id] && connections[id].open) connections[id].send(data);
      }
    }

    function applyGoldSkin() {
      ballMat.color.setHex(0xffd700);
      ballMat.metalness = 0.8;
      ballMat.roughness = 0.2;
    }

    function openShop() { requestInitData(); document.getElementById('shop-modal').style.display = 'flex'; }
    function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }

    initLevel(currentLevel);
    requestInitData();
    animate();

    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
