<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mattyou Cloud - Direct Bestand Messenger</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #252538;
            --accent-color: #89b4fa;
            --text-color: #cdd6f4;
            --danger-color: #f38ba8;
            --border-color: #45475a;
            --success-color: #a6e3a1;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .auth-screen {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 350px;
            margin: auto;
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .auth-screen h2 {
            margin-top: 0;
            color: var(--accent-color);
            text-align: center;
        }

        input[type="text"], input[type="password"] {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #11111b;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .auth-toggle {
            font-size: 0.85rem;
            text-align: center;
            color: #a6adc8;
            cursor: pointer;
        }

        .auth-toggle:hover { color: var(--accent-color); }

        .chat-layout {
            display: none;
            width: 100%;
            height: 100%;
        }

        .user-sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .user-sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-sidebar-header h3 {
            margin: 0;
            font-size: 1rem;
        }

        .user-list {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .user-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .user-item.active {
            background: rgba(137, 180, 250, 0.15);
            border-left: 4px solid var(--accent-color);
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-color);
            color: #11111b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.1);
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-bubble {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .message-bubble.other {
            background: var(--bg-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message-bubble.me {
            background: var(--accent-color);
            color: #11111b;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            font-weight: 500;
        }

        .msg-sender {
            font-size: 0.75rem;
            opacity: 0.7;
            display: block;
            margin-bottom: 2px;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
        }

        .no-chat-selected {
            margin: auto;
            color: #a6adc8;
            font-style: italic;
        }

        .btn-logout {
            background: var(--danger-color);
            color: #11111b;
            padding: 4px 8px;
            font-size: 0.75rem;
        }

        .status-msg {
            font-size: 0.85rem;
            color: var(--danger-color);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <div id="authScreen" class="auth-screen">
            <h2 id="authTitle">Inloggen</h2>
            <input type="text" id="authUsername" placeholder="Gebruikersnaam">
            <input type="password" id="authPassword" placeholder="Wachtwoord">
            <button onclick="handleAuth()" id="authBtn">Inloggen</button>
            <div class="status-msg" id="authError"></div>
            <div class="auth-toggle" onclick="toggleAuthMode()" id="authToggle">Nog geen account? Registreer hier</div>
        </div>

        <div id="chatLayout" class="chat-layout">
            
            <div class="user-sidebar">
                <div class="user-sidebar-header">
                    <div>
                        <strong id="myUsernameDisplay">@gebruiker</strong>
                    </div>
                    <button class="btn-logout" onclick="logout()">Uitloggen</button>
                </div>
                <ul class="user-list" id="userList">
                    </ul>
            </div>

            <div class="chat-main">
                <div class="chat-header" id="chatHeaderTitle">
                    Selecteer een account om te chatten
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="no-chat-selected">Klik links op een account om te chatten.</div>
                </div>

                <div class="chat-input-area" id="inputArea" style="display: none;">
                    <input type="text" id="msgInput" placeholder="Typ je bericht..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()">Verstuur</button>
                </div>
            </div>

        </div>

    </div>

    <script>
const API_KEY = 'sk_cacac16e_5k0j9snzzmx5yc2z1rf6rl';
const BASE_URL = 'https://qzqncoebdglqbivmlbla.supabase.co/functions/v1/api';

let isRegistering = false;
let currentUser = localStorage.getItem('chat_user') || null;
let activeChatPartner = null;
let chatInterval = null;

function toggleAuthMode() {
    isRegistering = !isRegistering;
    document.getElementById('authTitle').innerText = isRegistering ? 'Account Maken' : 'Inloggen';
    document.getElementById('authBtn').innerText = isRegistering ? 'Registreer' : 'Inloggen';
    document.getElementById('authToggle').innerText = isRegistering ? 'Al een account? Log in' : 'Nog geen account? Registreer hier';
    document.getElementById('authError').innerText = '';
}

// --- AUTHENTICATIE ---

async function handleAuth() {
    const username = document.getElementById('authUsername').value.trim().toLowerCase();
    const password = document.getElementById('authPassword').value.trim();
    const errorDiv = document.getElementById('authError');

    if (!username || !password) {
        errorDiv.innerText = 'Vul alle velden in!';
        return;
    }

    errorDiv.innerText = 'Laden...';
    const accountFilename = `account-${username}.txt`;

    try {
        const fileId = await getFileIdByName(accountFilename);

        if (isRegistering) {
            if (fileId) {
                errorDiv.innerText = 'Account bestaat al!';
                return;
            }
            
            const fileContent = `username: ${username}\npassword: ${password}`;
            await uploadCloudFile(accountFilename, fileContent);
            loginUser(username);

        } else {
            if (!fileId) {
                errorDiv.innerText = 'Account bestaat niet!';
                return;
            }

            const response = await fetch(`${BASE_URL}/files/${fileId}/download?key=${API_KEY}`);
            const content = await response.text();
            
            let savedPassword = '';
            content.split('\n').forEach(line => {
                if (line.startsWith('password:')) {
                    savedPassword = line.replace('password:', '').trim();
                }
            });

            if (savedPassword === password) {
                loginUser(username);
            } else {
                errorDiv.innerText = 'Onjuist wachtwoord!';
            }
        }
    } catch (err) {
        console.error(err);
        errorDiv.innerText = 'Fout bij netwerk / authenticatie.';
    }
}

function loginUser(username) {
    currentUser = username;
    localStorage.setItem('chat_user', username);
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('chatLayout').style.display = 'flex';
    document.getElementById('myUsernameDisplay').innerText = `@${username}`;

    loadUserAccounts();
    setInterval(loadUserAccounts, 4000);
}

function logout() {
    localStorage.removeItem('chat_user');
    location.reload();
}

// --- HULPFUNCTIE: HAAL REAL FILE ID OP VIA DE BESTANDSNAAM ---

async function getFileIdByName(targetName) {
    try {
        const response = await fetch(`${BASE_URL}/files?key=${API_KEY}`);
        if (!response.ok) return null;

        const raw = await response.json();
        const files = Array.isArray(raw) ? raw : (raw.data || raw.files || []);

        for (let f of files) {
            let fname = f.filename || f.name || f.file_name || f.title || '';
            fname = decodeURIComponent(fname);
            if (fname === targetName) {
                return f.id || f.file_id || fname;
            }
        }
    } catch (e) {
        console.error(e);
    }
    return null;
}

async function uploadCloudFile(filename, textContent) {
    const blob = new Blob([textContent], { type: 'text/plain' });
    const formData = new FormData();
    formData.append('file', blob, filename);

    await fetch(`${BASE_URL}/files/upload?key=${API_KEY}`, {
        method: 'POST',
        body: formData
    });
}

// --- GEBRUIKERS OPHALEN ---

async function loadUserAccounts() {
    try {
        const response = await fetch(`${BASE_URL}/files?key=${API_KEY}`);
        if (!response.ok) return;

        const rawResult = await response.json();
        let files = Array.isArray(rawResult) ? rawResult : (rawResult.data || rawResult.files || []);

        const userList = document.getElementById('userList');
        userList.innerHTML = '';

        let foundUsers = 0;

        files.forEach(f => {
            let fname = f.filename || f.name || f.file_name || f.title || '';
            fname = decodeURIComponent(fname);

            if ((fname.startsWith('account-') || fname.startsWith('account:')) && fname.endsWith('.txt')) {
                const accountName = fname.replace('account-', '').replace('account:', '').replace('.txt', '');

                if (accountName === currentUser) return;

                foundUsers++;

                const li = document.createElement('li');
                li.className = `user-item ${activeChatPartner === accountName ? 'active' : ''}`;
                li.onclick = () => openChatWith(accountName);

                li.innerHTML = `
                    <div class="avatar">${accountName.charAt(0).toUpperCase()}</div>
                    <div><strong>@${accountName}</strong></div>
                `;
                userList.appendChild(li);
            }
        });

        if (foundUsers === 0) {
            userList.innerHTML = '<li style="padding: 15px; color: #a6adc8; font-size: 0.85rem; text-align: center;">Geen andere accounts gevonden</li>';
        }
    } catch (err) {
        console.error('Fout bij ophalen accounts:', err);
    }
}

// --- BERICHTEN VERWERKEN EN TONEN ---

function getChatFilename(user1, user2) {
    const sorted = [user1, user2].sort();
    return `${sorted[0]}-${sorted[1]}(chat).txt`;
}

function openChatWith(targetUser) {
    activeChatPartner = targetUser;
    document.getElementById('chatHeaderTitle').innerText = `💬 Chat met @${targetUser}`;
    document.getElementById('inputArea').style.display = 'flex';

    loadUserAccounts();

    if (chatInterval) clearInterval(chatInterval);
    loadMessages();
    chatInterval = setInterval(loadMessages, 2000);
}

async function loadMessages() {
    if (!activeChatPartner) return;

    const filename = getChatFilename(currentUser, activeChatPartner);
    const chatBox = document.getElementById('chatMessages');

    try {
        const fileId = await getFileIdByName(filename);
        if (!fileId) {
            chatBox.innerHTML = '<div class="no-chat-selected">Nog geen berichten. Stuur het eerste bericht!</div>';
            return;
        }

        const response = await fetch(`${BASE_URL}/files/${fileId}/download?key=${API_KEY}`);
        if (!response.ok) return;

        const text = await response.text();
        const lines = text.split('\n').filter(line => line.trim() !== '');

        chatBox.innerHTML = '';

        lines.forEach(line => {
            const colonIndex = line.indexOf(':');
            if (colonIndex !== -1) {
                const sender = line.substring(0, colonIndex).trim();
                const msgText = line.substring(colonIndex + 1).trim();

                const isMe = sender === currentUser;
                appendMessageToUI(sender, msgText, isMe);
            }
        });

        chatBox.scrollTop = chatBox.scrollHeight;
    } catch (err) {
        console.error('Fout bij laden van berichten:', err);
    }
}

function appendMessageToUI(sender, text, isMe) {
    const chatBox = document.getElementById('chatMessages');
    
    // Verwijder 'geen berichten' melding als die er staat
    const noChat = chatBox.querySelector('.no-chat-selected');
    if (noChat) noChat.remove();

    const div = document.createElement('div');
    div.className = `message-bubble ${isMe ? 'me' : 'other'}`;
    div.innerHTML = `<span class="msg-sender">${isMe ? 'Jij' : '@' + sender}</span>${escapeHtml(text)}`;
    chatBox.appendChild(div);
    
    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();

    if (!text || !activeChatPartner) return;

    input.value = '';
    
    // 1. Toon het bericht MUTEEL op je eigen scherm direct
    appendMessageToUI(currentUser, text, true);

    const filename = getChatFilename(currentUser, activeChatPartner);

    try {
        // 2. Haal bestaande inhoud op uit cloud
        let currentContent = '';
        const fileId = await getFileIdByName(filename);

        if (fileId) {
            const response = await fetch(`${BASE_URL}/files/${fileId}/download?key=${API_KEY}`);
            if (response.ok) {
                currentContent = await response.text();
                if (currentContent && !currentContent.endsWith('\n')) {
                    currentContent += '\n';
                }
            }
        }

        // 3. Bouw de nieuwe inhoud op
        const newContent = currentContent + `${currentUser}:${text}\n`;

        // 4. Upload de nieuwe versie van het chatbestand naar de cloud
        await uploadCloudFile(filename, newContent);

    } catch (err) {
        console.error('Fout bij versturen van bericht:', err);
    }
}

function handleKeyPress(e) {
    if (e.key === 'Enter') sendMessage();
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

window.onload = () => {
    if (currentUser) {
        loginUser(currentUser);
    }
};
    </script>
</body>
</html>
