<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Domainport · Basic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0B1220;
    --bg-elev:#121B2E;
    --bg-elev-2:#182338;
    --bg-elev-3:#1F2C48;
    --text:#E8ECF3;
    --text-dim:#8B96AE;
    --text-dimmer:#5D6883;
    --accent:#4FD1C5;
    --accent-dim:#2C9C90;
    --accent-glow: rgba(79,209,197,0.35);
    --warn:#F0A868;
    --danger:#E8697A;
    --danger-dim:#B44B5A;
    --border:#263252;
    --border-soft:#1B2540;
    --radius:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(79,209,197,0.08), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(240,168,104,0.05), transparent 35%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:var(--font-body);cursor:pointer;}
  ::selection{background:var(--accent-glow);}
  input,textarea,select{
    font-family:var(--font-body);
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,textarea:focus,select:focus{
    border-color:var(--accent-dim);
    box-shadow:0 0 0 3px rgba(79,209,197,0.15);
  }
  code, .mono{font-family:var(--font-mono);}

  /* ---------- layout ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .container{max-width:920px;margin:0 auto;padding:0 24px;width:100%;}

  .navbar{
    border-bottom:1px solid var(--border-soft);
    background:rgba(11,18,32,0.85);
    backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:50;
  }
  .navbar-inner{
    max-width:920px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.2px;cursor:pointer;user-select:none;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);flex-shrink:0;}
  .brand small{font-family:var(--font-mono);font-weight:400;font-size:11px;color:var(--text-dimmer);margin-left:2px;}
  .nav-links{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .nav-link{
    font-size:13.5px;color:var(--text-dim);padding:7px 11px;border-radius:7px;border:1px solid transparent;
    background:transparent;transition:all .15s ease;
  }
  .nav-link:hover{color:var(--text);background:var(--bg-elev-2);}
  .nav-link.active{color:var(--accent);background:rgba(79,209,197,0.08);border-color:rgba(79,209,197,0.25);}
  .nav-link.admin{color:var(--warn);}
  .btn{
    font-size:13.5px;padding:8px 14px;border-radius:7px;border:1px solid var(--border);
    background:var(--bg-elev-2);color:var(--text);font-weight:500;transition:all .15s ease;
  }
  .btn:hover{border-color:var(--text-dimmer);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#08201D;font-weight:600;}
  .btn-accent:hover{background:#5FE0D4;box-shadow:0 0 0 3px var(--accent-glow);}
  .btn-danger{background:transparent;border-color:var(--danger-dim);color:var(--danger);}
  .btn-danger:hover{background:rgba(232,105,122,0.1);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
  .btn-ghost:hover{color:var(--text);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-sm{padding:5px 10px;font-size:12.5px;}

  main{flex:1;padding:48px 24px 80px;}
  footer{border-top:1px solid var(--border-soft);padding:22px 24px;text-align:center;color:var(--text-dimmer);font-size:12.5px;}
  footer a{color:var(--text-dim);text-decoration:underline;text-underline-offset:2px;}

  /* ---------- home / hero ---------- */
  .hero{max-width:720px;margin:0 auto;text-align:center;}
  .hero-eyebrow{
    display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:12px;color:var(--accent);
    background:rgba(79,209,197,0.08);border:1px solid rgba(79,209,197,0.25);padding:5px 12px;border-radius:20px;margin-bottom:22px;
  }
  .hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .hero h1{font-family:var(--font-display);font-size:44px;line-height:1.12;margin:0 0 14px;font-weight:700;letter-spacing:-.5px;}
  .hero p{color:var(--text-dim);font-size:16px;line-height:1.6;max-width:520px;margin:0 auto 34px;}

  .search-bar{
    display:flex;align-items:center;gap:0;background:var(--bg-elev);border:1px solid var(--border);
    border-radius:10px;padding:4px 4px 4px 16px;max-width:520px;margin:0 auto;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);transition:border-color .15s ease;
  }
  .search-bar:focus-within{border-color:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-glow);}
  .search-bar .prompt{font-family:var(--font-mono);color:var(--accent);font-size:15px;}
  .search-bar input{flex:1;background:transparent;border:none;font-family:var(--font-mono);font-size:15px;padding:12px 8px;}
  .search-bar input:focus{box-shadow:none;}
  .search-bar button{white-space:nowrap;}

  .search-hint{margin-top:12px;font-size:12.5px;color:var(--text-dimmer);font-family:var(--font-mono);}

  .stat-row{display:flex;justify-content:center;gap:36px;margin-top:56px;flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat .num{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--accent);}
  .stat .lbl{font-size:12px;color:var(--text-dimmer);margin-top:2px;font-family:var(--font-mono);}

  .feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:820px;margin:70px auto 0;}
  .feature-card{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;}
  .feature-card .ico{width:30px;height:30px;border-radius:8px;background:rgba(79,209,197,0.1);display:flex;align-items:center;justify-content:center;color:var(--accent);margin-bottom:12px;font-family:var(--font-mono);font-weight:600;}
  .feature-card h3{font-family:var(--font-display);font-size:15px;margin:0 0 6px;font-weight:600;}
  .feature-card p{font-size:13px;color:var(--text-dim);line-height:1.55;margin:0;}

  /* ---------- panels / cards ---------- */
  .panel{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:22px;margin-bottom:18px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .panel-head h2{font-family:var(--font-display);font-size:17px;margin:0;font-weight:600;display:flex;align-items:center;gap:9px;}
  .badge{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);background:var(--bg-elev-2);border:1px solid var(--border);padding:2px 8px;border-radius:20px;}
  .badge.warn{color:var(--warn);border-color:rgba(240,168,104,0.35);background:rgba(240,168,104,0.08);}
  .badge.ok{color:var(--accent);border-color:rgba(79,209,197,0.3);background:rgba(79,209,197,0.08);}

  .row-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 14px;border:1px solid var(--border-soft);border-radius:8px;background:var(--bg-elev-2);
    margin-bottom:9px;flex-wrap:wrap;
  }
  .row-item .left{display:flex;align-items:center;gap:10px;min-width:0;}
  .port-light{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--text-dimmer);}
  .port-light.on{background:var(--accent);box-shadow:0 0 8px var(--accent-glow);}
  .row-item .name{font-family:var(--font-mono);font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-item .sub{font-size:11.5px;color:var(--text-dimmer);margin-top:2px;}
  .row-item .actions{display:flex;gap:6px;flex-wrap:wrap;}
  .empty-state{text-align:center;padding:30px 10px;color:var(--text-dimmer);font-size:13.5px;}
  .empty-state .big{font-size:26px;margin-bottom:6px;}

  form.inline-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  form.inline-form input, form.inline-form select{flex:1;min-width:160px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
  .field input, .field textarea, .field select{width:100%;}
  .field .help{font-size:11.5px;color:var(--text-dimmer);margin-top:5px;}

  .message{padding:11px 14px;border-radius:8px;font-size:13.5px;margin-bottom:16px;border:1px solid;}
  .message.error{background:rgba(232,105,122,0.08);border-color:rgba(232,105,122,0.3);color:#F5A5B0;}
  .message.success{background:rgba(79,209,197,0.08);border-color:rgba(79,209,197,0.3);color:var(--accent);}
  .message.info{background:rgba(240,168,104,0.08);border-color:rgba(240,168,104,0.3);color:var(--warn);}

  .tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--border-soft);}
  .tab{padding:9px 4px;margin-right:20px;font-size:13.5px;color:var(--text-dim);border-bottom:2px solid transparent;font-weight:500;}
  .tab.active{color:var(--text);border-color:var(--accent);}

  /* ---------- auth ---------- */
  .auth-box{max-width:380px;margin:20px auto;}
  .auth-switch{display:flex;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:8px;padding:3px;margin-bottom:22px;}
  .auth-switch button{flex:1;background:transparent;border:none;padding:8px;border-radius:6px;color:var(--text-dim);font-size:13.5px;font-weight:500;}
  .auth-switch button.active{background:var(--bg-elev-3);color:var(--text);}

  /* ---------- editor ---------- */
  .editor-layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start;}
  .file-list{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:10px;}
  .file-item{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:8px 9px;border-radius:6px;font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);
    cursor:pointer;margin-bottom:2px;
  }
  .file-item:hover{background:var(--bg-elev-2);}
  .file-item.active{background:rgba(79,209,197,0.1);color:var(--accent);}
  .file-item .del{opacity:0;color:var(--danger);font-size:14px;}
  .file-item:hover .del{opacity:1;}
  .editor-main textarea{
    width:100%;min-height:340px;font-family:var(--font-mono);font-size:13px;line-height:1.55;resize:vertical;
  }
  .preview-frame{width:100%;height:420px;border:1px solid var(--border-soft);border-radius:8px;background:#fff;margin-top:14px;}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
  .toolbar .spacer{flex:1;}

  /* ---------- site viewer ---------- */
  .viewer-bar{
    display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--bg-elev);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:40;
  }
  .viewer-bar .url{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);}
  .viewer-frame{width:100%;height:calc(100vh - 49px);border:none;background:#fff;}

  .terms-list{padding-left:0;list-style:none;}
  .terms-list li{padding:12px 0;border-bottom:1px solid var(--border-soft);font-size:14px;color:var(--text-dim);line-height:1.6;display:flex;gap:12px;}
  .terms-list li b{color:var(--text);}
  .terms-num{font-family:var(--font-mono);color:var(--accent);flex-shrink:0;}

  .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .center-loading{display:flex;justify-content:center;padding:60px 0;}

  @media (max-width: 640px){
    .hero h1{font-size:32px;}
    .feature-grid{grid-template-columns:1fr;}
    .editor-layout{grid-template-columns:1fr;}
    .navbar-inner{flex-direction:column;align-items:flex-start;gap:10px;}
    .nav-links{width:100%;justify-content:flex-start;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";
  const SUPABASE_URL = "https://puljajfgjyzipgdrvioy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1bGphamZnanl6aXBnZHJ2aW95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNjU1NDUsImV4cCI6MjA5OTk0MTU0NX0.F9r4TxzjfOLieUaslnvG8cwgKPlEjSrWEPCHM2miJtU";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const state = {
    session: null,
    profile: null,
    view: "home",
    authMode: "login",
    websites: [],
    domains: [],
    currentWebsiteId: null,
    currentFiles: [],
    currentPath: null,
    draftContent: "",
    draftIsNew: false,
    newFilePath: "",
    siteViewer: null,
    adminData: null,
    adminTab: "domains",
    loading: false,
    message: null,
    booting: true,
  };

  const app = document.getElementById("app");

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function setMsg(type, text){ state.message = {type, text}; render(); }
  function clearMsg(){ state.message = null; }
  function go(view){ clearMsg(); state.view = view; render(); window.scrollTo(0,0); }

  function mimeFromPath(path){
    const ext = (path.split(".").pop() || "").toLowerCase();
    const map = {
      html:"text/html", htm:"text/html", css:"text/css", js:"application/javascript",
      json:"application/json", svg:"image/svg+xml", txt:"text/plain", md:"text/markdown",
      xml:"application/xml"
    };
    return map[ext] || "text/plain";
  }

  // ---------------- AUTH ----------------
  async function refreshSession(){
    const { data } = await sb.auth.getSession();
    state.session = data.session;
    if (state.session){
      const { data: prof } = await sb.from("v2_profiles").select("*").eq("id", state.session.user.id).maybeSingle();
      state.profile = prof || null;
    } else {
      state.profile = null;
    }
  }

  sb.auth.onAuthStateChange(async (_event, session) => {
    state.session = session;
    if (session){
      const { data: prof } = await sb.from("v2_profiles").select("*").eq("id", session.user.id).maybeSingle();
      state.profile = prof || null;
    } else {
      state.profile = null;
    }
    render();
  });

  async function doRegister(email, password){
    clearMsg();
    if (!email || !password || password.length < 6){
      setMsg("error", "Vul een e-mailadres in en een wachtwoord van minstens 6 tekens.");
      return;
    }
    state.loading = true; render();
    const { data, error } = await sb.auth.signUp({ email, password });
    state.loading = false;
    if (error){ setMsg("error", error.message); return; }
    if (data.session){
      await refreshSession();
      setMsg("success", "Account aangemaakt. Welkom!");
      go("dashboard");
    } else {
      setMsg("info", "Account aangemaakt. Check je e-mail om je account te bevestigen, log daarna in.");
      state.authMode = "login";
      render();
    }
  }

  async function doLogin(email, password){
    clearMsg();
    state.loading = true; render();
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    state.loading = false;
    if (error){ setMsg("error", error.message === "Invalid login credentials" ? "Onjuiste inloggegevens." : error.message); return; }
    state.session = data.session;
    await refreshSession();
    setMsg("success", "Ingelogd.");
    go("dashboard");
  }

  async function doLogout(){
    await sb.auth.signOut();
    state.session = null; state.profile = null; state.websites = []; state.domains = [];
    go("home");
  }

  // ---------------- DATA LOADING ----------------
  async function loadDashboardData(){
    if (!state.session) return;
    state.loading = true; render();
    const uid = state.session.user.id;
    const [{ data: sites }, { data: doms }] = await Promise.all([
      sb.from("v2_websites").select("*").eq("owner_id", uid).order("created_at"),
      sb.from("v2_domains").select("*").eq("owner_id", uid).order("created_at"),
    ]);
    state.websites = sites || [];
    state.domains = doms || [];
    state.loading = false; render();
  }

  async function createWebsite(name, slug){
    clearMsg();
    if (!slug || !/^[a-z0-9]([a-z0-9-]{0,48}[a-z0-9])?$/.test(slug)){
      setMsg("error", "Ongeldige slug. Gebruik alleen kleine letters, cijfers en koppeltekens.");
      return;
    }
    state.loading = true; render();
    const { error } = await sb.from("v2_websites").insert({
      owner_id: state.session.user.id,
      name: name || "Naamloze website",
      slug,
    });
    state.loading = false;
    if (error){ setMsg("error", error.message.includes("Limiet") ? error.message : (error.message.includes("duplicate") ? "Deze slug is al in gebruik." : error.message)); return; }
    setMsg("success", "Website aangemaakt.");
    await loadDashboardData();
  }

  async function deleteWebsite(id){
    if (!confirm("Deze website en alle bestanden verwijderen?")) return;
    state.loading = true; render();
    const { error } = await sb.from("v2_websites").delete().eq("id", id);
    state.loading = false;
    if (error){ setMsg("error", error.message); return; }
    setMsg("success", "Website verwijderd.");
    await loadDashboardData();
  }

  async function createDomain(name){
    clearMsg();
    const clean = (name || "").trim().toLowerCase();
    if (!/^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$/.test(clean)){
      setMsg("error", "Ongeldige domeinnaam. Gebruik alleen kleine letters, cijfers en koppeltekens (geen puntjes nodig).");
      return;
    }
    state.loading = true; render();
    const { data: blocked } = await sb.from("v2_domain_blocklist").select("word").eq("word", clean).maybeSingle();
    if (blocked){
      state.loading = false;
      setMsg("error", "Deze domeinnaam is gereserveerd en niet beschikbaar.");
      return;
    }
    const { error } = await sb.from("v2_domains").insert({
      owner_id: state.session.user.id,
      domain_name: clean,
    });
    state.loading = false;
    if (error){ setMsg("error", error.message.includes("Limiet") ? error.message : (error.message.includes("duplicate") ? "Dit domein is al bezet." : error.message)); return; }
    setMsg("success", "Domein aangemaakt.");
    await loadDashboardData();
  }

  async function deleteDomain(id){
    if (!confirm("Dit domein verwijderen?")) return;
    state.loading = true; render();
    const { error } = await sb.from("v2_domains").delete().eq("id", id);
    state.loading = false;
    if (error){ setMsg("error", error.message); return; }
    setMsg("success", "Domein verwijderd.");
    await loadDashboardData();
  }

  async function updateDomain(id, patch){
    state.loading = true; render();
    const { error } = await sb.from("v2_domains").update(patch).eq("id", id);
    state.loading = false;
    if (error){ setMsg("error", error.message); return; }
    await loadDashboardData();
  }

  async function openWebsiteEditor(id){
    clearMsg();
    state.currentWebsiteId = id;
    state.currentPath = null;
    state.loading = true; state.view = "editor"; render();
    const { data, error } = await sb.from("v2_website_files").select("*").eq("website_id", id).order("file_path");
    state.loading = false;
    if (error){ setMsg("error", error.message); }
    state.currentFiles = data || [];
    render();
  }

  function selectFile(path){
    const f = state.currentFiles.find(f => f.file_path === path);
    state.currentPath = path;
    state.draftContent = f ? f.content : "";
    state.draftIsNew = false;
    render();
  }

  function startNewFile(){
    state.currentPath = null;
    state.draftContent = "";
    state.draftIsNew = true;
    state.newFilePath = "";
    render();
  }

  async function saveCurrentFile(){
    clearMsg();
    const path = state.draftIsNew ? state.newFilePath.trim().replace(/^\/+/, "") : state.currentPath;
    if (!path || path.includes("..")){
      setMsg("error", "Ongeldig bestandspad.");
      return;
    }
    state.loading = true; render();
    const { error } = await sb.from("v2_website_files").upsert({
      website_id: state.currentWebsiteId,
      file_path: path,
      content: state.draftContent,
      mime_type: mimeFromPath(path),
      updated_at: new Date().toISOString(),
    }, { onConflict: "website_id,file_path" });
    state.loading = false;
    if (error){ setMsg("error", error.message); return; }
    setMsg("success", "Bestand opgeslagen: " + path);
    state.draftIsNew = false;
    state.currentPath = path;
    const { data } = await sb.from("v2_website_files").select("*").eq("website_id", state.currentWebsiteId).order("file_path");
    state.currentFiles = data || [];
    render();
  }

  async function deleteFile(id, path){
    if (!confirm("Bestand '" + path + "' verwijderen?")) return;
    state.loading = true; render();
    const { error } = await sb.from("v2_website_files").delete().eq("id", id);

    state.currentFiles = data || [];
    render();
  }

  // ---------------- PREVIEW ENGINE (cross-file linking) ----------------
  function buildFileMap(files){
    const map = {};
    files.forEach(f => { map[f.file_path] = f; });
    return map;
  }

  function resolvePath(basePath, rel){
    if (/^(https?:)?\/\//i.test(rel) || rel.startsWith("data:") || rel.startsWith("#") || rel.startsWith("mailto:")) return null;
    const baseParts = basePath.split("/"); baseParts.pop();
    const relParts = rel.split("/");
    const stack = baseParts.slice();
    for (const part of relParts){
      if (part === "." || part === "") continue;
      if (part === "..") stack.pop();
      else stack.push(part);
    }
    return stack.join("/");
  }

  function renderHtmlWithAssets(path, fileMap, blobCache, visited){
    if (blobCache[path]) return blobCache[path];
    if (visited.has(path)) return null;
    visited.add(path);
    const file = fileMap[path];
    if (!file) return null;
    let html = file.content;

    const attrRegex = /((?:src|href)\s*=\s*)(["'])(.*?)\2/gi;
    html = html.replace(attrRegex, (match, prefix, quote, val) => {
      const resolved = resolvePath(path, val);
      if (!resolved || !fileMap[resolved]) return match;
      let assetUrl;
      if (mimeFromPath(resolved) === "text/html"){
        assetUrl = renderHtmlWithAssets(resolved, fileMap, blobCache, visited);
      } else {
        assetUrl = blobUrlFor(resolved, fileMap, blobCache);
      }
      if (!assetUrl) return match;
      return prefix + quote + assetUrl + quote;
    });

    html = html.replace(/url\((["']?)(.*?)\1\)/gi, (match, quote, val) => {
      const resolved = resolvePath(path, val);
      if (!resolved || !fileMap[resolved]) return match;
      const assetUrl = blobUrlFor(resolved, fileMap, blobCache);
      return assetUrl ? "url(" + quote + assetUrl + quote + ")" : match;
    });

    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    blobCache[path] = url;
    return url;
  }

  function blobUrlFor(path, fileMap, blobCache){
    if (blobCache[path]) return blobCache[path];
    const file = fileMap[path];
    if (!file) return null;
    const blob = new Blob([file.content], { type: mimeFromPath(path) });
    const url = URL.createObjectURL(blob);
    blobCache[path] = url;
    return url;
  }

  function buildPreviewUrl(files){
    const fileMap = buildFileMap(files);
    if (!fileMap["index.html"]){
      return null;
    }
    const blobCache = {};
    return renderHtmlWithAssets("index.html", fileMap, blobCache, new Set());
  }

  // ---------------- DOMAIN SEARCH / VIEWER ----------------
  async function searchDomain(name){
    clearMsg();
    const clean = (name || "").trim().toLowerCase();
    if (!clean){ setMsg("error", "Typ eerst een domeinnaam in."); return; }
    state.loading = true; render();
    const { data: dom } = await sb.from("v2_domains").select("*").eq("domain_name", clean).maybeSingle();
    if (!dom){
      state.loading = false;
      setMsg("error", "Domein '" + clean + "' bestaat niet op dit platform.");
      return;
    }
    if (!dom.is_published || !dom.website_id){
      state.loading = false;
      setMsg("info", "Domein '" + clean + "' bestaat, maar is (nog) niet gepubliceerd door de eigenaar.");
      return;
    }
    const { data: files } = await sb.from("v2_website_files").select("*").eq("website_id", dom.website_id);
    state.loading = false;
    if (!files || !files.length){
      setMsg("error", "Deze website heeft nog geen bestanden.");
      return;
    }
    const url = buildPreviewUrl(files);
    if (!url){
      setMsg("error", "Deze website heeft geen index.html en kan niet worden weergegeven.");
      return;
    }
    state.siteViewer = { domain: clean, url };
    state.view = "site";
    render();
  }

      case "home": body = HomeView(); break;
      case "auth": body = AuthView(); break;
      case "dashboard": body = state.loading && !state.websites.length ? `<div class="center-loading"><span class="spinner"></span></div>` : DashboardView(); break;
      case "editor": body = EditorView(); break;
      case "admin": body = AdminView(); break;
      case "terms": body = TermsView(); break;
      default: body = HomeView();
    }
    app.innerHTML = `
      ${Navbar()}
      <main><div class="container">${body}</div></main>
      <footer>Domainport · Basic — systeem 2, los van het hoofdplatform. · <a onclick="Domainport.go('terms')">Voorwaarden</a> · beheerd door de site-admin</footer>
    `;
    if (state.view === "editor"){
      setTimeout(refreshPreviewFrame, 0);
    }
  }

  function refreshPreviewFrame(){
    const frame = document.getElementById("previewFrame");
    if (!frame) return;
    const url = buildPreviewUrl(state.currentFiles);
    frame.srcdoc = "";
    if (url){
      frame.src = url;
    } else {
      frame.srcdoc = "<div style='font-family:sans-serif;padding:20px;color:#888;'>Geen index.html gevonden. Maak een bestand met pad <b>index.html</b> aan.</div>";
    }
  }

  // ---------------- PUBLIC API (bound to window) ----------------
  window.Domainport = {
    go, goDashboard: async () => { go("dashboard"); await loadDashboardData(); },
    goAdmin: async () => { go("admin"); await loadAdminData(); },
    goAuth: (mode) => { state.authMode = mode; go("auth"); },
    adminTab: (tab) => { state.adminTab = tab; render(); },
    logout: doLogout,
    submitAuth: () => {
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      if (state.authMode === "login") doLogin(email, password);
      else doRegister(email, password);
    },
    search: (val) => searchDomain(val),
    closeViewer: () => { if (state.siteViewer) URL.revokeObjectURL(state.siteViewer.url); state.siteViewer = null; go("home"); },
    createWebsite: () => {
      const name = document.getElementById("newSiteName").value.trim();
      const slug = document.getElementById("newSiteSlug").value.trim().toLowerCase();
      createWebsite(name, slug);
    },
    deleteWebsite,
    createDomain: () => { const v = document.getElementById("newDomainName").value; createDomain(v); },
    deleteDomain,
    linkDomain: (domainId, websiteId) => updateDomain(domainId, { website_id: websiteId || null }),
    togglePublish: (id, current) => updateDomain(id, { is_published: !current }),
    openEditor: openWebsiteEditor,
    selectFile,
    startNewFile,
    setDraft: (v) => { state.draftContent = v; },
    setNewPath: (v) => { state.newFilePath = v; },
    saveFile: saveCurrentFile,
    deleteFile,
    refreshPreview: refreshPreviewFrame,
    adminDelDomain: adminDeleteDomain,
    adminDelWebsite: adminDeleteWebsite,
    adminToggle: adminTogglePublish,
  };

  // ---------------- BOOT ----------------
  (async function boot(){
    await refreshSession();
    state.booting = false;
    if (state.session){
      go("dashboard");
      await loadDashboardData();
    } else {
      render();
    }
  })();
})();
</script>
</body>
</html>
