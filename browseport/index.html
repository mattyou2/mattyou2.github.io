<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BrowsePort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0B1220; --bg-elev:#121B2E; --bg-elev-2:#182338; --bg-elev-3:#1F2C48;
    --text:#E8ECF3; --text-dim:#8B96AE; --text-dimmer:#5D6883;
    --accent:#4FD1C5; --accent-dim:#2C9C90; --accent-glow: rgba(79,209,197,0.35);
    --warn:#F0A868; --danger:#E8697A; --danger-dim:#B44B5A;
    --border:#263252; --border-soft:#1B2540; --radius:10px;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(79,209,197,0.08), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(240,168,104,0.05), transparent 35%), var(--bg);
    color:var(--text); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;} button{font-family:var(--font-body);cursor:pointer;} ::selection{background:var(--accent-glow);}
  input,textarea,select{
    font-family:var(--font-body); background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:10px 12px; font-size:14px; outline:none; transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,textarea:focus,select:focus{ border-color:var(--accent-dim); box-shadow:0 0 0 3px rgba(79,209,197,0.15); }
  code, .mono{font-family:var(--font-mono);}

  #app{min-height:100vh;display:flex;flex-direction:column;}
  .container{max-width:960px;margin:0 auto;padding:0 24px;width:100%;}

  .navbar{ border-bottom:1px solid var(--border-soft); background:rgba(11,18,32,0.85); backdrop-filter:blur(8px); position:sticky;top:0;z-index:50; }
  .navbar-inner{ max-width:960px;margin:0 auto;padding:14px 24px; display:flex;align-items:center;justify-content:space-between;gap:16px; }
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.2px;cursor:pointer;user-select:none;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);flex-shrink:0;}
  .nav-links{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .nav-link{ font-size:13.5px;color:var(--text-dim);padding:7px 11px;border-radius:7px;border:1px solid transparent; background:transparent;transition:all .15s ease; }
  .nav-link:hover{color:var(--text);background:var(--bg-elev-2);}
  .nav-link.active{color:var(--accent);background:rgba(79,209,197,0.08);border-color:rgba(79,209,197,0.25);}
  .nav-link.admin{color:var(--warn);}
  .btn{ font-size:13.5px;padding:8px 14px;border-radius:7px;border:1px solid var(--border); background:var(--bg-elev-2);color:var(--text);font-weight:500;transition:all .15s ease; }
  .btn:hover{border-color:var(--text-dimmer);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#08201D;font-weight:600;}
  .btn-accent:hover{background:#5FE0D4;box-shadow:0 0 0 3px var(--accent-glow);}
  .btn-danger{background:transparent;border-color:var(--danger-dim);color:var(--danger);}
  .btn-danger:hover{background:rgba(232,105,122,0.1);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
  .btn-ghost:hover{color:var(--text);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-sm{padding:5px 10px;font-size:12.5px;}
  .btn-lg{padding:13px 22px;font-size:14.5px;}

  main{flex:1;padding:48px 24px 80px;}
  footer{border-top:1px solid var(--border-soft);padding:22px 24px;text-align:center;color:var(--text-dimmer);font-size:12.5px;}
  footer a{color:var(--text-dim);text-decoration:underline;text-underline-offset:2px;cursor:pointer;}

  .hero{max-width:720px;margin:0 auto;text-align:center;}
  .hero-eyebrow{ display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:12px;color:var(--accent);
    background:rgba(79,209,197,0.08);border:1px solid rgba(79,209,197,0.25);padding:5px 12px;border-radius:20px;margin-bottom:22px; }
  .hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .hero h1{font-family:var(--font-display);font-size:44px;line-height:1.12;margin:0 0 14px;font-weight:700;letter-spacing:-.5px;}
  .hero p{color:var(--text-dim);font-size:16px;line-height:1.6;max-width:540px;margin:0 auto 34px;}

  .search-bar{ display:flex;align-items:center;gap:0;background:var(--bg-elev);border:1px solid var(--border);
    border-radius:10px;padding:4px 4px 4px 16px;max-width:540px;margin:0 auto;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);transition:border-color .15s ease; }
  .search-bar:focus-within{border-color:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-glow);}
  .search-bar .prompt{font-family:var(--font-mono);color:var(--accent);font-size:15px;}
  .search-bar input{flex:1;background:transparent;border:none;font-family:var(--font-mono);font-size:15px;padding:12px 8px;}
  .search-bar input:focus{box-shadow:none;}
  .search-hint{margin-top:12px;font-size:12.5px;color:var(--text-dimmer);font-family:var(--font-mono);}

  .stat-row{display:flex;justify-content:center;gap:36px;margin-top:56px;flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat .num{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--accent);}
  .stat .lbl{font-size:12px;color:var(--text-dimmer);margin-top:2px;font-family:var(--font-mono);}

  .feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:860px;margin:70px auto 0;}
  .feature-card{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;}
  .feature-card .ico{width:30px;height:30px;border-radius:8px;background:rgba(79,209,197,0.1);display:flex;align-items:center;justify-content:center;color:var(--accent);margin-bottom:12px;font-family:var(--font-mono);font-weight:600;}
  .feature-card h3{font-family:var(--font-display);font-size:15px;margin:0 0 6px;font-weight:600;}
  .feature-card p{font-size:13px;color:var(--text-dim);line-height:1.55;margin:0;}

  .panel{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:22px;margin-bottom:18px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .panel-head h2{font-family:var(--font-display);font-size:17px;margin:0;font-weight:600;display:flex;align-items:center;gap:9px;}
  .badge{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);background:var(--bg-elev-2);border:1px solid var(--border);padding:2px 8px;border-radius:20px;}
  .badge.warn{color:var(--warn);border-color:rgba(240,168,104,0.35);background:rgba(240,168,104,0.08);}
  .badge.ok{color:var(--accent);border-color:rgba(79,209,197,0.3);background:rgba(79,209,197,0.08);}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(220px,1fr));gap:12px;}
  .site-card{ background:var(--bg-elev-2);border:1px solid var(--border-soft);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s ease, transform .1s ease; }
  .site-card:hover{border-color:var(--accent-dim);transform:translateY(-2px);}
  .site-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .site-card .name{font-family:var(--font-display);font-weight:600;font-size:15px;}
  .site-card .sub{font-size:11.5px;color:var(--text-dimmer);font-family:var(--font-mono);margin-top:3px;}
  .add-card{ display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:transparent;border:1.5px dashed var(--border);border-radius:10px;padding:16px;min-height:78px;color:var(--text-dim);
    transition:all .15s ease; }
  .add-card:hover{border-color:var(--accent-dim);color:var(--accent);background:rgba(79,209,197,0.05);}
  .add-card .plus{font-size:20px;line-height:1;}

  .row-item{ display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 14px;border:1px solid var(--border-soft);border-radius:8px;background:var(--bg-elev-2);
    margin-bottom:9px;flex-wrap:wrap; }
  .row-item .left{display:flex;align-items:center;gap:10px;min-width:0;}
  .port-light{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--text-dimmer);}
  .port-light.on{background:var(--accent);box-shadow:0 0 8px var(--accent-glow);}
  .row-item .name{font-family:var(--font-mono);font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-item .sub{font-size:11.5px;color:var(--text-dimmer);margin-top:2px;}
  .row-item .actions{display:flex;gap:6px;flex-wrap:wrap;}
  .empty-state{text-align:center;padding:30px 10px;color:var(--text-dimmer);font-size:13.5px;}
  .empty-state .big{font-size:26px;margin-bottom:6px;}

  .field{margin-bottom:14px;} .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
  .field input, .field textarea, .field select{width:100%;}
  .field .help{font-size:11.5px;color:var(--text-dimmer);margin-top:5px;}
  .domain-input-row{display:flex;gap:0;}
  .domain-input-row input{border-radius:8px 0 0 8px;flex:1;}
  .domain-input-row select{border-radius:0 8px 8px 0;border-left:none;width:auto;flex-shrink:0;}

  .message{padding:11px 14px;border-radius:8px;font-size:13.5px;margin-bottom:16px;border:1px solid;}
  .message.error{background:rgba(232,105,122,0.08);border-color:rgba(232,105,122,0.3);color:#F5A5B0;}
  .message.success{background:rgba(79,209,197,0.08);border-color:rgba(79,209,197,0.3);color:var(--accent);}
  .message.info{background:rgba(240,168,104,0.08);border-color:rgba(240,168,104,0.3);color:var(--warn);}

  .tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--border-soft);}
  .tab{padding:9px 4px;margin-right:20px;font-size:13.5px;color:var(--text-dim);border-bottom:2px solid transparent;font-weight:500;background:none;border-top:none;border-left:none;border-right:none;}
  .tab.active{color:var(--text);border-color:var(--accent);}

  .modal-backdrop{ position:fixed;inset:0;background:rgba(6,10,20,0.7);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px; }
  .modal{ background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;padding:26px;width:100%;max-width:420px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  .modal h3{font-family:var(--font-display);margin:0 0 18px;font-size:17px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

  .auth-box{max-width:400px;margin:20px auto;}
  .auth-switch{display:flex;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:8px;padding:3px;margin-bottom:22px;}
  .auth-switch button{flex:1;background:transparent;border:none;padding:8px;border-radius:6px;color:var(--text-dim);font-size:13.5px;font-weight:500;}
  .auth-switch button.active{background:var(--bg-elev-3);color:var(--text);}

  .editor-layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start;}
  .file-list{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:10px;}
  .file-item{ display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:8px 9px;border-radius:6px;font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);
    cursor:pointer;margin-bottom:2px; }
  .file-item:hover{background:var(--bg-elev-2);}
  .file-item.active{background:rgba(79,209,197,0.1);color:var(--accent);}
  .file-item .del{opacity:0;color:var(--danger);font-size:14px;}
  .file-item:hover .del{opacity:1;}
  .editor-main textarea{width:100%;min-height:320px;font-family:var(--font-mono);font-size:13px;line-height:1.55;resize:vertical;}
  .preview-frame{width:100%;height:400px;border:1px solid var(--border-soft);border-radius:8px;background:#fff;margin-top:14px;}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
  .toolbar .spacer{flex:1;}

  .domain-hero{ display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
    background:var(--bg-elev-2);border:1px solid var(--border-soft);border-radius:10px;padding:16px 18px;margin-bottom:16px; }
  .domain-hero .name{font-family:var(--font-mono);font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px;}

  .viewer-bar{ display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--bg-elev);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:40; }
  .viewer-bar .url{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);}
  .viewer-frame{width:100%;height:calc(100vh - 49px);border:none;background:#fff;}

  .terms-list{padding-left:0;list-style:none;}
  .terms-list li{padding:12px 0;border-bottom:1px solid var(--border-soft);font-size:14px;color:var(--text-dim);line-height:1.6;display:flex;gap:12px;}
  .terms-list li b{color:var(--text);}
  .terms-num{font-family:var(--font-mono);color:var(--accent);flex-shrink:0;}

  .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .center-loading{display:flex;justify-content:center;padding:60px 0;}

  @media (max-width: 640px){
    .hero h1{font-size:32px;} .feature-grid{grid-template-columns:1fr;} .editor-layout{grid-template-columns:1fr;}
    .navbar-inner{flex-direction:column;align-items:flex-start;gap:10px;} .nav-links{width:100%;justify-content:flex-start;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";
  const SUPABASE_URL = "https://puljajfgjyzipgdrvioy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1bGphamZnanl6aXBnZHJ2aW95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNjU1NDUsImV4cCI6MjA5OTk0MTU0NX0.F9r4TxzjfOLieUaslnvG8cwgKPlEjSrWEPCHM2miJtU";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const TLDS = ["com","net","io","org","dev","app","site"];

  const state = {
    session:null, profile:null, view:"home", authMode:"login",
    websites:[], domains:[], subdomainsByDomain:{},
    currentWebsiteId:null, currentFiles:[], currentPath:null, draftContent:"", draftIsNew:false, newFilePath:"",
    currentDomainId:null,
    siteViewer:null, adminData:null, adminTab:"domains",
    modal:null, // {type, ...}
    loading:false, message:null, booting:true,
  };

  const app = document.getElementById("app");
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function setMsg(type,text){ state.message={type,text}; render(); }
  function clearMsg(){ state.message=null; }
  function go(view){ clearMsg(); state.view=view; state.modal=null; render(); window.scrollTo(0,0); }
  function slugify(str){
    return (str||"").toLowerCase().trim()
      .replace(/[^a-z0-9\s-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "site";
  }
  function mimeFromPath(path){
    const ext=(path.split(".").pop()||"").toLowerCase();
    const map={html:"text/html",htm:"text/html",css:"text/css",js:"application/javascript",json:"application/json",svg:"image/svg+xml",txt:"text/plain",md:"text/markdown",xml:"application/xml"};
    return map[ext]||"text/plain";
  }

  // ---------------- AUTH ----------------
  async function refreshSession(){
    const {data}=await sb.auth.getSession();
    state.session=data.session;
    if(state.session){
      const {data:prof}=await sb.from("v2_profiles").select("*").eq("id",state.session.user.id).maybeSingle();
      state.profile=prof||null;
    } else { state.profile=null; }
  }

  sb.auth.onAuthStateChange(async (_e,session)=>{
    state.session=session;
    if(session){
      const {data:prof}=await sb.from("v2_profiles").select("*").eq("id",session.user.id).maybeSingle();
      state.profile=prof||null;
    } else { state.profile=null; }
  });

  async function doRegister(name,email,password){
    clearMsg();
    if(!name || name.trim().length<2){ setMsg("error","Vul je naam in (minstens 2 tekens)."); return; }
    if(!email||!password||password.length<6){ setMsg("error","Vul een e-mailadres in en een wachtwoord van minstens 6 tekens."); return; }
    state.loading=true; render();
    const {data,error}=await sb.auth.signUp({ email, password, options:{ data:{ display_name:name.trim() } } });
    state.loading=false;
    if(error){ setMsg("error",error.message); return; }
    if(data.session){
      await refreshSession();
      setMsg("success","Account aangemaakt. Welkom, "+name.trim()+"!");
      go("dashboard"); await loadDashboardData();
    } else {
      setMsg("info","Account aangemaakt. Check je e-mail om te bevestigen, log daarna in.");
      state.authMode="login"; render();
    }
  }

  async function doLogin(email,password){
    clearMsg(); state.loading=true; render();
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    state.loading=false;
    if(error){ setMsg("error", error.message==="Invalid login credentials"?"Onjuiste inloggegevens.":error.message); return; }
    state.session=data.session; await refreshSession();
    go("dashboard"); await loadDashboardData();
  }

  async function doLogout(){
    await sb.auth.signOut();
    state.session=null; state.profile=null; state.websites=[]; state.domains=[];
    go("home");
  }

  // ---------------- DATA ----------------
  async function loadDashboardData(){
    if(!state.session) return;
    state.loading=true; render();
    const uid=state.session.user.id;
    const [{data:sites},{data:doms}]=await Promise.all([
      sb.from("v2_websites").select("*").eq("owner_id",uid).order("created_at"),
      sb.from("v2_domains").select("*").eq("owner_id",uid).order("created_at"),
    ]);
    state.websites=sites||[]; state.domains=doms||[];
    if(state.domains.length){
      const {data:subs}=await sb.from("v2_subdomains").select("*").in("domain_id", state.domains.map(d=>d.id));
      state.subdomainsByDomain={};
      (subs||[]).forEach(s=>{ (state.subdomainsByDomain[s.domain_id] ||= []).push(s); });
    } else { state.subdomainsByDomain={}; }
    state.loading=false; render();
  }

  const websiteLimit = () => (state.profile && state.profile.is_admin) ? Infinity : 4;
  const domainLimit = () => (state.profile && state.profile.is_admin) ? Infinity : 2;

  async function createWebsite(name){
    clearMsg();
    const clean=(name||"").trim();
    if(clean.length<2){ setMsg("error","Geef je website een naam."); return; }
    if(state.websites.length>=websiteLimit()){ setMsg("error","Je hebt het maximum aantal websites bereikt."); return; }
    let slug=slugify(clean);
    const existingSlugs=new Set(state.websites.map(w=>w.slug));
    if(existingSlugs.has(slug)) slug = slug+"-"+Math.random().toString(36).slice(2,6);
    state.loading=true; render();
    const {data,error}=await sb.from("v2_websites").insert({owner_id:state.session.user.id,name:clean,slug}).select().single();
    state.loading=false;
    if(error){ setMsg("error", error.message.includes("Limiet")?error.message:error.message); return; }
    state.websites.push(data);
    setMsg("success","Website '"+clean+"' aangemaakt.");
    openWebsiteEditor(data.id);
  }

  async function renameWebsite(id,name){
    const clean=(name||"").trim(); if(clean.length<2) return;
    await sb.from("v2_websites").update({name:clean,updated_at:new Date().toISOString()}).eq("id",id);
    const w=state.websites.find(w=>w.id===id); if(w) w.name=clean;
    render();
  }

  async function deleteWebsite(id){
    if(!confirm("Deze website en alle bestanden verwijderen?")) return;
    state.loading=true; render();
    const {error}=await sb.from("v2_websites").delete().eq("id",id);
    state.loading=false;
    if(error){ setMsg("error",error.message); return; }
    setMsg("success","Website verwijderd.");
    go("dashboard"); await loadDashboardData();
  }

  function parseDomainInput(raw){

  // ---------------- PREVIEW ENGINE ----------------
  function buildFileMap(files){ const m={}; files.forEach(f=>m[f.file_path]=f); return m; }
  function resolvePath(basePath,rel){
    if(/^(https?:)?\/\//i.test(rel)||rel.startsWith("data:")||rel.startsWith("#")||rel.startsWith("mailto:")) return null;
    const baseParts=basePath.split("/"); baseParts.pop();
    const stack=baseParts.slice();
    rel.split("/").forEach(part=>{ if(part==="."||part==="") return; if(part==="..") stack.pop(); else stack.push(part); });
    return stack.join("/");
  }
  function blobUrlFor(path,fileMap,cache){
    if(cache[path]) return cache[path];
    const file=fileMap[path]; if(!file) return null;
    const url=URL.createObjectURL(new Blob([file.content],{type:mimeFromPath(path)}));
    cache[path]=url; return url;
  }
  function renderHtmlWithAssets(path,fileMap,cache,visited){
    if(cache[path]) return cache[path];
    if(visited.has(path)) return null;
    visited.add(path);
    const file=fileMap[path]; if(!file) return null;
    let html=file.content;
    html=html.replace(/((?:src|href)\s*=\s*)(["'])(.*?)\2/gi,(match,prefix,quote,val)=>{
      const resolved=resolvePath(path,val); if(!resolved||!fileMap[resolved]) return match;
      const url = mimeFromPath(resolved)==="text/html" ? renderHtmlWithAssets(resolved,fileMap,cache,visited) : blobUrlFor(resolved,fileMap,cache);
      return url ? prefix+quote+url+quote : match;
    });
    html=html.replace(/url\((["']?)(.*?)\1\)/gi,(match,quote,val)=>{
      const resolved=resolvePath(path,val); if(!resolved||!fileMap[resolved]) return match;
      const url=blobUrlFor(resolved,fileMap,cache);
      return url ? "url("+quote+url+quote+")" : match;
    });
    const url=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    cache[path]=url; return url;
  }
  function buildPreviewUrl(files){
    const fileMap=buildFileMap(files);
    if(!fileMap["index.html"]) return null;
    return renderHtmlWithAssets("index.html",fileMap,{},new Set());
  }

  // ---------------- SEARCH / VIEWER ----------------
  async function searchDomain(raw){
    clearMsg();
    const clean=(raw||"").trim().toLowerCase();
    if(!clean){ setMsg("error","Typ eerst een domeinnaam in, bv. voorbeeld.com"); return; }
    state.loading=true; render();

    const {data:exact}=await sb.from("v2_domains").select("*").eq("domain_name",clean).maybeSingle();
    let websiteId=null, published=false, displayName=clean, notFoundMsg="Domein '"+clean+"' bestaat niet op BrowsePort.";

    if(exact){
      websiteId=exact.website_id; published=exact.is_published;
    } else {
      const parts=clean.split(".");
      if(parts.length>=3){
        const label=parts[0]; const baseDomain=parts.slice(1).join(".");
        const {data:baseDom}=await sb.from("v2_domains").select("*").eq("domain_name",baseDomain).maybeSingle();
        if(baseDom){
          const {data:sub}=await sb.from("v2_subdomains").select("*").eq("domain_id",baseDom.id).eq("label",label).maybeSingle();
          if(sub){ websiteId=sub.website_id; published=sub.is_published; }
        }
      }
    }

    if(!websiteId && !published){
      state.loading=false;
      if(exact || websiteId!==null){ setMsg("info","'"+clean+"' bestaat, maar is (nog) niet gepubliceerd door de eigenaar."); }
      else setMsg("error", notFoundMsg);
      return;
    }
    if(!published || !websiteId){
      state.loading=false;
      setMsg("info","'"+clean+"' bestaat, maar is (nog) niet gepubliceerd door de eigenaar.");
      return;
    }
    const {data:files}=await sb.from("v2_website_files").select("*").eq("website_id",websiteId);
    state.loading=false;
    if(!files||!files.length){ setMsg("error","Deze website heeft nog geen bestanden."); return; }
    const url=buildPreviewUrl(files);
    if(!url){ setMsg("error","Deze website heeft geen index.html en kan niet worden weergegeven."); return; }
    state.siteViewer={domain:clean,url};
    state.view="site"; render();
  }

    const linkedSite = state.websites.find(w=>w.id===d.website_id);
    const subs = state.subdomainsByDomain[d.id]||[];
    const canAddSub = subs.length < 2 || (state.profile&&state.profile.is_admin);

    const subRows = subs.map(s=>{
      const site = state.websites.find(w=>w.id===s.website_id);
      const options = state.websites.map(w=>`<option value="${w.id}" ${s.website_id===w.id?'selected':''}>${esc(w.name)}</option>`).join("");
      return `
      <div class="row-item">
        <div class="left"><span class="port-light ${s.is_published?'on':''}"></span>
          <div><div class="name">${esc(s.label)}.${esc(d.domain_name)}</div>
            <div class="sub">${site?'wijst naar "'+esc(site.name)+'"':'nog geen website gekoppeld'}</div></div>
        </div>
        <div class="actions">
          <select class="btn-sm" style="padding:6px 8px;" onchange="BrowsePort.linkSubdomain('${s.id}', this.value)">
            <option value="">— koppel website —</option>${options}
          </select>
          <button class="btn btn-sm ${s.is_published?'':'btn-accent'}" onclick="BrowsePort.toggleSubPublish('${s.id}', ${s.is_published})" ${!s.website_id?'disabled':''}>${s.is_published?'Depubliceren':'Publiceren'}</button>
          <button class="btn btn-danger btn-sm" onclick="BrowsePort.deleteSub('${s.id}')">✕</button>
        </div>
      </div>`;
    }).join("");

    const siteOptions = state.websites.map(w=>`<option value="${w.id}" ${d.website_id===w.id?'selected':''}>${esc(w.name)}</option>`).join("");

    return `
    <div class="panel-head"><h2 style="font-size:22px;">Domein instellingen</h2>
      <button class="btn btn-ghost btn-sm" onclick="BrowsePort.goDashboard()">← Terug</button></div>
    ${MessageBox()}
    <div class="domain-hero">
      <div class="name"><span class="port-light ${d.is_published?'on':''}"></span>${esc(d.domain_name)}</div>
      <button class="btn btn-sm ${d.is_published?'':'btn-accent'}" onclick="BrowsePort.togglePublish('${d.id}', ${d.is_published})" ${!d.website_id?'disabled title="Koppel eerst een website"':''}>${d.is_published?'Depubliceren':'Publiceren'}</button>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Hoofdwebsite</h2></div>
      <div class="field">
        <label>Welke website hoort bij ${esc(d.domain_name)}?</label>
        <select onchange="BrowsePort.linkDomain('${d.id}', this.value)">
          <option value="">— geen —</option>${siteOptions}
        </select>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Subdomeinen <span class="badge">${subs.length}/2</span></h2></div>
      ${subRows || '<div class="empty-state">Nog geen subdomeinen.</div>'}
      ${canAddSub ? `
      <form class="inline-form" style="display:flex;gap:8px;margin-top:10px;" onsubmit="event.preventDefault();BrowsePort.createSub()">
        <div style="display:flex;align-items:center;gap:6px;flex:1;">
          <input id="newSubLabel" type="text" placeholder="bv. blog" style="flex:1;" />
          <span class="mono" style="color:var(--text-dimmer);">.${esc(d.domain_name)}</span>
        </div>
        <button class="btn btn-accent" type="submit">+ Subdomein</button>
      </form>` : ''}
    </div>`;
  }

  function AdminView(){
    if(!state.adminData) return `<div class="center-loading"><span class="spinner"></span></div>`;
    const {domains,websites,profiles,subdomains}=state.adminData;
    const nameOf=uid=>{const p=profiles.find(p=>p.id===uid); return p?(p.display_name||p.email):uid.slice(0,8);};
    const siteOf=id=>websites.find(w=>w.id===id);

    const domainRows = domains.map(d=>`
      <div class="row-item">
        <div class="left"><span class="port-light ${d.is_published?'on':''}"></span>
          <div><div class="name">${esc(d.domain_name)}</div>
            <div class="sub">eigenaar: ${esc(nameOf(d.owner_id))} ${d.website_id?'· → '+esc((siteOf(d.website_id)||{}).name||'?'):'· geen website'}</div></div>
        </div>
        <div class="actions">
          <button class="btn btn-sm ${d.is_published?'':'btn-accent'}" onclick="BrowsePort.adminToggle('${d.id}', ${d.is_published})">${d.is_published?'Depubliceren':'Publiceren'}</button>
          <button class="btn btn-danger btn-sm" onclick="BrowsePort.adminDelDomain('${d.id}')">Verwijderen</button>
        </div>
      </div>`).join("") || '<div class="empty-state">Geen domeinen.</div>';

    const websiteRows = websites.map(w=>`
      <div class="row-item">
        <div class="left"><div><div class="name">${esc(w.name)} <span style="color:var(--text-dimmer);">/ ${esc(w.slug)}</span></div>
          <div class="sub">eigenaar: ${esc(nameOf(w.owner_id))}</div></div></div>
        <div class="actions">
          <button class="btn btn-sm" onclick="BrowsePort.openEditor('${w.id}')">Bekijk bestanden</button>
          <button class="btn btn-danger btn-sm" onclick="BrowsePort.adminDelWebsite('${w.id}')">Verwijderen</button>
        </div>
      </div>`).join("") || '<div class="empty-state">Geen websites.</div>';

    const userRows = profiles.map(p=>`
      <div class="row-item"><div class="left"><span class="port-light ${p.is_admin?'on':''}"></span>
        <div><div class="name">${esc(p.display_name||p.email)}</div>
          <div class="sub">${esc(p.email)} · ${p.is_admin?'admin · onbeperkt':'normale gebruiker · max 4 + 2'}</div></div></div>
      </div>`).join("");

    return `
    <div class="panel-head" style="margin-bottom:26px;"><h2 style="font-size:22px;">Admin</h2><span class="badge warn">${esc(state.session.user.email)}</span></div>
    <div class="tabs">
      <button class="tab ${state.adminTab==='domains'?'active':''}" onclick="BrowsePort.adminTabSet('domains')">Domeinen (${domains.length})</button>
      <button class="tab ${state.adminTab==='websites'?'active':''}" onclick="BrowsePort.adminTabSet('websites')">Websites (${websites.length})</button>
      <button class="tab ${state.adminTab==='users'?'active':''}" onclick="BrowsePort.adminTabSet('users')">Gebruikers (${profiles.length})</button>
    </div>
    <div class="panel">${state.adminTab==='domains'?domainRows:state.adminTab==='websites'?websiteRows:userRows}</div>`;
  }

  function TermsView(){
    const items=[
      ["Gebruikslimiet","Elke normale gebruiker mag maximaal <b>4 websites</b>, <b>2 domeinen</b> en per domein <b>2 subdomeinen</b> aanmaken. De beheerder heeft geen limiet."],
      ["Toegestane inhoud","Geen illegale, misleidende, discriminerende of haatdragende content, en geen malware of phishing-pagina's."],
      ["Domeinnamen","Een domein bestaat uit een naam plus extensie (bv. .com, .net, .io of een extensie naar keuze). Losse subdomeinen kun je alleen aanmaken onder een domein dat je zelf al bezit."],
      ["Eigendom","Je blijft verantwoordelijk voor de bestanden die je host. Host geen materiaal waar je geen recht op hebt."],
      ["Publiceren","Een domein of subdomein is pas zichtbaar via de zoekbalk wanneer je het expliciet publiceert."],
      ["Moderatie","De admin kan elk domein of elke website verwijderen of depubliceren bij misbruik."],
      ["Geen garanties","Er wordt geen uptime, back-up of dataretentie gegarandeerd."],
      ["Contact","Voor vragen of meldingen van misbruik: treurmattheo@gmail.com."],
    ];
    return `<div class="panel-head"><h2 style="font-size:22px;">Voorwaarden</h2></div>
    <div class="panel"><ul class="terms-list">${items.map((it,i)=>`<li><span class="terms-num">${String(i+1).padStart(2,'0')}</span><span><b>${esc(it[0])}.</b> ${it[1]}</span></li>`).join("")}</ul></div>`;
  }

  function SiteViewerView(){
    return `<div class="viewer-bar"><button class="btn btn-sm" onclick="BrowsePort.closeViewer()">← Terug</button><span class="url mono">${esc(state.siteViewer.domain)}</span></div>
    <iframe class="viewer-frame" src="${state.siteViewer.url}"></iframe>`;
  }

  function ModalView(){
    if(!state.modal) return "";
    if(state.modal.type==="newWebsite"){
      return `<div class="modal-backdrop" onclick="if(event.target===this)BrowsePort.closeModal()">
        <div class="modal">
          <h3>Nieuwe website</h3>
          <div class="field"><label>Naam van je website</label>
            <input id="modalInput" type="text" placeholder="bv. Mijn portfolio" onkeydown="if(event.key==='Enter')BrowsePort.submitNewWebsite()" /></div>
          <div class="modal-actions"><button class="btn" onclick="BrowsePort.closeModal()">Annuleren</button>
            <button class="btn btn-accent" onclick="BrowsePort.submitNewWebsite()">Aanmaken →</button></div>
        </div></div>`;
    }
    if(state.modal.type==="newDomain"){
      const opts = TLDS.map(t=>`<option value="${t}">.${t}</option>`).join("") + `<option value="__custom">aangepast…</option>`;
      return `<div class="modal-backdrop" onclick="if(event.target===this)BrowsePort.closeModal()">
        <div class="modal">
          <h3>Domein claimen</h3>
          <div class="field"><label>Domeinnaam</label>
            <div class="domain-input-row">
              <input id="modalDomainName" type="text" placeholder="voorbeeld" />
              <select id="modalDomainTld" onchange="BrowsePort.onTldChange(this.value)">${opts}</select>
            </div>
            <div class="help" id="customTldHelp" style="display:none;margin-top:8px;">
              <input id="modalDomainCustomTld" type="text" placeholder="aangepaste extensie, bv. dev" />
            </div>
          </div>
          <div class="modal-actions"><button class="btn" onclick="BrowsePort.closeModal()">Annuleren</button>
            <button class="btn btn-accent" onclick="BrowsePort.submitNewDomain()">Claimen →</button></div>
        </div></div>`;
    }
    if(state.modal.type==="linkDomain"){
      const opts = state.modal.options.map(d=>`<option value="${d.id}">${esc(d.domain_name)}</option>`).join("");
      return `<div class="modal-backdrop" onclick="if(event.target===this)BrowsePort.closeModal()">
        <div class="modal">
          <h3>Koppel domein</h3>
          ${state.modal.options.length ? `
          <div class="field"><label>Kies een van je domeinen</label>
            <select id="modalLinkSelect">${opts}</select>
            <div class="help">Dit koppelt het domein aan de website die je nu bewerkt.</div>
          </div>
          <div class="modal-actions"><button class="btn" onclick="BrowsePort.closeModal()">Annuleren</button>
            <button class="btn btn-accent" onclick="BrowsePort.submitLinkDomain()">Koppelen</button></div>
          ` : `<p style="color:var(--text-dim);font-size:13.5px;">Je hebt geen vrij domein om te koppelen. Claim eerst een nieuw domein via het dashboard, of maak een domein hier direct aan.</p>
          <div class="modal-actions"><button class="btn" onclick="BrowsePort.closeModal()">Sluiten</button>
            <button class="btn btn-accent" onclick="BrowsePort.closeModal(); BrowsePort.newDomainModal();">+ Nieuw domein</button></div>`}
        </div></div>`;
    }
    return "";
  }

  // ---------------- RENDER ----------------
  function render(){
    if(state.view==="site" && state.siteViewer){ app.innerHTML=SiteViewerView(); return; }
    let body;
    switch(state.view){
      case "home": body=HomeView(); break;
      case "auth": body=AuthView(); break;
      case "dashboard": body = (state.loading && !state.websites.length && !state.domains.length) ? `<div class="center-loading"><span class="spinner"></span></div>` : DashboardView(); break;
      case "editor": body=EditorView(); break;
      case "domain": body=DomainSettingsView(); break;
      case "admin": body=AdminView(); break;
      case "terms": body=TermsView(); break;
      default: body=HomeView();
    }
    app.innerHTML = `${Navbar()}<main><div class="container">${body}</div></main>
      <footer>BrowsePort — jouw domeinen, jouw regels. · <a onclick="BrowsePort.go('terms')">Voorwaarden</a></footer>
      ${ModalView()}`;
    if(state.view==="editor") setTimeout(refreshPreviewFrame,0);
  }

  function refreshPreviewFrame(){
    const frame=document.getElementById("previewFrame"); if(!frame) return;
    const url=buildPreviewUrl(state.currentFiles);
    if(url) frame.src=url;
    else frame.srcdoc="<div style='font-family:sans-serif;padding:20px;color:#888;'>Geen index.html gevonden. Maak een bestand met pad <b>index.html</b> aan.</div>";
  }

  // ---------------- PUBLIC API ----------------
  window.BrowsePort = {
    go, goDashboard: async ()=>{ go("dashboard"); await loadDashboardData(); },
    goAdmin: async ()=>{ go("admin"); await loadAdminData(); },
    goAuth:(mode)=>{ state.authMode=mode; go("auth"); },
    adminTabSet:(t)=>{ state.adminTab=t; render(); },
    logout: doLogout,
    submitAuth: ()=>{
      const email=document.getElementById("authEmail").value.trim();
      const password=document.getElementById("authPassword").value;
      if(state.authMode==="login") doLogin(email,password);
      else { const name=document.getElementById("authName").value; doRegister(name,email,password); }
    },
    search:(v)=>searchDomain(v),
    closeViewer:()=>{ if(state.siteViewer) URL.revokeObjectURL(state.siteViewer.url); state.siteViewer=null; go("home"); },

    newWebsiteModal: openNewWebsiteModal,
    submitNewWebsite: ()=>{ const v=document.getElementById("modalInput").value; state.modal=null; createWebsite(v); },
    deleteWebsite,
    openEditor: openWebsiteEditor,
    selectFile, startNewFile,
    setDraft:(v)=>{ state.draftContent=v; }, setNewPath:(v)=>{ state.newFilePath=v; },
    saveFile: saveCurrentFile, deleteFile, refreshPreview: refreshPreviewFrame,

    newDomainModal: openNewDomainModal,
    onTldChange:(v)=>{ const help=document.getElementById("customTldHelp"); if(help) help.style.display = v==="__custom"?"block":"none"; },
    submitNewDomain: async ()=>{
      const name=document.getElementById("modalDomainName").value;
      const tldSel=document.getElementById("modalDomainTld").value;
      const tld = tldSel==="__custom" ? document.getElementById("modalDomainCustomTld").value : tldSel;
      state.modal=null;
      await createDomain(name,tld);
    },
    goDomainSettings:(id)=>{ state.currentDomainId=id; go("domain"); },
    linkDomain:(id,websiteId)=>updateDomain(id,{website_id: websiteId||null}),
    togglePublish:(id,current)=>updateDomain(id,{is_published:!current}),
    deleteDomain,

    linkDomainModal: openLinkDomainModal,
    submitLinkDomain: async ()=>{
      const sel=document.getElementById("modalLinkSelect"); const domainId=sel.value;
      state.modal=null;
      await updateDomain(domainId,{website_id: state.currentWebsiteId});
      const {data}=await sb.from("v2_domains").select("*").eq("owner_id",state.session.user.id).order("created_at");
      state.domains=data||[]; render();
    },
    closeModal,

    createSub: ()=>{ const v=document.getElementById("newSubLabel").value; createSubdomain(state.currentDomainId, v); },
    linkSubdomain:(id,websiteId)=>updateSubdomain(id,{website_id: websiteId||null}),
    toggleSubPublish:(id,current)=>updateSubdomain(id,{is_published:!current}),
    deleteSub: deleteSubdomain,

    adminDelDomain: adminDeleteDomain, adminDelWebsite: adminDeleteWebsite, adminToggle,
  };

  (async function boot(){
    await refreshSession();
    state.booting=false;
    if(state.session){ go("dashboard"); await loadDashboardData(); } else { render(); }
  })();
})();
</script>
</body>
</html>
