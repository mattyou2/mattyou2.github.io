<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYAI — Code-Assistent</title>
<!--
  Het taalmodel draait NIET in de browser, maar server-side bij Hugging
  Face zelf, via de gratis "Serverless Inference API". Deze pagina stuurt
  enkel een verzoek naar https://router.huggingface.co en toont het
  antwoord. Je hebt hiervoor geen eigen Space nodig — alleen een gratis
  Hugging Face account met een API-token (zie uitleg onderaan het gesprek).
-->

<style>
  /* ==========================================================
     KLEURENPALET (CSS-variabelen)
     Donkere "programmeurs-darkmode" met neon-cyaan/magenta accenten.
  ========================================================== */
  :root {
    --bg-app:        #0b0e14;   /* achtergrond hele app */
    --bg-sidebar:     #10141c;  /* zijbalk */
    --bg-chat:        #0d1017;  /* chatvenster achtergrond */
    --bg-bubble-user: #16202c;  /* bericht van de gebruiker */
    --bg-bubble-ai:   #121722;  /* bericht van MYAI */
    --bg-code:        #05070c;  /* achtergrond van codeblokken */
    --border:         #1f2733;
    --text-main:      #e6edf3;
    --text-dim:       #8b96a5;
    --accent-cyan:    #00e5ff;
    --accent-magenta: #ff2ec4;
    --accent-green:   #39ff88;
    --radius:         12px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-app);
    color: var(--text-main);
    font-family: "Segoe UI", Roboto, -apple-system, sans-serif;
  }

  /* ==========================================================
     HOOFDLAYOUT: zijbalk + chatvenster
  ========================================================== */
  .app-layout {
    display: flex;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ---------- Zijbalk ---------- */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
  }

  .sidebar .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 1.2rem;
    margin-bottom: 20px;
    color: var(--accent-cyan);
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
  }

  .new-chat-btn {
    background: transparent;
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 10px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 0.9rem;
    margin-bottom: 20px;
    transition: 0.2s;
  }
  .new-chat-btn:hover {
    background: var(--accent-cyan);
    color: var(--bg-app);
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
  }

  .history-label {
    color: var(--text-dim);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .history-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .history-item {
    padding: 8px 10px;
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-item:hover {
    background: var(--bg-bubble-ai);
    color: var(--text-main);
  }

  /* ---------- Chatvenster (midden) ---------- */
  .chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg-chat);
  }

  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    color: var(--accent-magenta);
  }

  .chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .message {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }

  .message.user {
    align-self: flex-end;
    background: var(--bg-bubble-user);
    border: 1px solid var(--accent-cyan);
  }

  .message.ai {
    align-self: flex-start;
    background: var(--bg-bubble-ai);
    border: 1px solid var(--accent-magenta);
  }

  .message .role-label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    color: var(--text-dim);
  }

  /* Codeblokken netjes stylen, met afwijkende achtergrond */
  .message pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-green);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 10px 0;
  }

  .message code {
    font-family: "Fira Code", Consolas, monospace;
    font-size: 0.85rem;
    color: var(--accent-green);
  }

  /* Inline code (buiten <pre>) net iets anders */
  .message p code, .message code:not(pre code) {
    background: var(--bg-code);
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* ---------- Invoerbalk onderaan ---------- */
  .input-bar {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    background: var(--bg-sidebar);
  }

  .input-bar textarea {
    flex: 1;
    resize: none;
    background: var(--bg-app);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-main);
    padding: 12px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    height: 48px;
  }
  .input-bar textarea:focus {
    outline: none;
    border-color: var(--accent-cyan);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
  }

  .send-btn {
    background: var(--accent-magenta);
    border: none;
    color: #0b0e14;
    font-weight: 700;
    padding: 0 22px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: 0.2s;
  }
  .send-btn:hover {
    box-shadow: 0 0 14px rgba(255, 46, 196, 0.7);
  }
  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .typing-indicator {
    color: var(--text-dim);
    font-style: italic;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<div class="app-layout">

  <!-- ============ ZIJBALK ============ -->
  <aside class="sidebar">
    <div class="logo">⚡ MYAI</div>
    <button class="new-chat-btn" onclick="nieuweChat()">+ Nieuwe chat</button>
    <div class="history-label">Geschiedenis</div>
    <div class="history-list" id="historyList">
      <!-- Chatgeschiedenis wordt hier dynamisch toegevoegd -->
    </div>
  </aside>

  <!-- ============ CHATVENSTER ============ -->
  <main class="chat-main">
    <div class="chat-header">MYAI — Code-Assistent</div>

    <div class="chat-window" id="chatWindow">
      <div class="message ai">
        <span class="role-label">MYAI</span>
        Hoi! Ik ben MYAI, jouw code-assistent. Stel me gerust een programmeervraag.
      </div>
    </div>

    <div class="input-bar">
      <textarea id="userInput" placeholder="Stel je programmeervraag aan MYAI..."></textarea>
      <button class="send-btn" id="sendBtn" onclick="verstuurBericht()">Verstuur</button>
    </div>
  </main>

</div>

<script>
  // =========================================================
  // CONFIGURATIE
  // Model draait server-side bij Hugging Face zelf (gratis Serverless
  // Inference API). Vul hier je eigen, gratis HF-token in.
  // Aanmaken: https://huggingface.co/settings/tokens -> "New token"
  // (type "Read" is voldoende, of zet scope "Make calls to Inference
  // Providers" aan).
  //
  // LET OP: dit token staat zo zichtbaar in de broncode van de pagina.
  // Prima voor eigen/privégebruik, maar deel deze HTML dan niet publiekelijk
  // met je token erin, anders kan iedereen jouw gratis quotum gebruiken.
  // =========================================================
  const HF_TOKEN = "HIER_JE_HF_TOKEN";
  const API_URL  = "https://router.huggingface.co/hf-inference/v1/chat/completions";
  const MODEL_ID = "Qwen/Qwen2.5-Coder-1.5B-Instruct";

  const SYSTEM_PROMPT =
    "Je bent MYAI, een expert in programmeren. Geef duidelijke, schone code en leg kort uit hoe het werkt.";

  let chatGeschiedenis = [];  // voor context en voor de zijbalk

  const chatWindow  = document.getElementById("chatWindow");
  const userInput   = document.getElementById("userInput");
  const sendBtn     = document.getElementById("sendBtn");
  const historyList = document.getElementById("historyList");

  // Enter (zonder shift) verstuurt het bericht
  userInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      verstuurBericht();
    }
  });

  /**
   * Zet basale markdown-codeblokken (```taal ... ```) om naar
   * nette <pre><code> HTML, zodat MYAI's antwoorden goed ogen.
   */
  function formatteerAntwoord(tekst) {
    const escape = (s) => s
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    let veiligeTekst = escape(tekst);

    veiligeTekst = veiligeTekst.replace(/```(\w*)\n([\s\S]*?)```/g, function (_, taal, code) {
      return `<pre><code class="lang-${taal}">${code}</code></pre>`;
    });

    veiligeTekst = veiligeTekst.replace(/`([^`]+)`/g, "<code>$1</code>");

    return veiligeTekst;
  }

  function voegBerichtToe(rol, tekst) {
    const bericht = document.createElement("div");
    bericht.classList.add("message", rol === "user" ? "user" : "ai");

    const label = document.createElement("span");
    label.classList.add("role-label");
    label.textContent = rol === "user" ? "Jij" : "MYAI";

    const inhoud = document.createElement("div");
    inhoud.innerHTML = formatteerAntwoord(tekst);

    bericht.appendChild(label);
    bericht.appendChild(inhoud);
    chatWindow.appendChild(bericht);

    chatWindow.scrollTop = chatWindow.scrollHeight;
    return bericht;
  }

  function voegAanGeschiedenisSidebarToe(vraag) {
    const item = document.createElement("div");
    item.classList.add("history-item");
    item.textContent = vraag.slice(0, 40) + (vraag.length > 40 ? "…" : "");
    historyList.prepend(item);
  }

  async function verstuurBericht() {
    const vraag = userInput.value.trim();
    if (!vraag) return;

    voegBerichtToe("user", vraag);
    voegAanGeschiedenisSidebarToe(vraag);
    chatGeschiedenis.push({ role: "user", content: vraag });

    userInput.value = "";
    sendBtn.disabled = true;

    const typingEl = voegBerichtToe("ai", "");
    typingEl.querySelector("div").innerHTML =
      '<span class="typing-indicator">MYAI denkt na...</span>';

    try {
      // We sturen het verzoek rechtstreeks naar Hugging Face's server
      // (OpenAI-compatibel chat-completions formaat).
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${HF_TOKEN}`,
        },
        body: JSON.stringify({
          model: MODEL_ID,
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            ...chatGeschiedenis,
          ],
          max_tokens: 800,
          temperature: 0.3,
        }),
      });

      if (!response.ok) {
        const foutTekst = await response.text();
        throw new Error(`Server gaf status ${response.status}: ${foutTekst}`);
      }

      const data = await response.json();
      const antwoord = data.choices?.[0]?.message?.content || "(Geen antwoord ontvangen)";

      typingEl.querySelector("div").innerHTML = formatteerAntwoord(antwoord);
      chatGeschiedenis.push({ role: "assistant", content: antwoord });

    } catch (fout) {
      typingEl.querySelector("div").innerHTML =
        `⚠️ Er ging iets mis bij het verbinden met MYAI: ${fout.message}`;
      console.error(fout);
    } finally {
      sendBtn.disabled = false;
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }
  }

  function nieuweChat() {
    chatGeschiedenis = [];
    chatWindow.innerHTML = "";
    voegBerichtToe("ai", "Nieuwe chat gestart. Waar kan ik je mee helpen?");
  }
</script>

</body>
</html>
