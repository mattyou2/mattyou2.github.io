<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mattyou Studios™ - Official Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .interface-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            pointer-events: none;
        }

        header h1 {
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: fadeIn 1s ease-out;
        }

        header h1 span {
            color: #00ffcc;
        }

        .main-content {
            text-align: center;
            margin: auto;
            pointer-events: auto;
            animation: fadeIn 1.5s ease-out;
        }

        .main-content h2 {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
        }

        .cta-button {
            display: inline-block;
            padding: 15px 35px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #050505;
            background-color: #00ffcc;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .cta-button:hover {
            background-color: #ffffff;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            color: #444444;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="interface-overlay">
        <header>
            <h1>Mattyou <span>Studios™</span></h1>
        </header>

        <div class="main-content">
            <h2>MATTYOU STUDIOS</h2>
            <a href="dev.html" class="cta-button">Open Dev Website</a>
        </div>

        <footer>
            <p>&copy; 2026 Mattyou Studios™ | Alle rechten voorbehouden.</p>
        </footer>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({
            color: 0x00ffcc,
            wireframe: true,
            roughness: 0.1,
            metalness: 0.8
        });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 500;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.03, color: 0xffffff });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00ffcc, 2);
        pointLight.position.set(2, 3, 4);
        scene.add(pointLight);

        const directionalLight = new THREE.DirectionalLight(0xff00ff, 1);
        directionalLight.position.set(-2, -3, 2);
        scene.add(directionalLight);

        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) - 0.5;
            mouseY = (event.clientY / window.innerHeight) - 0.5;
        });

        const clock = new THREE.Clock();

        const animate = () => {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            cube.rotation.x = elapsedTime * 0.3;
            cube.rotation.y = elapsedTime * 0.4;

            targetX = mouseX * 2;
            targetY = mouseY * 2;
            cube.position.x += (targetX - cube.position.x) * 0.05;
            cube.position.y += (-targetY - cube.position.y) * 0.05;

            particlesMesh.rotation.y = elapsedTime * 0.05;
            particlesMesh.rotation.x = -mouseY * 0.5;

            renderer.render(scene, camera);
        };

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
