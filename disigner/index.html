<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxelCraft Studio 3D - Premium Web Animator</title>
    <!-- Tailwind CSS voor een ultra-modern design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons voor prachtige iconen -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden font-['Inter']">

    <!-- Top Navigation Bar -->
    <header class="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex items-center justify-between px-6 z-10 relative">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-lg shadow-indigo-500/30">
                <i data-lucide="box" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">VoxelCraft Studio 3D</h1>
                <p class="text-xs text-slate-400">Premium Web-based 3D Engine & Animator</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <button id="btn-play-preview" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow-lg shadow-emerald-500/20">
                <i data-lucide="play" class="w-4 h-4"></i> Speel Animatie
            </button>
            <button id="btn-export" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow-lg shadow-indigo-500/20">
                <i data-lucide="download" class="w-4 h-4"></i> Exporteer als HTML
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex h-[calc(100vh-4rem)] w-full overflow-hidden">
        
        <!-- Left Sidebar: Library & Templates -->
        <aside class="w-80 border-r border-slate-800 bg-slate-900/50 flex flex-col h-full">
            <!-- Primitives Section -->
            <div class="p-4 border-b border-slate-800">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i data-lucide="shapes" class="w-4 h-4 text-indigo-400"></i> Basis Vormen
                </h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="addObject('cube')" class="flex flex-col items-center justify-center p-3 rounded-lg bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-indigo-500/50 transition group">
                        <i data-lucide="square" class="w-6 h-6 text-slate-400 group-hover:text-indigo-400 mb-1"></i>
                        <span class="text-xs">Kubus</span>
                    </button>
                    <button onclick="addObject('sphere')" class="flex flex-col items-center justify-center p-3 rounded-lg bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-indigo-500/50 transition group">
                        <i data-lucide="circle" class="w-6 h-6 text-slate-400 group-hover:text-indigo-400 mb-1"></i>
                        <span class="text-xs">Bol</span>
                    </button>
                    <button onclick="addObject('cylinder')" class="flex flex-col items-center justify-center p-3 rounded-lg bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-indigo-500/50 transition group">
                        <i data-lucide="database" class="w-6 h-6 text-slate-400 group-hover:text-indigo-400 mb-1"></i>
                        <span class="text-xs">Cilinder</span>
                    </button>
                    <button onclick="addObject('cone')" class="flex flex-col items-center justify-center p-3 rounded-lg bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-indigo-500/50 transition group">
                        <i data-lucide="triangle" class="w-6 h-6 text-slate-400 group-hover:text-indigo-400 mb-1"></i>
                        <span class="text-xs">Kegel</span>
                    </button>
                </div>
            </div>

            <!-- Premium Templates Section -->
            <div class="p-4 flex-1 overflow-y-auto">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i> Premium Templates
                </h2>
                <div class="space-y-2">
                    <button onclick="addTemplate('cow')" class="w-full flex items-center gap-3 p-3 rounded-lg bg-slate-800/30 hover:bg-slate-800 border border-slate-700/30 hover:border-amber-500/50 transition text-left group">
                        <div class="p-2 rounded bg-amber-500/10 text-amber-400 group-hover:bg-amber-500/20">
                            <i data-lucide="dog" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="text-sm font-medium">3D Voxel Koe</div>
                            <div class="text-xs text-slate-500">Gedetailleerd diermodel</div>
                        </div>
                    </button>

                    <button onclick="addTemplate('house')" class="w-full flex items-center gap-3 p-3 rounded-lg bg-slate-800/30 hover:bg-slate-800 border border-slate-700/30 hover:border-amber-500/50 transition text-left group">
                        <div class="p-2 rounded bg-blue-500/10 text-blue-400 group-hover:bg-blue-500/20">
                            <i data-lucide="home" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="text-sm font-medium">Modern Huis</div>
                            <div class="text-xs text-slate-500">Muren, dak en deuropening</div>
                        </div>
                    </button>

                    <button onclick="addTemplate('tree')" class="w-full flex items-center gap-3 p-3 rounded-lg bg-slate-800/30 hover:bg-slate-800 border border-slate-700/30 hover:border-amber-500/50 transition text-left group">
                        <div class="p-2 rounded bg-emerald-500/10 text-emerald-400 group-hover:bg-emerald-500/20">
                            <i data-lucide="trees" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="text-sm font-medium">Natuur Boom</div>
                            <div class="text-xs text-slate-500">Stam en bladerdak</div>
                        </div>
                    </button>

                    <button onclick="addTemplate('grass')" class="w-full flex items-center gap-3 p-3 rounded-lg bg-slate-800/30 hover:bg-slate-800 border border-slate-700/30 hover:border-amber-500/50 transition text-left group">
                        <div class="p-2 rounded bg-green-500/10 text-green-400 group-hover:bg-green-500/20">
                            <i data-lucide="leaf" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="text-sm font-medium">Grasveld Patch</div>
                            <div class="text-xs text-slate-500">Graspolletjes met bloemen</div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Active Objects List -->
            <div class="p-4 border-t border-slate-800 bg-slate-900/80 h-48 flex flex-col">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center justify-between">
                    <span>Scène Objecten</span>
                    <span id="object-count" class="text-indigo-400">0</span>
                </h2>
                <div id="objects-list" class="flex-1 overflow-y-auto space-y-1 pr-1">
                    <!-- Dynamisch gevuld -->
                </div>
            </div>
        </aside>

        <!-- Center Area: Viewport & Timeline -->
        <section class="flex-1 flex flex-col h-full relative">
            <!-- 3D Canvas Container -->
            <div id="canvas-container" class="flex-1 w-full h-full relative bg-radial-gradient">
                <!-- Viewport Controls Overlay -->
                <div class="absolute top-4 left-4 z-10 flex gap-2 bg-slate-900/80 p-1.5 rounded-lg border border-slate-800 backdrop-blur-sm">
                    <button onclick="resetCamera()" class="p-2 hover:bg-slate-800 rounded text-slate-300 hover:text-white transition" title="Reset Camera">
                        <i data-lucide="video" class="w-4 h-4"></i>
                    </button>
                    <button onclick="clearScene()" class="p-2 hover:bg-red-950/50 rounded text-red-400 hover:text-red-300 transition" title="Leeg Scène">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Timeline Panel -->
            <div class="h-56 border-t border-slate-800 bg-slate-900/90 backdrop-blur-md flex flex-col p-4">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-4">
                        <span class="text-sm font-semibold text-slate-300">Animatie Tijdlijn</span>
                        <div class="flex items-center gap-1 bg-slate-800 rounded-lg p-1 border border-slate-700">
                            <button id="btn-prev-frame" class="p-1.5 hover:bg-slate-700 rounded text-slate-300"><i data-lucide="skip-back" class="w-4 h-4"></i></button>
                            <button id="btn-play" class="p-1.5 hover:bg-slate-700 rounded text-slate-300"><i data-lucide="play" class="w-4 h-4"></i></button>
                            <button id="btn-next-frame" class="p-1.5 hover:bg-slate-700 rounded text-slate-300"><i data-lucide="skip-forward" class="w-4 h-4"></i></button>
                        </div>
                        <span class="text-xs text-slate-400">Huidig Frame: <strong id="current-frame-display" class="text-indigo-400">0</strong> / 100</span>
                    </div>
                    <button id="btn-add-keyframe" class="flex items-center gap-1.5 bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/30 px-3 py-1.5 rounded-lg text-xs font-medium transition">
                        <i data-lucide="key" class="w-3.5 h-3.5"></i> Voeg Keyframe Toe
                    </button>
                </div>

                <!-- Timeline Slider & Track -->
                <div class="flex-1 flex flex-col justify-center relative">
                    <div class="relative w-full h-12 bg-slate-950 rounded-lg border border-slate-800/80 overflow-hidden flex flex-col justify-between">
                        <!-- Tick marks -->
                        <div class="absolute inset-0 flex justify-between px-2 pointer-events-none opacity-20">
                            <!-- Dynamically generated ticks -->
                            <span class="text-[10px]">0</span>
                            <span class="text-[10px]">10</span>
                            <span class="text-[10px]">20</span>
                            <span class="text-[10px]">30</span>
                            <span class="text-[10px]">40</span>
                            <span class="text-[10px]">50</span>
                            <span class="text-[10px]">60</span>
                            <span class="text-[10px]">70</span>
                            <span class="text-[10px]">80</span>
                            <span class="text-[10px]">90</span>
                            <span class="text-[10px]">100</span>
                        </div>
                        <!-- Keyframe Indicators Container -->
                        <div id="keyframe-track" class="absolute inset-x-0 top-4 h-4 pointer-events-none">
                            <!-- Keyframe dots will appear here -->
                        </div>
                        <!-- Slider Input -->
                        <input type="range" id="timeline-slider" min="0" max="100" value="0" class="w-full h-full opacity-70 hover:opacity-100 cursor-pointer accent-indigo-500 bg-transparent relative z-10">
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Sidebar: Properties & Keyframes -->
        <aside class="w-80 border-l border-slate-800 bg-slate-900/50 flex flex-col h-full overflow-y-auto">
            <div class="p-4 border-b border-slate-800">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i> Object Eigenschappen
                </h2>
                
                <div id="no-selection-msg" class="text-center py-8 text-slate-500 text-sm">
                    <i data-lucide="info" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                    Selecteer een object om eigenschappen te wijzigen.
                </div>

                <!-- Properties Form (Verborgen tot selectie) -->
                <div id="properties-panel" class="hidden space-y-4">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Object Naam</label>
                        <input type="text" id="prop-name" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>

                    <!-- Transform: Position -->
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Positie (X, Y, Z)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="number" step="0.1" id="prop-pos-x" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                            <input type="number" step="0.1" id="prop-pos-y" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                            <input type="number" step="0.1" id="prop-pos-z" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                        </div>
                    </div>

                    <!-- Transform: Rotation -->
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Rotatie (Graden X, Y, Z)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="number" id="prop-rot-x" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                            <input type="number" id="prop-rot-y" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                            <input type="number" id="prop-rot-z" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                        </div>
                    </div>

                    <!-- Transform: Scale -->
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Grootte (X, Y, Z)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="number" step="0.1" id="prop-scale-x" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                            <input type="number" step="0.1" id="prop-scale-y" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                            <input type="number" step="0.1" id="prop-scale-z" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                        </div>
                    </div>

                    <!-- Appearance -->
                    <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-800/80">
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">Kleur</label>
                            <div class="flex items-center gap-2">
                                <input type="color" id="prop-color" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0">
                                <span id="color-hex" class="text-xs font-mono text-slate-400">#ffffff</span>
                            </div>
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">Opacity (<span id="opacity-val">100</span>%)</label>
                            <input type="range" id="prop-opacity" min="0" max="100" value="100" class="w-full accent-indigo-500">
                        </div>
                    </div>

                    <!-- Delete Object Button -->
                    <button id="btn-delete-object" class="w-full mt-4 flex items-center justify-center gap-2 bg-red-950/40 hover:bg-red-900/40 text-red-400 border border-red-900/50 py-2 rounded-lg text-sm font-medium transition">
                        <i data-lucide="trash" class="w-4 h-4"></i> Verwijder Object
                    </button>
                </div>
            </div>

            <!-- Keyframes List for Selected Object -->
            <div class="p-4 flex-1 flex flex-col">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i data-lucide="key" class="w-4 h-4 text-indigo-400"></i> Geregistreerde Keyframes
                </h2>
                <div id="keyframes-list" class="flex-1 overflow-y-auto space-y-2 text-xs text-slate-400">
                    <!-- Dynamisch gevuld -->
                </div>
            </div>
        </aside>
    </main>

    <script src="app.js"></script>
    <script>
        // Initialiseer Lucide Icons
        lucide.createIcons();
    </script>
</body>
</html>
