<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MYMUSIC</title>
<link rel="icon" href="data:," />
<style>
  :root{
    --bg:#0b0d10; --panel:#0f1316; --card:#0f1417; --muted:#9aa0a6;
    --accent:#1db954; --glass: rgba(255,255,255,0.03); --radius:12px;
    --shadow: 0 8px 30px rgba(2,6,23,0.6);
    font-family: Inter, "Segoe UI", Roboto, system-ui, -apple-system, Arial;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:linear-gradient(180deg,#071014 0%, #0b0d10 100%);color:#e6eef3;display:flex;flex-direction:column}
  header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);border-bottom:1px solid rgba(255,255,255,0.02)}
  .brand{display:flex;align-items:center;gap:12px;font-weight:700}
  .logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#1db954,#0ea5a3);display:flex;align-items:center;justify-content:center;font-weight:700;color:#021;box-shadow:0 6px 18px rgba(13, 148, 136, 0.12)}
  button{background:#0f1417;color:#e6eef3;border:1px solid rgba(255,255,255,0.03);padding:8px 12px;border-radius:10px;cursor:pointer}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
  button.primary{background:linear-gradient(90deg,var(--accent),#0ea5a3);color:#021;border:0;font-weight:600}
  
  main.app{flex:1;display:grid;grid-template-columns:260px 1fr 300px;gap:18px;padding:18px;align-items:stretch;margin-bottom:90px}
  
  /* Sidebar */
  .sidebar{background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .sidebar-header{display:flex;align-items:center;justify-content:space-between}
  .sidebar h4{margin:0;color:var(--muted);font-size:0.85rem}
  .library-list{flex:1;overflow:auto;padding-right:6px}
  .lib-item{display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted)}
  .lib-item:hover{background:rgba(255,255,255,0.02);color:#fff}
  .lib-item.active{background:linear-gradient(90deg, rgba(29,185,84,0.12), rgba(14,165,163,0.06));color:#fff}
  .lib-left{display:flex;align-items:center;gap:10px}
  .lib-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(180deg,#0b0f10,#0e1416);display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .del-pl-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:4px}
  .del-pl-btn:hover{color:#ff4d4d;background:rgba(255,77,77,0.1)}

  /* Content */
  .content{background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;overflow:hidden}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .search{display:flex;gap:8px;align-items:center;width:100%}
  .search input{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:10px 12px;border-radius:10px;color:#e6eef3;width:100%}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;overflow:auto;padding-bottom:12px}
  .card{background:linear-gradient(180deg,#0b0f11,#0d1113);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
  .card .title{font-weight:700}
  
  /* Playlist view */
  .playlist-header{display:flex;gap:20px;align-items:flex-end;margin-bottom:16px;width:100%}
  .playlist-cover{width:110px;height:110px;border-radius:12px;background:linear-gradient(135deg,#1db954,#0ea5a3);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold;color:#021}
  .playlist-meta{display:flex;flex-direction:column;gap:6px}
  .playlist-type{font-size:0.8rem;text-transform:uppercase;color:var(--muted);letter-spacing:1px}
  .playlist-title-main{font-size:1.8rem;font-weight:800;margin:0}
  
  .track-table{width:100%;border-collapse:collapse;margin-top:10px;text-align:left}
  .track-table th{color:var(--muted);font-weight:500;border-bottom:1px solid rgba(255,255,255,0.05);padding:8px 12px;font-size:0.85rem}
  .track-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.02);font-size:0.9rem;color:var(--muted);cursor:pointer}
  .track-table tr{transition:background 0.2s}
  .track-table tr:hover td{background:rgba(255,255,255,0.02);color:#fff}
  .track-table tr.dragging{opacity:0.4;background:rgba(29,185,84,0.1)}
  .drag-handle{cursor:grab;user-select:none;color:var(--muted);font-size:1.2rem;padding-right:8px}
  .track-title-cell{display:flex;align-items:center;gap:12px;color:#fff;font-weight:600}
  .track-thumb{width:36px;height:36px;border-radius:6px;background:#111;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}

  /* Details */
  .details{background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .art{width:100%;height:200px;border-radius:10px;background:linear-gradient(135deg,#111,#0b0f12);display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--muted)}
  .meta{display:flex;flex-direction:column;gap:6px}
  .meta .name{font-weight:700;font-size:1.05rem}
  .meta .sub{color:var(--muted);font-size:0.9rem;word-break:break-all}

  /* Player Bottom */
  .player-bar{position:fixed;left:18px;right:18px;bottom:18px;height:84px;background:linear-gradient(180deg,#071014,#0b0d10);border-radius:14px;padding:12px 18px;display:flex;align-items:center;gap:18px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 20px 60px rgba(2,6,23,0.6);z-index:100}
  .player-left{display:flex;gap:12px;align-items:center;width:30%}
  .player-thumb{width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,#111,#0b0f12);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);flex-shrink:0}
  .player-info{display:flex;flex-direction:column;overflow:hidden}
  .player-info .title{font-weight:700;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
  .player-info .artist{color:var(--muted);font-size:0.85rem;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
  
  .player-center{flex:1;display:flex;flex-direction:column;gap:6px}
  .controls{display:flex;align-items:center;gap:8px;justify-content:center}
  .controls button{width:40px;height:40px;border-radius:10px}
  
  .progress{height:6px;background:rgba(255,255,255,0.05);border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#0ea5a3);width:0%;pointer-events:none}
  
  .player-right{width:220px;display:flex;align-items:center;justify-content:flex-end;gap:10px}
  .volume-container{display:flex;align-items:center;gap:8px;width:140px}
  .volume-icon{color:var(--muted);font-size:16px;cursor:pointer;user-select:none}
  .volume-slider{width:100%;accent-color:var(--accent);cursor:pointer;height:4px}
  
  .muted{color:var(--muted)}

  @media (max-width:1100px){ main.app{grid-template-columns:220px 1fr} .details{display:none} }
  @media (max-width:700px){ main.app{grid-template-columns:1fr} .sidebar{display:none} .player-bar{left:8px;right:8px} }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">M</div>
      <span>MYMUSIC</span>
    </div>
    <div class="muted" id="status-info">Laden...</div>
  </header>

  <main class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h4>Bibliotheek</h4>
        <button id="btn-new-playlist" class="primary" style="padding:4px 10px;font-size:0.8rem">+ Nieuw</button>
      </div>
      <div class="library-list" id="library-list"></div>
    </aside>

    <section class="content">
      <div class="top-row">
        <div class="search">
          <input id="search" placeholder="Zoek op nummer..." />
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="details" id="details">
      <div class="art">♪</div>
      <div class="meta">
        <div class="name" id="detail-name">Selecteer een nummer</div>
        <div class="sub" id="detail-sub">—</div>
      </div>
    </aside>
  </main>

  <div class="player-bar">
    <div class="player-left">
      <div class="player-thumb">♪</div>
      <div class="player-info">
        <div class="title" id="player-title">Geen nummer</div>
        <div class="artist" id="player-artist">—</div>
      </div>
    </div>

    <div class="player-center">
      <div class="controls">
        <button id="btn-prev" class="ghost">⏮</button>
        <button id="btn-play" class="primary">▶</button>
        <button id="btn-next" class="ghost">⏭</button>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="time-current" class="muted" style="width:35px;font-size:0.8rem">0:00</div>
        <div class="progress" id="progress-container" style="flex:1"><i id="progress-bar"></i></div>
        <div id="time-total" class="muted" style="width:35px;text-align:right;font-size:0.8rem">0:00</div>
      </div>
    </div>

    <div class="player-right">
      <div class="volume-container">
        <span class="volume-icon" id="volume-icon">🔊</span>
        <input type="range" class="volume-slider" id="volume-range" min="0" max="1" step="0.01" value="0.8" />
      </div>
    </div>
  </div>

  <template id="tpl-track-card">
    <div class="card track-card">
      <div style="display:flex;gap:12px;align-items:center">
        <div style="width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,#0b0f12,#111);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0">♪</div>
        <div style="flex:1; overflow:hidden">
          <div class="title" style="white-space:nowrap;text-overflow:ellipsis;overflow:hidden"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:auto">
        <button class="small play">▶</button>
        <button class="small add">+</button>
      </div>
    </div>
  </template>

<script>
(async () => {
  let tracks = []; 
  let playlists = JSON.parse(localStorage.getItem('playlists') || '[]');
  let currentQueue = []; 
  let currentQueueIndex = -1;
  let activePlaylistId = null;
  let activeView = 'all';

  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  const libraryList = document.getElementById('library-list');
  const statusInfo = document.getElementById('status-info');
  const tplTrackCard = document.getElementById('tpl-track-card');
  const detailName = document.getElementById('detail-name');
  const detailSub = document.getElementById('detail-sub');
  const btnNewPlaylist = document.getElementById('btn-new-playlist');

  const audio = new Audio();
  audio.volume = 0.8;

  const btnPlay = document.getElementById('btn-play');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const playerTitle = document.getElementById('player-title');
  const playerArtist = document.getElementById('player-artist');
  const progressBar = document.getElementById('progress-bar');
  const progressContainer = document.getElementById('progress-container');
  const timeCurrent = document.getElementById('time-current');
  const timeTotal = document.getElementById('time-total');
  const volumeRange = document.getElementById('volume-range');
  const volumeIcon = document.getElementById('volume-icon');

  function formatTime(sec){ if(!isFinite(sec)) return '0:00'; const m=Math.floor(sec/60); const s=Math.floor(sec%60).toString().padStart(2,'0'); return `${m}:${s}`; }
  function savePlaylists(){ localStorage.setItem('playlists', JSON.stringify(playlists)); }

  async function loadSongsFromFolder() {
    try {
      const res = await fetch('./music/songs.json');
      if (!res.ok) throw new Error('songs.json niet gevonden');
      tracks = await res.json();
      statusInfo.textContent = `${tracks.length} nummers geladen`;
      renderSidebar();
      filterAndRender();
    } catch (err) {
      statusInfo.textContent = 'Muzieklijst kon niet geladen worden.';
      grid.innerHTML = '<div class="muted">Zorg ervoor dat <b>music/songs.json</b> bestaat.</div>';
    }
  }

  function renderSidebar() {
    libraryList.innerHTML = '';
    
    const allEl = document.createElement('div');
    allEl.className = 'lib-item' + (activeView === 'all' ? ' active' : '');
    allEl.innerHTML = `
      <div class="lib-left">
        <div class="lib-icon">♫</div>
        <div>
          <div>Alle nummers</div>
          <div class="muted" style="font-size:0.8rem">${tracks.length} nummers</div>
        </div>
      </div>
    `;
    allEl.addEventListener('click', () => {
      activeView = 'all';
      activePlaylistId = null;
      renderSidebar();
      filterAndRender();
    });
    libraryList.appendChild(allEl);

    playlists.forEach(pl => {
      const el = document.createElement('div');
      el.className = 'lib-item' + (activePlaylistId === pl.id ? ' active' : '');
      el.innerHTML = `
        <div class="lib-left">
          <div class="lib-icon">📂</div>
          <div>
            <div>${pl.name}</div>
            <div class="muted" style="font-size:0.8rem">${pl.trackIds.length} nummers</div>
          </div>
        </div>
        <button class="del-pl-btn" title="Verwijder afspeellijst">✕</button>
      `;

      el.addEventListener('click', (e) => {
        if (e.target.classList.contains('del-pl-btn')) return;
        activeView = 'playlist';
        activePlaylistId = pl.id;
        renderSidebar();
        renderPlaylistView(pl);
      });

      el.querySelector('.del-pl-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm(`Wil je afspeellijst "${pl.name}" verwijderen?`)) {
          playlists = playlists.filter(p => p.id !== pl.id);
          savePlaylists();
          if (activePlaylistId === pl.id) {
            activeView = 'all';
            activePlaylistId = null;
            filterAndRender();
          }
          renderSidebar();
        }
      });

      libraryList.appendChild(el);
    });
  }

  function renderGrid(list) {
    grid.innerHTML = '';
    if (!list.length) { 
      grid.innerHTML = '<div class="muted">Geen nummers gevonden.</div>'; 
      return; 
    }

    list.forEach(item => {
      const node = tplTrackCard.content.cloneNode(true);
      const card = node.querySelector('.track-card');
      card.querySelector('.title').textContent = item.title;
      
      const playBtn = card.querySelector('.play');
      const addBtn = card.querySelector('.add');

      playBtn.addEventListener('click', () => {
        const listIds = list.map(t => t.id);
        const idx = listIds.indexOf(item.id);
        startQueue(listIds, idx);
      });

      addBtn.addEventListener('click', () => promptAddToPlaylist(item.id));
      grid.appendChild(card);
    });
    updatePlayingIndicators();
  }

  function renderPlaylistView(playlist) {
    grid.innerHTML = '';
    const playlistTracks = playlist.trackIds.map(id => tracks.find(t => t.id === id)).filter(Boolean);

    const q = search.value.trim().toLowerCase();
    const filteredTracks = playlistTracks.filter(t => t.title.toLowerCase().includes(q));

    const header = document.createElement('div');
    header.className = 'playlist-header';
    header.innerHTML = `
      <div class="playlist-cover">📂</div>
      <div class="playlist-meta">
        <div class="playlist-type">Afspeellijst</div>
        <h1 class="playlist-title-main">${playlist.name}</h1>
        <div class="muted">${playlistTracks.length} nummers (Sleep om de volgorde te veranderen)</div>
      </div>
    `;
    grid.appendChild(header);

    if (!filteredTracks.length) {
      const emptyMsg = document.createElement('div');
      emptyMsg.className = 'muted';
      emptyMsg.textContent = 'Deze afspeellijst is nog leeg. Klik op het "+" knopje bij een nummer om het toe te voegen.';
      grid.appendChild(emptyMsg);
      return;
    }

    const table = document.createElement('table');
    table.className = 'track-table';
    table.innerHTML = `
      <thead>
        <tr>
          <th style="width:30px"></th>
          <th style="width:35px">#</th>
          <th>Titel</th>
          <th>Bestand</th>
          <th style="width:40px"></th>
        </tr>
      </thead>
      <tbody id="playlist-tbody"></tbody>
    `;

    const tbody = table.querySelector('tbody');
    
    filteredTracks.forEach((tr, idx) => {
      const trEl = document.createElement('tr');
      trEl.draggable = true;
      trEl.dataset.trackId = tr.id;
      trEl.dataset.index = idx;

      trEl.innerHTML = `
        <td><span class="drag-handle">☰</span></td>
        <td class="track-number">${idx + 1}</td>
        <td>
          <div class="track-title-cell">
            <div class="track-thumb">♪</div>
            <div>${tr.title}</div>
          </div>
        </td>
        <td>${tr.file}</td>
        <td><button class="del-pl-btn" title="Verwijder uit afspeellijst">✕</button></td>
      `;

      trEl.addEventListener('click', (e) => {
        if (e.target.classList.contains('del-pl-btn') || e.target.classList.contains('drag-handle')) return;
        const queueIds = filteredTracks.map(t => t.id);
        startQueue(queueIds, idx);
      });

      trEl.querySelector('.del-pl-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        playlist.trackIds = playlist.trackIds.filter(id => id !== tr.id);
        savePlaylists();
        renderSidebar();
        renderPlaylistView(playlist);
      });

      // Drag & Drop Events
      trEl.addEventListener('dragstart', (e) => {
        trEl.classList.add('dragging');
        e.dataTransfer.setData('text/plain', idx);
      });

      trEl.addEventListener('dragend', () => {
        trEl.classList.remove('dragging');
      });

      tbody.appendChild(trEl);
    });

    // Slepen en neerzetten afhandelen
    tbody.addEventListener('dragover', (e) => {
      e.preventDefault();
      const draggingEl = tbody.querySelector('.dragging');
      if (!draggingEl) return;

      const siblings = [...tbody.querySelectorAll('tr:not(.dragging)')];
      const nextSibling = siblings.find(sibling => {
        const box = sibling.getBoundingClientRect();
        return e.clientY <= box.top + box.height / 2;
      });

      if (nextSibling) {
        tbody.insertBefore(draggingEl, nextSibling);
      } else {
        tbody.appendChild(draggingEl);
      }
    });

    tbody.addEventListener('drop', (e) => {
      e.preventDefault();
      const newTrackIds = [...tbody.querySelectorAll('tr')].map(row => row.dataset.trackId);
      playlist.trackIds = newTrackIds;
      savePlaylists();
      
      // Update nummers in de tabel
      tbody.querySelectorAll('tr').forEach((row, i) => {
        row.querySelector('.track-number').textContent = i + 1;
      });
    });

    grid.appendChild(table);
    updatePlayingIndicators();
  }

  btnNewPlaylist.addEventListener('click', () => {
    const name = prompt('Naam van de nieuwe afspeellijst:');
    if (!name || !name.trim()) return;
    const pl = { id: Date.now().toString(36), name: name.trim(), trackIds: [] };
    playlists.push(pl);
    savePlaylists();
    renderSidebar();
  });

  function promptAddToPlaylist(trackId) {
    if (!playlists.length) {
      alert('Je hebt nog geen afspeellijsten! Maak er eerst een aan met de "+ Nieuw" knop linksboven.');
      return;
    }
    const names = playlists.map((p, i) => `${i + 1}. ${p.name}`).join('\n');
    const choice = prompt(`Kies een afspeellijst om het nummer aan toe te voegen (typ het nummer):\n\n${names}`);
    if (!choice) return;

    const index = parseInt(choice, 10) - 1;
    if (playlists[index]) {
      if (!playlists[index].trackIds.includes(trackId)) {
        playlists[index].trackIds.push(trackId);
        savePlaylists();
        renderSidebar();
        alert(`Toegevoegd aan "${playlists[index].name}"!`);
      } else {
        alert('Dit nummer staat al in deze afspeellijst.');
      }
    } else {
      alert('Ongeldige keuze.');
    }
  }

  function startQueue(trackIds, index = 0) {
    currentQueue = trackIds;
    currentQueueIndex = index;
    playCurrentQueueTrack();
  }

  function playCurrentQueueTrack() {
    if (currentQueueIndex < 0 || currentQueueIndex >= currentQueue.length) return;
    const trackId = currentQueue[currentQueueIndex];
    const track = tracks.find(t => t.id === trackId);
    if (track) playTrack(track);
  }

  function playTrack(track) {
    audio.src = `./music/${track.file}`;
    audio.play();

    playerTitle.textContent = track.title;
    playerArtist.textContent = 'MYMUSIC';
    btnPlay.textContent = '⏸';

    detailName.textContent = track.title;
    detailSub.textContent = track.file;

    updatePlayingIndicators();
  }

  volumeRange.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    audio.volume = val;
    if (val === 0) {
      volumeIcon.textContent = '🔇';
    } else if (val < 0.5) {
      volumeIcon.textContent = '🔉';
    } else {
      volumeIcon.textContent = '🔊';
    }
  });

  volumeIcon.addEventListener('click', () => {
    if (audio.volume > 0) {
      audio.volume = 0;
      volumeRange.value = 0;
      volumeIcon.textContent = '🔇';
    } else {
      audio.volume = 0.8;
      volumeRange.value = 0.8;
      volumeIcon.textContent = '🔊';
    }
  });

  audio.onended = () => {
    if (currentQueue.length > 0) {
      currentQueueIndex = (currentQueueIndex + 1) % currentQueue.length;
      playCurrentQueueTrack();
    }
  };

  audio.onloadedmetadata = () => { timeTotal.textContent = formatTime(audio.duration); };
  audio.ontimeupdate = () => {
    const pct = (audio.currentTime / (audio.duration || 1)) * 100;
    progressBar.style.width = pct + '%';
    timeCurrent.textContent = formatTime(audio.currentTime);
  };

  progressContainer.addEventListener('click', (e) => {
    const rect = progressContainer.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = pos * audio.duration;
  });

  btnPlay.addEventListener('click', () => {
    if (!audio.src) return;
    if (audio.paused) { audio.play(); btnPlay.textContent = '⏸'; } 
    else { audio.pause(); btnPlay.textContent = '▶'; }
    updatePlayingIndicators();
  });

  btnNext.addEventListener('click', () => {
    if (currentQueue.length > 0) {
      currentQueueIndex = (currentQueueIndex + 1) % currentQueue.length;
      playCurrentQueueTrack();
    }
  });

  btnPrev.addEventListener('click', () => {
    if (currentQueue.length > 0) {
      currentQueueIndex = (currentQueueIndex - 1 + currentQueue.length) % currentQueue.length;
      playCurrentQueueTrack();
    }
  });

  function filterAndRender() {
    const q = search.value.trim().toLowerCase();
    if (activeView === 'all') {
      const filtered = tracks.filter(t => t.title.toLowerCase().includes(q));
      renderGrid(filtered);
    } else if (activeView === 'playlist') {
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (pl) renderPlaylistView(pl);
    }
  }

  search.addEventListener('input', filterAndRender);

  function updatePlayingIndicators() {
    const currentTrackId = currentQueue[currentQueueIndex];
    document.querySelectorAll('.track-card').forEach((card) => {
      const title = card.querySelector('.title').textContent;
      const tr = tracks.find(t => t.title === title);
      const btn = card.querySelector('.play');
      if (tr && tr.id === currentTrackId && !audio.paused) {
        btn.textContent = '⏸';
        btn.classList.add('primary');
      } else if (btn) {
        btn.textContent = '▶';
        btn.classList.remove('primary');
      }
    });
  }

  await loadSongsFromFolder();
})();
</script>
</body>
</html>
