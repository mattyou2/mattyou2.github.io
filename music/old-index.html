<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Premium Lokale Muziekspeler</title>
<link rel="icon" href="data:," />
<style>
  /* Premium dark theme layout */
  :root{
    --bg:#0b0d10; --panel:#0f1316; --card:#0f1417; --muted:#9aa0a6;
    --accent:#1db954; --glass: rgba(255,255,255,0.03); --radius:12px;
    --shadow: 0 8px 30px rgba(2,6,23,0.6);
    font-family: Inter, "Segoe UI", Roboto, system-ui, -apple-system, Arial;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:linear-gradient(180deg,#071014 0%, #0b0d10 100%);color:#e6eef3;display:flex;flex-direction:column}
  header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);border-bottom:1px solid rgba(255,255,255,0.02)}
  .brand{display:flex;align-items:center;gap:12px;font-weight:700}
  .logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#1db954,#0ea5a3);display:flex;align-items:center;justify-content:center;font-weight:700;color:#021;box-shadow:0 6px 18px rgba(13, 148, 136, 0.12)}
  .brand span{font-size:1.05rem}
  .top-controls{display:flex;gap:8px;align-items:center}
  button{background:#0f1417;color:#e6eef3;border:1px solid rgba(255,255,255,0.03);padding:8px 12px;border-radius:10px;cursor:pointer}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
  button.primary{background:linear-gradient(90deg,var(--accent),#0ea5a3);color:#021;border:0}
  main.app{flex:1;display:grid;grid-template-columns:260px 1fr 360px;gap:18px;padding:18px;align-items:stretch}
  /* Left sidebar */
  .sidebar{background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .sidebar h4{margin:0 0 6px 0;color:var(--muted);font-size:0.85rem}
  .library-list{flex:1;overflow:auto;padding-right:6px}
  .lib-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted)}
  .lib-item:hover{background:rgba(255,255,255,0.02);color:#fff}
  .lib-item.active{background:linear-gradient(90deg, rgba(29,185,84,0.12), rgba(14,165,163,0.06));color:#fff}
  .lib-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(180deg,#0b0f10,#0e1416);display:flex;align-items:center;justify-content:center;color:var(--muted)}
  /* Center content */
  .content{background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;overflow:hidden}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .search{display:flex;gap:8px;align-items:center}
  .search input{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:10px 12px;border-radius:10px;color:#e6eef3;width:420px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;overflow:auto;padding-bottom:12px}
  .card{background:linear-gradient(180deg,#0b0f11,#0d1113);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
  .card .title{font-weight:700}
  
  /* Playlist view styling (Zoals afbeelding) */
  .playlist-header{display:flex;gap:20px;align-items:flex-end;margin-bottom:16px}
  .playlist-cover{width:140px;height:140px;border-radius:12px;background:linear-gradient(135deg,#1db954,#0ea5a3);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:bold;color:#021}
  .playlist-meta{display:flex;flex-direction:column;gap:6px}
  .playlist-type{font-size:0.8rem;text-transform:uppercase;color:var(--muted);letter-spacing:1px}
  .playlist-title-main{font-size:2.2rem;font-weight:800;margin:0}
  .track-table{width:100%;border-collapse:collapse;margin-top:10px;text-align:left}
  .track-table th{color:var(--muted);font-weight:500;border-bottom:1px solid rgba(255,255,255,0.05);padding:8px 12px;font-size:0.85rem}
  .track-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.02);font-size:0.9rem;color:var(--muted)}
  .track-table tr:hover td{background:rgba(255,255,255,0.02);color:#fff}
  .track-table tr.active td{color:var(--accent)}
  .track-title-cell{display:flex;align-items:center;gap:12px;color:#fff;font-weight:600}
  .track-thumb{width:40px;height:40px;border-radius:6px;background:#111;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted)}

  /* Right details */
  .details{background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .art{width:100%;height:220px;border-radius:10px;background:linear-gradient(135deg,#111,#0b0f12);display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--muted)}
  .meta{display:flex;flex-direction:column;gap:6px}
  .meta .name{font-weight:700;font-size:1.05rem}
  .meta .sub{color:var(--muted);font-size:0.9rem}
  .meta .desc{margin-top:8px;color:var(--muted);font-size:0.9rem;line-height:1.3}
  .meta .edit{margin-top:8px}

  /* Player bottom */
  .player-bar{position:fixed;left:18px;right:18px;bottom:18px;height:84px;background:linear-gradient(180deg,#071014,#0b0d10);border-radius:14px;padding:12px 18px;display:flex;align-items:center;gap:18px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 20px 60px rgba(2,6,23,0.6)}
  .player-left{display:flex;gap:12px;align-items:center;width:36%}
  .player-thumb{width:64px;height:64px;border-radius:8px;background:linear-gradient(135deg,#111,#0b0f12);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted)}
  .player-info{display:flex;flex-direction:column}
  .player-info .title{font-weight:700}
  .player-info .artist{color:var(--muted);font-size:0.9rem}
  .player-center{flex:1;display:flex;flex-direction:column;gap:8px}
  .controls{display:flex;align-items:center;gap:8px;justify-content:center}
  .controls button{width:44px;height:44px;border-radius:10px}
  
  /* Interactive progress bar */
  .progress{height:8px;background:rgba(255,255,255,0.03);border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#0ea5a3);width:0%;pointer-events:none}
  
  .player-right{width:220px;text-align:right;color:var(--muted)}
  .muted{color:var(--muted)}
  .hidden{display:none}

  @media (max-width:1100px){
    main.app{grid-template-columns:220px 1fr}
    .details{display:none}
  }
  @media (max-width:700px){
    header .brand span{display:none}
    main.app{grid-template-columns:1fr}
    .sidebar{display:none}
    .player-bar{left:8px;right:8px}
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">M</div>
      <span>Mijn Muziek</span>
    </div>
    <div class="top-controls">
      <div id="dir-info" class="muted">Aantal nummers geladen: <span id="track-count">0</span></div>
      <button id="btn-scan" class="primary">Vernieuw Map</button>
    </div>
  </header>

  <main class="app">
    <aside class="sidebar" id="sidebar">
      <h4>Bibliotheek</h4>
      <div class="library-list" id="library-list">
        </div>
      <div style="display:flex;gap:8px">
        <button id="btn-new-playlist" class="primary" style="width:100%">+ Nieuwe playlist</button>
      </div>
    </aside>

    <section class="content">
      <div class="top-row">
        <div class="search">
          <input id="search" placeholder="Zoek nummers..." />
        </div>
      </div>

      <div class="grid" id="grid">
        </div>
    </section>

    <aside class="details" id="details">
      <div class="art" id="art">♪</div>
      <div class="meta">
        <div class="name" id="detail-name">Selecteer een nummer</div>
        <div class="sub" id="detail-sub">—</div>
        <div class="desc" id="detail-desc">Beschrijving en metadata verschijnen hier.</div>
        <div class="edit">
          <button id="btn-edit-meta" class="ghost">Bewerk beschrijving</button>
        </div>
      </div>
    </aside>
  </main>

  <div class="player-bar" role="region" aria-label="Afspeelbalk">
    <div class="player-left">
      <div class="player-thumb" id="player-thumb">♪</div>
      <div class="player-info">
        <div class="title" id="player-title">Geen nummer</div>
        <div class="artist" id="player-artist">—</div>
      </div>
    </div>

    <div class="player-center">
      <div class="controls">
        <button id="btn-prev" class="ghost">⏮</button>
        <button id="btn-play" class="primary">▶</button>
        <button id="btn-next" class="ghost">⏭</button>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="time-current" class="muted" style="width:40px">0:00</div>
        <div class="progress" id="progress-container" style="flex:1"><i id="progress-bar"></i></div>
        <div id="time-total" class="muted" style="width:40px;text-align:right">0:00</div>
      </div>
    </div>

    <div class="player-right">
      <div id="player-file" class="muted">—</div>
    </div>
  </div>

  <template id="tpl-lib-item">
    <div class="lib-item">
      <div class="lib-icon">♫</div>
      <div>
        <div class="lib-title"></div>
        <div class="muted lib-sub" style="font-size:0.85rem"></div>
      </div>
    </div>
  </template>

  <template id="tpl-track-card">
    <div class="card track-card">
      <div style="display:flex;gap:12px;align-items:center">
        <div style="width:64px;height:64px;border-radius:8px;background:linear-gradient(135deg,#0b0f12,#111);display:flex;align-items:center;justify-content:center;color:var(--muted)">♪</div>
        <div style="flex:1; overflow:hidden">
          <div class="title" style="white-space:nowrap;text-overflow:ellipsis;overflow:hidden"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
        <button class="small play">▶</button>
        <button class="small add">+</button>
      </div>
    </div>
  </template>

<script>
(async () => {
  // State
  let tracks = []; // [{id, filename, name, url}]
  let playlists = JSON.parse(localStorage.getItem('playlists') || '[]');
  let currentQueue = []; // Active list of track IDs being played
  let currentQueueIndex = -1;
  let activePlaylistId = null;
  let activeView = 'all';

  // LocalStorage setup for persistent Track IDs
  let trackMap = JSON.parse(localStorage.getItem('trackMap') || '{}'); 
  let nextTrackId = parseInt(localStorage.getItem('nextTrackId') || '1', 10);

  // Elements
  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  const libraryList = document.getElementById('library-list');
  const tplLibItem = document.getElementById('tpl-lib-item');
  const tplTrackCard = document.getElementById('tpl-track-card');
  const detailName = document.getElementById('detail-name');
  const detailSub = document.getElementById('detail-sub');
  const detailDesc = document.getElementById('detail-desc');
  const btnEditMeta = document.getElementById('btn-edit-meta');
  const btnNewPlaylist = document.getElementById('btn-new-playlist');
  const btnScan = document.getElementById('btn-scan');
  const trackCountEl = document.getElementById('track-count');

  // Player Elements
  const audio = new Audio();
  audio.preload = 'metadata';
  const btnPlay = document.getElementById('btn-play');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const playerTitle = document.getElementById('player-title');
  const playerArtist = document.getElementById('player-artist');
  const playerFile = document.getElementById('player-file');
  const playerThumb = document.getElementById('player-thumb');
  const progressBar = document.getElementById('progress-bar');
  const progressContainer = document.getElementById('progress-container');
  const timeCurrent = document.getElementById('time-current');
  const timeTotal = document.getElementById('time-total');

  function formatTime(sec){ if(!isFinite(sec)) return '0:00'; const m=Math.floor(sec/60); const s=Math.floor(sec%60).toString().padStart(2,'0'); return `${m}:${s}`; }
  function cleanName(filename) { return filename.replace(/\.[^/.]+$/, ''); }

  // Save State
  function savePlaylists(){ localStorage.setItem('playlists', JSON.stringify(playlists)); }
  function saveTrackMap(){ 
    localStorage.setItem('trackMap', JSON.stringify(trackMap));
    localStorage.setItem('nextTrackId', nextTrackId.toString());
  }

  // Auto-scan /music/ directory
  async function loadMusicFromFolder() {
    // Probeer bekende bestanden uit localStorage of een vooraf gedefinieerde index te halen
    let knownFiles = JSON.parse(localStorage.getItem('discoveredFiles') || '[]');
    
    // Voeg toe / ververs met eventuele nieuwe bestanden in de map
    tracks = knownFiles.map(filename => {
      if (!trackMap[filename]) {
        trackMap[filename] = nextTrackId++;
      }
      return {
        id: trackMap[filename],
        filename: filename,
        name: cleanName(filename),
        url: `music/${filename}`
      };
    });

    saveTrackMap();
    if (trackCountEl) trackCountEl.textContent = tracks.length;
    renderSidebar();
    if (activeView === 'all') renderGrid(tracks);
  }

  // Handmatig bestanden aan de speler toevoegen via een pop-up / invoer voor de music map
  btnScan.addEventListener('click', () => {
    const fileListStr = prompt("Voer de bestandsnamen uit je /music/ map in (gescheiden door een komma):\nBijv: nummer1.mp3, nummer2.mp3");
    if (fileListStr) {
      const parsed = fileListStr.split(',').map(s => s.trim()).filter(s => s.length > 0);
      let currentDiscovered = JSON.parse(localStorage.getItem('discoveredFiles') || '[]');
      let updated = Array.from(new Set([...currentDiscovered, ...parsed]));
      localStorage.setItem('discoveredFiles', JSON.stringify(updated));
      loadMusicFromFolder();
    }
  });

  // Render Sidebar
  function renderSidebar() {
    libraryList.innerHTML = '';
    
    // Alle nummers
    const allNode = tplLibItem.content.cloneNode(true);
    const allEl = allNode.querySelector('.lib-item');
    allEl.querySelector('.lib-title').textContent = 'Alle nummers';
    allEl.querySelector('.lib-sub').textContent = tracks.length + ' tracks';
    if(activeView === 'all') allEl.classList.add('active');
    allEl.addEventListener('click', () => {
      activeView = 'all';
      activePlaylistId = null;
      renderSidebar();
      renderGrid(tracks);
    });
    libraryList.appendChild(allEl);

    // Dynamic Playlists
    playlists.forEach(pl => {
      const node = tplLibItem.content.cloneNode(true);
      const el = node.querySelector('.lib-item');
      el.querySelector('.lib-title').textContent = pl.name;
      el.querySelector('.lib-sub').textContent = pl.trackIds.length + ' nummers';
      if(activePlaylistId === pl.id) el.classList.add('active');
      el.addEventListener('click', () => {
        activeView = 'playlist';
        activePlaylistId = pl.id;
        renderSidebar();
        renderPlaylistView(pl);
      });
      libraryList.appendChild(el);
    });
  }

  // Render Grid (Alle nummers view)
  function renderGrid(list) {
    grid.innerHTML = '';
    if (!list.length) { 
      grid.innerHTML = '<div class="muted">Geen nummers gevonden in de /music/ map. Klik op "Vernieuw Map" om bestanden op te geven.</div>'; 
      return; 
    }

    list.forEach(item => {
      const node = tplTrackCard.content.cloneNode(true);
      const card = node.querySelector('.track-card');
      card.querySelector('.title').textContent = item.name;
      
      const playBtn = card.querySelector('.play');
      const addBtn = card.querySelector('.add');

      playBtn.addEventListener('click', () => {
        startQueue([item.id], 0);
      });

      addBtn.addEventListener('click', () => {
        promptAddToPlaylist(item.id);
      });

      grid.appendChild(card);
    });
    updatePlayingIndicators();
  }

  // Render Spotify-style Playlist view
  function renderPlaylistView(playlist) {
    grid.innerHTML = '';
    const playlistTracks = playlist.trackIds.map(id => tracks.find(t => t.id === id)).filter(Boolean);

    const header = document.createElement('div');
    header.className = 'playlist-header';
    header.innerHTML = `
      <div class="playlist-cover">♪</div>
      <div class="playlist-meta">
        <div class="playlist-type">Afspeellijst</div>
        <h1 class="playlist-title-main">${playlist.name}</h1>
        <div class="muted">${playlistTracks.length} nummers</div>
      </div>
    `;
    grid.appendChild(header);

    if (!playlistTracks.length) {
      const emptyMsg = document.createElement('div');
      emptyMsg.className = 'muted';
      emptyMsg.textContent = 'Deze afspeellijst is nog leeg. Voeg nummers toe met de +-knop.';
      grid.appendChild(emptyMsg);
      return;
    }

    const table = document.createElement('table');
    table.className = 'track-table';
    table.innerHTML = `
      <thead>
        <tr>
          <th style="width:30px">#</th>
          <th>Titel</th>
          <th>Album</th>
          <th>Datum toegevoegd</th>
          <th style="text-align:right">⏱</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

    const tbody = table.querySelector('tbody');
    playlistTracks.forEach((tr, idx) => {
      const trEl = document.createElement('tr');
      trEl.innerHTML = `
        <td>${idx + 1}</td>
        <td>
          <div class="track-title-cell">
            <div class="track-thumb">♪</div>
            <div>${tr.name}</div>
          </div>
        </td>
        <td>Music</td>
        <td>Vandaag</td>
        <td style="text-align:right" class="duration-cell" id="dur-${tr.id}">--:--</td>
      `;

      // Klikken om af te spelen
      trEl.addEventListener('click', () => {
        const queueIds = playlistTracks.map(t => t.id);
        startQueue(queueIds, idx);
      });

      // Duur van nummer ophalen
      const dummyAudio = new Audio(tr.url);
      dummyAudio.onloadedmetadata = () => {
        const durCell = trEl.querySelector(`#dur-${tr.id}`);
        if(durCell) durCell.textContent = formatTime(dummyAudio.duration);
      };

      tbody.appendChild(trEl);
    });

    grid.appendChild(table);
    updatePlayingIndicators();
  }

  // Playlist management
  btnNewPlaylist.addEventListener('click', () => {
    const name = prompt('Naam van nieuwe afspeellijst:');
    if (!name) return;
    const pl = { id: Date.now().toString(36), name, trackIds: [] };
    playlists.push(pl);
    savePlaylists();
    renderSidebar();
  });

  function promptAddToPlaylist(trackId) {
    if (!playlists.length) {
      alert('Maak eerst een afspeellijst aan via het zijmenu.');
      return;
    }
    const names = playlists.map((p, i) => `${i + 1}. ${p.name}`).join('\n');
    const choice = prompt(`Kies een afspeellijst (typ het nummer):\n${names}`);
    const index = parseInt(choice, 10) - 1;
    if (playlists[index]) {
      if (!playlists[index].trackIds.includes(trackId)) {
        playlists[index].trackIds.push(trackId);
        savePlaylists();
        renderSidebar();
        alert('Toegevoegd aan ' + playlists[index].name);
      } else {
        alert('Dit nummer staat al in deze afspeellijst.');
      }
    }
  }

  // Queue & Player Logic
  function startQueue(trackIds, index = 0) {
    currentQueue = trackIds;
    currentQueueIndex = index;
    playCurrentQueueTrack();
  }

  function playCurrentQueueTrack() {
    if (currentQueueIndex < 0 || currentQueueIndex >= currentQueue.length) return;
    const trackId = currentQueue[currentQueueIndex];
    const track = tracks.find(t => t.id === trackId);
    if (track) playTrack(track);
  }

  function playTrack(track) {
    audio.src = track.url;
    audio.play().catch(e => console.error("Kon niet afspelen:", e));

    playerTitle.textContent = track.name;
    playerArtist.textContent = 'Lokale Audio';
    playerFile.textContent = track.name;
    btnPlay.textContent = '⏸';

    detailName.textContent = track.name;
    detailSub.textContent = track.filename;
    detailDesc.textContent = localStorage.getItem('desc_' + track.id) || 'Geen beschrijving ingevoerd.';

    updatePlayingIndicators();
  }

  // Auto-next en looping binnen playlist
  audio.onended = () => {
    if (currentQueue.length > 0) {
      currentQueueIndex++;
      if (currentQueueIndex >= currentQueue.length) {
        currentQueueIndex = 0; // Loop terug naar het begin van de playlist
      }
      playCurrentQueueTrack();
    } else {
      btnPlay.textContent = '▶';
      updatePlayingIndicators();
    }
  };

  audio.onloadedmetadata = () => { timeTotal.textContent = formatTime(audio.duration); };
  audio.ontimeupdate = () => {
    const pct = (audio.currentTime / (audio.duration || 1)) * 100;
    progressBar.style.width = pct + '%';
    timeCurrent.textContent = formatTime(audio.currentTime);
  };

  // Slepen & klikbare progress bar
  let isSeeking = false;
  function seek(e) {
    const rect = progressContainer.getBoundingClientRect();
    const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    if (audio.duration) {
      audio.currentTime = pos * audio.duration;
    }
  }

  progressContainer.addEventListener('mousedown', (e) => {
    isSeeking = true;
    seek(e);
  });
  window.addEventListener('mousemove', (e) => { if (isSeeking) seek(e); });
  window.addEventListener('mouseup', () => { isSeeking = false; });

  // Player controls
  btnPlay.addEventListener('click', () => {
    if (!audio.src) return;
    if (audio.paused) { audio.play(); btnPlay.textContent = '⏸'; } 
    else { audio.pause(); btnPlay.textContent = '▶'; }
    updatePlayingIndicators();
  });

  btnNext.addEventListener('click', () => {
    if (currentQueue.length > 0) {
      currentQueueIndex = (currentQueueIndex + 1) % currentQueue.length;
      playCurrentQueueTrack();
    }
  });

  btnPrev.addEventListener('click', () => {
    if (currentQueue.length > 0) {
      currentQueueIndex = (currentQueueIndex - 1 + currentQueue.length) % currentQueue.length;
      playCurrentQueueTrack();
    }
  });

  // Edit Metadata
  btnEditMeta.addEventListener('click', () => {
    if (currentQueueIndex === -1) return;
    const currentTrackId = currentQueue[currentQueueIndex];
    const oldDesc = localStorage.getItem('desc_' + currentTrackId) || '';
    const newDesc = prompt('Beschrijving voor dit nummer:', oldDesc);
    if (newDesc !== null) {
      localStorage.setItem('desc_' + currentTrackId, newDesc);
      detailDesc.textContent = newDesc;
    }
  });

  // Search filter
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    const filtered = tracks.filter(t => t.name.toLowerCase().includes(q));
    if (activeView === 'all') renderGrid(filtered);
  });

  function updatePlayingIndicators() {
    const currentTrackId = currentQueue[currentQueueIndex];
    document.querySelectorAll('.track-card').forEach((card, idx) => {
      const tr = tracks[idx];
      const btn = card.querySelector('.play');
      if (tr && tr.id === currentTrackId && !audio.paused) {
        btn.textContent = '⏸';
        btn.classList.add('primary');
      } else if (btn) {
        btn.textContent = '▶';
        btn.classList.remove('primary');
      }
    });
  }

  // Initialize
  await loadMusicFromFolder();

})();
</script>
</body>
</html>
