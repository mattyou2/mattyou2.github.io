<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn AI Webapp</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 450px; height: 550px; background: #1e1e1e; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header { background: #007bff; padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 6px; max-width: 80%; line-height: 1.4; word-break: break-word; }
        .user { background: #007bff; align-self: flex-end; }
        .ai { background: #333; align-self: flex-start; }
        .input-box { display: flex; padding: 15px; background: #1a1a1a; gap: 8px; }
        input { flex: 1; padding: 12px; border: none; background: #2a2a2a; color: white; border-radius: 4px; font-size: 1rem; }
        input:focus { outline: 2px solid #007bff; }
        button { background: #007bff; color: white; border: none; padding: 0 18px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header" id="status">Mijn Lokale AI Assistent</div>
        <div id="chat-box" class="chat-box">
            <div class="msg ai">Hallo! Typ hieronder je vraag. De allereerste reactie kan even 10 seconden duren omdat ik mezelf opstart.</div>
        </div>
        <div class="input-box">
            <!-- De balk staat nu direct OPEN zodat je er direct in kunt klikken en typen -->
            <input type="text" id="user-input" placeholder="Typ hier je bericht..." autofocus>
            <button id="send-btn">Stuur</button>
        </div>
    </div>

    <script type="module">
        // We importeren de AI-bibliotheek
        import { pipeline } from 'https://jsdelivr.net';

        let aiModel = null;
        const statusHeader = document.getElementById('status');
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBox = document.getElementById('chat-box');

        // Functie die de AI op de achtergrond inlaadt
        async function loadModel() {
            try {
                if (!aiModel) {
                    aiModel = await pipeline('text2text-generation', 'Xenova/LaMini-Flan-T5-78M');
                }
                return aiModel;
            } catch (err) {
                console.error("Model laadfout:", err);
                return null;
            }
        }

        async function handleChat() {
            const text = inputField.value.trim();
            if (!text) return; // Doe niks als de balk leeg is

            // Toon direct jouw bericht op het scherm
            appendMessage(text, 'user');
            inputField.value = ''; // Maak de typbalk meteen weer leeg
            
            // Toon dat de AI bezig is
            statusHeader.innerText = "AI denkt na...";
            statusHeader.style.background = "#ff9800";

            try {
                // Laad het model (of pak de al geladen versie)
                const model = await loadModel();
                
                if (model) {
                    // Genereer het antwoord
                    const response = await model(text, { max_new_tokens: 60, temperature: 0.7 });
                    appendMessage(response[0].generated_text, 'ai');
                } else {
                    appendMessage("Oeps, ik kon het AI-model niet lokaal opstarten.", 'ai');
                }
            } catch (error) {
                appendMessage("Er is een fout opgetreden bij het berekenen van het antwoord.", 'ai');
                console.error(error);
            }

            // Zet status weer terug naar normaal
            statusHeader.innerText = "Mijn Lokale AI Assistent";
            statusHeader.style.background = "#007bff";
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.classList.add('msg', sender);
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight; // Scroll automatisch omlaag
        }

        // Luister naar de klik op de knop en de Enter-toets
        sendBtn.addEventListener('click', handleChat);
        inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChat(); });
    </script>
</body>
</html>
