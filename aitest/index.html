<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobiele Lokale AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f9f9fb;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        #chatbox {
            height: 60vh;
            border: 1px solid #e1e1e8;
            background: #fff;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .msg { margin: 10px 0; padding: 10px; border-radius: 8px; max-width: 85%; }
        .user { color: #fff; background: #007AFF; margin-left: auto; text-align: right; }
        .ai { color: #000; background: #E9E9EB; margin-right: auto; }
        .status-box {
            padding: 10px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #e1e1e8;
            margin-bottom: 15px;
            font-size: 0.85em;
            text-align: center;
        }
        .progress-bg { background: #eee; border-radius: 4px; height: 6px; margin-top: 5px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: #34C759; transition: width 0.1s ease; }
        .input-area { display: flex; gap: 8px; }
        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 22px;
            font-size: 16px; /* Voorkomt automatisch zoomen op iPhone */
        }
        button {
            padding: 0 20px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 22px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <h3>📱 Mobiele Browser AI</h3>
        
        <div class="status-box">
            <div id="status">Opstarten...</div>
            <div class="progress-bg"><div id="progress" class="progress-bar"></div></div>
        </div>
        
        <div id="chatbox"></div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Typ een bericht..." disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>Stuur</button>
        </div>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://jsdelivr.net';

        // CRUCIAL VOOR MOBIEL: Voorkom dat de browser crash door te zware caching op GitHub Pages
        env.useBrowserCache = true; 

        let generator;
        const statusDiv = document.getElementById('status');
        const progressBar = document.getElementById('progress');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        async function initAI() {
            try {
                statusDiv.innerText = "Lichtgewicht model downloaden...";
                
                // We gebruiken LaMini-GPT-22M: extreem compact (~15MB), perfect voor telefoons
                generator = await pipeline('text-generation', 'Xenova/LaMini-GPT-22M', {
                    progress_callback: (data) => {
                        if (data.status === 'progress') {
                            progressBar.style.width = `${data.progress}%`;
                            statusDiv.innerText = `Laden: ${Math.round(data.progress)}%`;
                        } else if (data.status === 'ready') {
                            progressBar.style.width = '100%';
                            statusDiv.innerText = "⚡ Model geladen in telefoongeheugen!";
                        }
                    }
                });

                statusDiv.innerText = "✅ AI is klaar voor gebruik!";
                userInput.disabled = false;
                sendBtn.disabled = false;
            } catch (error) {
                statusDiv.innerText = "❌ Fout: " + error.message;
                console.error(error);
            }
        }

        window.sendMessage = async function() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('Jij', text, 'user');
            userInput.value = '';
            statusDiv.innerText = "AI denkt na...";
            sendBtn.disabled = true;

            try {
                const output = await generator(text, { 
                    max_new_tokens: 30, 
                    temperature: 0.7,
                    repetition_penalty: 1.2
                });
                
                let reply = output[0].generated_text;
                if (reply.startsWith(text)) {
                    reply = reply.substring(text.length).trim();
                }

                appendMessage('AI', reply || "...", 'ai');
            } catch (e) {
                appendMessage('Systeem', 'Oeps, de telefoon-processor raakte overbelast.', 'ai');
            }

            statusDiv.innerText = "✅ AI is klaar voor gebruik!";
            sendBtn.disabled = false;
        };

        function appendMessage(sender, text, className) {
            const chatbox = document.getElementById('chatbox');
            chatbox.innerHTML += `<div class="msg ${className}"><strong>${sender}:</strong><br>${text}</div>`;
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        initAI();
    </script>
</body>
</html>
