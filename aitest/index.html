<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokale Browser AI (Zonder API)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        #chatbox {
            height: 300px;
            border: 1px solid #ccc;
            background: #fff;
            padding: 10px;
            overflow-y: scroll;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .user { color: blue; margin: 5px 0; }
        .ai { color: green; margin: 5px 0; font-weight: bold; }
        .status { color: gray; font-style: italic; font-size: 0.9em; }
        input[type="text"] {
            width: 75%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 20%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

    <h2>🤖 Lokale Browser AI</h2>
    <div id="status" class="status">Model laden... Een moment geduld (dit kan even duren bij de eerste start).</div>
    
    <div id="chatbox"></div>
    
    <input type="text" id="userInput" placeholder="Typ een bericht..." disabled>
    <button id="sendBtn" onclick="sendMessage()" disabled>Stuur</button>

    <!-- Importeer Transformers.js via een gratis CDN -->
    <script type="module">
        import { pipeline } from 'https://jsdelivr.net';

        let generator;
        const statusDiv = document.getElementById('status');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Initialiseer de AI met een zeer licht tekstgeneratiemodel (Xenova/Qwen1.5-0.5B-Chat)
        async function initAI() {
            try {
                statusDiv.innerText = "Model wordt gedownload naar je browser-cache...";
                generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat');
                statusDiv.innerText = "✅ AI is klaar voor gebruik! (Draait 100% lokaal)";
                userInput.disabled = false;
                sendBtn.disabled = false;
            } catch (error) {
                statusDiv.innerText = "❌ Fout bij laden model: " + error.message;
            }
        }

        // Maak de functie wereldwijd beschikbaar voor de HTML-knop
        window.sendMessage = async function() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('Jij', text, 'user');
            userInput.value = '';
            statusDiv.innerText = "AI is aan het nadenken...";
            sendBtn.disabled = true;

            try {
                // Genereer het antwoord
                const output = await generator(text, { 
                    max_new_tokens: 50, 
                    temperature: 0.7 
                });
                
                let reply = output[0].generated_text;
                // Verwijder de originele prompt uit de tekst indien nodig
                if (reply.startsWith(text)) {
                    reply = reply.substring(text.length).trim();
                }

                appendMessage('AI', reply || "Ik weet even geen antwoord.", 'ai');
            } catch (e) {
                appendMessage('Systeem', 'Er ging iets mis tijdens het genereren.', 'status');
            }

            statusDiv.innerText = "✅ AI is klaar voor gebruik!";
            sendBtn.disabled = false;
        };

        function appendMessage(sender, text, className) {
            const chatbox = document.getElementById('chatbox');
            chatbox.innerHTML += `<div class="${className}"><strong>${sender}:</strong> ${text}</div>`;
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        // Start het proces direct
        initAI();
    </script>
</body>
</html>
