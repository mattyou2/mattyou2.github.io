<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    
    /* Overlay voor eerste klik (vereist door browsers voor audio & fullscreen) */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    #start-card {
      background: #1e293b;
      padding: 30px 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    #start-card h2 {
      margin-bottom: 10px;
      color: #38bdf8;
    }

    /* Hoofdscherm / Standaard weergave */
    #main-display {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    #text-overlay {
      font-size: 3.5rem;
      font-weight: bold;
      padding: 20px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
    }

    /* Iframe Container */
    #iframe-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      z-index: 50;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="start-overlay" onclick="activateSystem()">
    <div id="start-card">
      <h2>Klik ergens om te starten</h2>
      <p>Klik op het scherm om de weergave te laden.</p>
    </div>
  </div>

  <div id="main-display">
    <div id="text-overlay">Wachten op signaal...</div>
  </div>

  <div id="iframe-container">
    <iframe id="target-iframe" src=""></iframe>
  </div>

  <script>
    const RECEIVER_ID = "mattyou-remote-receiver-screen";
    const peer = new Peer(RECEIVER_ID);
    let audioActive = false;

    // Betrouwbare CORS-vriendelijke audio links
    const soundLibrary = {
      fart: "https://upload.wikimedia.org/wikipedia/commons/e/e8/Fart-sound.mp3",
      scream: "https://upload.wikimedia.org/wikipedia/commons/3/3d/Male_Scream.ogg",
      airhorn: "https://raw.githubusercontent.com/rafaelreis-hotmart/Audio-Samples/main/airhorn.mp3",
      bell: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Service_bell_ding.wav",
      error: "https://upload.wikimedia.org/wikipedia/commons/d/dd/Windows_Error_Sound.mp3"
    };

    // Activeer geluid & Volledig Scherm bij de eerste klik
    function activateSystem() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => console.log(err));
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }

      audioActive = true;
      speakText("Systeem geactiveerd");

      document.getElementById('start-overlay').style.display = 'none';
    }

    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        handleCommand(data);
      });
    });

    // Spraakfunctie (TTS)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'nl-NL';
        window.speechSynthesis.speak(utterance);
      }
    }

    // Audio afspelen met foutafhandeling
    function playSound(soundKey) {
      const url = soundLibrary[soundKey] || soundKey;
      if (url) {
        const audio = new Audio(url);
        audio.play().catch(e => {
          console.error("Audio kon niet worden afgespeeld:", e);
        });
      }
    }

    // Iframe verbergen en terugkeren naar het hoofdmenu
    function stopIframe() {
      const container = document.getElementById('iframe-container');
      const iframe = document.getElementById('target-iframe');
      container.style.display = "none";
      iframe.src = "";
    }

    // Inkomende commando's verwerken
    function handleCommand(data) {
      if (data.type === 'tts') {
        speakText(data.value);
      } else if (data.type === 'sound') {
        playSound(data.value);
      } else if (data.type === 'text') {
        // Sluit eventueel openstaand iframe zodat de tekst direct te zien is
        stopIframe();
        document.getElementById('text-overlay').innerText = data.value;
      } else if (data.type === 'iframe') {
        const container = document.getElementById('iframe-container');
        const iframe = document.getElementById('target-iframe');
        if (data.value && data.value.trim() !== "") {
          iframe.src = data.value;
          container.style.display = "block";
        } else {
          stopIframe();
        }
      } else if (data.type === 'stopIframe') {
        stopIframe();
      }
    }
  </script>
</body>
</html>
