<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Designer — Mattyou Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#0a0c11;
  --bg2:#0f1218;
  --panel: rgba(255,255,255,0.045);
  --panel-solid:#12151c;
  --border: rgba(255,255,255,0.09);
  --text:#e8eaf1;
  --muted:#8b93a7;
  --muted2:#5b6377;
  --accent1:#8b5cf6;
  --accent2:#22d3ee;
  --grad: linear-gradient(135deg, var(--accent1), var(--accent2));
  --danger:#f0556c;
  --ok:#3ddc97;
  --radius:12px;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent1); color:#fff;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12); border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2);}

.app{ height:100vh; display:flex; flex-direction:column; background:
  radial-gradient(1200px 600px at 15% -10%, rgba(139,92,246,0.16), transparent 60%),
  radial-gradient(1000px 500px at 110% 10%, rgba(34,211,238,0.10), transparent 55%),
  var(--bg);
}

/* ---------- TOPBAR ---------- */
.topbar{
  height:56px; flex:0 0 56px;
  display:flex; align-items:center; gap:14px;
  padding:0 16px;
  background:rgba(15,18,24,0.75);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  z-index:50;
}
.logo{ display:flex; align-items:center; gap:10px; margin-right:6px; }
.logo-mark{
  width:30px; height:30px; border-radius:9px;
  background:var(--grad);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; color:#0a0c11; font-size:15px;
  box-shadow:0 4px 16px rgba(139,92,246,0.4);
}
.logo-text{ display:flex; flex-direction:column; line-height:1.1; }
.logo-text b{ font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:0.2px;}
.logo-text span{ font-size:9.5px; color:var(--muted2); letter-spacing:0.3px; }
.topbar-sep{ width:1px; align-self:stretch; margin:10px 4px; background:var(--border); }

.pagetabs{ display:flex; align-items:center; gap:6px; flex:1; overflow-x:auto; padding:0 4px;}
.pagetab{
  display:flex; align-items:center; gap:6px;
  padding:6px 10px; border-radius:8px; font-size:12.5px; white-space:nowrap;
  color:var(--muted); cursor:pointer; border:1px solid transparent;
}
.pagetab.active{ background:var(--panel); border-color:var(--border); color:var(--text); }
.pagetab:hover{ color:var(--text); }
.pagetab .x{ opacity:0.5; padding:0 2px;}
.pagetab .x:hover{ opacity:1; color:var(--danger);}
.addpage{ width:26px; height:26px; border-radius:7px; border:1px dashed var(--border); color:var(--muted); display:flex;align-items:center;justify-content:center; cursor:pointer; flex:0 0 auto;}
.addpage:hover{ color:var(--text); border-color:var(--accent2); }

.topbar-actions{ display:flex; align-items:center; gap:8px; }

.btn{
  appearance:none; border:1px solid var(--border); background:var(--panel);
  color:var(--text); font-family:var(--font-body); font-size:12.5px; font-weight:500;
  padding:8px 13px; border-radius:9px; cursor:pointer; display:flex; align-items:center; gap:6px;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
}
.btn:hover{ border-color:rgba(255,255,255,0.22); background:rgba(255,255,255,0.08); }
.btn:active{ transform:scale(0.96); }
.btn.primary{ background:var(--grad); border:none; color:#0a0c11; font-weight:600; }
.btn.primary:hover{ filter:brightness(1.08); }
.btn.ghost{ background:transparent; }
.btn.icon{ padding:8px; width:34px; height:34px; justify-content:center; }
.btn.small{ padding:5px 9px; font-size:11.5px; }
.btn.danger{ color:var(--danger); border-color:rgba(240,85,108,0.35); }
.btn.danger:hover{ background:rgba(240,85,108,0.12); }

/* ---------- LAYOUT ---------- */
.main{ flex:1; display:flex; min-height:0; }

.rail{
  flex:0 0 252px; display:flex; flex-direction:column;
  background:rgba(15,18,24,0.55); backdrop-filter:blur(16px);
  border-right:1px solid var(--border);
}
.rail.right{ border-right:none; border-left:1px solid var(--border); flex:0 0 300px;}
.rail-tabs{ display:flex; border-bottom:1px solid var(--border); padding:8px 8px 0; gap:4px;}
.rail-tab{ flex:1; text-align:center; padding:9px 4px; font-size:11.5px; color:var(--muted); cursor:pointer; border-radius:8px 8px 0 0; font-weight:500;}
.rail-tab.active{ color:var(--text); background:var(--panel); }
.rail-body{ flex:1; overflow-y:auto; padding:14px; }
.rail-section-title{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted2); margin:14px 0 8px; font-weight:600;}
.rail-section-title:first-child{ margin-top:0;}

.obj-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.obj-item{
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:12px 8px; display:flex; flex-direction:column; align-items:center; gap:6px;
  cursor:grab; font-size:10.5px; color:var(--muted); text-align:center; user-select:none;
  transition:border-color .12s, color .12s, transform .12s;
}
.obj-item:hover{ border-color:var(--accent2); color:var(--text); transform:translateY(-1px);}
.obj-item:active{ cursor:grabbing; }
.obj-item .ic{ font-size:19px; }

.bg-item{
  border:1px solid var(--border); border-radius:10px; padding:10px; cursor:pointer; margin-bottom:10px;
  display:flex; align-items:center; gap:10px; background:var(--panel);
}
.bg-item:hover{ border-color:var(--accent2); }
.bg-item.active{ border-color:var(--accent1); box-shadow:0 0 0 1px var(--accent1); }
.bg-swatch{ width:38px; height:32px; border-radius:7px; flex:0 0 auto; border:1px solid rgba(255,255,255,0.15); }
.bg-item .lbl{ font-size:12px; font-weight:500; }
.bg-item .sub{ font-size:10px; color:var(--muted2); }

.tpl-card{
  border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:12px; cursor:pointer; background:var(--panel);
}
.tpl-card:hover{ border-color:var(--accent2); }
.tpl-thumb{ height:80px; display:flex; align-items:center; justify-content:center; font-size:26px;}
.tpl-info{ padding:9px 11px; border-top:1px solid var(--border);}
.tpl-info b{ font-size:12.5px; }
.tpl-info p{ margin:3px 0 0; font-size:10.5px; color:var(--muted2); }

/* ---------- CANVAS ---------- */
.canvas-wrap{
  flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center;
  padding:36px; position:relative;
}
.canvas-shell{ box-shadow:0 30px 80px rgba(0,0,0,0.55); border-radius:14px; overflow:visible; position:relative;}
.canvas{
  width:1200px; height:800px; position:relative; overflow:hidden; border-radius:14px;
  background:#101319; border:1px solid var(--border);
}
.canvas.mode-preview .el{ cursor:default !important; }
.canvas-label{ position:absolute; top:-26px; left:0; font-size:11px; color:var(--muted2); display:flex; gap:10px; align-items:center;}
.canvas-badge{ background:var(--panel); border:1px solid var(--border); padding:3px 9px; border-radius:20px; font-size:10.5px;}

.el{
  position:absolute; cursor:move; outline:none;
}
.el.selected{ box-shadow:0 0 0 2px var(--accent2); }
.el:hover:not(.selected){ box-shadow:0 0 0 1px rgba(34,211,238,0.5); }
.el[data-el-type="text"], .el[data-el-type="heading"], .el[data-el-type="button"]{ display:flex; align-items:center; }
.el .resize-handle{
  position:absolute; right:-6px; bottom:-6px; width:13px; height:13px; border-radius:4px;
  background:var(--accent2); border:2px solid #0a0c11; cursor:nwse-resize; display:none;
}
.el.selected .resize-handle{ display:block; }
.el-label{
  position:absolute; top:-20px; left:0; font-size:9.5px; background:var(--accent1); color:#fff;
  padding:1px 6px; border-radius:5px; white-space:nowrap; display:none; font-family:var(--font-mono);
}
.el.selected .el-label{ display:block; }

.liquid-glass{
  background:rgba(255,255,255,0.08) !important;
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid rgba(255,255,255,0.25) !important;
  box-shadow:0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.25);
}

.bg3d{ position:absolute; inset:0; overflow:hidden; z-index:0; perspective:900px;}
.bg3d .cube{
  position:absolute; width:70px; height:70px; transform-style:preserve-3d;
  animation:spin3d 14s linear infinite; opacity:0.35;
}
.bg3d .cube div{ position:absolute; width:70px; height:70px; border:1px solid rgba(139,92,246,0.6); background:rgba(139,92,246,0.06);}
.bg3d .cube .f1{ transform:translateZ(35px);} .bg3d .cube .f2{ transform:rotateY(90deg) translateZ(35px);}
.bg3d .cube .f3{ transform:rotateY(180deg) translateZ(35px);} .bg3d .cube .f4{ transform:rotateY(-90deg) translateZ(35px);}
.bg3d .cube .f5{ transform:rotateX(90deg) translateZ(35px);} .bg3d .cube .f6{ transform:rotateX(-90deg) translateZ(35px);}
@keyframes spin3d{ from{transform:rotateX(0) rotateY(0);} to{transform:rotateX(360deg) rotateY(360deg);} }

.bg-glasswave{ position:absolute; inset:0; overflow:hidden; z-index:0;}
.bg-glasswave .blob{ position:absolute; border-radius:50%; filter:blur(50px); opacity:0.55; animation:floatBlob 10s ease-in-out infinite;}
@keyframes floatBlob{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(30px,-25px) scale(1.12);} }

.bg-animated-grad{ background-size:220% 220% !important; animation:gradShift 9s ease infinite;}

.bg-starfield{ position:absolute; inset:0; overflow:hidden; z-index:0;}
.bg-starfield .star{ position:absolute; border-radius:50%; background:#fff; box-shadow:0 0 4px rgba(255,255,255,0.8); animation:twinkle 3.5s ease-in-out infinite;}
.bg-starfield .star-glow{ position:absolute; border-radius:50%; background:radial-gradient(circle, rgba(139,92,246,0.35), transparent 70%); filter:blur(6px);}
@keyframes twinkle{ 0%,100%{opacity:0.25;} 50%{opacity:1;} }

/* ---------- snap guides ---------- */
.snap-guide{ position:absolute; background:var(--accent2); z-index:9999; pointer-events:none; box-shadow:0 0 6px rgba(34,211,238,0.8);}
.snap-guide.v{ width:1px; top:0; bottom:0; }
.snap-guide.h{ height:1px; left:0; right:0; }

/* ---------- align toggle switch (top of right rail) ---------- */
.snap-toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); background:rgba(255,255,255,0.02);}
.switch{ position:relative; width:36px; height:20px; flex:0 0 auto;}
.switch input{ opacity:0; width:0; height:0; }
.switch .slider{ position:absolute; inset:0; background:rgba(255,255,255,0.15); border-radius:20px; cursor:pointer; transition:.15s;}
.switch .slider:before{ content:''; position:absolute; width:14px; height:14px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s;}
.switch input:checked + .slider{ background:var(--grad); }
.switch input:checked + .slider:before{ transform:translateX(16px); }

/* ---------- context menu ---------- */
.ctx-menu{ position:fixed; z-index:500; background:var(--panel-solid); border:1px solid var(--border); border-radius:10px; padding:6px; min-width:190px; box-shadow:0 20px 50px rgba(0,0,0,0.5); display:none;}
.ctx-menu.show{ display:block; }
.ctx-item{ padding:8px 10px; font-size:12.5px; border-radius:7px; cursor:pointer; display:flex; align-items:center; gap:8px; color:var(--text);}
.ctx-item:hover{ background:var(--panel); }
.ctx-item.disabled{ opacity:0.35; pointer-events:none; }
.ctx-sep{ height:1px; background:var(--border); margin:5px 2px; }
.ctx-key{ margin-left:auto; font-size:10px; color:var(--muted2); font-family:var(--font-mono);}

/* ---------- align buttons ---------- */
.align-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.align-grid .btn{ padding:8px 4px; justify-content:center; font-size:13px; }

/* ---------- timeline bar ---------- */
.timeline-bar{ flex:0 0 190px; border-top:1px solid var(--border); background:rgba(12,14,20,0.9); backdrop-filter:blur(16px); display:none; flex-direction:column; }
.timeline-bar.show{ display:flex; }
.timeline-head{ display:flex; align-items:center; gap:10px; padding:9px 16px; border-bottom:1px solid var(--border); }
.timeline-head b{ font-size:12px; }
.timeline-time{ font-family:var(--font-mono); font-size:11.5px; color:var(--muted); background:rgba(255,255,255,0.05); padding:3px 8px; border-radius:6px;}
.timeline-track-wrap{ flex:1; position:relative; padding:16px; overflow-x:auto; }
.timeline-ruler{ position:relative; height:44px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px; cursor:pointer; min-width:600px;}
.timeline-tick{ position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,0.08); }
.timeline-tick span{ position:absolute; top:2px; left:4px; font-size:9px; color:var(--muted2); font-family:var(--font-mono);}
.timeline-kf{ position:absolute; top:50%; width:13px; height:13px; background:var(--accent1); border:2px solid #0a0c11; transform:translate(-50%,-50%) rotate(45deg); cursor:pointer; z-index:5;}
.timeline-kf:hover, .timeline-kf.active{ background:var(--accent2); }
.timeline-playhead{ position:absolute; top:-6px; bottom:-6px; width:2px; background:#fff; z-index:6; pointer-events:none; box-shadow:0 0 6px #fff;}
.timeline-playhead:before{ content:''; position:absolute; top:-5px; left:-5px; width:12px; height:12px; background:#fff; border-radius:3px 3px 3px 0; transform:rotate(45deg); }
@keyframes gradShift{ 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

/* ---------- PROPERTIES PANEL ---------- */
.prop-group{ margin-bottom:16px; }
.prop-label{ font-size:11px; color:var(--muted); margin-bottom:6px; display:block; font-weight:500;}
.prop-row{ display:flex; gap:8px; margin-bottom:8px; }
.prop-row > *{ flex:1; }
input[type=text], input[type=number], input[type=url], select, textarea{
  width:100%; background:#0d1016; border:1px solid var(--border); color:var(--text);
  padding:7px 9px; border-radius:8px; font-size:12px; font-family:var(--font-body); outline:none;
}
input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus, input[type=url]:focus{ border-color:var(--accent2); }
textarea{ resize:vertical; min-height:56px; font-family:var(--font-mono); }
input[type=color]{ width:36px; height:32px; padding:2px; border-radius:8px; border:1px solid var(--border); background:#0d1016; cursor:pointer;}
input[type=range]{ width:100%; accent-color:var(--accent2); }
.color-row{ display:flex; align-items:center; gap:8px; }
.color-row input[type=text]{ flex:1; }
.mini-label{ font-size:10px; color:var(--muted2); margin-bottom:4px; display:block;}
.checkline{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text); cursor:pointer; margin-bottom:4px;}
.checkline input{ accent-color:var(--accent1); width:15px; height:15px;}
.empty-state{ text-align:center; color:var(--muted2); padding:40px 12px; font-size:12.5px; line-height:1.6;}
.empty-state .ic{ font-size:30px; display:block; margin-bottom:10px; }
.layerbtns{ display:flex; gap:6px; margin-top:4px;}
.layerbtns .btn{ flex:1; }

/* action block */
.action-block{ border:1px solid var(--border); border-radius:10px; padding:10px; background:rgba(255,255,255,0.02); margin-bottom:8px;}
.action-block-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.action-block-head b{ font-size:11.5px;}

/* ---------- MODALS ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(5,6,9,0.7); backdrop-filter:blur(6px);
  display:none; align-items:center; justify-content:center; z-index:200;
}
.overlay.show{ display:flex; }
.modal{
  background:var(--panel-solid); border:1px solid var(--border); border-radius:16px;
  width:560px; max-width:92vw; max-height:86vh; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 40px 100px rgba(0,0,0,0.6);
}
.modal.wide{ width:920px; }
.modal-head{ display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border);}
.modal-head h3{ margin:0; font-family:var(--font-display); font-size:16px; font-weight:600;}
.modal-body{ padding:20px; overflow-y:auto; }
.modal-foot{ padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}
.close-x{ cursor:pointer; color:var(--muted); font-size:18px; padding:4px 8px; border-radius:6px;}
.close-x:hover{ color:var(--text); background:var(--panel);}

.field{ margin-bottom:14px; }
.field label{ font-size:11.5px; color:var(--muted); margin-bottom:5px; display:block; font-weight:500;}

.code-tabs{ display:flex; gap:4px; padding:0 20px; border-bottom:1px solid var(--border); background:rgba(255,255,255,0.02);}
.code-tab{ padding:10px 14px; font-size:12px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent;}
.code-tab.active{ color:var(--text); border-color:var(--accent2);}
.code-area{ width:100%; height:400px; background:#0a0c10; color:#c9d1d9; border:none; padding:16px; font-family:var(--font-mono); font-size:12px; line-height:1.55; resize:none; outline:none;}

.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:400; display:flex; flex-direction:column; gap:8px;}
.toast{ background:var(--panel-solid); border:1px solid var(--border); padding:11px 16px; border-radius:10px; font-size:12.5px; box-shadow:0 10px 30px rgba(0,0,0,0.4); display:flex; align-items:center; gap:8px; animation:toastIn .25s ease;}
.toast.ok{ border-color:rgba(61,220,151,0.4); }
.toast.err{ border-color:rgba(240,85,108,0.4); }
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

.acc-tabs{ display:flex; gap:4px; margin-bottom:16px; background:rgba(255,255,255,0.03); padding:4px; border-radius:10px;}
.acc-tab{ flex:1; text-align:center; padding:8px; font-size:12px; border-radius:7px; cursor:pointer; color:var(--muted);}
.acc-tab.active{ background:var(--grad); color:#0a0c11; font-weight:600;}

/* runtime animation keyframes */
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes fadeOut{ from{opacity:1;} to{opacity:0;} }
@keyframes slideInLeft{ from{opacity:0; transform:translateX(-40px);} to{opacity:1; transform:translateX(0);} }
@keyframes slideInRight{ from{opacity:0; transform:translateX(40px);} to{opacity:1; transform:translateX(0);} }
@keyframes slideInUp{ from{opacity:0; transform:translateY(40px);} to{opacity:1; transform:translateY(0);} }
@keyframes slideInDown{ from{opacity:0; transform:translateY(-40px);} to{opacity:1; transform:translateY(0);} }
@keyframes zoomIn{ from{opacity:0; transform:scale(0.7);} to{opacity:1; transform:scale(1);} }
@keyframes bounceIn{ 0%{transform:scale(0.5); opacity:0;} 60%{transform:scale(1.08); opacity:1;} 100%{transform:scale(1);} }
@keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
@keyframes rotateIn{ from{opacity:0; transform:rotate(-15deg) scale(0.9);} to{opacity:1; transform:rotate(0) scale(1);} }
@keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
@keyframes flipIn{ from{opacity:0; transform:rotateY(90deg);} to{opacity:1; transform:rotateY(0);} }

@media (max-width: 980px){
  .rail{ display:none; }
}
</style>
<style id="dynamicKfStyle"></style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>
<script>
/* =========================================================================
   DESIGNER — made by Mattyou Studios (tm)
   Volledig client-side website-bouwer: drag & drop, acties, animaties,
   liquid glass, templates, accounts, code editor, export.
   ========================================================================= */

/* ---------------- helpers ---------------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const uid = (p='id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function on(el, ev, fn, opts){ el.addEventListener(ev, fn, opts); }
function toast(msg, type='ok', icon){
  const wrap = $('#toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<span>${icon || (type==='ok'?'✅':type==='err'?'⚠️':'ℹ️')}</span><span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }

  const base = {
    id: uid('el'), type, x, y, w:def.w, h:def.h, z: 1,

    href:'', src:'',
    lockAspect:false,
    startHidden: type==='overlay',
    style:{
      bg: type==='glass' ? 'rgba(255,255,255,0.08)' : (type==='button' ? '#8b5cf6' : (type==='container'? 'rgba(255,255,255,0.04)': (type==='overlay' ? 'rgba(6,7,10,0.72)' : 'transparent'))),
      color: type==='button' ? '#0a0c11' : '#e8eaf1',

      radius: type==='button'?10:(type==='container'||type==='glass'?14:(type==='shape'?999:6)),
      opacity: 1,
      scale: 1,
      rotate: 0,
      shadow:false,
      glass: type==='glass',

    action:{enabled:false, type:'none', target:'', animType:'pulse', url:'', message:''},

  return base;
}

function bindShellEvents(){
  $('#snapToggle').onchange = e=>{ state.snapEnabled = e.target.checked; toast(state.snapEnabled ? 'Uitlijnhulp aan' : 'Uitlijnhulp uit', 'info', '🧲'); };
  $('#btnUndo').onclick = undo;
  $('#btnRedo').onclick = redo;
  $('#expOneFile').onclick = ()=>{ closeModal('modalExport'); exportSingleHTML(); };
  $('#expZip').onclick = ()=>{ closeModal('modalExport'); exportZip(); };
  on(document, 'click', e=>{ if(!e.target.closest('.ctx-menu')) closeContextMenu(); });
  on(document, 'contextmenu', e=>{
    if(state.mode!=='edit') return;
    const canvas = $('#canvas');
    if(e.target===canvas){ e.preventDefault(); openCanvasContextMenu(e.clientX, e.clientY); }
  });
  $('#btnModeToggle').onclick = toggleMode;
  $('#btnCode').onclick = openCodeModal;
  $('#btnSettings').onclick = openSettingsModal;
  $('#btnSave').onclick = () => saveProject(true);
  $('#btnExport').onclick = ()=>{ if(!state.project){ toast('Geen project geladen', 'err'); return; } openModal('modalExport'); };
  $('#btnAccount').onclick = openAccountModal;
  $('#btnTemplates').onclick = openTemplatesModal;
  $('#btnProjects').onclick = openProjectsModal;

  $$('.rail-tab', $('#railLeft')).forEach(tab=>{
    tab.onclick = () => { state.railTab = tab.dataset.tab; renderLeftRail(); };
  });
  $$('.rail-tab', $('#railRight')).forEach(tab=>{
    tab.onclick = () => { state.propTab = tab.dataset.tab; renderRightRail(); };
  });

  $$('.overlay').forEach(ov=>{
    ov.addEventListener('click', e=>{ if(e.target===ov) closeModal(ov.id); });
    $$('[data-close]', ov).forEach(x=> x.onclick = ()=> closeModal(ov.id));
  });

  $$('.code-tab').forEach(t=>{
    t.onclick = ()=>{ $$('.code-tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); loadCodeTab(t.dataset.codeTab); };
  });
  $('#btnCodeApply').onclick = applyCodeChanges;
  $('#btnCodeCopy').onclick = ()=>{ navigator.clipboard.writeText($('#codeArea').value).then(()=>toast('Code gekopieerd')); };
  $('#btnNewProjectFromList').onclick = ()=>{ closeModal('modalProjects'); openNewProjectModal(); };

  // canvas background drop target for new objects
  const canvas = $('#canvas');
  on(canvas, 'dragover', e=> e.preventDefault());
  on(canvas, 'drop', e=>{
    e.preventDefault();
    if(!state.dragNewType) return;
    const rect = canvas.getBoundingClientRect();
    const x = clamp(e.clientX - rect.left - 20, 0, 1150);
    const y = clamp(e.clientY - rect.top - 20, 0, 750);
    addElement(state.dragNewType, x, y);
    state.dragNewType = null;
  });
  on(canvas, 'mousedown', e=>{
    if(e.target === canvas){ selectElement(null); }
  });

  document.addEventListener('keydown', e=>{
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    const typing = tag==='INPUT' || tag==='TEXTAREA' || document.activeElement.isContentEditable;
    const ctrl = e.ctrlKey || e.metaKey;
    if(ctrl && !typing){
      const k = e.key.toLowerCase();
      if(k==='z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
      if((k==='z' && e.shiftKey) || k==='y'){ e.preventDefault(); redo(); return; }
      if(k==='c' && state.selectedId){ e.preventDefault(); copyElement(state.selectedId); return; }
      if(k==='x' && state.selectedId){ e.preventDefault(); cutElement(state.selectedId); return; }
      if(k==='v' && state.clipboard){ e.preventDefault(); pasteClipboard(); return; }
      if(k==='d' && state.selectedId){ e.preventDefault(); const pg=activePage(); const el=pg.elements.find(x=>x.id===state.selectedId); if(el) duplicateElement(el); return; }
    }
    if(typing) return;
    if((e.key==='Delete' || e.key==='Backspace') && state.selectedId && state.mode==='edit'){
      e.preventDefault(); deleteSelected();
    }
    if(e.key==='Escape'){ selectElement(null); closeContextMenu(); }
  });
}

function createProject(name, tplId){
  const bg = (TEMPLATES.find(t=>t.id===tplId) || TEMPLATES[0]).bg;
  const proj = {
    id: uid('proj'),
    name: name || 'Naamloos project',
    createdAt: Date.now(), updatedAt: Date.now(),
    activePageId: 'page_1',
    pages: [{
      id:'page_1', name:'Home',
      background: Object.assign({}, bg),
      elements: templateElements(tplId)
    }]
  };
  return proj;
}

function saveProject(showToast){
  if(!state.project) return;
  state.project.updatedAt = Date.now();
  saveJSON(LS_PROJECT_PREFIX + state.project.id, state.project);
  let list = getProjectList();
  const idx = list.findIndex(p=>p.id===state.project.id);
  const summary = {id:state.project.id, name:state.project.name, updatedAt: state.project.updatedAt};
  if(idx>=0) list[idx] = summary; else list.push(summary);
  saveProjectList(list);

  if(state.settings.storageMode === 'database' && state.settings.dbUrl){
    fetch(state.settings.dbUrl, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'save', project: state.project})
    }).then(()=> showToast && toast('Opgeslagen naar database én lokaal')).catch(()=> showToast && toast('Database niet bereikbaar — lokaal opgeslagen', 'err'));
  } else if(showToast){
    toast('Project opgeslagen in local storage');
  }
}

function loadProject(id){
  const proj = loadJSON(LS_PROJECT_PREFIX + id, null);
  if(!proj){ toast('Project niet gevonden', 'err'); return; }
  state.project = proj;
  if(!state.project.activePageId) state.project.activePageId = state.project.pages[0].id;
  state.selectedId = null;
  renderAll();
  toast('Project geladen: ' + proj.name);
}

function deleteProject(id){
  localStorage.removeItem(LS_PROJECT_PREFIX + id);
  saveProjectList(getProjectList().filter(p=>p.id!==id));
  if(state.project && state.project.id===id){ initFreshProject(); }
  renderProjectsList();
  toast('Project verwijderd');
}

function initFreshProject(){
  const list = getProjectList();
  if(list.length){
    loadProject(list[list.length-1].id);
  } else {
    state.project = createProject('Mijn eerste project', 'landing');
    saveProject(false);
    renderAll();
  }
}

/* =========================================================================
   PAGES
   ========================================================================= */
function activePage(){
  if(!state.project) return null;
  return state.project.pages.find(p=>p.id===state.project.activePageId) || state.project.pages[0];
}
function addPage(){
  const p = {id: uid('page'), name:'Pagina ' + (state.project.pages.length+1), background:{type:'solid', value:'#101319'}, elements:[]};
  state.project.pages.push(p);
  state.project.activePageId = p.id;
  state.selectedId = null;
  renderAll();
}
function removePage(pageId){
  if(state.project.pages.length<=1){ toast('Je hebt minimaal 1 pagina nodig', 'err'); return; }
  state.project.pages = state.project.pages.filter(p=>p.id!==pageId);
  if(state.project.activePageId===pageId) state.project.activePageId = state.project.pages[0].id;
  state.selectedId = null;
  renderAll();
}
function renderPageTabs(){
  const wrap = $('#pageTabs');
  if(!state.project){ wrap.innerHTML=''; return; }
  wrap.innerHTML = state.project.pages.map(p => `
    <div class="pagetab ${p.id===state.project.activePageId?'active':''}" data-page="${p.id}">
      📄 ${esc(p.name)} ${state.project.pages.length>1?`<span class="x" data-del-page="${p.id}">✕</span>`:''}
    </div>`).join('') + `<div class="addpage" id="addPageBtn">+</div>`;
  $$('.pagetab', wrap).forEach(t=>{
    t.onclick = (e)=>{ if(e.target.dataset.delPage) return; state.project.activePageId = t.dataset.page; state.selectedId=null; renderAll(); };
  });
  $$('[data-del-page]', wrap).forEach(x=> x.onclick = (e)=>{ e.stopPropagation(); removePage(x.dataset.delPage); });
  $('#addPageBtn').onclick = addPage;
}
/* =========================================================================
   LEFT RAIL — objects / backgrounds / layers

function objIcon(){ return 'transparent'; }

/* =========================================================================
   CANVAS RENDERING
   ========================================================================= */
function ensureBgDeco(bg){
  if(!bg) return bg;
  if(bg.type==='3d' && !bg.cubes){
    bg.cubes = Array.from({length:7}, ()=>({x:Math.round(Math.random()*1100), y:Math.round(Math.random()*700), dur:(10+Math.random()*10).toFixed(1)}));
  }
  if(bg.type==='glasswave' && !bg.blobs){
    const colors=['#8b5cf6','#22d3ee','#3ddc97'];
    bg.blobs = Array.from({length:4}, (_,i)=>({size:Math.round(180+Math.random()*180), x:Math.round(Math.random()*1000), y:Math.round(Math.random()*600), color:colors[i%3], delay:(Math.random()*4).toFixed(1)}));
  }
  if(bg.type==='starfield' && !bg.stars){
    bg.stars = Array.from({length:110}, ()=>({x:Math.round(Math.random()*1200), y:Math.round(Math.random()*800), r:+(Math.random()*1.6+0.6).toFixed(1), o:+(Math.random()*0.6+0.35).toFixed(2)}));
    bg.glows = Array.from({length:6}, ()=>({x:Math.round(Math.random()*1200), y:Math.round(Math.random()*800), size:Math.round(50+Math.random()*90)}));
  }
  if(bg.type==='aurora' && !bg.blobs){
    const colors=['#8b5cf6','#22d3ee','#3ddc97','#5b6cf6'];
    bg.blobs = Array.from({length:3}, (_,i)=>({size:Math.round(320+Math.random()*220), x:Math.round(Math.random()*900), y:Math.round(Math.random()*450), color:colors[i%colors.length], delay:(Math.random()*4).toFixed(1)}));
  }
  return bg;
}
function starfieldHTML(bg){
  const stars = (bg.stars||[]).map(s=>`<div class="star" style="left:${s.x}px; top:${s.y}px; width:${s.r*2}px; height:${s.r*2}px; opacity:${s.o};"></div>`).join('');
  const glows = (bg.glows||[]).map(g=>`<div class="star-glow" style="left:${g.x}px; top:${g.y}px; width:${g.size}px; height:${g.size}px;"></div>`).join('');
  return `<div class="bg-starfield">${glows}${stars}</div>`;
}
function auroraHTML(bg){
  const blobs = (bg.blobs||[]).map(b=>`<div class="blob" style="width:${b.size}px;height:${b.size}px;left:${b.x}px;top:${b.y}px;background:${b.color};animation-delay:${b.delay}s;"></div>`).join('');
  return `<div class="bg-glasswave bg-aurora-wrap">${blobs}</div>`;
}
function cubesHTML(bg){
  return `<div class="bg3d">${(bg.cubes||[]).map(c=>`<div class="cube" style="left:${c.x}px; top:${c.y}px; animation-duration:${c.dur}s;"><div class="f1"></div><div class="f2"></div><div class="f3"></div><div class="f4"></div><div class="f5"></div><div class="f6"></div></div>`).join('')}</div>`;
}
function glasswaveHTML(bg){
  return `<div class="bg-glasswave">${(bg.blobs||[]).map(b=>`<div class="blob" style="width:${b.size}px;height:${b.size}px;left:${b.x}px;top:${b.y}px;background:${b.color};animation-delay:${b.delay}s;"></div>`).join('')}</div>`;
}

function renderCanvas(){
  const canvas = $('#canvas');
  canvas.classList.toggle('mode-preview', state.mode==='preview');
  const pg = activePage();
  canvas.innerHTML = '';
  if(!pg){ return; }

  // background
  const bg = ensureBgDeco(pg.background || {type:'solid', value:'#101319'});
  canvas.style.background = '';
  canvas.style.backgroundImage = '';
  canvas.classList.remove('bg-animated-grad');
  if(bg.type==='solid'){ canvas.style.background = bg.value; }
  else if(bg.type==='gradient'){ canvas.style.background = bg.value; }
  else if(bg.type==='animgrad'){ canvas.style.background = bg.value; canvas.classList.add('bg-animated-grad'); }
  else if(bg.type==='3d'){ canvas.style.background = '#0e1016'; }
  else if(bg.type==='glasswave'){ canvas.style.background = 'linear-gradient(135deg,#241a3d,#0e1016)'; }
  else if(bg.type==='starfield'){ canvas.style.background = 'radial-gradient(circle at 30% 20%, #171b2b, #06070a 70%)'; }
  else if(bg.type==='aurora'){ canvas.style.background = 'linear-gradient(135deg,#0b1020,#170e2e)'; }
  else if(bg.type==='dotgrid'){ canvas.style.background = bg.value; canvas.style.backgroundImage = 'radial-gradient(rgba(255,255,255,0.14) 1.4px, transparent 1.4px)'; canvas.style.backgroundSize = '22px 22px'; }
  else if(bg.type==='noise'){ canvas.style.background = bg.value; canvas.style.backgroundImage = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>")`; }

  if(bg.type==='3d') canvas.insertAdjacentHTML('beforeend', cubesHTML(bg));
  if(bg.type==='glasswave') canvas.insertAdjacentHTML('beforeend', glasswaveHTML(bg));
  if(bg.type==='starfield') canvas.insertAdjacentHTML('beforeend', starfieldHTML(bg));
  if(bg.type==='aurora') canvas.insertAdjacentHTML('beforeend', auroraHTML(bg));

  pg.elements.slice().sort((a,b)=>a.z-b.z).forEach(el=> canvas.appendChild(buildElementNode(el)));
  renderSnapGuideLayer();
}


function buildElementNode(el){
  const node = document.createElement('div');
  node.className = 'el';
  node.dataset.elType = el.type;
  node.dataset.id = el.id;
  node.style.left = el.x+'px'; node.style.top = el.y+'px';
  node.style.width = el.w+'px'; node.style.height = el.h+'px';
  node.style.zIndex = el.z;
  applyElementStyle(node, el);

  let inner = '';
  switch(el.type){
    case 'heading': inner = `<div class="el-content" style="width:100%; outline:none;">${esc(el.content)}</div>`; break;
    case 'text': inner = `<div class="el-content" style="width:100%; outline:none;">${esc(el.content)}</div>`; break;
    case 'button': inner = `<div class="el-content" style="width:100%; text-align:center; outline:none;">${esc(el.content)}</div>`; break;
    case 'badge': inner = `<div class="el-content" style="width:100%; text-align:center; outline:none;">${esc(el.content)}</div>`; break;
    case 'input': inner = `<input type="text" placeholder="${esc(el.content)}" style="width:100%; height:100%; background:transparent; border:none; color:inherit; font-size:inherit; padding:0 12px;" ${state.mode==='edit'?'disabled':''}>`; break;
    case 'image': inner = el.src ? `<img src="${esc(el.src)}" style="width:100%; height:100%; object-fit:cover; border-radius:inherit; pointer-events:none;">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:12px; flex-direction:column; gap:6px;"><span style="font-size:22px;">🖼️</span>Geen afbeelding — stel URL in bij Stijl</div>`;
      break;
    case 'video': inner = el.src ? `<iframe src="${esc(el.src)}" style="width:100%; height:100%; border:none; border-radius:inherit; pointer-events:none;" allowfullscreen></iframe>` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:12px;">▶ Video — stel embed-URL in bij Stijl</div>`;
      break;
    case 'icon': inner = `<div class="el-content" style="width:100%; text-align:center; font-size:${Math.max(20,el.h*0.5)}px; line-height:${el.h}px; outline:none;">${esc(el.content)}</div>`; break;
    case 'divider': inner = ''; break;
    case 'shape': inner = ''; break;
    case 'overlay': inner = state.mode==='edit' ? `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.5);font-size:12px; border:2px dashed rgba(255,255,255,0.25); box-sizing:border-box;">⧉ Overlay / pop-up — plaats hier je elementen overheen</div>` : ''; break;
    case 'container': case 'glass': inner = state.mode==='edit' ? `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:11px;">${el.type==='glass'?'◈ Glass panel':'Container'}</div>` : ''; break;
    default: inner = esc(el.content);
  }
  node.innerHTML = inner + `<span class="el-label">${OBJECT_DEFS.find(o=>o.type===el.type)?.label||el.type}${el.startHidden?' · verborgen bij laden':''}</span><div class="resize-handle"></div>`;

  if(el.id===state.selectedId) node.classList.add('selected');
  if(el.startHidden){
    if(state.mode==='preview'){ node.style.display = 'none'; }
    else { node.style.outline = '1px dashed rgba(255,255,255,0.3)'; node.style.opacity = (parseFloat(node.style.opacity||1) * 0.55); }
  }

  if(state.mode==='edit'){
    attachEditInteractions(node, el);
  } else {
    attachPreviewInteractions(node, el);
  }
  return node;
}

function applyElementStyle(node, el){
  const s = el.style;
  node.style.color = s.color;
  node.style.fontSize = s.fontSize+'px';
  node.style.fontWeight = s.fontWeight;
  node.style.borderRadius = s.radius+'px';
  node.style.opacity = s.opacity;
  node.style.textAlign = s.align;
  node.style.justifyContent = s.align==='center'?'center':(s.align==='right'?'flex-end':'flex-start');
  node.style.border = s.border || 'none';
  node.style.boxShadow = s.shadow ? '0 12px 30px rgba(0,0,0,0.35)' : '';
  node.style.padding = ['button','container','glass','badge'].includes(el.type) ? '0 16px' : (el.type==='text'||el.type==='heading' ? '0' : '0');
  node.style.overflow = el.type==='overlay' ? 'visible' : 'hidden';
  node.style.background = s.bg;
  node.style.transform = `scale(${s.scale||1}) rotate(${s.rotate||0}deg)`;
  node.style.transformOrigin = 'center center';
  if(el.type==='divider'){ node.style.background = s.bg==='transparent' ? 'rgba(255,255,255,0.2)' : s.bg; }
  node.classList.toggle('liquid-glass', !!s.glass);
  const useCustomKf = el.timeline && el.timeline.enabled && el.timeline.keyframes.length>=2;
  if(el.onLoadAnim && el.onLoadAnim.enabled && state.mode==='preview'){
    if(useCustomKf){
      node.style.animation = `kf_${el.id} ${el.timeline.duration}ms linear ${el.onLoadAnim.delay}ms both`;
    } else {
      node.style.animation = `${el.onLoadAnim.type} ${el.onLoadAnim.duration}ms ease ${el.onLoadAnim.delay}ms both`;
    }
  } else {
    node.style.animation = '';
  }
}
/* =========================================================================
   ELEMENT INTERACTIONS (edit mode: select / drag / resize / inline edit)
   ========================================================================= */
function attachEditInteractions(node, el){
  node.addEventListener('mousedown', e=>{
    if(e.button!==0) return;
    if(e.target.classList.contains('resize-handle')) return;
    if(e.target.isContentEditable) return;
    e.stopPropagation();
    selectElement(el.id);
    const canvasRect = $('#canvas').getBoundingClientRect();
    state.interaction = {
      kind:'move', id: el.id,
      offX: e.clientX - canvasRect.left - el.x,
      offY: e.clientY - canvasRect.top - el.y
    };
  });
  node.addEventListener('contextmenu', e=>{
    e.preventDefault(); e.stopPropagation();
    selectElement(el.id);
    openContextMenu(e.clientX, e.clientY, el.id);
  });
  const handle = $('.resize-handle', node);
  handle.addEventListener('mousedown', e=>{
    e.stopPropagation(); e.preventDefault();
    selectElement(el.id);
    state.interaction = { kind:'resize', id: el.id, startX:e.clientX, startY:e.clientY, startW:el.w, startH:el.h, ratio: el.w/Math.max(1,el.h) };
  });
  const contentEl = $('.el-content', node);
  if(contentEl){
    node.addEventListener('dblclick', e=>{
      e.stopPropagation();
      contentEl.contentEditable = true;
      contentEl.focus();
      document.execCommand('selectAll', false, null);
    });
    contentEl.addEventListener('blur', ()=>{
      contentEl.contentEditable = false;
      el.content = contentEl.innerText;
      renderRightRail();
      saveDebounced();
      historyDebounced();
    });
    contentEl.addEventListener('keydown', e=>{ if(e.key==='Enter' && el.type!=='text'){ e.preventDefault(); contentEl.blur(); } if(e.key==='Escape'){ contentEl.blur(); } });
  }
}

function snapAxis(pos, size, refLines, threshold){
  const points = [pos, pos+size/2, pos+size];
  for(const ref of refLines){
    for(let i=0;i<points.length;i++){
      if(Math.abs(points[i]-ref) < threshold){
        return { newPos: ref - (i===0?0:(i===1?size/2:size)), guide: ref };
      }
    }
  }
  return { newPos: pos, guide: null };
}
let activeGuides = {v:null, h:null};
function renderSnapGuideLayer(){
  $$('.snap-guide').forEach(g=>g.remove());
  const canvas = $('#canvas'); if(!canvas) return;
  if(activeGuides.v!=null){ const g=document.createElement('div'); g.className='snap-guide v'; g.style.left=activeGuides.v+'px'; canvas.appendChild(g); }
  if(activeGuides.h!=null){ const g=document.createElement('div'); g.className='snap-guide h'; g.style.top=activeGuides.h+'px'; canvas.appendChild(g); }
}

on(document, 'mousemove', e=>{
  const it = state.interaction;
  if(!it) return;
  const pg = activePage(); if(!pg) return;
  const el = pg.elements.find(x=>x.id===it.id); if(!el) return;
  const canvasRect = $('#canvas').getBoundingClientRect();
  if(it.kind==='move'){
    let nx = clamp(e.clientX - canvasRect.left - it.offX, -50, 1200 - 20);
    let ny = clamp(e.clientY - canvasRect.top - it.offY, -20, 800 - 10);
    activeGuides = {v:null, h:null};
    if(state.snapEnabled){
      const refX = [0,600,1200], refY = [0,400,800];
      pg.elements.forEach(o=>{ if(o.id===el.id) return; refX.push(o.x, o.x+o.w/2, o.x+o.w); refY.push(o.y, o.y+o.h/2, o.y+o.h); });
      const rx = snapAxis(nx, el.w, refX, 6); const ry = snapAxis(ny, el.h, refY, 6);
      nx = rx.newPos; ny = ry.newPos; activeGuides = {v:rx.guide, h:ry.guide};
    }
    el.x = nx; el.y = ny;
    const node = $(`.el[data-id="${el.id}"]`);
    if(node){ node.style.left = el.x+'px'; node.style.top = el.y+'px'; }
    renderSnapGuideLayer();
  } else if(it.kind==='resize'){
    const dx = e.clientX - it.startX, dy = e.clientY - it.startY;
    if(el.lockAspect){
      el.w = clamp(it.startW + dx, 24, 1180);
      el.h = clamp(Math.round(el.w / it.ratio), 16, 780);
    } else {
      el.w = clamp(it.startW + dx, 24, 1180);
      el.h = clamp(it.startH + dy, 16, 780);
    }
    const node = $(`.el[data-id="${el.id}"]`);
    if(node){ node.style.width = el.w+'px'; node.style.height = el.h+'px'; }
  }
});
on(document, 'mouseup', ()=>{
  if(state.interaction){
    state.interaction = null;
    activeGuides = {v:null, h:null};
    renderSnapGuideLayer();
    renderRightRail();
    saveDebounced();
    historyDebounced();
  }
});

function attachPreviewInteractions(node, el){
  if(!(el.action && el.action.enabled && el.action.type!=='none')) return;
  node.style.cursor = 'pointer';
  node.addEventListener('click', e=>{
    e.stopPropagation();
    runAction(el);
  });
}

function runAction(el){
  const a = el.action;
  switch(a.type){
    case 'goToPage':
      if(a.target){ state.project.activePageId = a.target; renderAll(); }
      break;
    case 'openLink':
      if(a.url) window.open(a.url, '_blank');
      break;
    case 'show': case 'hide': case 'toggle': {
      const targetNode = $(`.el[data-id="${a.target}"]`);
      if(targetNode){
        if(a.type==='show') targetNode.style.display='';
        if(a.type==='hide') targetNode.style.display='none';
        if(a.type==='toggle') targetNode.style.display = (targetNode.style.display==='none') ? '' : 'none';
      }
      break;
    }
    case 'animate': {
      const targetNode = a.target ? $(`.el[data-id="${a.target}"]`) : $(`.el[data-id="${el.id}"]`);
      if(targetNode){
        targetNode.style.animation = 'none';
        void targetNode.offsetWidth;
        targetNode.style.animation = `${a.animType} 650ms ease`;
      }
      break;
    }
    case 'alert':
      toast(a.message || 'Actie uitgevoerd', 'info', '🔔');
      break;
  }
}

/* =========================================================================
   ELEMENT CRUD (+ clipboard, duplicate)
   ========================================================================= */
function addElement(type, x, y){
  if(!state.project) return;
  const pg = activePage();
  const maxZ = pg.elements.reduce((m,e)=>Math.max(m,e.z),0);
  const el = newElement(type, Math.round(x), Math.round(y));
  el.z = maxZ+1;
  pg.elements.push(el);
  state.selectedId = el.id;
  renderAll();
  saveDebounced();
  pushHistory();
}
function deleteSelected(){
  if(!state.selectedId) return;
  const pg = activePage();
  pg.elements = pg.elements.filter(e=>e.id!==state.selectedId);
  state.selectedId = null;
  renderAll();
  saveDebounced();
  pushHistory();
}
function deleteElementById(id){
  const pg = activePage();
  pg.elements = pg.elements.filter(e=>e.id!==id);
  if(state.selectedId===id) state.selectedId = null;
  renderAll();
  saveDebounced();
  pushHistory();
}
function duplicateElement(el){
  const pg = activePage();
  const clone = JSON.parse(JSON.stringify(el));
  clone.id = uid('el');
  clone.x = clamp(el.x+24, 0, 1180);
  clone.y = clamp(el.y+24, 0, 780);
  const maxZ = pg.elements.reduce((m,e)=>Math.max(m,e.z),0);
  clone.z = maxZ+1;
  pg.elements.push(clone);
  state.selectedId = clone.id;
  renderAll();
  saveDebounced();
  pushHistory();
  toast('Element gedupliceerd');
}
function copyElement(id){
  const pg = activePage();
  const el = pg.elements.find(e=>e.id===id);
  if(!el) return;
  state.clipboard = JSON.parse(JSON.stringify(el));
  toast('Gekopieerd — plak met Ctrl+V');
}
function cutElement(id){
  copyElement(id);
  deleteElementById(id);
  toast('Geknipt');
}
function pasteClipboard(atX, atY){
  if(!state.clipboard || !state.project) return;
  const pg = activePage();
  const clone = JSON.parse(JSON.stringify(state.clipboard));
  clone.id = uid('el');
  if(atX!=null){
    const canvasRect = $('#canvas').getBoundingClientRect();
    clone.x = clamp(Math.round(atX - canvasRect.left - clone.w/2), 0, 1180);
    clone.y = clamp(Math.round(atY - canvasRect.top - clone.h/2), 0, 780);
  } else {
    clone.x = clamp(clone.x+24, 0, 1180);
    clone.y = clamp(clone.y+24, 0, 780);
  }
  const maxZ = pg.elements.reduce((m,e)=>Math.max(m,e.z),0);
  clone.z = maxZ+1;
  pg.elements.push(clone);
  state.selectedId = clone.id;
  renderAll();
  saveDebounced();
  pushHistory();
  toast('Geplakt');
}
function selectElement(id){
  state.selectedId = id;
  $$('.el').forEach(n=> n.classList.toggle('selected', n.dataset.id===id));
  renderRightRail();
  if(state.railTab==='layers') renderLeftRail();
}
function getSelectedEl(){
  const pg = activePage(); if(!pg) return null;
  return pg.elements.find(e=>e.id===state.selectedId) || null;
}

let saveTimer = null;
function saveDebounced(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=> saveProject(false), 700);
}

function toggleMode(){
  state.mode = state.mode==='edit' ? 'preview' : 'edit';
  $('#btnModeToggle').innerHTML = state.mode==='edit' ? '👁️ Voorbeeld' : '✏️ Bewerken';
  $('#canvasModeBadge').innerHTML = state.mode==='edit' ? '✏️ Bewerkmodus' : '👁️ Voorbeeldmodus (acties actief)';
  if(state.mode==='preview') state.selectedId = null;
  renderAll();
}

/* =========================================================================
   UNDO / REDO HISTORY
   ========================================================================= */
let history = { stack: [], index: -1, max: 60 };
let historyTimer = null;
function pushHistory(){
  if(!state.project) return;
  const snap = JSON.stringify(state.project);
  if(history.stack[history.index] === snap) return;
  history.stack = history.stack.slice(0, history.index+1);
  history.stack.push(snap);
  if(history.stack.length>history.max) history.stack.shift();
  history.index = history.stack.length-1;
}
function historyDebounced(){
  clearTimeout(historyTimer);
  historyTimer = setTimeout(pushHistory, 500);
}
function undo(){
  if(history.index<=0){ toast('Niets meer om ongedaan te maken', 'info'); return; }
  clearTimeout(historyTimer);
  if(history.index===history.stack.length-1) pushHistory();
  history.index--;
  state.project = JSON.parse(history.stack[history.index]);
  if(!state.project.pages.find(p=>p.id===state.project.activePageId)) state.project.activePageId = state.project.pages[0].id;
  state.selectedId = null;
  renderAll();
  saveDebounced();
  toast('Ongedaan gemaakt', 'info', '↩️');
}
function redo(){
  if(history.index>=history.stack.length-1){ toast('Niets om opnieuw te doen', 'info'); return; }
  history.index++;
  state.project = JSON.parse(history.stack[history.index]);
  state.selectedId = null;
  renderAll();
  saveDebounced();
  toast('Opnieuw gedaan', 'info', '↪️');
}

function openContextMenu(x, y, elId){
  const menu = $('#ctxMenu');
  const hasClip = !!state.clipboard;
  menu.innerHTML = `
    <div class="ctx-item" data-act="copy">📋 Kopiëren<span class="ctx-key">Ctrl+C</span></div>
    <div class="ctx-item" data-act="cut">✂️ Knippen<span class="ctx-key">Ctrl+X</span></div>
    <div class="ctx-item ${hasClip?'':'disabled'}" data-act="paste">📥 Plakken<span class="ctx-key">Ctrl+V</span></div>
    <div class="ctx-item" data-act="duplicate">⧉ Dupliceren<span class="ctx-key">Ctrl+D</span></div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-act="front">⬆ Naar voren</div>
    <div class="ctx-item" data-act="back">⬇ Naar achteren</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-act="delete">🗑️ Verwijderen<span class="ctx-key">Del</span></div>
  `;
  menu.style.left = x+'px'; menu.style.top = y+'px';
  menu.classList.add('show');
  menu.dataset.forEl = elId || '';
  $$('.ctx-item', menu).forEach(item=>{
    item.onclick = ()=>{
      const id = menu.dataset.forEl;
      const act = item.dataset.act;
      if(act==='copy') copyElement(id);
      else if(act==='cut') cutElement(id);
      else if(act==='paste') pasteClipboard(x, y);
      else if(act==='duplicate'){ const pg=activePage(); const el=pg.elements.find(e=>e.id===id); if(el) duplicateElement(el); }
      else if(act==='front'){ const pg=activePage(); const el=pg.elements.find(e=>e.id===id); if(el){ const maxZ=Math.max(...pg.elements.map(e=>e.z)); el.z=maxZ+1; refreshEl(); historyDebounced(); } }
      else if(act==='back'){ const pg=activePage(); const el=pg.elements.find(e=>e.id===id); if(el){ const minZ=Math.min(...pg.elements.map(e=>e.z)); el.z=minZ-1; refreshEl(); historyDebounced(); } }
      else if(act==='delete') deleteElementById(id);
      closeContextMenu();
    };
  });
}
function openCanvasContextMenu(x,y){
  const menu = $('#ctxMenu');
  const hasClip = !!state.clipboard;
  menu.innerHTML = `<div class="ctx-item ${hasClip?'':'disabled'}" data-act="paste">📥 Plakken hier<span class="ctx-key">Ctrl+V</span></div>`;
  menu.style.left = x+'px'; menu.style.top = y+'px';
  menu.classList.add('show');
  $$('.ctx-item', menu).forEach(item=>{ item.onclick = ()=>{ pasteClipboard(x,y); closeContextMenu(); }; });
}

function alignElementToCanvas(el, type){
  switch(type){
    case 'left': el.x=0; break;
    case 'centerH': el.x=Math.round((1200-el.w)/2); break;
    case 'right': el.x=1200-el.w; break;
    case 'top': el.y=0; break;
    case 'centerV': el.y=Math.round((800-el.h)/2); break;
    case 'bottom': el.y=800-el.h; break;
  }
  refreshEl();
  renderRightRail();
  historyDebounced();
}

function toHexColor(v){
  if(!v || v==='transparent') return '#000000';
  if(v.startsWith('#')) return v.length===7?v:'#000000';
  return '#8b5cf6';
}
function linkColor(colorId, textId, fn){
  const c = $('#'+colorId), t = $('#'+textId);
  c.oninput = ()=>{ t.value = c.value; fn(c.value); };
  t.oninput = ()=>{ fn(t.value); };
}

/* =========================================================================
   KEYFRAME TIMELINE EDITOR
   ========================================================================= */
function openTimelineEditor(elId){
  state.timelineElId = elId;
  const pg = activePage();
  const el = pg.elements.find(e=>e.id===elId);
  if(el && el.timeline.keyframes.length===0){
    el.timeline.keyframes.push(captureKeyframe(el, 0));
  }
  state.timelineTime = 0;
  state.timelineSelectedKf = null;
  renderTimelineBar();
}
function closeTimelineEditor(){
  state.timelineElId = null;
  state.timelinePlaying = false;
  renderTimelineBar();
  refreshEl();
}
function captureKeyframe(el, t){
  return { id: uid('kf'), t, x: el.x, y: el.y, w: el.w, h: el.h, opacity: el.style.opacity, scale: el.style.scale||1, rotate: el.style.rotate||0 };
}
function timelineGetEl(){
  if(!state.timelineElId || !state.project) return null;
  const pg = activePage();
  return pg.elements.find(e=>e.id===state.timelineElId) || null;
}
function interpolateAt(el, t){
  const kfs = el.timeline.keyframes.slice().sort((a,b)=>a.t-b.t);
  if(!kfs.length) return null;
  if(t<=kfs[0].t) return kfs[0];
  if(t>=kfs[kfs.length-1].t) return kfs[kfs.length-1];
  let k0=kfs[0], k1=kfs[kfs.length-1];
  for(let i=0;i<kfs.length-1;i++){ if(t>=kfs[i].t && t<=kfs[i+1].t){ k0=kfs[i]; k1=kfs[i+1]; break; } }
  const span = Math.max(1, k1.t-k0.t);
  const f = (t-k0.t)/span;
  const lerp = (a,b)=> a + (b-a)*f;
  return { x:lerp(k0.x,k1.x), y:lerp(k0.y,k1.y), w:lerp(k0.w,k1.w), h:lerp(k0.h,k1.h), opacity:lerp(k0.opacity,k1.opacity), scale:lerp(k0.scale,k1.scale), rotate:lerp(k0.rotate,k1.rotate) };
}
function previewTimelineAt(el, t){
  const val = interpolateAt(el, t);
  if(!val) return;
  const node = $(`.el[data-id="${el.id}"]`);
  if(!node) return;
  node.style.left = val.x+'px'; node.style.top = val.y+'px';
  node.style.width = val.w+'px'; node.style.height = val.h+'px';
  node.style.opacity = val.opacity;
  node.style.transform = `scale(${val.scale}) rotate(${val.rotate}deg)`;
}
function renderTimelineBar(){
  const bar = $('#timelineBar');
  if(!bar) return;
  const el = timelineGetEl();
  if(!el || !el.timeline.enabled){ bar.classList.remove('show'); bar.innerHTML=''; return; }
  bar.classList.add('show');
  const dur = el.timeline.duration;
  const kfs = el.timeline.keyframes.slice().sort((a,b)=>a.t-b.t);
  const rulerW = Math.max(600, Math.round(dur/4));
  const ticks = [];
  const tickStep = dur<=2000?250:(dur<=6000?500:1000);
  for(let t=0;t<=dur;t+=tickStep){ ticks.push(t); }
  bar.innerHTML = `
    <div class="timeline-head">
      <b>🎬 ${OBJECT_DEFS.find(o=>o.type===el.type)?.label||el.type} — keyframe-tijdlijn</b>
      <button class="btn icon small" id="tl_play">${state.timelinePlaying?'⏸':'▶'}</button>
      <span class="timeline-time" id="tl_timeLabel">${Math.round(state.timelineTime)} ms</span>
      <div style="display:flex; align-items:center; gap:6px;"><label class="mini-label" style="margin:0;">Duur</label><input type="number" id="tl_dur" value="${dur}" style="width:80px;"> ms</div>
      <button class="btn small" id="tl_addkf">＋ Keyframe hier</button>
      <button class="btn small danger ${state.timelineSelectedKf?'':'disabled'}" id="tl_delkf">🗑️ Verwijder keyframe</button>
      <div style="flex:1;"></div>
      <button class="btn small" id="tl_close">✕ Sluiten</button>
    </div>
    <div class="timeline-track-wrap">
      <div class="timeline-ruler" id="tl_ruler" style="width:${rulerW}px;">
        ${ticks.map(t=>`<div class="timeline-tick" style="left:${(t/dur)*rulerW}px;"><span>${t}ms</span></div>`).join('')}
        ${kfs.map(k=>`<div class="timeline-kf ${state.timelineSelectedKf===k.id?'active':''}" data-kf="${k.id}" style="left:${(k.t/dur)*rulerW}px;" title="${k.t}ms"></div>`).join('')}
        <div class="timeline-playhead" id="tl_playhead" style="left:${(state.timelineTime/dur)*rulerW}px;"></div>
      </div>
    </div>
  `;
  const ruler = $('#tl_ruler');
  ruler.addEventListener('click', e=>{
    if(e.target.classList.contains('timeline-kf')) return;
    const rect = ruler.getBoundingClientRect();
    const t = clamp(Math.round(((e.clientX-rect.left)/rulerW)*dur), 0, dur);
    state.timelineTime = t; state.timelineSelectedKf = null;
    previewTimelineAt(el, t);
    renderTimelineBar();
  });
  $$('.timeline-kf', ruler).forEach(dot=>{
    dot.onclick = e=>{
      e.stopPropagation();
      const kf = el.timeline.keyframes.find(k=>k.id===dot.dataset.kf);
      state.timelineTime = kf.t; state.timelineSelectedKf = kf.id;
      previewTimelineAt(el, kf.t);
      renderTimelineBar();
    };
  });
  $('#tl_play').onclick = ()=> toggleTimelinePlay(el);
  $('#tl_close').onclick = closeTimelineEditor;
  $('#tl_dur').onchange = e=>{
    el.timeline.duration = Math.max(200, parseInt(e.target.value)||3000);
    refreshDynamicKeyframesCSS(); saveDebounced(); historyDebounced();
    renderTimelineBar();
  };
  $('#tl_addkf').onclick = ()=>{
    const existing = el.timeline.keyframes.find(k=>Math.abs(k.t-state.timelineTime)<Math.max(20, dur*0.01));
    const kf = captureKeyframe(el, state.timelineTime);
    if(existing){ Object.assign(existing, kf, {id:existing.id, t:existing.t}); }
    else { el.timeline.keyframes.push(kf); }
    refreshDynamicKeyframesCSS(); saveDebounced(); pushHistory();
    renderTimelineBar();
    toast('Keyframe toegevoegd');
  };
  $('#tl_delkf').onclick = ()=>{
    if(!state.timelineSelectedKf) return;
    if(el.timeline.keyframes.length<=1){ toast('Je hebt minimaal 1 keyframe nodig', 'err'); return; }
    el.timeline.keyframes = el.timeline.keyframes.filter(k=>k.id!==state.timelineSelectedKf);
    state.timelineSelectedKf = null;
    refreshDynamicKeyframesCSS(); saveDebounced(); pushHistory();
    renderTimelineBar();
  };
}
function toggleTimelinePlay(el){
  state.timelinePlaying = !state.timelinePlaying;
  if(!state.timelinePlaying){ renderTimelineBar(); return; }
  const dur = el.timeline.duration;
  const startTime = performance.now() - state.timelineTime;
  function tick(now){
    if(!state.timelinePlaying) return;
    let t = now - startTime;
    if(t>=dur){ t = dur; state.timelinePlaying = false; }
    state.timelineTime = t;
    previewTimelineAt(el, t);
    const ph = $('#tl_playhead'); const lbl = $('#tl_timeLabel'); const playBtn = $('#tl_play');
    if(ph){ const ruler=$('#tl_ruler'); const rulerW = ruler ? ruler.getBoundingClientRect().width : 600; ph.style.left = (t/dur)*rulerW+'px'; }
    if(lbl) lbl.textContent = Math.round(t)+' ms';
    if(!state.timelinePlaying && playBtn) playBtn.textContent = '▶';
    if(state.timelinePlaying) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function bgCss(bg){
  if(!bg) return 'background:#101319;';
  if(bg.type==='solid') return `background:${bg.value};`;
  if(bg.type==='gradient') return `background:${bg.value};`;
  if(bg.type==='animgrad') return `background:${bg.value}; background-size:220% 220%; animation:gradShift 9s ease infinite;`;
  if(bg.type==='3d') return `background:#0e1016;`;
  if(bg.type==='glasswave') return `background:linear-gradient(135deg,#241a3d,#0e1016);`;
  if(bg.type==='starfield') return `background:radial-gradient(circle at 30% 20%, #171b2b, #06070a 70%);`;
  if(bg.type==='aurora') return `background:linear-gradient(135deg,#0b1020,#170e2e);`;
  if(bg.type==='dotgrid') return `background:${bg.value}; background-image:radial-gradient(rgba(255,255,255,0.14) 1.4px, transparent 1.4px); background-size:22px 22px;`;
  if(bg.type==='noise') return `background:${bg.value}; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");`;
  return 'background:#101319;';
}
function elementInnerHTML(el){
  switch(el.type){
    case 'heading': case 'text': case 'button': case 'badge': return esc(el.content);
    case 'icon': return `<span style="font-size:${Math.max(20,el.h*0.5)}px;">${esc(el.content)}</span>`;
    case 'input': return `<input type="text" placeholder="${esc(el.content)}" style="width:100%;height:100%;background:transparent;border:none;color:inherit;font-size:inherit;padding:0 12px;outline:none;">`;
    case 'image': return el.src ? `<img src="${esc(el.src)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">` : '';
    case 'video': return el.src ? `<iframe src="${esc(el.src)}" style="width:100%;height:100%;border:none;border-radius:inherit;" allowfullscreen></iframe>` : '';
    default: return '';
  }
}
function elementStyleString(el){
  const s = el.style;
  let bg = s.bg;
  let extra = '';
  if(s.glass){
    bg = 'rgba(255,255,255,0.08)';
    extra += `backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%); border:1px solid rgba(255,255,255,0.25); box-shadow:0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.25);`;
  }
  const justify = s.align==='center'?'center':(s.align==='right'?'flex-end':'flex-start');
  const isFlexType = ['heading','text','button','badge','icon'].includes(el.type);
  const useCustomKf = el.timeline && el.timeline.enabled && el.timeline.keyframes && el.timeline.keyframes.length>=2;
  let animCss = '';
  if(el.onLoadAnim && el.onLoadAnim.enabled){
    animCss = useCustomKf
      ? `animation:kf_${el.id} ${el.timeline.duration}ms linear ${el.onLoadAnim.delay}ms both;`
      : `animation:${el.onLoadAnim.type} ${el.onLoadAnim.duration}ms ease ${el.onLoadAnim.delay}ms both;`;
  }
  return `position:absolute; left:${el.x}px; top:${el.y}px; width:${el.w}px; height:${el.h}px; z-index:${el.z};`+
    `background:${bg}; color:${s.color}; font-size:${s.fontSize}px; font-weight:${s.fontWeight}; border-radius:${s.radius}px; opacity:${s.opacity}; `+
    `transform:scale(${s.scale||1}) rotate(${s.rotate||0}deg); transform-origin:center center; `+
    `${!s.glass ? 'border:'+(s.border||'none')+';' : extra} ${s.shadow?'box-shadow:0 12px 30px rgba(0,0,0,0.35);':''} overflow:${el.type==='overlay'?'visible':'hidden'}; box-sizing:border-box; `+
    `${isFlexType ? `display:flex; align-items:center; justify-content:${justify}; text-align:${s.align}; padding:0 16px;` : ''}`+
    `${el.type==='divider' ? `background:${s.bg==='transparent'?'rgba(255,255,255,0.2)':s.bg};` : ''}`+
    `${(el.action&&el.action.enabled&&el.action.type!=='none') ? 'cursor:pointer;' : ''}`+
    `${el.startHidden ? 'display:none;' : ''}`+
    animCss;
}
function elementActionAttrs(el, mode, fileMap, page){
  if(!(el.action && el.action.enabled && el.action.type!=='none')) return '';
  let animName = el.action.animType || 'pulse', animDur = 650, animTiming = 'ease';
  if(el.action.type==='animate'){
    const targetId = el.action.target || el.id;
    const targetEl = page.elements.find(x=>x.id===targetId);
    if(el.action.animType==='__custom__' && targetEl && targetEl.timeline && targetEl.timeline.enabled && targetEl.timeline.keyframes.length>=2){
      animName = 'kf_'+targetId; animDur = targetEl.timeline.duration; animTiming = 'linear';
    }

  let targetFileAttr = '';
  if(el.action.type==='goToPage' && mode==='zip' && fileMap){
    targetFileAttr = `data-target-file="${esc(fileMap[el.action.target]||'')}"`;
  }
  return `data-action="${el.action.type}" data-target="${esc(el.action.target||'')}" ${targetFileAttr} data-anim="${esc(animName)}" data-anim-dur="${animDur}" data-anim-timing="${animTiming}" data-url="${esc(el.action.url||'')}" data-msg="${esc(el.action.message||'')}"`;
}

function slugify(name){
  return (name||'pagina').toString().toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'pagina';
}
function buildFileMap(proj){
  const map = {}; const used = {};
  proj.pages.forEach((p,i)=>{
    let base = i===0 ? 'index' : slugify(p.name);
    let name = base, n=2;
    while(used[name]){ name = base+'-'+n; n++; }
    used[name] = true;
    map[p.id] = name+'.html';
  });
  return map;
}

      if(!existing) return;
      const st = node.getAttribute('style') || '';
      const get = (prop)=>{ const m = st.match(new RegExp(prop+':\\s*([^;]+);?')); return m ? m[1].trim() : null; };
      const px = v => v ? parseFloat(v) : null;
      if(get('left')!=null) existing.x = px(get('left'));
      if(get('top')!=null) existing.y = px(get('top'));
      if(get('width')!=null) existing.w = px(get('width'));
      if(get('height')!=null) existing.h = px(get('height'));
      if(get('z-index')!=null) existing.z = px(get('z-index'));
      if(get('opacity')!=null) existing.style.opacity = parseFloat(get('opacity'));
      if(get('border-radius')!=null) existing.style.radius = px(get('border-radius'));
      if(get('font-size')!=null) existing.style.fontSize = px(get('font-size'));
      if(get('color')!=null) existing.style.color = get('color');
      if(get('background')!=null) existing.style.bg = get('background').split(' ')[0];
      if(['heading','text','button','badge','icon'].includes(existing.type)) existing.content = node.textContent;
      newEls.push(existing);
    });
    if(newEls.length){ activePage().elements = newEls; }
    renderAll();
    saveDebounced();
    pushHistory();
    toast('Code toegepast op canvas');
    closeModal('modalCode');
  }catch(err){
    toast('Kon code niet verwerken — controleer of data-id attributen intact zijn', 'err');
  }
}

function exportSingleHTML(){
  if(!state.project){ toast('Geen project geladen', 'err'); return; }
  const html = generateFullHTML();
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (state.project.name || 'website').replace(/[^a-z0-9\-_]+/gi,'_') + '.html';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Website geëxporteerd als HTML-bestand');
}

function exportZip(){
  if(!state.project){ toast('Geen project geladen', 'err'); return; }
  if(typeof JSZip==='undefined'){ toast('ZIP-bibliotheek kon niet laden — controleer je internetverbinding', 'err'); return; }
  const proj = state.project;
  const fileMap = buildFileMap(proj);
  const zip = new JSZip();
  zip.file('style.css', `/* ${esc(proj.name)} — gedeelde stijl, gegenereerd door Designer (Mattyou Studios) */\n` + sharedStyleCSS(proj));
  zip.file('script.js', `/* ${esc(proj.name)} — gedeelde runtime, gegenereerd door Designer (Mattyou Studios) */\n` + runtimeJSBody('zip'));
  proj.pages.forEach(p=>{
    zip.file(fileMap[p.id], generateStandalonePageHTML(p, proj, fileMap));
  });
  zip.generateAsync({type:'blob'}).then(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (proj.name || 'website').replace(/[^a-z0-9\-_]+/gi,'_') + '.zip';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Website geëxporteerd als ZIP-bestand');
  }).catch(()=> toast('Zippen mislukt — probeer het opnieuw', 'err'));
}

/* =========================================================================
   TEMPLATES MODAL
   ========================================================================= */
function openTemplatesModal(){
  const grid = $('#tplGrid');
  grid.innerHTML = TEMPLATES.map(t=>`
    <div class="tpl-card" data-tpl="${t.id}">
      <div class="tpl-thumb" style="background:${t.bg.type==='solid'?t.bg.value:(t.bg.value||'#1a1c26')};">${t.ic}</div>
      <div class="tpl-info"><b>${t.label}</b><p>${t.desc}</p></div>
    </div>`).join('');
  $$('.tpl-card', grid).forEach(c=>{
    c.onclick = ()=>{
      if(!state.project){ toast('Geen project actief', 'err'); return; }
      const pg = activePage();
      const t = TEMPLATES.find(x=>x.id===c.dataset.tpl);
      if(pg.elements.length && !confirm('Dit vervangt de inhoud van de huidige pagina door de template. Doorgaan?')) return;
      pg.background = Object.assign({}, t.bg);
      pg.elements = templateElements(t.id);
      state.selectedId = null;
      renderAll(); saveDebounced();
      closeModal('modalTemplates');
      toast('Template toegepast: ' + t.label);
    };
  });
  openModal('modalTemplates');
}

function openNewProjectModal(){
  const grid = $('#newProjTplGrid');
  grid.innerHTML = TEMPLATES.map(t=>`
    <div class="tpl-card" data-tpl="${t.id}">
      <div class="tpl-thumb" style="background:${t.bg.type==='solid'?t.bg.value:(t.bg.value||'#1a1c26')};">${t.ic}</div>

/* =========================================================================
   PROJECTS MODAL
   ========================================================================= */
function renderProjectsList(){
  const list = getProjectList().slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  const body = $('#projectsBody');
  if(!list.length){
    body.innerHTML = `<div class="empty-state"><span class="ic">📁</span>Nog geen opgeslagen projecten${state.user?'':' als gast'}.</div>`;
    return;
  }
  body.innerHTML = list.map(p=>`
    <div class="bg-item" style="cursor:pointer;">
      <div class="bg-swatch" style="background:var(--grad); display:flex; align-items:center; justify-content:center;">📄</div>
      <div style="flex:1;" data-open="${p.id}"><div class="lbl">${esc(p.name)}</div><div class="sub">Bijgewerkt: ${new Date(p.updatedAt).toLocaleString('nl-NL')}</div></div>
      <button class="btn small danger" data-del="${p.id}">🗑️</button>
    </div>`).join('');
  $$('[data-open]', body).forEach(x=> x.onclick = ()=>{ loadProject(x.dataset.open); closeModal('modalProjects'); });
  $$('[data-del]', body).forEach(x=> x.onclick = (e)=>{ e.stopPropagation(); if(confirm('Project definitief verwijderen?')) deleteProject(x.dataset.del); });
}
function openProjectsModal(){ renderProjectsList(); openModal('modalProjects'); }

/* =========================================================================
   ACCOUNT MODAL (lokaal account-systeem via localStorage)
   ========================================================================= */
function openAccountModal(){
  openModal('modalAccount');
  renderAccountModal();
}
function renderAccountModal(){
  const body = $('#accModalBody');
  $('#accModalTitle').innerHTML = state.user ? '👤 Mijn account' : '👤 Account';
  if(state.user){
    body.innerHTML = `
      <p style="font-size:13px; color:var(--muted); margin-top:0;">Ingelogd als <b style="color:var(--text);">${esc(state.user.username)}</b></p>
      <p style="font-size:11.5px; color:var(--muted2); line-height:1.6;">Je projecten worden apart van gast-projecten bewaard in de opslag van deze browser.</p>
      <button class="btn small" style="width:100%; margin-top:10px;" id="accLogout">🚪 Uitloggen</button>
    `;
    $('#accLogout').onclick = ()=>{
      state.user = null;
      localStorage.removeItem(LS_CURRENT_USER);
      closeModal('modalAccount');
      initFreshProject();
      toast('Uitgelogd — verdergegaan als gast');
    };
    return;
  }
  body.innerHTML = `
    <div class="acc-tabs">
      <div class="acc-tab active" data-acctab="login">Inloggen</div>
      <div class="acc-tab" data-acctab="register">Account maken</div>
    </div>
    <div id="accFormArea"></div>
    <p style="font-size:10.5px; color:var(--muted2); margin-top:14px; line-height:1.5;">Accounts worden lokaal in deze browser bewaard (niet naar een server verstuurd), puur om jouw projecten te scheiden van andere gebruikers van dit toestel.</p>
  `;
  $$('.acc-tab', body).forEach(t=>{
    t.onclick = ()=>{ $$('.acc-tab', body).forEach(x=>x.classList.remove('active')); t.classList.add('active'); renderAccForm(t.dataset.acctab); };
  });
  renderAccForm('login');

  function renderAccForm(kind){
    const area = $('#accFormArea');
    area.innerHTML = `
      <div class="field"><label>Gebruikersnaam</label><input type="text" id="accUser" placeholder="bv. mattyou"></div>
      <div class="field"><label>Wachtwoord</label><input type="text" id="accPass" placeholder="••••••••"></div>
      <button class="btn small primary" style="width:100%;" id="accSubmit">${kind==='login'?'Inloggen':'Account aanmaken'}</button>
    `;
    $('#accSubmit').onclick = ()=>{
      const u = $('#accUser').value.trim();
      const p = $('#accPass').value;
      if(!u || !p){ toast('Vul gebruikersnaam en wachtwoord in', 'err'); return; }
      const accounts = loadJSON(LS_ACCOUNTS, {});
      if(kind==='register'){
        if(accounts[u]){ toast('Deze gebruikersnaam bestaat al', 'err'); return; }
        accounts[u] = {passHash: simpleHash(p), createdAt: Date.now()};
        saveJSON(LS_ACCOUNTS, accounts);
        toast('Account aangemaakt — je bent nu ingelogd');
      } else {
        if(!accounts[u] || accounts[u].passHash !== simpleHash(p)){ toast('Onjuiste gebruikersnaam of wachtwoord', 'err'); return; }
        toast('Ingelogd als ' + u);
      }
      state.user = {username: u};
      saveJSON(LS_CURRENT_USER, state.user);
      closeModal('modalAccount');
      initFreshProject();
    };
  }
}

/* =========================================================================
   SETTINGS MODAL (opslag: local storage vs database)
   ========================================================================= */
function openSettingsModal(){
  const body = $('#settingsBody');
  body.innerHTML = `
    <div class="field">
      <label>Waar wil je projecten opslaan?</label>
      <select id="setMode">
        <option value="local" ${state.settings.storageMode==='local'?'selected':''}>Alleen local storage (in deze browser)</option>
        <option value="database" ${state.settings.storageMode==='database'?'selected':''}>Local storage + eigen database-eindpunt</option>
      </select>
    </div>
    <div class="field" id="dbUrlField" style="${state.settings.storageMode==='database'?'':'display:none;'}">
      <label>Database API-URL (jouw eigen backend)</label>
      <input type="text" id="setDbUrl" value="${esc(state.settings.dbUrl)}" placeholder="https://jouw-backend.nl/api/projects">
      <p style="font-size:10.5px; color:var(--muted2); margin-top:6px; line-height:1.6;">Designer draait volledig in de browser en kan zelf geen database hosten. Geef hier de URL van jouw eigen server op — bij opslaan sturen we een POST met het project als JSON. Zonder eigen server valt alles automatisch terug op local storage, zodat je nooit iets kwijtraakt.</p>
    </div>
    <button class="btn small primary" style="width:100%;" id="setSave">Opslaan</button>
  `;
  $('#setMode').onchange = e=>{ $('#dbUrlField').style.display = e.target.value==='database' ? '' : 'none'; };
  $('#setSave').onclick = ()=>{
    state.settings.storageMode = $('#setMode').value;
    state.settings.dbUrl = $('#setDbUrl') ? $('#setDbUrl').value.trim() : '';
    saveJSON(LS_SETTINGS, state.settings);
    toast('Instellingen opgeslagen');
    closeModal('modalSettings');
  };
  openModal('modalSettings');
}

/* =========================================================================
   MASTER RENDER + INIT
   ========================================================================= */
function renderAll(){
  renderPageTabs();
  renderCanvas();
  renderLeftRail();
  renderRightRail();
  refreshDynamicKeyframesCSS();
  renderTimelineBar();
}

function buildKeyframeCSS(el){
  if(!el.timeline || !el.timeline.enabled || !el.timeline.keyframes || el.timeline.keyframes.length<2) return '';
  const kfs = el.timeline.keyframes.slice().sort((a,b)=>a.t-b.t);
  const dur = Math.max(1, el.timeline.duration);
  const stops = kfs.map(k=>{
    const pct = clamp(Math.round((k.t/dur)*100),0,100);
    return `${pct}%{ left:${k.x}px; top:${k.y}px; width:${k.w}px; height:${k.h}px; opacity:${k.opacity}; transform:scale(${k.scale}) rotate(${k.rotate}deg); }`;
  }).join(' ');
  return `@keyframes kf_${el.id}{ ${stops} }`;
}
function refreshDynamicKeyframesCSS(){
  const styleTag = document.getElementById('dynamicKfStyle');
  if(!styleTag || !state.project) return;
  let css = '';
  state.project.pages.forEach(pg=> pg.elements.forEach(el=>{ css += buildKeyframeCSS(el); }));
  styleTag.textContent = css;
}

function init(){
  buildShell();
  initFreshProject();
  pushHistory();
}
init();
