<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community — McTools©</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="app" id="app"></div>

<script src="app.js"></script>
<script>
window.IS_DATAPACK_PAGE=false;
const startFilter = new URLSearchParams(location.search).get('filter');
let communityPacks=null, communityLoading=true, communityError=null, communitySearch='';
let communityFilter = startFilter==='items' ? 'items' : 'packs'; // 'packs' | 'items'

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  app.appendChild(renderHeader('community'));
  const main=document.createElement('main');
  main.appendChild(renderCommunityPage());
  app.appendChild(main);
  app.appendChild(renderFooter());
  if(state.authModal) app.appendChild(renderAuthModal());
  if(state.myPacksModal) app.appendChild(renderMyPacksModal());
}

function renderCommunityPage(){
  const wrap=document.createElement('div');
  wrap.innerHTML=`
    <div style="margin-bottom:16px;">
      <h1 style="font-size:22px;margin:0 0 6px;">🌍 Community</h1>
      <p style="color:var(--text-dim);font-size:13px;margin:0;">Alle door spelers gepubliceerde packs — of zoek losse items uit al die packs.</p>
    </div>
    <div class="filter-chips">
      <div class="filter-chip ${communityFilter==='packs'?'active':''}" data-f="packs">📦 Packs</div>
      <div class="filter-chip ${communityFilter==='items'?'active':''}" data-f="items">🖼️ Items</div>
    </div>
    <div class="field" style="max-width:340px;margin-bottom:18px;">
      <input type="text" id="communitySearchInput" placeholder="${communityFilter==='packs'?'Zoek op pack- of makernaam…':'Zoek op itemnaam, basis-item of maker…'}" value="${escapeHtml(communitySearch)}">
    </div>
    <div id="communityGrid"></div>
  `;
  const grid=wrap.querySelector('#communityGrid');

  if(communityLoading){ grid.innerHTML='<div class="empty-hint">Laden…</div>'; }
  else if(communityError){ grid.innerHTML=`<div class="error-msg">${escapeHtml(communityError)}</div>`; }
  else if(communityFilter==='packs'){ renderPacksGrid(grid); }
  else { renderItemsGrid(grid); }

  setTimeout(()=>{
    wrap.querySelectorAll('.filter-chip').forEach(c=>{ c.onclick=()=>{ communityFilter=c.dataset.f; render(); }; });
    const si=wrap.querySelector('#communitySearchInput');
    if(si) si.addEventListener('input',e=>{ communitySearch=e.target.value; render(); });
  },0);
  return wrap;
}

function renderPacksGrid(grid){
  grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;';
  const q=communitySearch.trim().toLowerCase();
  const filtered=communityPacks.filter(p=> !q || p.name.toLowerCase().includes(q) || p.authorName.toLowerCase().includes(q));
  if(!filtered.length){ grid.innerHTML='<div class="empty-hint">Nog geen publieke packs gevonden.</div>'; return; }
  filtered.forEach(p=>{
    const items=(p.data&&p.data.items)||[];
    const card=document.createElement('div');
    card.className='panel';
    card.style.cssText='padding:16px;cursor:pointer;';
    card.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
        <div><b style="font-size:14.5px;">${escapeHtml(p.name)}</b><div class="sub" style="color:var(--text-dim);font-size:11.5px;">door ${escapeHtml(p.authorName)}</div></div>
        <span class="ab-pill">${items.length} item${items.length===1?'':'s'}</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
        ${items.slice(0,6).map(it=>`<div class="thumb" style="width:30px;height:30px;">${it.texture?`<img src="${it.texture}">`:''}</div>`).join('')}
      </div>
      <div class="field-row" style="margin:0;">
        <button class="btn small primary" data-open>Bekijken</button>
        <button class="btn small ghost" data-import>Importeren</button>
        <button class="btn small ghost" data-download>Download</button>
      </div>
    `;
    card.onclick=()=>{ location.href='community-pack.html?id='+encodeURIComponent(p.id); };
    card.querySelector('[data-open]').onclick=(e)=>{ e.stopPropagation(); location.href='community-pack.html?id='+encodeURIComponent(p.id); };
    card.querySelector('[data-import]').onclick=(e)=>{
      e.stopPropagation();
      localStorage.setItem('mc_pending_import', JSON.stringify(items.map(it=>({ name:it.name, color:it.color, baseItem:it.baseItem, dataUrl:it.texture }))));
      location.href='datapack-maker.html';
    };
    card.querySelector('[data-download]').onclick=(e)=>{ e.stopPropagation(); downloadCommunityPack(p); };
    grid.appendChild(card);
  });
}

function renderItemsGrid(grid){
  grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;';
  const q=communitySearch.trim().toLowerCase();
  const allItems=[];
  communityPacks.forEach(p=>{
    ((p.data&&p.data.items)||[]).forEach(it=>{
      allItems.push({ name:it.name, color:it.color, baseItem:it.baseItem, texture:it.texture, authorName:p.authorName, packId:p.id, packName:p.name });
    });
  });
  const filtered=allItems.filter(it=> !q ||
    it.name.toLowerCase().includes(q) || it.baseItem.toLowerCase().includes(q) ||
    it.authorName.toLowerCase().includes(q) || it.packName.toLowerCase().includes(q));
  if(!filtered.length){ grid.innerHTML='<div class="empty-hint">Niks gevonden. Nog niemand heeft dit item gepubliceerd, of pas je zoekterm aan.</div>'; return; }
  filtered.forEach(it=>{
    const card=document.createElement('div');
    card.className='item-card';
    card.style.cursor='pointer';
    card.innerHTML=`
      <div class="thumb">${it.texture?`<img src="${it.texture}">`:''}</div>
      <div class="meta">
        <div class="nm" style="color:${mcColorHex(it.color)}">${escapeHtml(it.name)}</div>
        <div class="sub">${prettyName(it.baseItem)} · ${escapeHtml(it.authorName)}</div>
      </div>
    `;
    card.onclick=()=>{ location.href='community-pack.html?id='+encodeURIComponent(it.packId); };
    grid.appendChild(card);
  });
}

async function boot(){
  render();
  try{
    communityPacks=await fetchCommunityPacks();
    communityLoading=false;
  }catch(err){
    communityLoading=false;
    communityError='Kon community-packs niet laden. Is de "is_public"-kolom en "mc_profiles"-tabel al aangemaakt in Supabase? ('+err.message+')';
  }
  render();
}
boot();
</script>
</body>
</html>
