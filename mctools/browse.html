<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse — McTools©</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="app" id="app"></div>

<script src="app.js"></script>
<script>
window.IS_DATAPACK_PAGE=false;
let browseItems=null, browseLoading=true, browseError=null, browseSearch='';

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  app.appendChild(renderHeader('browse'));
  const main=document.createElement('main');
  main.appendChild(renderBrowsePage());
  app.appendChild(main);
  app.appendChild(renderFooter());
  if(state.authModal) app.appendChild(renderAuthModal());
  if(state.myPacksModal) app.appendChild(renderMyPacksModal());
}

function renderBrowsePage(){
  const wrap=document.createElement('div');
  wrap.innerHTML=`
    <div style="margin-bottom:20px;">
      <h1 style="font-size:22px;margin:0 0 6px;">🔍 Browse</h1>
      <p style="color:var(--text-dim);font-size:13px;max-width:700px;line-height:1.6;margin:0;">
        Zoek door items die door de community zijn gedeeld (via gepubliceerde packs). Klik op een item
        om 'm zo in je eigen datapack te zetten. <b>Let op:</b> vanilla Minecraft-textures staan hier
        bewust nog niet in — die mogen we niet zomaar vanaf een externe bron aanbieden (auteursrecht van
        Mojang). Zodra er een nette, legale manier is (bijv. je eigen game-bestanden lokaal uploaden) komt
        dat er nog bij; voor nu doorzoek je wat spelers zelf gemaakt en gepubliceerd hebben.
      </p>
    </div>
    <div class="field" style="max-width:380px;margin-bottom:18px;">
      <input type="text" id="browseSearchInput" placeholder="Zoek op itemnaam, basis-item of maker…" value="${escapeHtml(browseSearch)}">
    </div>
    <div id="browseGrid"></div>
  `;
  const grid=wrap.querySelector('#browseGrid');
  grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;';

  if(browseLoading){ grid.innerHTML='<div class="empty-hint">Laden…</div>'; }
  else if(browseError){ grid.innerHTML=`<div class="error-msg">${escapeHtml(browseError)}</div>`; }
  else {
    const q=browseSearch.trim().toLowerCase();
    const filtered=browseItems.filter(it=> !q ||
      it.name.toLowerCase().includes(q) || it.baseItem.toLowerCase().includes(q) ||
      it.authorName.toLowerCase().includes(q) || it.packName.toLowerCase().includes(q));
    if(!filtered.length){ grid.innerHTML='<div class="empty-hint">Niks gevonden. Nog niemand heeft dit item gepubliceerd, of pas je zoekterm aan.</div>'; }
    filtered.forEach(it=>{
      const card=document.createElement('div');
      card.className='item-card';
      card.style.cursor='pointer';
      card.innerHTML=`
        <div class="thumb">${it.texture?`<img src="${it.texture}">`:''}</div>
        <div class="meta">
          <div class="nm" style="color:${mcColorHex(it.color)}">${escapeHtml(it.name)}</div>
          <div class="sub">${prettyName(it.baseItem)} · ${escapeHtml(it.authorName)}</div>
        </div>
      `;
      card.onclick=()=>{
        localStorage.setItem('mc_pending_import', JSON.stringify([{name:it.name,color:it.color,baseItem:it.baseItem,dataUrl:it.texture}]));
        location.href='datapack-maker.html';
      };
      grid.appendChild(card);
    });
  }

  setTimeout(()=>{
    wrap.querySelector('#browseSearchInput').addEventListener('input',e=>{ browseSearch=e.target.value; render(); });
  },0);
  return wrap;
}

async function boot(){
  render();
  try{
    const packs=await fetchCommunityPacks();
    browseItems=[];
    packs.forEach(p=>{
      ((p.data&&p.data.items)||[]).forEach(it=>{
        browseItems.push({ name:it.name, color:it.color, baseItem:it.baseItem, texture:it.texture, authorName:p.authorName, packName:p.name });
      });
    });
    browseLoading=false;
  }catch(err){
    browseLoading=false;
    browseError='Kon community-items niet laden. ('+err.message+')';
  }
  render();
}
boot();
</script>
</body>
</html>
