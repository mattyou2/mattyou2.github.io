<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mattyou Craft - By Mattyou Studios™</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #0a0a10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            box-sizing: border-box;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 11;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { left: 7px; top: 0; width: 2px; height: 16px; }

        /* Branding Watermark */
        .branding {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            z-index: 12;
        }

        /* Hotbar */
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #333;
            border-radius: 5px;
            padding: 5px;
            pointer-events: auto;
        }

        .hotbar-slot {
            width: 50px;
            height: 50px;
            border: 2px solid #555;
            margin: 0 4px;
            background-size: cover;
            position: relative;
            cursor: pointer;
            image-rendering: pixelated;
        }

        .hotbar-slot.active {
            border-color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }

        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        /* Survival Stats */
        #stats-panel {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        .stat-bar {
            width: 150px;
            height: 12px;
            background: #333;
            border: 2px solid white;
            border-radius: 3px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s;
        }

        #hp-fill { background: #ff2222; }

        /* Screens: Menu, Inventory, World Creation */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 5px;
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            color: #ff00ff;
            margin-bottom: 40px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .btn {
            background: #111;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: all 0.2s;
            text-transform: uppercase;
            width: 250px;
            text-align: center;
        }

        .btn:hover {
            background: #00ffff;
            color: #111;
            box-shadow: 0 0 15px #00ffff;
        }

        /* World Creation Form */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            width: 300px;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #ccc;
        }

        .form-group input, .form-group select {
            padding: 10px;
            background: #222;
            border: 2px solid #555;
            color: white;
            font-size: 16px;
            border-radius: 4px;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #00ffff;
            outline: none;
        }

        /* Inventory & Crafting Screen ('E') */
        #inventory-screen {
            display: none;
            background: rgba(5, 5, 10, 0.95);
        }

        .inv-container {
            display: flex;
            gap: 40px;
            background: #1a1a24;
            border: 3px solid #00ffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }

        .inv-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .inv-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .inv-slot {
            width: 60px;
            height: 60px;
            border: 2px solid #444;
            background: #222;
            position: relative;
            cursor: pointer;
        }

        .inv-slot:hover {
            border-color: #00ffff;
        }

        .crafting-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 280px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .craft-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a3a;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
        }

        .craft-item button {
            background: #00ffff;
            border: none;
            color: black;
            padding: 5px 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .craft-item button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        /* World Selection List */
        #world-list {
            width: 320px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #333;
            background: #111;
            padding: 10px;
        }

        .world-item {
            padding: 10px;
            border: 1px solid #444;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            background: #222;
        }

        .world-item:hover {
            border-color: #00ffff;
            background: #1a2a2a;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- HUD -->
    <div id="hud" style="display: none;">
        <div id="crosshair"></div>
        <div class="branding">MATTYOU STUDIOS™</div>

        <!-- Stats (Alleen zichtbaar in Survival) -->
        <div id="stats-panel">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <span style="font-size: 11px; margin-bottom: 2px;">INTEGRITY (HP)</span>
                <div class="stat-bar">
                    <div id="hp-fill" class="stat-fill"></div>
                </div>
            </div>
        </div>

        <!-- Hotbar -->
        <div id="hotbar">
            <!-- Dynamisch gevuld via JS -->
        </div>
    </div>

    <!-- Main Menu Screen -->
    <div id="menu-screen" class="screen">
        <h1>MATTYOU CRAFT</h1>
        <div class="subtitle">BY MATTYOU STUDIOS™</div>
        
        <div id="world-list-container" style="display: none; flex-direction: column; align-items: center;">
            <h3>Selecteer een Wereld</h3>
            <div id="world-list"></div>
            <button class="btn" onclick="showCreateWorld()">Nieuwe Wereld</button>
        </div>

        <div id="main-menu-buttons">
            <button class="btn" onclick="showWorldSelection()">Speel Mattyou Craft</button>
        </div>
    </div>

    <!-- World Creation Screen -->
    <div id="create-world-screen" class="screen" style="display: none;">
        <h1>CREËER WERELD</h1>
        <div class="subtitle">MATTYOU STUDIOS™</div>

        <div class="form-group">
            <label for="world-name">Wereld Naam</label>
            <input type="text" id="world-name" value="Mijn Geweldige Wereld">
        </div>

        <div class="form-group">
            <label for="world-mode">Spelmodus</label>
            <select id="world-mode">
                <option value="survival">Survival (Overleven & Verzamelen)</option>
                <option value="creative">Creative (Oneindig bouwen & Vliegen)</option>
            </select>
        </div>

        <button class="btn" onclick="createAndStartWorld()">INITIALISEER WERELD</button>
        <button class="btn" style="border-color: #ff0055; color: #ff0055;" onclick="cancelWorldCreation()">Annuleer</button>
    </div>

    <!-- Inventory & Crafting Screen -->
    <div id="inventory-screen" class="screen">
        <div class="inv-container">
            <!-- Inventaris Grid -->
            <div class="inv-section">
                <h2 style="color: #00ffff; margin-top: 0;">INVENTARIS</h2>
                <div class="inv-grid" id="inv-grid">
                    <!-- Gevuld via JS -->
                </div>
            </div>

            <!-- Crafting Recepten -->
            <div class="inv-section" style="border-left: 2px solid #333; padding-left: 40px;">
                <h2 style="color: #ff00ff; margin-top: 0;">CRAFTING</h2>
                <div class="crafting-list" id="crafting-list">
                    <!-- Gevuld via JS -->
                </div>
            </div>
        </div>
        <p style="color: #888; margin-top: 20px;">Druk op <b style="color: white;">'E'</b> of klik buiten het menu om terug te keren naar de game.</p>
    </div>

    <script>
        // ============================================================================
        // PROCEDURAL TEXTURE GENERATOR (Pixel-art blocks)
        // ============================================================================
        class TextureGenerator {
            static createBlockTexture(type) {
                const canvas = document.createElement('canvas');
                canvas.width = 16;
                canvas.height = 16;
                const ctx = canvas.getContext('2d');

                const drawPixel = (x, y, color) => {
                    ctx.fillStyle = color;
                    ctx.fillRect(x, y, 1, 1);
                };

                // Genereer pixel-art gebaseerd op type
                if (type === 'grass') {
                    // Top gras groen, onderkant aarde
                    ctx.fillStyle = '#557a2b';
                    ctx.fillRect(0, 0, 16, 4);
                    ctx.fillStyle = '#866043';
                    ctx.fillRect(0, 4, 16, 12);
                    // Voeg ruis toe
                    for(let i=0; i<30; i++) {
                        drawPixel(Math.floor(Math.random()*16), Math.floor(Math.random()*4), '#4d6e27');
                        drawPixel(Math.floor(Math.random()*16), 4 + Math.floor(Math.random()*12), '#5c402c');
                    }
                } else if (type === 'dirt') {
                    ctx.fillStyle = '#866043';
                    ctx.fillRect(0, 0, 16, 16);
                    for(let i=0; i<40; i++) {
                        drawPixel(Math.floor(Math.random()*16), Math.floor(Math.random()*16), '#5c402c');
                        drawPixel(Math.floor(Math.random()*16), Math.floor(Math.random()*16), '#9c7353');
                    }
                } else if (type === 'stone') {
                    ctx.fillStyle = '#737373';
                    ctx.fillRect(0, 0, 16, 16);
                    for(let i=0; i<40; i++) {
                        drawPixel(Math.floor(Math.random()*16), Math.floor(Math.random()*16), '#525252');
                        drawPixel(Math.floor(Math.random()*16), Math.floor(Math.random()*16), '#8f8f8f');
                    }
                } else if (type === 'wood') {
                    ctx.fillStyle = '#5c402c';
                    ctx.fillRect(0, 0, 16, 16);
                    ctx.fillStyle = '#3d2a1d';
                    ctx.fillRect(4, 0, 8, 16); // Stam nerf
                } else if (type === 'leaves') {
                    ctx.fillStyle = '#2e5c1e';
                    ctx.fillRect(0, 0, 16, 16);
                    for(let i=0; i<30; i++) {
                        drawPixel(Math.floor(Math.random()*16), Math.floor(Math.random()*16), '#1f3d14');
                        drawPixel(Math.floor(Math.random()*16), Math.floor(Math.random()*16), '#3d7a29');
                    }
                } else if (type === 'planks') {
                    ctx.fillStyle = '#b08854';
                    ctx.fillRect(0, 0, 16, 16);
                    ctx.strokeStyle = '#7a5a31';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(0, 0, 16, 16);
                    ctx.beginPath();
                    ctx.moveTo(0, 5); ctx.lineTo(16, 5);
                    ctx.moveTo(0, 10); ctx.lineTo(16, 10);
                    ctx.stroke();
                } else if (type === 'crafting_table') {
                    ctx.fillStyle = '#7a5a31';
                    ctx.fillRect(0, 0, 16, 16);
                    ctx.fillStyle = '#b08854';
                    ctx.fillRect(2, 2, 12, 12);
                    // Teken gereedschapjes op de zijkant
                    ctx.fillStyle = '#333';
                    ctx.fillRect(4, 4, 2, 6);
                    ctx.fillRect(10, 4, 2, 4);
                }

                const texture = new THREE.CanvasTexture(canvas);
                texture.magFilter = THREE.NearestFilter;
                texture.minFilter = THREE.NearestFilter;
                return texture;
            }
        }

        // ============================================================================
        // GAME CONFIG & DATA
        // ============================================================================
        const BLOCK_TYPES = {
            1: { name: 'Gras', key: 'grass', color: '#557a2b' },
            2: { name: 'Aarde', key: 'dirt', color: '#866043' },
            3: { name: 'Steen', key: 'stone', color: '#737373' },
            4: { name: 'Hout Stam', key: 'wood', color: '#5c402c' },
            5: { name: 'Bladeren', key: 'leaves', color: '#2e5c1e' },
            6: { name: 'Houten Planken', key: 'planks', color: '#b08854' },
            7: { name: 'Crafting Table', key: 'crafting_table', color: '#7a5a31' }
        };

        const CRAFTING_RECIPES = [
            { result: 6, resultCount: 4, ingredients: { 4: 1 }, name: 'Planken (4x)' }, // 1 Stam -> 4 Planken
            { result: 7, resultCount: 1, ingredients: { 6: 4 }, name: 'Crafting Table' } // 4 Planken -> 1 Crafting Table
        ];

        // ============================================================================
        // INPUT MANAGER
        // ============================================================================
        class InputManager {
            constructor() {
                this.keys = {};
                this.mouse = { x: 0, y: 0, left: false, right: false };
                this.locked = false;

                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (e.code === 'KeyE') game.toggleInventory();
                });
                window.addEventListener('keyup', (e) => this.keys[e.code] = false);
                
                const container = document.getElementById('canvas-container');
                container.addEventListener('click', () => {
                    if (!this.locked && game.state === 'playing') {
                        container.requestPointerLock();
                    }
                });

                document.addEventListener('pointerlockchange', () => {
                    this.locked = document.pointerLockElement === container;
                    if (!this.locked && game.state === 'playing' && !game.inventoryOpen) {
                        // Pauzeer of open inventaris als pointer lock verbroken wordt
                        game.toggleInventory(true);
                    }
                });

                document.addEventListener('mousemove', (e) => {
                    if (this.locked) {
                        this.mouse.x = e.movementX;
                        this.mouse.y = e.movementY;
                    }
                });

                window.addEventListener('mousedown', (e) => {
                    if (!this.locked) return;
                    if (e.button === 0) this.mouse.left = true;
                    if (e.button === 2) this.mouse.right = true;
                });
            }

            isKeyDown(code) {
                return !!this.keys[code];
            }

            consumeMouseMove() {
                const m = { x: this.mouse.x, y: this.mouse.y };
                this.mouse.x = 0;
                this.mouse.y = 0;
                return m;
            }
        }

        // ============================================================================
        // GAME CLASS
        // ============================================================================
        class Game {
            constructor() {
                this.state = 'menu'; // menu, playing
                this.inventoryOpen = false;
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.clock = new THREE.Clock();
                
                this.input = new InputManager();
                this.worlds = JSON.parse(localStorage.getItem('mattyou_craft_worlds')) || [];
                
                // Active World Data
                this.activeWorld = null;
                this.worldSize = { x: 32, y: 16, z: 32 };
                this.blocks = {}; // 3D Grid: "x,y,z" -> blockTypeId
                this.blockMeshes = {}; // "x,y,z" -> THREE.Mesh

                // Player Physics & Stats
                this.player = {
                    position: new THREE.Vector3(16, 12, 16),
                    velocity: new THREE.Vector3(),
                    yaw: 0,
                    pitch: 0,
                    hp: 100,
                    maxHp: 100,
                    onGround: false,
                    inventory: {
                        1: 10, // Gras
                        2: 10, // Aarde
                        3: 5   // Steen
                    },
                    hotbar: [1, 2, 3, 4, 5, 6, 7, null, null],
                    activeHotbarIdx: 0,
                    isFlying: false
                };

                this.materials = {};
                this.initEngine();
                this.loadBlockMaterials();
            }

            initEngine() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x80a0ff); // Sky color
                this.scene.fog = new THREE.FogExp2(0x80a0ff, 0.02);

                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: false }); // Pixelated retro feel
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);

                // Licht
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(20, 40, 20);
                this.scene.add(dirLight);

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            loadBlockMaterials() {
                Object.keys(BLOCK_TYPES).forEach(id => {
                    const type = BLOCK_TYPES[id];
                    this.materials[id] = new THREE.MeshLambertMaterial({
                        map: TextureGenerator.createBlockTexture(type.key)
                    });
                });
            }

            // ============================================================================
            // WORLD GENERATION & MANAGEMENT
            // ============================================================================
            generateTerrain() {
                this.blocks = {};
                // Verwijder oude meshes
                Object.values(this.blockMeshes).forEach(mesh => this.scene.remove(mesh));
                this.blockMeshes = {};

                const geometry = new THREE.BoxGeometry(1, 1, 1);

                for (let x = 0; x < this.worldSize.x; x++) {
                    for (let z = 0; z < this.worldSize.z; z++) {
                        // Simpele sinus/cosinus heuvels
                        const height = Math.floor(Math.sin(x / 4) * Math.cos(z / 4) * 3 + 6);

                        for (let y = 0; y < this.worldSize.y; y++) {
                            let blockType = 0; // Air

                            if (y < height - 3) {
                                blockType = 3; // Stone
                            } else if (y < height - 1) {
                                blockType = 2; // Dirt
                            } else if (y === height - 1) {
                                blockType = 1; // Grass
                            }

                            if (blockType !== 0) {
                                this.setBlock(x, y, z, blockType, geometry);
                            }
                        }

                        // Kans op een boom op het gras
                        if (Math.random() < 0.03 && x > 2 && x < this.worldSize.x - 2 && z > 2 && z < this.worldSize.z - 2) {
                            const heightVal = Math.floor(Math.sin(x / 4) * Math.cos(z / 4) * 3 + 6);
                            this.spawnTree(x, heightVal, z, geometry);
                        }
                    }
                }

                // Zet speler op veilige hoogte
                this.player.position.set(16, 12, 16);
            }

            spawnTree(tx, ty, tz, geometry) {
                // Boomstam (Hout)
                for (let h = 0; h < 4; h++) {
                    this.setBlock(tx, ty + h, tz, 4, geometry);
                }
                // Bladeren kroon
                for (let x = -1; x <= 1; x++) {
                    for (let z = -1; z <= 1; z++) {
                        for (let y = 3; y <= 4; y++) {
                            if (x === 0 && z === 0 && y === 3) continue; // Sla stam over
                            this.setBlock(tx + x, ty + y, tz + z, 5, geometry);
                        }
                    }
                }
            }

            setBlock(x, y, z, typeId, sharedGeometry) {
                const key = `${x},${y},${z}`;
                
                // Verwijder oude blok op deze positie indien aanwezig
                if (this.blockMeshes[key]) {
                    this.scene.remove(this.blockMeshes[key]);
                    delete this.blockMeshes[key];
                }

                if (typeId === 0) {
                    delete this.blocks[key];
                    return;
                }

                this.blocks[key] = typeId;

                const geom = sharedGeometry || new THREE.BoxGeometry(1, 1, 1);
                const mesh = new THREE.Mesh(geom, this.materials[typeId]);
                mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
                this.scene.add(mesh);
                this.blockMeshes[key] = mesh;
            }

            getBlock(x, y, z) {
                const key = `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
                return this.blocks[key] || 0;
            }

            // ============================================================================
            // GAMEPLAY LOOP & PHYSICS
            // ============================================================================
            animate() {
                if (this.state !== 'playing') return;
                requestAnimationFrame(() => this.animate());

                const dt = Math.min(this.clock.getDelta(), 0.1);

                if (!this.inventoryOpen) {
                    this.updatePlayerPhysics(dt);
                    this.handleInteractions();
                }

                this.renderer.render(this.scene, this.camera);
            }

            updatePlayerPhysics(dt) {
                // Muis Kijken
                const mouse = this.input.consumeMouseMove();
                this.player.yaw -= mouse.x * 0.0025;
                this.player.pitch -= mouse.y * 0.0025;
                this.player.pitch = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, this.player.pitch));

                this.camera.rotation.set(0, 0, 0);
                this.camera.rotation.y = this.player.yaw;
                this.camera.rotation.x = this.player.pitch;

                // Toetsenbord Beweging
                const moveSpeed = this.player.isFlying ? 15.0 : 6.0;
                const moveVector = new THREE.Vector3();

                if (this.input.isKeyDown('KeyW')) moveVector.z -= 1;
                if (this.input.isKeyDown('KeyS')) moveVector.z += 1;
                if (this.input.isKeyDown('KeyA')) moveVector.x -= 1;
                if (this.input.isKeyDown('KeyD')) moveVector.x += 1;

                moveVector.normalize();
                moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), this.player.yaw);

                this.player.velocity.x = moveVector.x * moveSpeed;
                this.player.velocity.z = moveVector.z * moveSpeed;

                // Zwaartekracht & Springen / Vliegen
                if (this.activeWorld.mode === 'creative') {
                    // Creative vliegbesturing
                    this.player.velocity.y = 0;
                    if (this.input.isKeyDown('Space')) this.player.velocity.y = moveSpeed;
                    if (this.input.isKeyDown('ShiftLeft')) this.player.velocity.y = -moveSpeed;
                } else {
                    // Survival zwaartekracht
                    if (!this.player.onGround) {
                        this.player.velocity.y -= 22 * dt; // Gravity
                    } else {
                        this.player.velocity.y = 0;
                        if (this.input.isKeyDown('Space')) {
                            this.player.velocity.y = 8.0; // Jump force
                            this.player.onGround = false;
                        }
                    }
                }

                // Beweeg speler en los collisions op
                const nextPos = this.player.position.clone().addScaledVector(this.player.velocity, dt);
                this.resolveCollisions(nextPos);

                // Camera volgt speler op ooghoogte
                this.camera.position.copy(this.player.position).y += 0.8;

                // Hotbar selectie via cijfertoetsen
                for (let i = 1; i <= 9; i++) {
                    if (this.input.isKeyDown(`Digit${i}`)) {
                        this.player.activeHotbarIdx = i - 1;
                        this.updateHotbarUI();
                    }
                }
            }

            resolveCollisions(nextPos) {
                if (this.activeWorld.mode === 'creative') {
                    // Geen collisions in creative om makkelijk te bouwen
                    this.player.position.copy(nextPos);
                    return;
                }

                // Simpele AABB collision met voxel grid
                const pSize = { x: 0.6, y: 1.8, z: 0.6 };
                
                // Check X-as
                if (!this.checkCollisionAt(nextPos.x, this.player.position.y, this.player.position.z, pSize)) {
                    this.player.position.x = nextPos.x;
                } else {
                    this.player.velocity.x = 0;
                }

                // Check Z-as
                if (!this.checkCollisionAt(this.player.position.x, this.player.position.y, nextPos.z, pSize)) {
                    this.player.position.z = nextPos.z;
                } else {
                    this.player.velocity.z = 0;
                }

                // Check Y-as (Vloer / Plafond)
                this.player.position.y += this.player.velocity.y * 0.016; // Vaste physics tick
                if (this.checkCollisionAt(this.player.position.x, this.player.position.y, this.player.position.z, pSize)) {
                    if (this.player.velocity.y < 0) {
                        this.player.onGround = true;
                        // Val schade berekenen indien nodig
                    }
                    this.player.position.y = Math.round(this.player.position.y);
                    this.player.velocity.y = 0;
                } else {
                    this.player.onGround = false;
                }

                // Wereldgrenzen bewaken
                this.player.position.x = Math.max(0.5, Math.min(this.worldSize.x - 0.5, this.player.position.x));
                this.player.position.z = Math.max(0.5, Math.min(this.worldSize.z - 0.5, this.player.position.z));
            }

            checkCollisionAt(px, py, pz, size) {
                // Check alle hoekpunten van de player bounding box
                const minX = Math.floor(px - size.x / 2);
                const maxX = Math.floor(px + size.x / 2);
                const minY = Math.floor(py);
                const maxY = Math.floor(py + size.y);
                const minZ = Math.floor(pz - size.z / 2);
                const maxZ = Math.floor(pz + size.z / 2);

                for (let x = minX; x <= maxX; x++) {
                    for (let y = minY; y <= maxY; y++) {
                        for (let z = minZ; z <= maxZ; z++) {
                            if (this.getBlock(x, y, z) !== 0) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            // ============================================================================
            // MINING & PLACING BLOCKS
            // ============================================================================
            handleInteractions() {
                if (this.input.mouse.left) {
                    this.input.mouse.left = false;
                    this.performRaycast(true); // Mine
                }
                if (this.input.mouse.right) {
                    this.input.mouse.right = false;
                    this.performRaycast(false); // Place
                }
            }

            performRaycast(isMining) {
                const raycaster = new THREE.Raycaster();
                // Raycast vanuit het midden van het scherm
                raycaster.setFromCamera(new THREE.Vector2(0, 0), this.camera);

                // Haal alle actieve blok meshes op
                const meshes = Object.values(this.blockMeshes);
                const intersects = raycaster.intersectObjects(meshes);

                if (intersects.length > 0 && intersects[0].distance < 6.0) {
                    const hit = intersects[0];
                    const point = hit.point;
                    const normal = hit.face.normal;

                    if (isMining) {
                        // Bereken voxel positie door iets in de richting van de normal te gaan
                        const vx = Math.floor(point.x - normal.x * 0.5);
                        const vy = Math.floor(point.y - normal.y * 0.5);
                        const vz = Math.floor(point.z - normal.z * 0.5);

                        const blockId = this.getBlock(vx, vy, vz);
                        if (blockId !== 0) {
                            // Verwijder blok
                            this.setBlock(vx, vy, vz, 0);

                            // Voeg toe aan inventaris (indien Survival)
                            if (this.activeWorld.mode === 'survival') {
                                this.player.inventory[blockId] = (this.player.inventory[blockId] || 0) + 1;
                            }
                        }
                    } else {
                        // Plaatsen: bereken positie door met de normal mee te gaan
                        const vx = Math.floor(point.x + normal.x * 0.5);
                        const vy = Math.floor(point.y + normal.y * 0.5);
                        const vz = Math.floor(point.z + normal.z * 0.5);

                        // Check of we niet in onszelf bouwen
                        const pBox = {
                            minX: this.player.position.x - 0.3,
                            maxX: this.player.position.x + 0.3,
                            minY: this.player.position.y,
                            maxY: this.player.position.y + 1.8,
                            minZ: this.player.position.z - 0.3,
                            maxZ: this.player.position.z + 0.3
                        };

                        if (vx >= pBox.minX && vx <= pBox.maxX && 
                            vy >= pBox.minY && vy <= pBox.maxY && 
                            vz >= pBox.minZ && vz <= pBox.maxZ) {
                            return; // Blok blokkeert speler
                        }

                        const activeBlockId = this.player.hotbar[this.player.activeHotbarIdx];
                        if (activeBlockId) {
                            if (this.activeWorld.mode === 'creative' || (this.player.inventory[activeBlockId] || 0) > 0) {
                                this.setBlock(vx, vy, vz, activeBlockId);

                                if (this.activeWorld.mode === 'survival') {
                                    this.player.inventory[activeBlockId]--;
                                }
                            }
                        }
                    }

                    this.updateHotbarUI();
                }
            }

            // ============================================================================
            // UI & SCREENS
            // ============================================================================
            toggleInventory(forceClose = false) {
                if (this.state !== 'playing') return;

                if (this.inventoryOpen || forceClose) {
                    this.inventoryOpen = false;
                    document.getElementById('inventory-screen').style.display = 'none';
                    document.getElementById('canvas-container').requestPointerLock();
                } else {
                    this.inventoryOpen = true;
                    document.getElementById('inventory-screen').style.display = 'flex';
                    document.exitPointerLock();
                    this.drawInventory();
                }
            }

            drawInventory() {
                const grid = document.getElementById('inv-grid');
                grid.innerHTML = '';

                // Teken alle mogelijke blokken in de inventaris
                Object.keys(BLOCK_TYPES).forEach(id => {
                    const count = this.player.inventory[id] || 0;
                    const type = BLOCK_TYPES[id];

                    const slot = document.createElement('div');
                    slot.className = 'inv-slot';
                    slot.style.backgroundColor = type.color;
                    slot.title = type.name;

                    if (this.activeWorld.mode === 'creative' || count > 0) {
                        const countEl = document.createElement('span');
                        countEl.className = 'slot-count';
                        countEl.innerText = this.activeWorld.mode === 'creative' ? '∞' : count;
                        slot.appendChild(countEl);
                    } else {
                        slot.style.opacity = '0.3';
                    }

                    // Klik om toe te voegen aan actieve hotbar slot
                    slot.addEventListener('click', () => {
                        this.player.hotbar[this.player.activeHotbarIdx] = parseInt(id);
                        this.updateHotbarUI();
                        this.toggleInventory(true);
                    });

                    grid.appendChild(slot);
                });

                // Teken Crafting Recepten
                const craftList = document.getElementById('crafting-list');
                craftList.innerHTML = '';

                CRAFTING_RECIPES.forEach(recipe => {
                    const item = document.createElement('div');
                    item.className = 'craft-item';
                    
                    let canCraft = true;
                    let ingredientsText = "";

                    // Check ingrediënten
                    Object.keys(recipe.ingredients).forEach(ingId => {
                        const reqCount = recipe.ingredients[ingId];
                        const hasCount = this.player.inventory[ingId] || 0;
                        ingredientsText += `${BLOCK_TYPES[ingId].name} (${hasCount}/${reqCount}) `;
                        if (hasCount < reqCount) canCraft = false;
                    });

                    item.innerHTML = `
                        <div>
                            <div style="font-weight:bold;">${recipe.name}</div>
                            <div style="font-size:11px; color:#aaa;">${ingredientsText}</div>
                        </div>
                    `;

                    const btn = document.createElement('button');
                    btn.innerText = 'CRAFT';
                    btn.disabled = !canCraft && this.activeWorld.mode !== 'creative';
                    btn.addEventListener('click', () => this.craftItem(recipe));
                    item.appendChild(btn);

                    craftList.appendChild(item);
                });
            }

            craftItem(recipe) {
                if (this.activeWorld.mode === 'survival') {
                    // Trek ingrediënten af
                    Object.keys(recipe.ingredients).forEach(ingId => {
                        this.player.inventory[ingId] -= recipe.ingredients[ingId];
                    });
                    // Voeg resultaat toe
                    this.player.inventory[recipe.result] = (this.player.inventory[recipe.result] || 0) + recipe.resultCount;
                } else {
                    // Creative krijgt het gewoon direct in hotbar
                    this.player.hotbar[this.player.activeHotbarIdx] = recipe.result;
                }

                this.drawInventory();
                this.updateHotbarUI();
            }

            updateHotbarUI() {
                const hotbar = document.getElementById('hotbar');
                hotbar.innerHTML = '';

                for (let i = 0; i < 9; i++) {
                    const slot = document.createElement('div');
                    slot.className = `hotbar-slot ${i === this.player.activeHotbarIdx ? 'active' : ''}`;
                    
                    const blockId = this.player.hotbar[i];
                    if (blockId) {
                        slot.style.backgroundColor = BLOCK_TYPES[blockId].color;
                        const count = this.player.inventory[blockId] || 0;

                        const countEl = document.createElement('span');
                        countEl.className = 'slot-count';
                        countEl.innerText = this.activeWorld.mode === 'creative' ? '∞' : count;
                        slot.appendChild(countEl);
                    }

                    slot.addEventListener('click', () => {
                        this.player.activeHotbarIdx = i;
                        this.updateHotbarUI();
                    });

                    hotbar.appendChild(slot);
                }
            }

            // ============================================================================
            // WORLD SELECTION & CREATION MENU
            // ============================================================================
            showWorldSelection() {
                document.getElementById('main-menu-buttons').style.display = 'none';
                document.getElementById('world-list-container').style.display = 'flex';
                this.renderWorldList();
            }

            renderWorldList() {
                const list = document.getElementById('world-list');
                list.innerHTML = '';

                if (this.worlds.length === 0) {
                    list.innerHTML = '<p style="color:#888; text-align:center;">Geen werelden gevonden.</p>';
                    return;
                }

                this.worlds.forEach((w, idx) => {
                    const el = document.createElement('div');
                    el.className = 'world-item';
                    el.innerHTML = `
                        <span><b>${w.name}</b> (${w.mode.toUpperCase()})</span>
                        <span style="color:#ff0055; font-weight:bold;" onclick="event.stopPropagation(); game.deleteWorld(${idx})">X</span>
                    `;
                    el.addEventListener('click', () => this.loadWorld(w));
                    list.appendChild(el);
                });
            }

            showCreateWorld() {
                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('create-world-screen').style.display = 'flex';
            }

            cancelWorldCreation() {
                document.getElementById('create-world-screen').style.display = 'none';
                document.getElementById('menu-screen').style.display = 'flex';
                this.showWorldSelection();
            }

            createAndStartWorld() {
                const name = document.getElementById('world-name').value.trim() || 'Nieuwe Wereld';
                const mode = document.getElementById('world-mode').value;

                const newWorld = {
                    name: name,
                    mode: mode,
                    created: Date.now()
                };

                this.worlds.push(newWorld);
                localStorage.setItem('mattyou_craft_worlds', JSON.stringify(this.worlds));

                this.loadWorld(newWorld);
            }

            deleteWorld(idx) {
                this.worlds.splice(idx, 1);
                localStorage.setItem('mattyou_craft_worlds', JSON.stringify(this.worlds));
                this.renderWorldList();
            }

            loadWorld(world) {
                this.activeWorld = world;
                this.state = 'playing';

                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('create-world-screen').style.display = 'none';
                document.getElementById('hud').style.display = 'block';

                // Pas HUD aan op basis van modus
                if (world.mode === 'creative') {
                    document.getElementById('stats-panel').style.display = 'none';
                } else {
                    document.getElementById('stats-panel').style.display = 'flex';
                    this.player.hp = 100;
                    document.getElementById('hp-fill').style.width = '100%';
                }

                this.generateTerrain();
                this.updateHotbarUI();

                // Lock pointer en start loop
                document.getElementById('canvas-container').requestPointerLock();
                this.clock.getDelta();
                this.animate();
            }
        }

        // Start de game engine
        const game = new Game();

        // Helper functies voor onclick events in HTML
        function showCreateWorld() { game.showCreateWorld(); }
        function showWorldSelection() { game.showWorldSelection(); }
        function createAndStartWorld() { game.createAndStartWorld(); }
        function cancelWorldCreation() { game.cancelWorldCreation(); }
    </script>
</body>
