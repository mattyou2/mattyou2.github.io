<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beheerder — Producten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <div class="logo">MijnWinkel</div>
      <div class="role">Beheerportaal</div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="index.html"><span class="icon">📊</span> Dashboard</a>
      <a class="nav-item active" href="products.html"><span class="icon">📦</span> Producten</a>
      <a class="nav-item" href="orders.html"><span class="icon">🧾</span> Bestellingen</a>
      <a class="nav-item" href="settings.html"><span class="icon">⚙️</span> Instellingen</a>
      <hr style="border:none;border-top:1px solid rgba(255,255,255,.1);margin:.5rem 0;" />
      <a class="nav-item" href="../index.html" target="_blank"><span class="icon">🏪</span> Winkel bekijken</a>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="logout()" style="color:rgba(255,82,82,.8);">
        <span class="icon">🚪</span> Uitloggen
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Producten</h1>
      <button class="btn btn-accent" onclick="openAddModal()">+ Nieuw product</button>
    </div>

    <div class="admin-content">

      <!-- ZOEKVELD -->
      <div class="card" style="padding:1rem 1.25rem;margin-bottom:1rem;">
        <input type="text" id="searchInput" placeholder="Zoek op naam of categorie…" oninput="filterProducts()" style="width:100%;max-width:400px;" />
      </div>

      <!-- PRODUCTEN TABEL -->
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Foto</th>
                <th>Naam</th>
                <th>Prijs</th>
                <th>Voorraad</th>
                <th>Status</th>
                <th>Acties</th>
              </tr>
            </thead>
            <tbody id="productsTable">
              <tr><td colspan="6" style="text-align:center;color:#4a4a6a;padding:2rem;">Laden…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- PRODUCT MODAL (Toevoegen / Bewerken) -->
<div class="modal-backdrop" id="productModal">
  <div class="modal-box" style="max-width:580px;">
    <h3 id="modalTitle">Nieuw product</h3>

    <div class="form-group">
      <label>Naam *</label>
      <input type="text" id="pName" placeholder="Productnaam" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Prijs (€) *</label>
        <input type="number" id="pPrice" placeholder="0.00" step="0.01" min="0" />
      </div>
      <div class="form-group">
        <label>Categorie</label>
        <input type="text" id="pCategory" placeholder="bijv. Kleding, Elektronica" list="catList" />
        <datalist id="catList"></datalist>
      </div>
    </div>

    <div class="form-group">
      <label>Beschrijving</label>
      <textarea id="pDesc" placeholder="Omschrijving van het product…" rows="3"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Afbeelding URL</label>
        <input type="url" id="pImage" placeholder="https://…/afbeelding.jpg" oninput="previewImg()" />
        <img id="imgPreview" class="img-preview" src="" alt="Voorbeeld" />
      </div>
      <div class="form-group">
        <label>Voorraad (leeg = onbeperkt)</label>
        <input type="number" id="pStock" placeholder="bijv. 50" min="0" />
      </div>
    </div>

    <div class="form-group">
      <div class="toggle-wrap">
        <label class="toggle">
          <input type="checkbox" id="pActive" checked />
          <span class="toggle-slider"></span>
        </label>
        <span>Zichtbaar in de winkel</span>
      </div>
    </div>

    <div style="display:flex;gap:.75rem;margin-top:1.5rem;flex-wrap:wrap;">
      <button class="btn btn-accent" onclick="saveProduct()">💾 Opslaan</button>
      <button class="btn btn-outline" onclick="closeModal()">Annuleren</button>
      <button class="btn btn-danger" id="deleteBtn" onclick="deleteProduct()" style="display:none;margin-left:auto;">🗑️ Verwijderen</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="js/admin.js"></script>
<script>
let allProducts = [];
let editingId = null;

document.addEventListener('DOMContentLoaded', async () => {
  await requireAuth();
  loadProducts();
});

async function loadProducts() {
  const { data, error } = await db
    .from('products')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) { showToast('Fout bij laden producten', 'error'); return; }
  allProducts = data || [];
  renderTable(allProducts);
  fillCatList();
}

function fillCatList() {
  const cats = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
  document.getElementById('catList').innerHTML = cats.map(c => `<option value="${escapeHTML(c)}">`).join('');
}

function filterProducts() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allProducts.filter(p =>
    p.name.toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q)
  );
  renderTable(filtered);
}

function renderTable(products) {
  const tbody = document.getElementById('productsTable');
  if (!products.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#4a4a6a;padding:2rem;">Geen producten gevonden</td></tr>`;
    return;
  }
  tbody.innerHTML = products.map(p => `
    <tr>
      <td>
        ${p.image_url
          ? `<img src="${escapeHTML(p.image_url)}" class="td-img" onerror="this.src=''" />`
          : `<div class="td-img" style="display:flex;align-items:center;justify-content:center;background:#eee;font-size:1.3rem;">📦</div>`
        }
      </td>
      <td>
        <div class="td-name">${escapeHTML(p.name)}</div>
        <div class="td-cat">${escapeHTML(p.category || 'Geen categorie')}</div>
      </td>
      <td>${formatPrice(p.price)}</td>
      <td>${p.stock !== null && p.stock !== undefined ? p.stock : '∞'}</td>
      <td><span class="badge ${p.active ? 'badge-success' : 'badge-danger'}">${p.active ? 'Actief' : 'Verborgen'}</span></td>
      <td>
        <button class="btn btn-sm btn-outline" onclick="openEditModal('${p.id}')">✏️ Bewerken</button>
      </td>
    </tr>
  `).join('');
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Nieuw product';
  document.getElementById('pName').value = '';
  document.getElementById('pPrice').value = '';
  document.getElementById('pCategory').value = '';
  document.getElementById('pDesc').value = '';
  document.getElementById('pImage').value = '';
  document.getElementById('pStock').value = '';
  document.getElementById('pActive').checked = true;
  document.getElementById('imgPreview').className = 'img-preview';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('productModal').classList.add('open');
}

function openEditModal(id) {
  const p = allProducts.find(p => p.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Product bewerken';
  document.getElementById('pName').value = p.name || '';
  document.getElementById('pPrice').value = p.price || '';
  document.getElementById('pCategory').value = p.category || '';
  document.getElementById('pDesc').value = p.description || '';
  document.getElementById('pImage').value = p.image_url || '';
  document.getElementById('pStock').value = p.stock !== null ? p.stock : '';
  document.getElementById('pActive').checked = p.active !== false;
  document.getElementById('deleteBtn').style.display = 'inline-flex';

  const preview = document.getElementById('imgPreview');
  if (p.image_url) {
    preview.src = p.image_url;
    preview.className = 'img-preview visible';
  } else {
    preview.className = 'img-preview';
  }

  document.getElementById('productModal').classList.add('open');
}

function closeModal() {
  document.getElementById('productModal').classList.remove('open');
  editingId = null;
}

function previewImg() {
  const url = document.getElementById('pImage').value;
  const preview = document.getElementById('imgPreview');
  if (url) {
    preview.src = url;
    preview.className = 'img-preview visible';
  } else {
    preview.className = 'img-preview';
  }
}

async function saveProduct() {
  const name  = document.getElementById('pName').value.trim();
  const price = parseFloat(document.getElementById('pPrice').value);

  if (!name || isNaN(price)) {
    showToast('Naam en prijs zijn verplicht.', 'error');
    return;
  }

  const stockVal = document.getElementById('pStock').value;
  const payload = {
    name,
    price,
    category:    document.getElementById('pCategory').value.trim() || null,
    description: document.getElementById('pDesc').value.trim() || null,
    image_url:   document.getElementById('pImage').value.trim() || null,
    stock:       stockVal !== '' ? parseInt(stockVal) : null,
    active:      document.getElementById('pActive').checked
  };

  let error;
  if (editingId) {
    ({ error } = await db.from('products').update(payload).eq('id', editingId));
  } else {
    ({ error } = await db.from('products').insert(payload));
  }

  if (error) {
    showToast('Opslaan mislukt: ' + error.message, 'error');
  } else {
    showToast(editingId ? '✓ Product bijgewerkt!' : '✓ Product toegevoegd!', 'success');
    closeModal();
    loadProducts();
  }
}

async function deleteProduct() {
  if (!editingId) return;
  if (!confirm('Weet je zeker dat je dit product wilt verwijderen?')) return;

  const { error } = await db.from('products').delete().eq('id', editingId);
  if (error) {
    showToast('Verwijderen mislukt.', 'error');
  } else {
    showToast('Product verwijderd.', 'success');
    closeModal();
    loadProducts();
  }
}

// Sluiten bij klik buiten modal
document.getElementById('productModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});
</script>
</body>
</html>
