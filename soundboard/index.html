<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Soundboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      margin: 0;
    }
    h1 { color: #00e676; margin-bottom: 20px; }
    .controls {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label { font-weight: bold; font-size: 13px; color: #aaa; }
    select, input[type="file"], button.btn-action {
      padding: 8px 12px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    button.btn-action {
      background: #00e676;
      color: #121212;
      font-weight: bold;
      border: none;
    }
    button.btn-action:hover { background: #00b359; }
    #board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }
    .sound-card {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .sound-card input[type="text"] {
      width: 90%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #555;
      color: #fff;
      text-align: center;
      font-weight: bold;
    }
    .sound-card input[type="text"]:focus {
      outline: none;
      border-bottom-color: #00e676;
    }
    .btn-play {
      width: 100%;
      height: 50px;
      background-color: #00e676;
      color: #121212;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Soundboard</h1>

  <div class="controls">
    <div class="field">
      <label>1. Geef Toestemming</label>
      <button class="btn-action" id="permBtn">Vraag Apparaat Toegang</button>
    </div>

    <div class="field">
      <label for="audioOutput">2. Kies Output Apparaat</label>
      <select id="audioOutput">
        <option value="">Klik eerst op Toegang Vragen</option>
      </select>
    </div>

    <div class="field">
      <label>3A. Selecteer Losse MP3's</label>
      <input type="file" id="fileInput" multiple accept=".mp3,.wav,.ogg,.m4a">
    </div>

    <div class="field">
      <label>3B. Selecteer Map</label>
      <input type="file" id="folderInput" webkitdirectory directory multiple>
    </div>
  </div>

  <div id="board"></div>

  <script>
    const permBtn = document.getElementById('permBtn');
    const audioOutput = document.getElementById('audioOutput');
    const fileInput = document.getElementById('fileInput');
    const folderInput = document.getElementById('folderInput');
    const board = document.getElementById('board');
    
    const currentAudio = new Audio();

    async function loadDevices() {
      try {
        await navigator.mediaDevices.getUserMedia({ audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const outputs = devices.filter(d => d.kind === 'audiooutput');

        audioOutput.innerHTML = '';
        outputs.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Audio Apparaat ${index + 1}`;
          audioOutput.appendChild(option);
        });
        permBtn.innerText = "✓ Toegang Verleend";
        permBtn.style.background = "#444";
        permBtn.style.color = "#fff";
      } catch (err) {
        alert("Kan geen toegang krijgen tot audio apparaten. Zorg dat je de pagina via een lokale server (localhost) runt.");
      }
    }

    permBtn.addEventListener('click', loadDevices);

    audioOutput.addEventListener('change', async () => {
      if (audioOutput.value && typeof currentAudio.setSinkId === 'function') {
        try {
          await currentAudio.setSinkId(audioOutput.value);
        } catch (err) {
          console.error("Fout bij instellen van apparaat:", err);
        }
      }
    });

    function processFiles(files) {
      board.innerHTML = '';
      const audioFiles = Array.from(files).filter(f => f.name.match(/\.(mp3|wav|ogg|m4a)$/i));

      if (audioFiles.length === 0) {
        alert("Geen geldige audiobestanden gevonden.");
        return;
      }

      audioFiles.forEach(file => {
        const fileUrl = URL.createObjectURL(file);
        const cleanName = file.name.replace(/\.[^/.]+$/, "");

        const card = document.createElement('div');
        card.className = 'sound-card';

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = cleanName;

        const playBtn = document.createElement('button');
        playBtn.className = 'btn-play';
        playBtn.innerText = '▶ Speel';

        playBtn.addEventListener('click', () => {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          currentAudio.src = fileUrl;
          
          if (audioOutput.value && typeof currentAudio.setSinkId === 'function') {
            currentAudio.setSinkId(audioOutput.value);
          }

          currentAudio.play();
        });

        card.appendChild(nameInput);
        card.appendChild(playBtn);
        board.appendChild(card);
      });
    }

    fileInput.addEventListener('change', (e) => processFiles(e.target.files));
    folderInput.addEventListener('change', (e) => processFiles(e.target.files));
  </script>
</body>
</html>
